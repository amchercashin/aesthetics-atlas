# Главы-эпохи. Диапазоны условны и могут перекрываться.
- id: prehistory
  pigment: Красная охра
  name: Первобытность
  short: Первобытность
  start: -66000
  end: -3000
  intro: >
    Десятки тысяч лет до письменности. Древнейшему датированному рисунку — трафарету ладони — не меньше
    67 800 лет. Люди охрой и углём рисуют животных на стенах пещер,
    вырезают фигурки из бивня и ставят каменные кольца. Здесь начинается всё остальное.
- id: ancient
  pigment: Египетская синь
  name: Древний мир
  short: Древность
  start: -3500
  end: -500
  intro: >
    Первые города и государства в Египте, Междуречье, Персии, Китае, Индии и Андах. Искусство служит
    богам и правителям: появляются канон, иерархия размеров, монументальный рельеф и письмо, которое становится орнаментом.
- id: antiquity
  pigment: Помпейский красный
  name: Классические цивилизации и античность
  short: Античность
  start: -800
  end: 500
  intro: >
    Средиземноморье открывает идеальные пропорции и ордер, в Гандхаре античная пластика встречается с буддийским образом,
    в степях Евразии расцветает звериный стиль, а в Европе — кельтский орнамент и культура Мезоамерики в Новом Свете.
- id: medieval
  pigment: Сусальное золото
  name: Средневековье (500–1400)
  short: Средние века
  start: 500
  end: 1400
  intro: >
    Тысяча лет параллельных художественных миров: золотые фоны византийских и древнерусских икон, витражи
    готических соборов, исламская геометрия, китайский пейзаж шань-шуй, бронзы Чола, храмы Боробудура и скульптура Ифе.
- id: renaissance
  pigment: Ультрамарин
  name: Раннее Новое время (1400–1750)
  short: 1400–1750
  start: 1400
  end: 1750
  intro: >
    Эпоха Возрождения и барокко в Европе — линейная перспектива, светотень и театр — разворачивается одновременно
    с османской керамикой Изника, персидской и могольской миниатюрой, гравюрой укиё-э и придворным искусством Бенина.
- id: xix
  pigment: Мовеин
  name: Долгий XIX век (1750–1880)
  short: 1750–1880
  start: 1750
  end: 1880
  intro: >
    Революции, промышленность, печать и фотография ускоряют смену визуальных языков: от неоклассицизма, романтизма
    и импрессионизма в Европе до шанхайской школы хайпай, гравюр Хокусая и Хиросигэ и народной графики разных континентов.
- id: fin-de-siecle
  pigment: Изумрудная зелень
  name: Рубеж веков (1880–1910)
  short: 1880–1910
  start: 1880
  end: 1910
  intro: >
    Цвет освобождается от формы, линия — от предмета. Модерн и неорусский стиль превращают в искусство
    архитектуру, театр и быт, а фовисты и экспрессионисты готовят взрыв авангарда.
- id: avant-garde
  pigment: Кадмий красный
  name: Авангард и модернизмы (1907–1945)
  short: 1907–1945
  start: 1907
  end: 1945
  intro: >
    Три десятилетия радикальных экспериментов: кубизм разбирает предмет, супрематизм отказывается от него вовсе,
    Баухаус и конструктивизм проектируют новый мир, а локальные школы в Азии, Африке и Америке ищут собственный модернизм.
- id: postwar
  pigment: Синий Кляйна
  name: Послевоенный мир (1945–1970)
  short: 1945–1970
  start: 1945
  end: 1970
  intro: >
    География модернизма становится многополярной: абстрактный экспрессионизм, поп-арт и mid-century modern в США,
    швейцарская типографика в Европе, школы Хартума, Зарии и Наньянга, корейская монохромная живопись.
- id: postmodern
  pigment: Флуоресцентный розовый
  name: Постмодерн и глобальные языки (1970–2000)
  short: 1970–2000
  start: 1970
  end: 2000
  intro: >
    Вера в единственно верный стиль заканчивается. Цитата, ирония и диалог культур: Мемфис, панк, граффити,
    деконструктивизм, киберпанк, а также современные авторские языки Африки, Азии, Океании и постсоветского пространства.
- id: digital
  pigment: Экранный циан
  name: Цифровая эпоха (1995–2015)
  short: 1995–2015
  start: 1995
  end: 2015
  intro: >
    Экран и интерфейс становятся главным холстом эпохи. От мигающих страниц GeoCities и глянца Y2K
    до стеклянных пузырей Frutiger Aero и победы плоского дизайна.
- id: internet
  pigment: Электрик-фиолет
  name: Интернет-эстетики и 2020-е
  short: 2010–2026
  start: 2010
  end: 2026
  intro: >
    Эстетики рождаются в Tumblr, YouTube и TikTok, получают названия с суффиксом «-core» и живут по нескольку лет —
    от ностальгии вейпорвейва до ИИ-эстетики и современных мультимедийных практик вплоть до 2026 года.
