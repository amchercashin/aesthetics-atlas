# Главы-эпохи. Диапазоны условны и могут перекрываться.
- id: prehistory
  pigment: Красная охра
  name: Первобытность
  short: Первобытность
  start: -66000
  end: -3000
  intro: >
    Десятки тысяч лет до письменности. Древнейшему датированному рисунку — трафарету ладони — не меньше
    67 800 лет. Люди охрой и углём рисуют животных на стенах пещер,
    вырезают фигурки из бивня и ставят каменные кольца. Здесь начинается всё остальное.
- id: ancient
  pigment: Египетская синь
  name: Древний мир
  short: Древность
  start: -3500
  end: -500
  intro: >
    Первые города и государства. Искусство служит богам и царям: появляются канон,
    иерархия размеров, монументальная архитектура и письмо, которое тоже становится орнаментом.
- id: antiquity
  pigment: Помпейский красный
  name: Античность
  short: Античность
  start: -800
  end: 500
  intro: >
    Греция и Рим открывают идеальные пропорции, ордер и человеческое тело как меру всего.
    Эту классику потом будут возрождать снова и снова, вплоть до vaporwave.
- id: medieval
  pigment: Сусальное золото
  name: Средневековье
  short: Средние века
  start: 500
  end: 1400
  intro: >
    Тысяча лет, в которые изображение — это окно в иной мир. Золотые фоны икон, витражи
    готических соборов, исламская геометрия и китайский пейзаж тушью развиваются параллельно.
- id: renaissance
  pigment: Ультрамарин
  name: Возрождение и барокко
  short: Возрождение
  start: 1400
  end: 1750
  intro: >
    Линейная перспектива, анатомия, светотень. Художник становится автором, а картина —
    иллюзией реальности. Затем барокко добавляет театр и движение, рококо — лёгкость и игру.
- id: xix
  pigment: Мовеин
  name: От Просвещения к импрессионизму
  short: 1750–1880
  start: 1750
  end: 1880
  intro: >
    Революции, промышленность, фотография. Стили сменяются быстрее: строгий неоклассицизм,
    страстный романтизм, трезвый реализм и первые попытки писать не предмет, а впечатление.
- id: fin-de-siecle
  pigment: Изумрудная зелень
  name: Рубеж веков
  short: 1880–1910
  start: 1880
  end: 1910
  intro: >
    Цвет освобождается от формы, линия — от предмета. Модерн превращает в искусство всё,
    от вокзала до ложки, а фовисты и экспрессионисты готовят взрыв авангарда.
- id: avant-garde
  pigment: Кадмий красный
  name: Авангард
  short: Авангард
  start: 1907
  end: 1945
  intro: >
    Три десятилетия радикальных экспериментов: кубизм разбирает предмет, супрематизм отказывается
    от него вовсе, Баухаус и конструктивизм проектируют новый мир, сюрреализм уходит в сон.
- id: postwar
  pigment: Синий Кляйна
  name: Послевоенный модернизм
  short: 1945–1970
  start: 1945
  end: 1970
  intro: >
    Центр искусства перемещается в Нью-Йорк. Абстрактный экспрессионизм, поп-арт и минимализм;
    швейцарская типографика и mid-century modern задают облик корпораций и домов.
- id: postmodern
  pigment: Флуоресцентный розовый
  name: Постмодерн
  short: Постмодерн
  start: 1970
  end: 2000
  intro: >
    Вера в единственно верный стиль заканчивается. Цитата, ирония, смешение высокого и низкого:
    Мемфис, панк, граффити, деконструктивизм и неоновые города киберпанка.
- id: digital
  pigment: Экранный циан
  name: Цифровая эпоха
  short: Цифра
  start: 1995
  end: 2015
  intro: >
    Интерфейс становится главным холстом эпохи. От мигающих страниц GeoCities и глянца Y2K
    до стеклянных пузырей Frutiger Aero и победы плоского дизайна.
- id: internet
  pigment: Электрик-фиолет
  name: Интернет-эстетики
  short: Интернет
  start: 2010
  end: 2026
  intro: >
    Эстетики рождаются в Tumblr, YouTube и TikTok, получают названия с суффиксом «-core»
    и живут по нескольку лет. Ностальгия, тревога, уют и чужие воспоминания — вплоть до 2026 года.
