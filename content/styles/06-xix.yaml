    бюргера. Мебель смягчает строгость ампира и делается из светлых местных пород без металлического декора. Живопись
    предпочитает жанр и сентиментальные сюжеты: Шпицвег пишет бедного поэта в мансарде, под зонтиком от протекающей крыши.
