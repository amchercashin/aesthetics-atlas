      title: Давид. Смерть Сократа
    - file: Death_of_Marat_by_David.jpg
      title: Давид. Смерть Марата
  summary: >
    После раскопок Помпей Европа устала от рококо и вернулась к строгой античной добродетели: ясная линия, героизм, колонны.
  description: |
    Открытие Помпей и Геркуланума, тексты Винкельмана о «благородной простоте и спокойном величии» греков
    и дух Просвещения повернули вкус к античности. Жак Луи Давид в «Клятве Горациев» ставит героев как
    статуи на фоне аркады: чёткие контуры, холодный свет, гражданский пафос. В архитектуре — портики,
    купола, симметрия; в России — Петербург Кваренги, Росси и Воронихина.
  traits:
    - Ясная линия и чёткий контур
    - Античные сюжеты о долге и доблести
    - Симметрия, уравновешенность, сдержанный колорит
    - Портики, колонны, купола
  promptCues:
    - Ясная линия и чёткий контур
    - Строгая симметрия и уравновешенность
    - Сдержанный колорит и гладкое письмо
    - Колонны, портики и античные формы в обрамлении
  names: [Жак Луи Давид, Антонио Канова, Энгр, Карл Росси, Андрей Воронихин]
