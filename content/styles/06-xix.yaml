- id: neoclassicism
  name: Неоклассицизм
  orig: Neoclassicism
  aliases: [классицизм, Давид, Канова, ампир]
  start: 1750
  end: 1830
  dates: ок. 1750 – 1830
  era: xix
  domain: [art, architecture]
  region: Франция, Европа, Россия
  tier: 1
  parents:
    - { id: classical-greece, type: revival }
    - { id: rococo, type: reaction }
  summary: >
    После раскопок Помпей Европа устала от рококо и вернулась к строгой античной добродетели: ясная линия, героизм, колонны.
  description: |
    Открытие Помпей и Геркуланума, тексты Винкельмана о «благородной простоте и спокойном величии» греков
    и дух Просвещения повернули вкус к античности. Жак Луи Давид в «Клятве Горациев» ставит героев как
    статуи на фоне аркады: чёткие контуры, холодный свет, гражданский пафос. В архитектуре — портики,
    купола, симметрия; в России — Петербург Кваренги, Росси и Воронихина.
  traits:
    - Ясная линия и чёткий контур
    - Античные сюжеты о долге и доблести
    - Симметрия, уравновешенность, сдержанный колорит
    - Портики, колонны, купола
  names: [Жак Луи Давид, Антонио Канова, Энгр, Карл Росси, Андрей Воронихин]
  example:
    file: Jacques-Louis David - Oath of the Horatii - Google Art Project.jpg
    title: Клятва Горациев
    author: Жак Луи Давид
    year: 1784
    place: Лувр, Париж
  wiki: Neoclassicism
  links:
    - { title: "Neoclassicism", url: "https://www.theartstory.org/movement/neoclassicism/", src: "The Art Story", lang: en }

- id: empire-style
  name: Ампир
  orig: Empire style
  aliases: [стиль ампир, наполеоновский стиль, русский ампир]
  start: 1800
  end: 1830
  dates: ок. 1800 – 1830
  era: xix
  domain: [architecture, design]
  region: Франция, Россия, Европа
  tier: 2
  parents:
    - { id: neoclassicism, type: evolved }
  summary: >
    Имперский неоклассицизм Наполеона: триумфальные арки, лавровые венки, золочёная бронза и тёмное красное дерево.
  description: |
    Наполеон хотел, чтобы его империя выглядела как Рим. Архитекторы Персье и Фонтен строят триумфальные
    арки, мебель украшают сфинксами, орлами, лаврами и египетскими мотивами после похода в Египет.
    После 1812 года стиль расцветает в России: ансамбли Росси в Петербурге и послепожарная Москва.
  traits:
    - Триумфальные мотивы — арки, лавры, орлы
    - Тёмное дерево с золочёной бронзой
    - Египетские и римские военные символы
    - Монументальная симметрия
  names: [Шарль Персье, Пьер Фонтен, Карл Росси, Осип Бове]
  example:
    file: Arc de triomphe du carrousel in Paris France.jpg
    title: Триумфальная арка на площади Каррузель
    author: Шарль Персье, Пьер Фонтен
    year: 1806–1808
    place: Париж
  wiki: Empire style
  links: []

- id: romanticism
  name: Романтизм
  orig: Romanticism
  aliases: [романтики, Фридрих, Делакруа, Тёрнер]
  start: 1790
  end: 1850
  dates: ок. 1790 – 1850
  era: xix
  domain: [art]
  region: Германия, Англия, Франция
  tier: 1
  parents:
    - { id: neoclassicism, type: reaction }
  summary: >
    Чувство против разума: одинокий путник над туманом, бури, руины, восстания и величие природы.
  description: |
    Романтики отвергли холодную рассудочность классицизма. Каспар Давид Фридрих пишет фигуру со спины
    перед бескрайним туманом, Тёрнер растворяет корабли в вихрях света, Делакруа ведёт Свободу на баррикады.
    Главное — возвышенное: природа и история, перед которыми человек ощущает трепет.
  traits:
    - Возвышенная, грозная природа
    - Одинокая фигура, часто со спины
    - Драма, эмоции, бурный мазок
    - Интерес к прошлому, руинам, Востоку
  names: [Каспар Давид Фридрих, Уильям Тёрнер, Эжен Делакруа, Франсиско Гойя, Карл Брюллов]
  example:
    file: Caspar David Friedrich - Wanderer above the sea of fog.jpg
    title: Странник над морем тумана
    author: Каспар Давид Фридрих
    year: ок. 1818
    place: Гамбургский кунстхалле
  wiki: Romanticism
  links:
    - { title: "Romanticism", url: "https://www.theartstory.org/movement/romanticism/", src: "The Art Story", lang: en }

- id: biedermeier
  name: Бидермайер
  orig: Biedermeier
  aliases: [стиль бидермайер, бюргерский уют]
  start: 1815
  end: 1848
  dates: 1815 – 1848
  era: xix
  domain: [design, art]
  region: Германия, Австрия
  tier: 3
  parents:
    - { id: empire-style, type: evolved }
  summary: >
    Домашний уют бюргера: простая светлая мебель, цветы на окнах и тихие жанровые сценки.
  description: |
    После наполеоновских войн и в эпоху цензуры жители Вены и Берлина уходят в частную жизнь. Ампир
    упрощается до удобной мебели из светлого дерева с плавными линиями, а живопись — до добродушных
    сцен из быта. Карл Шпицвег пишет бедного поэта под зонтиком от протекающей крыши.
  traits:
    - Простые плавные формы мебели
    - Светлые породы дерева — вишня, груша
    - Уютные интерьеры и бытовые сценки
    - Сдержанность и практичность
  names: [Карл Шпицвег, Фердинанд Георг Вальдмюллер, Йозеф Данхаузер]
  example:
    file: Carl Spitzweg - Der arme Poet (Neue Pinakothek).jpg
    title: Бедный поэт
    author: Карл Шпицвег
    year: 1839
    place: Новая пинакотека, Мюнхен
  wiki: Biedermeier
  links: []

- id: academism
  name: Академизм
  orig: Academic art
  aliases: [академическое искусство, салонная живопись, Бугро, ар-помпье]
  start: 1820
  end: 1900
  dates: ок. 1820 – 1900
  era: xix
  domain: [art]
  region: Франция, Европа, Россия
  tier: 2
  parents:
    - { id: neoclassicism, type: evolved }
  summary: >
    Идеальная гладкая живопись Салона: мифологические богини, безупречное тело, невидимый мазок.
  description: |
    Академии художеств задавали правила: рисунок с антиков, иерархия жанров, где история и мифология выше
    пейзажа, и безупречная отделка без видимого мазка. Бугро и Кабанель писали обнажённых богинь,
    которых охотно покупала буржуазия. Именно против академизма восстанут реалисты, прерафаэлиты и импрессионисты.
  traits:
    - Безупречная, «зализанная» поверхность
    - Мифологические и исторические сюжеты
    - Идеализированная анатомия
    - Тёплый, «музейный» колорит
  names: [Вильям Бугро, Александр Кабанель, Жан-Леон Жером, Генрих Семирадский]
  example:
    file: William-Adolphe Bouguereau (1825-1905) - The Birth of Venus (1879).jpg
    title: Рождение Венеры
    author: Вильям Бугро
    year: 1879
    place: Музей Орсе, Париж
  wiki: Academic art
  links: []

- id: barbizon-school
  name: Барбизонская школа
  orig: Barbizon school
  aliases: [барбизонцы, Коро, Руссо, пейзаж на пленэре]
  start: 1830
  end: 1870
  dates: ок. 1830 – 1870
  era: xix
  domain: [art]
  region: Франция
  tier: 3
  parents:
    - { id: romanticism, type: evolved }
    - { id: dutch-golden-age, type: influence }
  summary: >
    Художники уходят из мастерских в лес Фонтенбло и пишут обычную французскую природу — без богов и героев.
  description: |
    В деревне Барбизон под Парижем поселились Теодор Руссо, Добиньи, Милле, а Коро часто работал рядом.
    Вдохновляясь голландскими пейзажистами и Констеблом, они писали этюды на открытом воздухе и превращали
    скромный лес, пруд или поле в самостоятельную тему. Это прямой мост к реализму и импрессионизму.
  traits:
    - Скромный, «непарадный» пейзаж
    - Работа на натуре, этюды на пленэре
    - Серебристый, приглушённый свет
    - Крестьяне и лес как главные герои
  names: [Камиль Коро, Теодор Руссо, Шарль-Франсуа Добиньи, Жан-Франсуа Милле]
  example:
    file: Souvenir de Mortefontaine (Camille Corot).jpg
    title: Воспоминание о Мортефонтене
    author: Камиль Коро
    year: 1864
    place: Лувр, Париж
  wiki: Barbizon school
  links:
    - { title: "Barbizon School", url: "https://www.theartstory.org/movement/barbizon-school/", src: "The Art Story", lang: en }

- id: pre-raphaelites
  name: Прерафаэлиты
  orig: Pre-Raphaelite Brotherhood
  aliases: [братство прерафаэлитов, Милле, Россетти, Офелия]
  start: 1848
  end: 1900
  dates: 1848 – 1900
  era: xix
  domain: [art]
  region: Великобритания
  tier: 2
  parents:
    - { id: academism, type: reaction }
    - { id: early-renaissance, type: revival }
  summary: >
    Молодые англичане против академической рутины: яркие краски, точность ботаника и средневековая поэзия.
  description: |
    Россетти, Милле и Хант решили писать так, как писали до Рафаэля, — честно, ярко, с любовью к каждой
    травинке. «Офелия» Милле плывёт среди цветов, выписанных с натуры на берегу реки. Позже прерафаэлиты
    ушли в символизм и рыжеволосых красавиц, а их идеи подхватили Уильям Моррис и движение искусств и ремёсел.
  traits:
    - Яркие, насыщенные цвета на белом грунте
    - Ботаническая точность деталей
    - Сюжеты из Шекспира, легенд и Средневековья
    - Задумчивые героини с длинными волосами
  names: [Данте Габриэль Россетти, Джон Эверетт Милле, Уильям Холман Хант, Эдвард Бёрн-Джонс]
  example:
    file: John Everett Millais - Ophelia - Google Art Project.jpg
    title: Офелия
    author: Джон Эверетт Милле
    year: 1851–1852
    place: Галерея Тейт, Лондон
  wiki: Pre-Raphaelite Brotherhood
  links:
    - { title: "Pre-Raphaelite", url: "https://www.tate.org.uk/art/art-terms/p/pre-raphaelite", src: "Tate", lang: en }

- id: peredvizhniki
  name: Передвижники
  orig: Peredvizhniki (The Wanderers)
  aliases: [Товарищество передвижных художественных выставок, Репин, русский реализм]
  start: 1870
  end: 1923
  dates: 1870 – 1923
  era: xix
  domain: [art]
  region: Россия
  tier: 2
  parents:
    - { id: realism, type: evolved }
    - { id: academism, type: reaction }
  summary: >
    Русский реализм с гражданской совестью: бурлаки, крестный ход, суровая природа, выставки по всей стране.
  description: |
    В 1863 году четырнадцать выпускников Академии отказались писать заданный мифологический сюжет —
    «бунт четырнадцати». Через несколько лет возникло Товарищество, возившее выставки по городам России.
    Репин, Перов, Крамской, Суриков и Левитан писали жизнь народа, историю и пейзаж так, чтобы зритель
    задумался о социальной правде.
  traits:
    - Социальные и исторические сюжеты
    - Психологизм лиц
    - Реалистичная, «разговорная» манера
    - Русский пейзаж с настроением
  names: [Илья Репин, Иван Крамской, Василий Суриков, Василий Перов, Исаак Левитан]
  example:
    file: Ilya Repin - Barge Haulers on the Volga - Google Art Project.jpg
    title: Бурлаки на Волге
    author: Илья Репин
    year: 1870–1873
    place: Государственный Русский музей, Санкт-Петербург
  wiki: Peredvizhniki
  links: []

- id: historicism
  name: Историзм и эклектика
  orig: Historicism (Eclecticism)
  aliases: [эклектика, неостили, викторианский стиль, бозар]
  start: 1830
  end: 1910
  dates: ок. 1830 – 1910
  era: xix
  domain: [architecture, design]
  region: Европа, Америка, Россия
  tier: 3
  parents:
    - { id: gothic-revival, type: evolved }
    - { id: neoclassicism, type: evolved }
  summary: >
    Все стили прошлого сразу: неоренессанс, необарокко, неорусский стиль — пышные фасады для оперы, банка и вокзала.
  description: |
    Буржуазный XIX век строит много и хочет богато. Архитекторы свободно комбинируют формы всех эпох,
    подбирая «подходящий» стиль к назначению здания: готика для церкви, ренессанс для банка, барокко для
    театра. Парижская Опера Гарнье — квинтэссенция этой роскошной смеси. Против неё восстанут модерн
    и чикагская школа.
  traits:
    - Свободное смешение стилей прошлого
    - Обилие декора, скульптуры и позолоты
    - Стиль подбирается под назначение здания
    - Новые материалы под историческими формами
  names: [Шарль Гарнье, Готфрид Земпер, Константин Тон, Ипполит Монигетти]
  example:
    file: West facade of Palais Garnier, Paris 2017.jpg
    title: Опера Гарнье
    author: Шарль Гарнье
    year: 1861–1875
    place: Париж
  wiki: Historicism (art)
  links: []

- id: aesthetic-movement
  name: Эстетизм
  orig: Aesthetic movement
  aliases: [искусство для искусства, Уистлер, Оскар Уайльд]
  start: 1860
  end: 1900
  dates: ок. 1860 – 1900
  era: xix
  domain: [art, design]
  region: Великобритания
  tier: 3
  parents:
    - { id: pre-raphaelites, type: evolved }
    - { id: japonisme, type: influence }
  summary: >
    «Искусство для искусства»: красота сама по себе, без морали и сюжета, — от ноктюрнов Уистлера до павлиньих интерьеров.
  description: |
    Эстеты во главе с Уистлером и Оскаром Уайльдом утверждали, что искусство ничего не должно — ни учить,
    ни рассказывать. Уистлер называл картины «ноктюрнами» и «симфониями», как музыку: в «Ноктюрне в чёрном
    и золотом» фейерверк растворяется во тьме. Рёскин обвинил его в том, что он «плеснул краской в лицо
    публике», — и проиграл суд.
  traits:
    - Красота важнее сюжета и морали
    - Музыкальные названия — ноктюрн, симфония
    - Японские мотивы, павлины, подсолнухи
    - Тонкие тональные гармонии
  names: [Джеймс Уистлер, Оскар Уайльд, Альберт Мур, Эдвард Годвин]
  example:
    file: Whistler-Nocturne in black and gold.jpg
    title: Ноктюрн в чёрном и золотом. Падающая ракета
    author: Джеймс Уистлер
    year: 1875
    place: Детройтский институт искусств
  wiki: Aesthetic movement
  links:
    - { title: "Aesthetic Movement", url: "https://www.theartstory.org/movement/aesthetic-art/", src: "The Art Story", lang: en }

- id: japonisme
  name: Японизм
  orig: Japonisme
  aliases: [японская мода, влияние японской гравюры]
  start: 1860
  end: 1910
  dates: ок. 1860 – 1910
  era: xix
  domain: [art, design]
  region: Франция, Европа
  tier: 3
  parents:
    - { id: ukiyo-e, type: influence }
  summary: >
    Открытие Японии потрясает Европу: плоский цвет, смелое кадрирование и асимметрия меняют живопись и дизайн.
  description: |
    После 1854 года в Европу хлынули японские гравюры, веера и фарфор. Художники увидели совсем другое
    построение изображения: без перспективы, с обрезанными краями и чистыми плоскостями цвета. Ван Гог
    копировал Хиросигэ, Моне собирал гравюры, Дега и Тулуз-Лотрек учились кадрированию. Японизм стал
    одним из ключей к модернизму и модерну.
  traits:
    - Плоские цветовые плоскости
    - Обрезанная, асимметричная композиция
    - Веера, кимоно, цветущие ветви
    - Высокая линия горизонта
  names: [Винсент ван Гог, Клод Моне, Эдгар Дега, Анри де Тулуз-Лотрек]
  example:
    file: Flowering Plum Orchard - after Hiroshige - My Dream.jpg
    title: Цветущий сливовый сад (по Хиросигэ)
    author: Винсент ван Гог
    year: 1887
    place: Музей Ван Гога, Амстердам
  wiki: Japonisme
  links:
    - { title: "Japonisme", url: "https://www.theartstory.org/movement/japonism/", src: "The Art Story", lang: en }

- id: gothic-revival
  name: Неоготика
  orig: Gothic Revival
  aliases: [неоготический стиль, псевдоготика, викторианская готика]
  start: 1790
  end: 1900
  dates: 1790-е – 1900-е
  era: xix
  domain: [architecture, design]
  region: Великобритания, затем весь мир
  tier: 2
  parents:
    - { id: gothic, type: revival }
    - { id: romanticism, type: influence }
  summary: >
    Возрождение средневековой готики в эпоху пара и железа: парламенты, вокзалы и университеты
    в стрельчатых арках.
  description: |
    Началось как романтическая игра аристократов в «старину», а после пожара 1834 года стало
    официальным языком британского государства: новый Вестминстерский дворец Бэрри и Пьюджина.
    Для Пьюджина и Рёскина готика была честнее и нравственнее классики.
  traits:
    - Стрельчатые окна, шпили, пинакли
    - Асимметричные живописные силуэты
    - Новые материалы — чугун, кирпич — под средневековым декором
    - Орнамент из трилистников и четырёхлистников
  names: [Огастес Пьюджин, Чарльз Бэрри, Джон Рёскин, Эжен Виолле-ле-Дюк]
