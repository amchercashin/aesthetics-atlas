    - file: Pierre-Auguste_Renoir_-_Luncheon_of_the_Boating_Party_-_Google_Art_Project.jpg
      title: Ренуар. Завтрак гребцов
  summary: >
    Свет, воздух и мгновение: быстрые мазки чистого цвета на пленэре вместо выверенной
    мастерской живописи.
  description: |
    Название придумал насмешливый критик по картине Моне «Впечатление. Восходящее солнце» на
    выставке 1874 года. Молодые художники, отвергнутые официальным Салоном, писали на открытом
    воздухе, ловя меняющийся свет: стога, соборы, бульвары, кафе и пригородные пикники.

    Они раскладывали цвет на отдельные мазки, отказывались от чёрного в тенях и оставляли
    картину словно незаконченной. Тюбиковые краски, железная дорога и японская гравюра сделали
    это возможным, а импрессионизм открыл дверь всему модернизму.
  traits:
    - Видимый, дробный мазок
    - Чистый цвет, цветные тени вместо чёрных
    - Работа на пленэре, интерес к мгновению
    - Сюжеты современной городской жизни и досуга
    - Обрезанное, «случайное» кадрирование
  promptCues:
    - Видимый, дробный мазок
    - Чистый цвет, цветные тени вместо чёрных
    - Переменчивый дневной свет и воздух
    - Случайное, обрезанное кадрирование
