  summary: >
    Раскопки античных городов возвращают Европе ясную линию, героизм и колонны.
  description: |
    Во второй половине XVIII века Европа всё сильнее обращается к античности. Находки в Геркулануме, Помпеях, Афинах
    и Пальмире расходятся в трактатах и гравюрах, а Винкельман утверждает превосходство греческого искусства
    и его идеальной красоты. Жак Луи Давид в «Клятве Горациев» (1784), написанной по королевскому заказу, ставит
    героев у аркады: чёткие контуры, сдержанный цвет, гражданский сюжет.
  traits:
    - Ясная линия и чёткий контур
    - Античные сюжеты о долге и доблести
    - Симметрия, уравновешенность, сдержанный колорит
    - Колонны и арки в композиции
  promptCues:
    - Ясная линия и чёткий контур
    - Строгая симметрия и уравновешенность
    - Сдержанный колорит и гладкое письмо
    - Колонны, портики и античные формы в обрамлении
  names: [Жак Луи Давид, Антонио Канова, Энгр, Карл Росси, Андрей Воронихин]
  example:
