    - { id: romanticism, type: reaction }
  summary: >
    Писать то, что видишь: крестьян, рабочих и похороны в провинции — в масштабе, прежде
    отведённом богам и героям.
  description: |
    Гюстав Курбе заявил, что не умеет писать ангелов, потому что никогда их не видел. Реалисты
    отказались от идеализации академии и романтических грёз и сделали героями картин обычных
    людей — без прикрас и морали.
  traits:
    - Обыденные сюжеты и простые люди
    - Отказ от идеализации
    - Землистая, сдержанная палитра
    - Большой формат для «низких» тем
  names: [Гюстав Курбе, Жан-Франсуа Милле, Оноре Домье, Илья Репин]
