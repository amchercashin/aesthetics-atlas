  summary: >
    Чувство против разума: одинокий путник над туманом, бури, катастрофы и величие природы.
  description: |
    Романтизм как понятие возникает около 1800 года, а как художественное движение набирает силу во Франции и Британии
    в первые десятилетия XIX века. Он ставит воображение и чувство выше порядка и разума Просвещения, хотя многие ранние
    романтики вышли из мастерской Давида. Природа становится грозной и возвышенной: у Тёрнера снежный вихрь поглощает
