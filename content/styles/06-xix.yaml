    - id: rococo
      type: reaction
      status: verified
      note: >-
        Кураторское предисловие Art Institute Museum Studies 15(1) прямо описывает неоклассическую реакцию на
        воспринимаемую фривольность рококо. Оставить reaction как одну из установок конца XVIII века, сохранив
        самостоятельную роль археологии, античных моделей и Просвещения.
