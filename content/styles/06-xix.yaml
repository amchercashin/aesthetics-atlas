    Бунт против фабричной безликости: ручная работа, честные материалы и узоры из птиц и листьев.
  description: |
    Уильям Моррис и его последователи считали, что промышленность убила красоту и радость труда.
    Они возрождали средневековые цеха, печатали обои и ткани вручную, переплетали книги. Идея,
    что дизайн повседневных вещей — это искусство, напрямую привела к модерну и Баухаусу.
