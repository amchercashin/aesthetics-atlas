    author: Жак Луи Давид
    year: 1784
    place: Лувр, Париж
    whyRepresentative: >-
      Братья и отец выстроены у трёх арок почти как рельеф: жёсткие контуры, клинки в центре и сдержанная гамма.
    sources: [louvre-horatii]
  evidence:
