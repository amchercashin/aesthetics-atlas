- id: pacita-abad
  name: Расписанные текстильные поверхности Паситы Абад
  orig: "Pacita Abad: trapunto and textile collage"
  kind: author-style
  start: 1988
  end: 1998
  era: postmodern
  domain:
    - art
  medium:
    - painting
    - textile
  region: >-
    Филиппины, Юго-Восточная Азия; США и международная практика художницы; ткани из разных мест и семейного
    собрания
  tier: 3
  dateKind: practice
  origin: unknown
  parents: []
  summary: >-
    Живопись, шитьё и собранные ткани образуют плотную цветовую поверхность с заметным рельефом и повтором
    деталей.
  description: >-
    Выбранный корпус соединяет две картины с набивкой и текстильный коллаж. В Bacongo VIII и L.A. Liberty
    фигура строится вместе с системой линий, швов и прикреплённых деталей. В 100 Years of Freedom фигура
    уступает место повтору длинных тканевых полос. Цвет и материальная фактура участвуют в композиции
    одновременно.


    Trapunto здесь обозначает конкретный способ прошивать и набивать холст, описанный Walker. Эта техника не
    объясняет автоматически происхождение каждого узора. Статья Клариссы Эсгерры прослеживает несколько
    источников тканей в коллаже 1998 года; многообразие материала следует сохранять, а не сводить к одному
    национальному орнаменту.
  traits:
    - Насыщенные цветовые поля дробятся на небольшие орнаментальные участки
    - Швы, набивка и прикреплённые детали создают видимый рельеф поверхности
    - Линии и повтор деталей объединяют фигуру с фоном
    - Разные ткани сохраняют собственный рисунок внутри общей композиции
