      title: Anatoly Zverev. Portrait of Alyona Basilova
      author: Aleksei Svetailo
      whyRepresentative: Экспрессивный портрет со свободными мазками и сдвинутой композицией.
  summary: >-
    Портретный образ собирается стремительной линией, открытым пятном и несколькими выразительными акцентами
    лица.
  description: >-
    В выбранном портретном корпусе Зверев меняет соотношение цвета и линии: от насыщенной гуаши до почти
    монохромного рисунка. Повторяется способ выделять взгляд, рот и поворот головы, оставляя контур
    прерывистым, а фон — свободным.


    Корпус ограничен тремя музейно атрибутированными портретами 1958–1967 годов. Его собственная тема —
    устройство портретного образа, а не вся биография художника. Разница материалов и степени заполнения листа
    помогает увидеть устойчивый приём внутри вариаций. Материалы учебного мастер-класса Музея AZ не
    использованы как сведения о технике оригиналов.
  traits:
    - Прерывистая линия и открытые участки контура
    - Акцент на глазах и рте при свободной моделировке лица
    - Цветовое пятно может выходить за границу изображённой формы
    - Неровный ритм штриха и сохранение незаполненной поверхности
