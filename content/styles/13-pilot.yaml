  parents: []
  summary: >-
    Лаконичные эмблемы, яркая окраска и переработанный камуфляж делают личную и культурную принадлежность
    публично видимой.
  description: >-
    Реко Ренни соединяет опыт граффити с конкретными знаками своей связи с Kamilaroi/Gamilaroi. В пояснении к
    Regalia он отдельно описывает корону, ромб и флаг; эти значения принадлежат данному высказыванию
    художника. Они не образуют универсального словаря всех коренных народов Австралии.


    Корпус сопоставляет неоновую эмблему и два видео с автомобилями. Здесь меняются носитель и масштаб:
    отдельный световой контур, ярко расписанный предмет, движение в ландшафте. AGSA объясняет, как броская
    окраска меняет обычную функцию камуфляжа. Это соединение знака, поверхности и публичного присутствия
    задаёт границы авторской карточки.
  traits:
    - Сокращение сложного высказывания до контрастного узнаваемого знака
    - Яркий розовый и светящиеся контуры усиливают заметность
    - Камуфляж превращается из средства сокрытия в средство привлечь взгляд
    - Знак переносится с плоскости и неона на предмет и экранное пространство
