  summary: >-
    Контурный рисунок, цветовые плоскости и устройство книжной страницы связывают повествовательное
    изображение с орнаментом и текстом.
  description: >-
    Карточка описывает ограниченный корпус сказочной книжной графики начала XX века. В нём есть и небольшой
    контурный рисунок на свободном поле, и насыщенная рамкой цветная иллюстрация, и страница с текстом.
    Повторяется внимание к линии, силуэту и месту рисунка внутри книги; степень орнаментальной плотности
    меняется.


    Третьяковская галерея рассматривает оформление сказок Билибина как целое, включающее иллюстрации, буквицы
    и бордюры. Имя автора здесь обозначает самостоятельный визуальный язык, а не новое историческое движение.
    Даты рисунков, выпуска книг и конкретных оттисков различаются: для страницы «Белой уточки» видна дата
    рисунка 1902, но год показанного печатного экземпляра не установлен.
  traits:
    - Контурная линия удерживает силуэт и разделяет цветовые участки
    - Плоские цветовые поля сочетаются с детализированным линейным узором
    - Рамка, буквица и иллюстрация соотносятся с устройством книжной страницы
    - Плотные орнаментальные листы чередуются с небольшими рисунками на свободном поле
