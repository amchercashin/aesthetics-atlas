- id: zverev-portrait-graphics
  name: Экспрессивные портреты Анатолия Зверева
  orig: Expressive portraits by Anatoly Zverev
  kind: author-style
  start: 1958
  end: 1967
  era: postwar
  domain:
    - art
  medium:
    - painting
    - drawing
  region: Москва, СССР / Россия
