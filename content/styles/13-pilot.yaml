  summary: Фактурный рисунок, светлое или туманное поле и выразительный силуэт соединяются в перекладочной анимации.
  description: >-
    Карточка сопоставляет визуальную организацию трёх фильмов 1974–1979 годов. В опубликованных кадрах рисунок
    не теряет ручной фактуры: тонкие контуры птиц, мягкие границы тумана и контрастные силуэты формируют
    разные пространственные состояния. Кадр используется как образец изображения; полное устройство движения и
    монтажа требует просмотра фильма.


    У этого корпуса несколько авторских ролей. Норштейн указан режиссёром и аниматором, Ярбусова —
    художником-постановщиком. Александр Жуковский снял «Цаплю и журавля» и «Ёжика в тумане», Игорь
    Скидан-Босин — «Сказку сказок». Именной узел не должен превращать всю экранную работу в единоличное
    авторство режиссёра.
  traits:
    - Ручная фактура рисунка сохраняется в экранном изображении
    - Контур и силуэт меняют выразительность на светлом либо туманном поле
    - Разная чёткость фигур и фона создаёт ощущение воздушной глубины
    - Небольшие цветовые акценты выделяются среди приглушённых тонов
