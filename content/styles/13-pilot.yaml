- id: khokhloma
  name: Хохломская роспись
  orig: Khokhloma painting
  kind: tradition
  start: 1650
  end: null
  era: renaissance
  domain:
    - art
  medium:
    - decorative-arts
  region: "Нижегородское Заволжье, Россия: Семёнов, Сёмино и связанные мастерские"
  tier: 2
  dateKind: practice
  origin: unknown
  parents: []
  summary: >-
    Роспись деревянных предметов, в которой золотистая поверхность, травный орнамент и форма вещи образуют
    общую композицию.
  description: >-
    Хохлома — традиция художественной обработки дерева с несколькими центрами и поколениями мастеров. В
    собрании Русского музея она представлена предметами разных размеров и назначения. Музей описывает
    технологию грунта с металлическим порошком и прозрачного покрытия; золотистый вид не означает, что предмет
    покрыт настоящим золотом.


    Сравнение чаши XIX века, ковша 1920–1930-х и блюда 1969 года показывает изменения внутри традиции. Декор
    может быть редким или плотным, геометрически расчленённым или свободно растительным. Старые покрытия
    темнеют, поэтому одинаковая современная палитра не должна становиться тестом подлинности. Ключевы связь
    рисунка с объёмом и система орнаментального письма.
  traits:
    - Золотистая поверхность в сочетании с красным, чёрным и меняющимися оттенками старого покрытия
    - Травные побеги, ягоды, листья и завитки, согласованные с формой вещи
    - Чередование заполненных и свободных полей; центральные геометрические либо растительные композиции
    - Декор проходит по округлой поверхности, не превращаясь в отдельную станковую картину
