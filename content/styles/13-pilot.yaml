      whyRepresentative: Детский рисунок с животными и подписями; линейная манера школы Карролап.
  summary: >-
    Пейзажные рисунки детей Карролап соединяют выразительный цвет земли, тёмные силуэты деревьев и ритм фигур
    и животных.
  description: >-
    Работы созданы детьми, насильственно разлучёнными с семьями и помещёнными в поселение Карролап. История
    коллекции включает преподавание Noel и Lily White, зарубежные показы, утрату местонахождения части работ и
    последующее возвращение собрания. Эту среду важно сохранять рядом с формальным сравнением.


    В выбранных рисунках 1949–1950 годов тёмные стволы и силуэты выделены на светлом либо тёплом поле, а
    диагонали земли и воды связывают передний и дальний планы. Рейнольд Харт, Парнелл Демпстер и Барри Лу
    решают эти задачи по-разному. Карточка описывает конкретную историческую школу, сохраняя именное авторство
    и различия между работами.
  traits:
    - Контраст тёмных деревьев и фигур со светлым или тёплым пейзажным полем
    - Ритм стволов, силуэтов животных и человеческих фигур
    - Диагонали склона, берега или дороги организуют глубину
    - Пастель, акварель и тушь дают разные способы сочетать плоскость и пространство
