  gallery:
    - file: File:The Great Wave off Kanagawa.jpg
      title: The Great Wave off Kanagawa
      author: After Katsushika Hokusai
      whyRepresentative: "Волна с лодками и Фудзи: крупный передний план и диагональ."
  summary: >-
    Фудзи становится постоянной точкой сравнения в композициях с крупным передним планом, резкими диагоналями
    и меняющимся масштабом.
  description: >-
    Три листа серии «Тридцать шесть видов Фудзи» показывают разные способы организовать пейзаж вокруг одной
    горы. Волна занимает передний план, рыболовная сцена связывает берег с далью, а «Попутный ветер, ясная
    погода» приближает саму Фудзи. Повтор мотива позволяет увидеть различия кадрирования и масштаба.


    Авторская атрибуция рисунка не отменяет коллективного производства гравюры. В выбранных записях имена
    резчиков и печатников не сообщены. Музей Тибы отдельно подчёркивает роль печатника в градации цвета и
    различия между оттисками. Подписи относятся к конкретным музейным экземплярам; оттенки одного снимка не
    объявляются обязательной палитрой серии.
  traits:
    - Крупный передний план сопоставлен с малой дальней Фудзи
    - Дуги и диагонали связывают фигуры, воду, берег и гору
    - Ограниченные цветовые поля сочетаются с градациями печатного тона
    - Повтор одной горы позволяет резко менять кадрирование и пространственный масштаб
