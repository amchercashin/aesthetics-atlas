  summary: >-
    Рукописная страница становится пространством разрывов, повторяющихся фигур, изменённых рамок и
    неоднозначного чтения.
  description: >-
    Сикандер училась исторической рукописной живописи в Лахоре, а затем развивала практику в США. Выбранный
    корпус 1989–2002 годов сохраняет работу на бумаге и обращение к устройству страницы, одновременно меняя
    масштаб, порядок чтения и отношения между центром и полями.


    В The Scroll архитектура организует длинное повествовательное пространство; в Perilous Order портрет
    прерывают другие фигуры и точечная сетка; в Usurpia насыщенная рамка окружает разреженное центральное
    поле. Это три разных композиционных решения одного ограниченного исследовательского корпуса. Поздние
    анимация, мозаика и общественная скульптура остаются отдельными возможными направлениями разбора.
  traits:
    - Изменение соотношения центрального изображения, рамки и полей
    - Перекрывающиеся фигуры и несовпадающие масштабы внутри одной страницы
    - Точное письмо соседствует с разреженным полем, повтором или разрывом
    - Повествование разворачивается через несколько точек зрения и состояний фигуры
