- id: emily-kngwarray
  name: Живопись Эмили Кам Кнгваррей
  orig: Painting by Emily Kam Kngwarray
  kind: author-style
  start: 1988
  end: 1996
  era: postwar
  domain:
    - art
  medium:
    - painting
    - drawing
  region: Alhalker / Alhalkere, регион Утопия, Северная территория, Австралия; Anmatyerr
  tier: 3
  dateKind: practice
  origin: unknown
  parents: []
  summary: >-
    Ритмические живописные поля, в которых точечные слои, полосы и переплетения линий связаны с Country и
    личной практикой автора.
  description: >-
    Кнгваррей пришла к живописи на холсте в 1988–1989 годах после работы с батиком. Её живописный корпус
    включает разные этапы: цветовые скопления точек, полосовые решения и широкие линейные сети. Эти варианты
    следует сравнивать внутри конкретных работ, сохраняя различия между ними.


    NGV связывает After rain и Big yam Dreaming с Alhalker и anwerlarr, а поздние линии — также с практиками
    awely. Культурный смысл берётся из этого предметного пояснения. Визуально объединяют выбранные работы
    охват всей поверхности, нерегулярное повторение и меняющаяся плотность ритма; разные этапы не сводятся к
    одной точечной технике.
  traits:
    - Ритм охватывает поверхность целиком, без обязательного центрального мотива
    - Повторение строится точками, полосами или переплетающимися линиями в разных этапах
    - Плотность и интервалы важнее академической перспективы и моделировки предметов
    - Форма жеста и его нерегулярность сохраняются даже при многократном повторении
