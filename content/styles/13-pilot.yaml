  gallery:
    - file: File:BMW 525i Art Car - Esther Mahlangu (1991).jpg
      title: BMW 525i Art Car - Esther Mahlangu (1991)
      author: User:Strainu
      whyRepresentative: BMW Art Car с геометрической росписью ндебеле.
  summary: >-
    Геометрические поля с чёрно-белыми контурами переносятся между кузовом, прямоугольным холстом и круглой
    поверхностью.
  description: >-
    Эстер Малангу развивает личную практику в связи с коллективной традицией настенной росписи ндебеле.
    Музейная ретроспектива Iziko рассматривает её переход к другим поверхностям. Авторская карточка описывает
    выбранные композиции Малангу, сохраняя различие между именем художницы и традицией многих женщин-мастериц.


    В трёх примерах цветные участки отделены чёрными и белыми линиями, а ступенчатые фигуры и треугольные
    пояса организуют поверхность. Кузов, прямоугольник и круг задают разные границы рисунка. Изображение
    автомобиля показывает именно роспись Малангу; конструкция автомобиля относится к другому производственному
    авторству.
  traits:
    - Чёткое разделение чёрных, белых и насыщенных цветных полей
    - Ступенчатые фигуры, треугольники и многополосные бордюры
    - Баланс центральной композиции и повторяющегося обрамления
    - Геометрическая система перестраивается под форму конкретной поверхности
