  summary: Одежда меняет очертания и пропорции тела через асимметрию, набивку и многослойный объём.
  description: >-
    Три музейных предмета из разных коллекций показывают несколько способов построить непривычный силуэт. В
    платье 1983–1984 годов это асимметричные складки и свободный крой, в работе 1997 года — набивка под
    клетчатой тканью, в ансамбле 2015–2016 годов — многослойная оболочка. Общий вопрос этого корпуса —
    отношение между телом и формой одежды.


    Карточка ограничена этими конструктивными решениями. Она не сводит Comme des Garçons к чёрному цвету и не
    описывает все линии марки. Музей отдельно указывает дизайнера и дом моды; для ткани платья 1997 года
    названы изготовитель и дизайнер текстиля.
