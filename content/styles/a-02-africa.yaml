  summary: >-
    Живопись Киншасы с конца 1960-х: ясные фигуративные сцены городской жизни, политики и социальных бед, яркий
    плоский цвет, юмор и надписи прямо на холсте.
  description: >-
    По тексту выставки Fondation Cartier «Beauté Congo» (2015), выставка «Art Partout» в Киншасе в 1978 году
    открыла публике Шери Самбу, Шери Шерена, Моке и других. Увлечённые городской средой и коллективной памятью,
    они называли себя «народными художниками» и выработали новый подход к фигуративной живописи: сюжеты брались
    из повседневных, политических и социальных событий, которые сограждане узнавали сразу. Сегодня этот подход,
    по тому же тексту, продолжают Ж.-П. Мика и Монсенго Шула.


    Выставка Королевского музея Центральной Африки в Брюсселе (2016–2017) показывала картины 1968–2012 годов и
    подчёркивала, что народная живопись, как музыка и танец, связана с повседневной жизнью. Портреты, пейзажи,
    аллегории, городские и исторические сцены критически смотрят на религию, политику и социальные проблемы,
    часто с лёгким юмором. В работах Шери Самбы и Шери Шерена из собрания Пигоцци сюжет объясняют надписи на
    холсте — название крупными буквами и пояснения в «облачках» или на транспарантах.
  traits:
    - Ясная фигуративная сцена, понятная без пояснений куратора
    - Сюжеты городской жизни, политики и социальных бед — бары, улица, СПИД, беженцы
    - Яркий плоский цвет и чёткий контур
    - Надписи на холсте — крупное название, реплики, пояснения
