  summary: >-
    Книжная миниатюра, иконы и литые кресты Эфиопской церкви: яркие плоские цвета, чёткий чёрно-красный
    контур, фронтальные лица с крупными глазами и ажурные симметричные кресты.
  description: >-
    Христианство стало государственной религией Аксума в IV веке при Эзане, а Новый Завет перевели на геэз
    в VI веке. Монастыри Северного нагорья стали центрами учёности и книжного искусства. По описанию Met,
    иллюминированное Евангелие конца XIV — начала XV века опирается на византийские образцы, но переводит
    их в местную манеру: красный, жёлтый, зелёный и синий цвета, упрощённые лица, жирная чёрная и красная
    линия, фронтальные головы на телах в профиль и фигуры-колонны в полосатых одеждах.


    Тот же язык виден в иконах на доске: икона считалась духовным воплощением святого, а фигуры стоят
    фронтальными рядами в ярко узорчатых одеждах. Отдельная линия — литые и резные кресты: процессионные
    кресты носят на шестах во время служб, их ажурная форма строго симметрична при свободном орнаменте, и
    мастера бесконечно её переосмысливали. Обзор помогает найти эти линии рядом с византийским искусством и
    древнерусской иконой, но не сводит их к одному набору признаков.
  traits:
    - Плоские яркие цвета — красный, жёлтый, зелёный, синий — без моделирующей светотени
    - Жирный чёрный и красный контур, упрощённые лица с крупными глазами
    - Фронтальные головы и фигуры-колонны в одеждах из полос и узоров
    - Ажурные симметричные кресты со свободным плетением внутри формы
  scopeNote: >-
    Книжная миниатюра, иконы на доске и литые кресты Эфиопии XIV–XVIII веков по четырём предметам Met.
    Ранние памятники Аксума, скальные церкви Лалибелы, стенопись храмов и связанные традиции Эритреи
    требуют отдельных карточек или проверки.
  dateNote: >-
    1380 — конец XIV века, к которому Met относит самый ранний предмет карточки, Евангелие 1998.66.
    Христианство принято около 330 года, но более ранних работ источники карточки не показывают. Кресты
    и иконы делают и сейчас, поэтому конец не указан.
