  summary: >-
    Ткани из волокна рафии с вышитой и аппликационной геометрией: прямоугольные панели и длинные юбки, где
    ромбы, ломаные линии и лабиринты сменяют друг друга без строгого повтора.
  description: >-
    Ткани куба делают из волокна рафиевой пальмы. По описанию Met, работа совместная: мужчины ткут
    прямоугольные панели на станке, а женщины вышивают и расписывают их, выполняя узоры по памяти. Для
    церемониальной юбки нчак женщины клана собирают и украшают такие панели, старшая из них
    выбирает стиль и размечает вышивку, а готовая вещь принадлежит клану. Ткани носят и выставляют на
    церемониях как знаки престижа, а прежде они служили и деньгами.


    Узор строится из ромбов, полос, ломаных линий и лабиринтов. Поле часто делится на ячейки,
    и каждая заполняется по-своему, так что строгий повтор то и дело нарушается. В кенте асанте ритм
    задают сшитые узкие тканые полосы, а здесь — вышивка и аппликация по готовому полотну из рафии.
    Абстрактным мотивам дают названия, но их толкования карточка не приводит.
  traits:
    - Полотно из волокна рафии с вышитым или аппликационным узором
    - Геометрия ромбов, полос и ломаных линий, складывающихся в лабиринты
    - Поле делится на ячейки, каждая заполнена по-своему — повтор намеренно нарушается
