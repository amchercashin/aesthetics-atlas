  summary: >-
    Живопись эль-Салахи 1960-х: разломанные арабские буквы превращаются в лица, маски и тотемные фигуры,
    землистые и сумрачные цвета, плотная фактура — язык Хартумской школы.
  description: >-
    По подписи Тейт, эль-Салахи учился живописи в Хартуме, затем в Лондоне и, вернувшись в 1957 году в только
    что независимый Судан, решил, что новый контекст требует иного подхода: простые формы, сильные линии,
    сумрачные цвета, арабские и африканские мотивы. Его слова, приведённые Тейт: «Я писал буквы и слова, которые
    ничего не значили. Потом… мне пришлось сломать кость буквы». Из ломаных линий, по тексту Тейт и Чикагского
    института, возникают звериные и растительные формы, лица, скелеты и маскоподобные фигуры, а строение
    западноафриканских масок тоже служило ему образцом.


    Met называет эль-Салахи ведущей фигурой Хартумской школы — движения за новую арабо-африканскую национальную
    эстетику после 1956 года — и сравнивает его рассказ о видениях с автоматизмом сюрреалистов. Чикагский
    институт выделяет землистые цвета и работу с фактурой: краску на старом холсте он сворачивал, чтобы она
    растрескалась. Карточка описывает его язык 1960-х; Хартумская школа как целое в атласе пока не описана.
  traits:
    - Арабские буквы, разобранные на части и превращённые в лица и фигуры
    - Маскоподобные тотемные фигуры рядом с каллиграфическими линиями
    - Землистая и сумрачная палитра — охра, коричневый, чёрный, белый
    - Плотная, растрескавшаяся фактура эмали и масла
