  summary: >-
    Латунное литьё и резьба по слоновой кости для дворца обы в Бенин-Сити: идеализированные памятные головы
    в коралловых регалиях, рельефные пластины с иерархическим масштабом фигур и ажурные маски.
  description: >-
    Искусство двора Бенина создавали гильдии мастеров для дворца обы в Бенин-Сити, на территории нынешней
    Нигерии; к Республике Бенин оно отношения не имеет. Литейщики гильдии Игун Эронмвон отливали из латуни
    памятные головы для алтарей предков: новый оба посвящал алтарь предшественнику. Голова не передаёт
    портретного сходства: это идеальный образ правителя в расцвете сил, и главное в нём — регалии,
    коралловая шапка, нити бус и высокий воротник.


    В XVI–XVII веках при дворе отлили около 900 рельефных пластин для фасада дворца; на них оба и свита
    даны в иерархическом масштабе: чем выше ранг, тем крупнее фигура. Резчики гильдии Игбесанмва работали
    по слоновой кости: лицо королевы-матери Иды на подвесной маске обрамлено ажурной резьбой с фигурками
    португальских торговцев и рыб. По описанию Met, со временем головы становились массивнее, а регалии
    пышнее. В 1897 году британские войска захватили Бенин-Сити и разграбили дворец, а предметы разошлись
    по музеям и рынку; после 1913 года оба Эвека II возобновил покровительство мастерам.
  traits:
    - Идеализированное симметричное лицо без портретного сходства, обрамлённое регалиями — коралловой шапкой, нитями бус, воротником
    - Ранние головы с тонкими стенками отливки, поздние — цилиндрические, с воротником до подбородка и широким фланцем
    - Рельефные пластины с иерархическим масштабом — правитель крупнее свиты
    - Ажурная резьба по слоновой кости с мелкими мотивами-атрибутами власти
