  scopeNote: >-
    Придворное латунное литьё и резьба по слоновой кости царства Бенин XV–XIX веков по четырём предметам
    Met: две памятные головы, рельефная пластина и подвесная маска. Не путать с Республикой Бенин. Работы
    мастеров Бенин-Сити после 1897 года и современные гильдии требуют отдельной проверки.
  dateNote: >-
    1400 и 1900 — границы датировок корпуса: начало XV века у ранней головы и XIX век в записи поздней
    (этикетка той же записи — «вероятно, конец XVIII века»). Это не начало и не конец традиции: гильдии
    работают и сейчас.
