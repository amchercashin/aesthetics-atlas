  summary: >-
    Студенты колледжа в Зарии, с 1958 года восставшие против европоцентричной учёбы: «естественный синтез»
    местных традиций и модернизма — стилизованные фигуры, узоры тканей адире, сюжеты сказок и нигерийской жизни.
  description: >-
    По путеводителю Тейт, Общество искусств Зарии возникло в Нигерийском колледже искусств, науки и технологии
    (NCAST), устроенном по британскому образцу, где курсы почти не учитывали африканское искусство. В 1958 году
    студенты объединились против ограниченной европоцентричной программы ради панафриканской задачи — вернуть
    исчезающее наследие. В октябре 1960 года, в месяц независимости, Уче Океке написал манифест «Natural
    Synthesis» — «естественный синтез» иностранных и местных традиций. По тексту MoMA, сам Океке строил этот синтез
    на эстетических традициях и мировоззрении игбо, соединяя их с художественным опытом, усвоенным извне, вместо
    колониальных канонов, по которым его учили в Зарии. После выпуска многие участники переехали в Ибадан и в 1961
    году основали там клуб «Мбари».


    Тейт подчёркивает, что «мятежники Зарии» поддерживали друг друга в поиске личных стилей на основе местных
    сюжетов и традиций, поэтому общий признак — программа, а не одна манера. У Онобракпейи библейские сцены
    перенесены в нигерийскую среду, с тканями адире и геометрией местной архитектуры. Грилло пишет
    стилизованные фигуры, напоминающие маски, в синем, навеянном индиго адире и «голубым периодом» Пикассо.
    «Первобытный зверь» Океке (1961) — персонаж игбо-сказок, а «Нигерия в 1959 году» Нвоко (1960) иронично
    показывает колониальных офицеров накануне независимости.
  traits:
    - Стилизованные фигуры, напоминающие маски
    - Узоры тканей адире и геометрия местной архитектуры в композиции
