  wiki: { en: Zanele Muholi }
  summary: >-
    Чёрно-белые автопортреты Мухоли с 2012 года: контрастный снимок, лицо почти сливается с тёмным фоном,
    прямой взгляд в камеру, бытовые предметы и ткани как реквизит и головной убор, названия на зулу.
  description: >-
    По тексту собрания Тейт, серию Somnyama Ngonyama («Слава тебе, тёмная львица») Мухоли начинает в 2012 году
    в поездках, чтобы отметить своё присутствие в разных местах, а в 2014 году задумывает как 365 автопортретов —
    каждый отвечает на место, историю и личный опыт и спорит с политикой расы и репрезентации. На одних снимках
    фон гладкий и предмет один, на других фон — графичный узор, а бытовые вещи вне привычного контекста
    становятся исторически нагруженным реквизитом. Названия даны на зулу, родном языке автора, и обычно
    указывают место съёмки.


    Свою практику Мухоли называет «визуальным активизмом». В ранних сериях — Only Half the Picture (2003–2006) и Faces and
    Phases (с 2006 года) — в центре чернокожие лесбиянки и трансженщины ЮАР, а Somnyama Ngonyama, по Тейт, более
    автобиографична и похожа на дневник. Сама серия, по словам Мухоли в цитате Тейт, противостоит политике
    расы и пигмента в фотографическом архиве.
  traits:
    - Контрастный чёрно-белый снимок, лицо на тёмном или сером фоне
    - Прямой взгляд в камеру
    - Бытовые предметы, кружево, волосы и ткани как реквизит и головной убор
    - Гладкий тёмный фон или графичный узор
