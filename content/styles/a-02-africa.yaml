  scopeNote: >-
    Общество по путеводителю и этикеткам выставки Тейт «Nigerian Modernism» (2025–2026), тексту собрания Тейт
    об Онобракпейе и тексту MoMA об Океке. Изображения — гравюра Онобракпейи 1969 года, литография 1958 года и
