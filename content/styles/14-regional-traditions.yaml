  summary: >-
    Модульный декор лубяного полотна объединяет растирание по купеси, ручную дорисовку и мотивы общественных
    событий.
  description: >-
    На нгату повторяющиеся модули и ручная дорисовка организуют большую поверхность лубяного полотна. В
    выбранных музейных предметах встречаются растения и животные, спортивные трофеи, самолёт и электрические
    фонари. Событийные изображения входят в живую практику и не требуют объяснения как неизменные древние
    знаки.


    Фрагмент большого полотна сохраняет собственный ритм столбцов и рамок. Общий приём изготовления лубяной
    основы связывает нгату с другими практиками tapa, но не делает их одним визуальным языком.
  traits:
    - Повторяющиеся ячейки и вертикальные полосы организуют крупное полотно
    - Растирание по рельефным купеси сочетается с ручной дорисовкой
    - Коричневые пятна, линии и силуэты читаются на светлой основе
    - Изображения современных предметов и событий включаются в устойчивую модульную композицию
  scopeNote: >-
    Три самостоятельных музейных нгату: 1932?, около 1940-х и 1991 год. Мотивы, наблюдаемые здесь, не
    объявлены универсальным словарём всех тонганских полотен.
  dateNote: >-
    Координата 1930 приблизительно размещает самый ранний предмет выбранного корпуса, датированный музеем
    «1932?». Истоки нгату здесь не датированы; 1991 — последняя работа корпуса, а не конец практики.
