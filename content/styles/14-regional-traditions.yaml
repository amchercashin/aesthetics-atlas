    - file: File:Tapa, asset G1ejUDBXecRYZQSYBP6Y8Tmw.jpg
      title: Tapa, asset G1ejUDBXecRYZQSYBP6Y8Tmw
      author: onbekend (textielwerker)
      whyRepresentative: Маси с плотным геометрическим трафаретным узором.
  summary: >-
    Повторяющиеся трафаретные мотивы, вложенные обрамления и контрастные поля соединяются на лубяном полотне;
    современный декор допускает сюжетную сцену.
  description: >-
    Карточка сосредоточена на декорированном фиджийском маси с трафаретным рисунком и его сочетании со
    свободным письмом. Она не приравнивает все виды маси к одному узору. Большие треугольники, рамки и полосы
    организуют поверхность, внутри которой повторяются меньшие мотивы.


    Четыре примера сохраняют различия назначения и авторства: историческая полоса с предметными мотивами,
    свадебное полотно Керелы Имануэли, вещь со смешанным способом декора и современная совместная работа Робин
    Уайт и Тамари Кабеиканачеа. В последней орнамент входит в изображение комнаты. Оба автора названы; техника
    и местный контекст не растворены в одном известном имени.
  traits:
    - Трафаретный повтор даёт чёткий ритм мелких форм
    - Вложенные рамки и крупные геометрические деления связывают центр и края
    - Светлая лубяная основа соотносится с тёмными и коричневыми участками
    - Трафарет может сочетаться со свободным рисунком и сюжетным изображением
  scopeNote: >-
    Четыре декорированных маси Te Papa, включая два недатированных предмета и работу 2019 года. Белые,
