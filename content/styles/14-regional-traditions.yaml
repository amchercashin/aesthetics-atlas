    - file: File:Distaff, Gorodets 01.jpg
      title: Distaff, Gorodets 01
      author: Nikolay Omonov
      whyRepresentative: Расписное донце с фигурами, конями и цветочным орнаментом.
  summary: >-
    Сюжетные сцены, кони, птицы и крупные цветы собраны в плоскостные композиции с выразительными цветовыми
    пятнами и тонкой прорисовкой.
  description: >-
    Выбранные вещи показывают роспись деревянных донец и её развитие в самостоятельные композиции на бумаге.
    Персонажи, растения и цветочные группы делят поверхность на ясно читаемые поля. Светлые и тёмные линии
    уточняют цветовое пятно, а рамка и полосы связывают рисунок с формой предмета.


    Четыре работы не образуют неизменный набор сюжетов: от парных всадников и дерева композиция переходит к
    многофигурному празднику и декоративному интерьеру. Крупные формы и ритм сохраняют связь между предметами
    разных носителей. Раннюю резьбу и инкрустацию музей рассматривает отдельно; они не выданы за расписной
    корпус.
  traits:
    - Крупные цветовые пятна уточняются светлыми и тёмными линиями
    - Фигуры, цветы и птицы собраны в плоскостные группы
    - Полосы, рамки и смена регистров делят поверхность
    - Масштаб элементов подчинён ясности общей композиции, а не единой перспективе
  scopeNote: >-
    Два расписных донца XIX века и две композиции 1935–1938 годов. Скульптура, инкрустированные донца и вся
    современная продукция Городца не описаны этим корпусом полностью.
  dateNote: >-
    1850 — условный нижний рубеж музейной датировки «вторая половина XIX века». Последняя работа корпуса
    датирована 1938 годом; это не конец промысла. Историю продолжения XX века рассматривает независимый
    музейный обзор.
