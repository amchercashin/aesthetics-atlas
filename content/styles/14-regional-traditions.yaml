      whyRepresentative: Тёмное полотно с белыми геометрическими знаками.
  summary: >-
    Светлые геометрические формы и тёмные поля организуют расписное хлопчатое полотно, соединяя внутренний
    узор и разные по рисунку края.
  description: >-
    В выбранных боголанфини геометрический рисунок нанесён на готовую хлопчатую основу. Поэтому видимые полосы
    ткани и орнаментальная композиция относятся к разным этапам работы. Музеи описывают окрашивание с
    использованием растительных составов и ферментированной глины; точный состав каждого предмета не угадан по
    его виду.


    Два предмета неизвестных мастеров сопоставлены с двумя работами Накунте Диарры. Её выставочные полотна
    продолжают традицию и меняют формат использования. Знаки имеют конкретные интерпретации у музейных
    исследователей; карточка не превращает их в универсальный словарь для любого изделия.
  traits:
    - Светлые фигуры и линии читаются на тёмном поле
    - Центральная композиция и краевые полосы могут иметь разные ритмы
    - Повторение ромбов, крестов, линий и вложенных форм создаёт плотное поле
    - Нанесённый рисунок соединяет поверхность из сшитых хлопчатых полос
  scopeNote: >-
    Четыре музейных предмета: первая половина XX века, неопределённый XX век и работы Накунте Диарры 1987 и
    1988 годов. Не все современные изделия, продаваемые как mud cloth, включены в этот охват.
  dateNote: >-
    1900–1999 — рамка столетия для двух широких музейных датировок, а не даты возникновения и прекращения
    боголанфини. Именные работы датированы точнее. Сведения о действующем авторском праве не подменяют
    датировку вещи.
