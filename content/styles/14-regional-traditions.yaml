    Дутты. Линейное письмо и насыщенные цветовые поля сосуществуют внутри практики: её нельзя свести к одному
    орнаменту или палитре.


    У Ганги Деви дерево, животные и поезд складываются из тонких контуров и мелкого рисунка. Сита Деви строит
    крупные фигуры цветными участками, а Годавари Дутта связывает фигуру с плотной линейной проработкой
    деталей. Различия между авторами сохраняются внутри общей сравнительной карточки; отдельные авторские узлы
    потребуют собственных исследований.
  traits:
    - Двойные и одинарные контуры задают границы фигур и орнаментальных участков
    - Мелкие линии, штриховка и повторяющиеся элементы заполняют формы
    - Фигуры и растения организуются плоскостно, без единой глубинной перспективы
    - Рамки, полосы и внутренние узоры связывают изображение с границами поверхности
