  summary: >-
    Орнамент на лубяном полотне соединяет сетки, полосы, растительные силуэты и контраст коричневого рисунка
    со светлой основой.
  description: >-
    Сиапо — самоанская практика декорирования лубяного полотна. Внутри неё различаются свободное письмо mamanu
    и декор с переносом рисунка elei. Полотно получают из внутреннего слоя коры; его нельзя описывать как
    ткань с переплетением нитей.


    Три исторических предмета и работа 2000 года показывают разные способы деления поверхности: множество
    небольших ячеек, сплошной треугольный ритм, крупные чередующиеся клетки и вытянутые орнаментальные полосы.
    Название карточки сохраняет местную практику; общая технология tapa не отменяет различий с Тонга и Фиджи.
  traits:
    - Светлая лубяная основа остаётся активной частью рисунка
    - Прямоугольные сетки и полосы объединяют повторяющиеся геометрические и растительные формы
    - Тёмные и красновато-коричневые пятна чередуются с незаполненными участками
    - Свободный рисунок и перенос орнамента дают разные решения внутри сиапо
  scopeNote: >-
    Четыре музейных сиапо: три mamanu 1890-х — 1900-х и один elei 2000 года. Это ограниченный сравнительный
    корпус, а не полный канон всех самоанских островов и поколений.
  dateNote: >-
    На оси отмечен просмотренный корпус. 1890-е не являются датой возникновения сиапо. Работа 2000 года не
    обозначает прекращение практики. Музейный обзор описывает её современное продолжение.
