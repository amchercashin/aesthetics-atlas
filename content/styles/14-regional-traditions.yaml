      title: PalekhComintern
      author: Ivan Ivanovich Golikov
      whyRepresentative: Лаковая миниатюра с многофигурной сценой и золотым контуром.
  summary: >-
    Темперные повествования на лаковых предметах: тонкая линия, вытянутые фигуры, насыщенные цветовые поля и
    золочёные детали.
  description: >-
    Палехская миниатюра переносит приёмы местной иконописи в светские сцены на вещах из папье-маше. Музей
    отдельно отмечает опыт Федоскина в изготовлении таких предметов; техника носителя и язык изображения имеют
    разные связи.


    В выбранных работах сюжет организован силуэтами, ритмом фигур и тонкими линиями. Чёрный лак может
    оставаться открытым полем или почти уступать место пейзажу и многочастной сцене. У ларчика Смирновой
    повествование продолжается на стенках; это один предмет, а не несколько независимых работ.
  traits:
    - Тонкие контуры, вытянутые фигуры и ритмически связанные жесты
    - Насыщенные цветовые участки и золотистая прорисовка на лаковой поверхности
    - Повествование приспосабливается к овальной, прямоугольной либо объёмной форме
    - Несколько сцен могут объединяться архитектурой, пейзажем и орнаментальной рамкой
  scopeNote: >-
    Четыре предмета четырёх мастеров, 1926, 1985 и 1994 годов. Палехская иконопись, сценография и все
    остальные центры лаковой миниатюры требуют отдельного рассмотрения.
  dateNote: >-
    1920 — приблизительная отметка становления светской лаковой миниатюры; музей относит его к 1920–1930-м.
    Артель основана в 1924 году. Даты не обозначают начало местной иконописи.
