  description: >-
    Четыре полотна из музейных записей асанте-акан показывают, как рисунок отдельной полосы складывается в
    более крупную композицию. В одном предмете преобладают полосы, в другом — плотные небольшие мотивы;
    материалы включают шёлк, хлопок и вискозное волокно.


    Кенте не ограничивается асанте: музейный каталог отдельно рассматривает эве и историческое сближение
    практик. Яркая геометрия сама по себе не позволяет уверенно выбрать культурную атрибуцию. В этот корпус
    включены только предметы с определённой атрибуцией асанте-акан; спорный предмет «Asante-Akan or Ewe (?)»
    оставлен вне него.
  traits:
