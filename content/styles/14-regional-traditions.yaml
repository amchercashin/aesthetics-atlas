  evidence:
    - claim: >-
        Предметная запись FE000825 различает свободное письмо и перенос рисунка с рельефной доски; практика не
        сводится к одному приёму.
      field: scope
      source: tepapa-siapo-825
    - claim: Музей датирует FE011611 1896 годом и описывает включённые в предмет надписи.
      field: corpus
      source: tepapa-siapo-11611
    - claim: Обзор Te Papa называет сиапо, нгату и маси как локальные практики и представляет современных мастеров.
      field: admission
      source: tepapa-pacific-tapa
  admission:
    language: >-
      Проверяемые признаки — разделение плоскости на сетки и полосы, чередование светлой основы и коричневого
      орнамента, ритм геометрических и растительных форм.
    corpus: Четыре самостоятельных полотна с разными регистрационными номерами; в корпус включены mamanu и elei.
    distinctness: >-
      От нгату выбранный корпус отличается организацией орнаментальных ячеек; от фиджийского маси его отделяет
      самостоятельная самоанская практика. Локальные названия не сведены к единому «полинезийскому узору».
    significance: Te Papa публикует предметные записи, исторические сведения и материалы о современной практике сиапо.
    sources:
      - tepapa-siapo-825
      - tepapa-siapo-11611
      - tepapa-siapo-1425
      - tepapa-siapo-elei-11577
      - tepapa-pacific-tapa
  review:
    status: partial
    date: "2026-10-14"
    note: >-
      Просмотрены четыре репродукции и записи. В записи siapo elei написание имени в Production отличается от
      подписи изображения; сохранена предметная атрибуция без объединения вариантов. Раннее происхождение и
      общая хронология не установлены этим корпусом.
