  summary: >-
    Выразительная линия, крупные силуэты и свободный фон делают религиозные и городские сцены компактными
    самостоятельными изображениями.
  description: >-
    Выбранный корпус показывает городской визуальный язык Калигхата на четырёх работах XIX — начала XX века.
    Контуры фигур, редкие предметные детали и свободное поле позволяют прочитать жест или сцену без
    развёрнутого пейзажа. Цвет и степень завершённости меняются: линейный кот с рыбой не похож на насыщенную
    цветом женскую фигуру.


    Именная атрибуция сохраняется там, где её даёт музей. Собиратели и дарители не становятся авторами.
    Современная работа Анвара Читракара приведена отдельно как продолжение практики; её дата не расширяет
    исторический корпус автоматически.
  traits:
    - Крупные фигуры и предметы отделены от свободного фона
    - Контур и изгиб силуэта несут основную выразительность
    - Немного деталей выделяют жест, атрибут или социальную ситуацию
    - Цветовые участки и тональные переходы подчиняются ясной форме; встречается и линейный рисунок
  scopeNote: >-
    Четыре самостоятельные работы V&A: женщина с павлином, женщина с розой, кот с рыбой и мужчина с ситаром.
    Отдельно показан современный пример 2010 года. Все бенгальские патуа и все виды индийской популярной
    графики к этой школе не приравниваются.
  dateNote: >-
    На оси расположены выбранные работы около 1860–1870, около 1870, около 1900 и 1920-х. Музейная коллекция
    шире этого корпуса; даты не являются точным периодом существования всей практики.
