  summary: >-
    Мазковая цветочная живопись на металлических подносах соединяет объём лепестков, свободное поле и
    орнаментальное обрамление.
  description: >-
    В жостовской росписи цветы образуют самостоятельную композицию на поле подноса, а рисунок борта связывает
    её с формой вещи. Цвет фона меняется: в выбранном корпусе есть белое и тёмные поля. Масляная живопись
    передаёт объём лепестков и листьев, тогда как тонкий орнамент обрамления подчёркивает плоскость
    металлической поверхности.


    Русский музей относит переход жостовских подносов к металлу к 1830-м годам и отдельно описывает роль
    тагильского подносного промысла. Это история конкретных технических и художественных связей. Четыре
    предмета 1880-х — 1990 года показывают вариативность внутри традиции: компактный букет, распределённые
    группы цветов, светло-золотистую композицию и крупные соцветия одуванчиков. Коллективный промысел
    сохраняет именное авторство отдельных работ.
  traits:
    - Мазковое построение объёма цветка и листа с переходами тона
    - Букеты и отдельные цветочные группы соотносятся со свободным полем
    - Орнамент борта повторяет очертания подноса и обрамляет живопись
    - Цветные, светлые и тёмные фоны допускают разные композиционные решения
