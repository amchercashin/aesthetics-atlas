- id: high-renaissance
  name: Высокое Возрождение
  orig: High Renaissance
  aliases: [чинквеченто, High Renaissance]
  searchKeywords: [Леонардо, Микеланджело, Рафаэль, Браманте, Тициан, Мона Лиза, Сикстинская капелла]
  start: 1490
  end: 1527
  dates: ок. 1490 – 1527
  dateKind: period
  approx: true
  dateNote: >
    Периодизация историков искусства: от зрелых работ Леонардо до разграбления Рима в 1527 году. Граница
    условна — часть исследователей не видит резкого стилистического перелома около 1520 года.
  era: renaissance
  domain: [art, architecture]
  medium: [painting, sculpture, architecture]
  region: Рим, Флоренция, Милан, Венеция
  tier: 1
  kind: period
  scopeNote: >
    Термин описывает короткий период итальянского искусства и узкий круг мастеров. Сами понятия
    «Высокое Возрождение» и «маньеризм» в современной науке обсуждаются как условные.
  parents:
    - id: early-renaissance
      type: evolved
      status: verified
      note: >-
        Раннее и Высокое Возрождение — два условно выделяемых этапа итальянского Возрождения. Evolved читать как
        развитие внутри этой периодизации, не как происхождение независимого движения.
      sources:
        - ra26-highrenaissance
  summary: >
    Леонардо, Микеланджело и Рафаэль строят крупные уравновешенные композиции, моделируют форму светом
    и тенью и работают в монументальном масштабе.
  description: |
    На рубеже XV–XVI веков в Милане, Флоренции и Риме складывается язык, который потом назовут Высоким
    Возрождением. Леонардо строит моделировку на сфумато — дымчатых лессировках без жёстких контуров —
    и пишет «Мону Лизу». Микеланджело в 1508–1512 годах расписывает свод Сикстинской капеллы, Рафаэль —
    станцы Ватикана с «Афинской школой». Композиции строятся как уравновешенное целое, часто пирамидой,
    а фигуры идеализированы и анатомически убедительны.

    За таким языком стоят заказчики — папский двор, Медичи, Сфорца — и масштабные работы, где живопись,
    скульптура и архитектура задуманы вместе. Позднейшая традиция называла это «вершиной» Ренессанса; это
    оценка, а не историческое объяснение.
  traits:
    - Пирамидальные, уравновешенные композиции
    - Сфумато — мягкие переходы без контура
    - Идеализированная, анатомически точная фигура
    - Монументальный масштаб и ясное построение
  names: [Леонардо да Винчи, Микеланджело, Рафаэль, Браманте, Тициан]
  evidence:
    - { claim: "Сфумато — лессировки, создающие «дымчатый» эффект и мягкие контуры", field: traits, source: louvre-mona-lisa }
    - { claim: "Свод Сикстинской капеллы расписан в 1508–1512 годах", field: description, source: vatican-sistine-ceiling }
    - { claim: "Полезность терминов «Высокое Возрождение» и «маньеризм» оспаривается; резкой границы около 1520 года во Флоренции нет", field: scope, source: franklin-2005 }
  review:
    status: partial
    date: "2026-10-16"
    note: >-
      Убраны оценочные «абсолютная гармония» и «вершина», добавлены границы термина. Даты «Моны Лизы» и
      «Афинской школы» по музейным страницам не сверены. 16.10.2026 проверены исторические отношения и связанные
      с ними контексты и сопоставления; границы подтверждения указаны у каждой записи.
  example:
    file: Mona Lisa, by Leonardo da Vinci, from C2RMF retouched.jpg
    title: Мона Лиза (Джоконда)
    author: Леонардо да Винчи
    year: ок. 1503–1519
    place: Лувр, Париж
    whyRepresentative: Сфумато, пирамидальное построение фигуры и воздушная перспектива пейзажа.
  wiki: High Renaissance
  links:
    - { title: "High Renaissance", url: "https://www.theartstory.org/movement/high-renaissance/", src: "The Art Story", lang: en }
