      подтверждения указаны у каждой записи. Даты, описание и изображения карточки полностью не проверялись.
  parents:
    - id: high-renaissance
      type: influence
      status: verified
      note: >-
        Архитектура Палладио использовала достижения Браманте, Рафаэля и Микеланджело наряду с непосредственным
        изучением античности. Влияние ограничено архитектурными моделями и их передачей через Палладио и не
        делает его частью самого периода Высокого Возрождения.
      sources:
        - ra26-d2-palladio
    - id: ancient-rome
      type: revival
      status: verified
      note: >-
        Палладианство сознательно переосмысливало римскую архитектуру и принципы Витрувия через Палладио.
        Сохранять различие между практикой Палладио и её поздними возвращениями.
      sources:
        - ra26-palladian
  summary: >
    Симметричные виллы с портиками-храмами по чертежам Андреа Палладио — от Виченцы до Петербурга и Вирджинии.
  description: |
    Палладио изучал руины Рима и построил вокруг Виченцы виллы, где фасад украшен античным портиком, а план
    идеально симметричен. Его «Четыре книги об архитектуре» стали учебником для всей Европы: английские
    поместья, русские усадьбы и даже Белый дом выросли из палладианской идеи.
  traits:
    - Строгая симметрия плана и фасада
    - Портик с фронтоном, как у храма
    - Математически выверенные пропорции
    - Белые оштукатуренные объёмы
  names: [Андреа Палладио, Иниго Джонс, Джакомо Кваренги, Томас Джефферсон]
