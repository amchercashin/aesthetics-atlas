- id: dutch-golden-age
  name: Голландский золотой век
  orig: Dutch Golden Age painting
  aliases: [малые голландцы, Вермеер, Рембрандт, голландский натюрморт]
  start: 1600
  end: 1672
  dates: ок. 1600 – 1672
  era: renaissance
  domain: [art]
  region: Нидерланды
  tier: 2
  kind: period
  review:
    status: partial
    date: "2026-10-16"
    note: >-
      16.10.2026 проверены исторические отношения и связанные с ними контексты и сопоставления; границы
      подтверждения указаны у каждой записи. Даты, описание и изображения карточки полностью не проверялись.
  parents:
    - id: northern-renaissance
      type: influence
      status: verified
      note: >-
        Ранненидерландские художники XVI века развивали пейзаж, натюрморт и бытовые элементы, подготовившие
        жанровые темы XVII века. Изменить evolved на influence с ограничением жанровой преемственности;
        религиозные, политические и рыночные условия Dutch Golden Age не сводятся к этой стрелке.
      sources:
        - ra26-d2-netherlandish
    - id: caravaggism
      type: influence
      status: verified
      note: >-
        Хонтхорст и другие утрехтские караваджисты распространяли язык Караваджо в Голландии. Ограничить
        подтверждение этим кругом; вся голландская живопись не была караваджистской.
      sources:
        - ra26-caravaggisti
        - ra26-utrecht
  summary: >
    Тихий свет из окна, натюрморты, пейзажи и портреты бюргеров: живопись для дома, а не для церкви.
  description: |
    Протестантская торговая республика покупала картины для жилых комнат, и художники специализировались
    на жанрах: натюрморт, пейзаж, бытовая сцена, групповой портрет. Рембрандт пишет «Ночной дозор»
    с караваджистской светотенью, Вермеер — «Девушку с жемчужной серёжкой» и залитые мягким светом интерьеры.
  traits:
    - Мягкий рассеянный свет из окна
    - Бытовые сцены, натюрморты, пейзажи
    - Точность фактур — шёлк, металл, стекло
    - Небольшие форматы для домашних интерьеров
  names: [Рембрандт, Ян Вермеер, Франс Хальс, Якоб ван Рёйсдал, Питер де Хох]
