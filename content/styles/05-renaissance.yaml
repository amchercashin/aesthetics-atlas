  summary: >
    Барокко становится лёгким и игривым: пастельные тона, раковины-рокайли, качели и флирт в садах.
  description: |
    После смерти Людовика XIV аристократия переезжает из парадных залов в уютные салоны. Барочная мощь
    сменяется изяществом: асимметричные завитки-рокайли, позолота, зеркала и пастель. Фрагонар пишет
    «Качели» — девушка взлетает, роняя туфельку, а поклонник прячется в кустах роз.
  traits:
    - Пастельные тона — розовый, голубой, золото
    - Асимметричный орнамент-рокайль (раковина)
    - Галантные, легкомысленные сюжеты
    - Интимные масштабы салонов и будуаров
  names: [Антуан Ватто, Франсуа Буше, Жан Оноре Фрагонар, Франческо Растрелли]
