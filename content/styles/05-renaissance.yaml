    делает революцию: фигуры стоят на земле, отбрасывают тени, их жесты выражают живое чувство. В «Оплакивании»
    ангелы рыдают в небе, а скала ведёт взгляд к лицу Христа. Отсюда начинается путь к Возрождению.
  traits:
