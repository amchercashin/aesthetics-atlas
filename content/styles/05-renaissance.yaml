  summary: >
    Персидская миниатюра при дворе Великих Моголов обретает портретность, натурализм и даже европейские приёмы.
  description: |
    Император Акбар собрал в мастерских персидских и индийских художников, и вместе они создали новый стиль.
    Иллюстрированные хроники «Акбар-наме» полны действия, а при Джахангире появляются точные портреты,
    изображения птиц и растений и аллегории с европейскими ангелами, подсмотренными у фламандских гравюр.
  traits:
    - Портретная точность и натурализм
    - Насыщенный цвет и золото
    - Сочетание персидской, индийской и европейской традиций
    - Исторические хроники и аллегории власти
  names: [Басаван, Бичитр, Мансур, Абу-ль-Хасан]
