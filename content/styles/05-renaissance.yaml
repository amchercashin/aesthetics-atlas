      sources:
        - ra26-chinoiserie
  summary: >
    Европейская фантазия о Китае: павильоны с загнутыми крышами, фарфор, лаковые шкафчики и обои с пагодами.
  description: |
    Торговля фарфором, шёлком и чаем рождает моду на всё «китайское» — точнее, на воображаемый Китай.
    Шинуазри сливается с рококо: в парках строят китайские домики, интерьеры оклеивают обоями с птицами
    и пагодами, а мейсенская мануфактура копирует восточный фарфор. Это одна из первых массовых «экзотических» мод Европы.
  traits:
    - Пагоды, загнутые крыши, мостики
    - Фарфор, лак, шёлковые обои
    - Сине-белая палитра и позолота
    - Свободная фантазия вместо точной копии
