- id: proto-renaissance
  name: Проторенессанс
  orig: Proto-Renaissance
  aliases: [Джотто, треченто, итальянская готика]
  start: 1280
  end: 1400
  dates: ок. 1280 – 1400
  era: renaissance
  domain: [art]
  region: Италия
  tier: 3
  parents:
    - { id: byzantine-art, type: evolved }
    - { id: gothic, type: influence }
  summary: >
    Джотто возвращает фигурам вес и пространство: на смену золотому фону приходят земля, небо и человеческое горе.
  description: |
    Итальянские мастера XIII–XIV веков работают в «греческой манере», но Джотто в капелле Скровеньи
    делает революцию: фигуры стоят на земле, отбрасывают тени, их жесты выражают живое чувство. В «Оплакивании»
    ангелы рыдают в небе, а скала ведёт взгляд к лицу Христа. Отсюда начинается путь к Возрождению.
  traits:
    - Объёмные, тяжёлые фигуры
    - Попытка построить пространство
    - Сильные эмоции и жесты
    - Фреска на стенах капелл
  names: [Джотто, Чимабуэ, Дуччо, Симоне Мартини]
  example:
    file: Giotto - Scrovegni - -36- - Lamentation (The Mourning of Christ) adj.jpg
    title: Оплакивание Христа
    author: Джотто
    year: ок. 1305
    place: Капелла Скровеньи, Падуя
  wiki: Proto-Renaissance
  links: []

- id: early-renaissance
  name: Раннее Возрождение
  orig: Early Renaissance
  aliases: [кватроченто, флорентийский ренессанс, Боттичелли, перспектива]
  start: 1400
  end: 1490
  dates: ок. 1400 – 1490
  era: renaissance
  domain: [art, architecture]
  region: Флоренция, Италия
  tier: 1
  parents:
    - { id: proto-renaissance, type: evolved }
    - { id: ancient-rome, type: revival }
  summary: >
    Флоренция открывает линейную перспективу, возвращает античные формы и ставит человека в центр картины.
  description: |
    Брунеллески строит купол собора и формулирует законы линейной перспективы, Донателло создаёт первую
    со времён античности свободно стоящую обнажённую статую, Мазаччо пишет фрески с настоящей глубиной.
    Под покровительством Медичи Боттичелли пишет «Рождение Венеры» — языческую богиню в полный рост,
    невозможную ещё сто лет назад.
  traits:
    - Линейная перспектива с точкой схода
    - Возвращение античных сюжетов и ордеров
    - Ясный рисунок и светлый колорит
    - Интерес к анатомии и портрету
  names: [Филиппо Брунеллески, Донателло, Мазаччо, Сандро Боттичелли, Пьеро делла Франческа]
  example:
    file: Sandro Botticelli - La nascita di Venere - Google Art Project - edited.jpg
    title: Рождение Венеры
    author: Сандро Боттичелли
    year: ок. 1485
    place: Галерея Уффици, Флоренция
  wiki: Italian Renaissance painting
  links:
    - { title: "Early Renaissance", url: "https://www.theartstory.org/movement/early-renaissance/", src: "The Art Story", lang: en }

- id: high-renaissance
  name: Высокое Возрождение
  orig: High Renaissance
  aliases: [Леонардо, Микеланджело, Рафаэль, чинквеченто]
  start: 1490
  end: 1527
  dates: ок. 1490 – 1527
  era: renaissance
  domain: [art, architecture]
  region: Рим, Флоренция, Милан, Венеция
  tier: 1
  parents:
    - { id: early-renaissance, type: evolved }
  summary: >
    Тридцать лет абсолютной гармонии: Леонардо, Микеланджело и Рафаэль доводят идеи Ренессанса до совершенства.
  description: |
    На рубеже XV–XVI веков итальянское искусство достигает вершины. Леонардо изобретает сфумато — тающие
    без контуров переходы света, и пишет «Мону Лизу». Микеланджело расписывает потолок Сикстинской капеллы,
    Рафаэль — «Афинскую школу». Композиция строится как идеально уравновешенное целое, а человек предстаёт
    почти божественным.
  traits:
    - Пирамидальные, уравновешенные композиции
    - Сфумато — мягкие переходы без контура
    - Идеализированная, мощная анатомия
    - Монументальность и ясность
  names: [Леонардо да Винчи, Микеланджело, Рафаэль, Браманте, Тициан]
  example:
    file: Mona Lisa, by Leonardo da Vinci, from C2RMF retouched.jpg
    title: Мона Лиза (Джоконда)
    author: Леонардо да Винчи
    year: ок. 1503–1519
    place: Лувр, Париж
  wiki: High Renaissance
  links:
    - { title: "High Renaissance", url: "https://www.theartstory.org/movement/high-renaissance/", src: "The Art Story", lang: en }

- id: northern-renaissance
  name: Северное Возрождение
  orig: Northern Renaissance
  aliases: [нидерландская живопись, ван Эйк, Дюрер, Босх, Брейгель]
  start: 1430
  end: 1580
  dates: ок. 1430 – 1580
  era: renaissance
  domain: [art]
  region: Нидерланды, Германия
  tier: 2
  parents:
    - { id: international-gothic, type: evolved }
    - { id: early-renaissance, type: influence }
  summary: >
    Масляная живопись с микроскопической точностью: каждое отражение, ворсинка и блик — символ.
  description: |
    Пока Италия ищет идеальные пропорции, фламандцы смотрят в детали. Ян ван Эйк совершенствует масляную
    живопись и пишет «Портрет четы Арнольфини», где в выпуклом зеркале отражается вся комната. Дюрер
    соединяет северную точность с итальянской теорией, Босх населяет картины чудищами, Брейгель — крестьянами.
  traits:
    - Масляные краски, светящиеся лессировки
    - Микроскопическая детализация
    - Скрытый символизм бытовых предметов
    - Интерес к пейзажу и повседневности
  names: [Ян ван Эйк, Рогир ван дер Вейден, Альбрехт Дюрер, Иероним Босх, Питер Брейгель Старший]
  example:
    file: Van Eyck - Arnolfini Portrait.jpg
    title: Портрет четы Арнольфини
    author: Ян ван Эйк
    year: 1434
    place: Лондонская национальная галерея
  wiki: Northern Renaissance
  links:
    - { title: "Northern Renaissance", url: "https://www.theartstory.org/movement/northern-renaissance/", src: "The Art Story", lang: en }

- id: mannerism
  name: Маньеризм
  orig: Mannerism
  aliases: [маньеристы, Пармиджанино, Понтормо, Эль Греко]
  start: 1520
  end: 1600
  dates: ок. 1520 – 1600
  era: renaissance
  domain: [art]
  region: Италия, затем Европа
  tier: 2
  parents:
    - { id: high-renaissance, type: evolved }
  summary: >
    После совершенства — изощрённость: вытянутые фигуры, странные позы, холодные цвета и намеренное напряжение.
  description: |
    Когда гармония Высокого Возрождения достигнута, художникам остаётся играть с ней. Маньеристы удлиняют
    тела, закручивают позы в «змеевидную линию», сгущают пространство и выбирают кислотные цвета.
    «Мадонна с длинной шеей» Пармиджанино — элегантная и чуть тревожная. Позже Эль Греко доведёт этот язык
    до мистического экстаза.
  traits:
    - Удлинённые, изысканные фигуры
    - «Змеевидная» закрученная поза
    - Неустойчивое, тесное пространство
    - Холодные, неестественные цвета
  names: [Пармиджанино, Понтормо, Бронзино, Эль Греко]
  example:
    file: Parmigianino - Madonna dal collo lungo - Google Art Project.jpg
    title: Мадонна с длинной шеей
    author: Пармиджанино
    year: 1534–1540
    place: Галерея Уффици, Флоренция
  wiki: Mannerism
  links:
    - { title: "Mannerism", url: "https://www.theartstory.org/movement/mannerism/", src: "The Art Story", lang: en }

- id: caravaggism
  name: Караваджизм
  orig: Caravaggism
  aliases: [Караваджо, тенебризм, караваджисты]
  start: 1595
  end: 1650
  dates: ок. 1595 – 1650
  era: renaissance
  domain: [art]
  region: Рим, затем вся Европа
  tier: 2
  parents:
    - { id: mannerism, type: reaction }
  summary: >
    Луч света из темноты выхватывает грязные пятки и живые лица: священная история как уличная сцена.
  description: |
    Караваджо отказался от маньеристской изысканности и стал писать святых с римских бедняков. Его фирменный
    приём — тенебризм: глубокая тьма и резкий направленный свет, как в театре. «Призвание апостола Матфея»
    разыгрывается в таверне. За ним пошли сотни караваджистов от Неаполя до Утрехта.
  traits:
    - Тенебризм — резкий свет и глубокая тень
    - Натурщики с улицы, грубый реализм
    - Драматичный, «остановленный» момент
    - Фигуры в натуральную величину на тёмном фоне
  names: [Караваджо, Артемизия Джентилески, Хусепе де Рибера, Жорж де Латур]
  example:
    file: The Calling of Saint Matthew-Caravaggo (1599-1600).jpg
    title: Призвание апостола Матфея
    author: Караваджо
    year: 1599–1600
    place: Церковь Сан-Луиджи-деи-Франчези, Рим
  wiki: Caravaggisti
  links: []

- id: baroque
  name: Барокко
  orig: Baroque
  aliases: [барочный стиль, Бернини, Рубенс]
  start: 1600
  end: 1750
  dates: ок. 1600 – 1750
  era: renaissance
  domain: [art, architecture]
  region: Европа и Латинская Америка
  tier: 1
  parents:
    - { id: high-renaissance, type: evolved }
    - { id: caravaggism, type: influence }
  summary: >
    Театр, движение и пышность: изогнутые фасады, взлетающие драпировки и потолки, распахнутые в небо.
  description: |
    Католическая церковь отвечает на Реформацию искусством, которое должно потрясать чувства. Бернини
    превращает мрамор в ткань и облака: его «Экстаз святой Терезы» поставлен в капелле как спектакль
    с потайным светом. Фасады изгибаются волной, потолки расписаны иллюзорными небесами, а Рубенс пишет
    вихри пышных тел.
  traits:
    - Динамика, диагонали, изгибы
    - Театральный свет и контрасты
    - Синтез архитектуры, скульптуры и живописи
    - Пышность, золото, иллюзорные плафоны
  names: [Джан Лоренцо Бернини, Франческо Борромини, Питер Пауль Рубенс, Диего Веласкес]
  example:
    file: Ecstasy of St. Theresa.jpg
    title: Экстаз святой Терезы
    author: Джан Лоренцо Бернини
    year: 1647–1652
    place: Санта-Мария-делла-Виттория, Рим
  wiki: Baroque
  links: []

- id: dutch-golden-age
  name: Голландский золотой век
  orig: Dutch Golden Age painting
  aliases: [малые голландцы, Вермеер, Рембрандт, голландский натюрморт]
  start: 1600
  end: 1672
  dates: ок. 1600 – 1672
  era: renaissance
  domain: [art]
  region: Нидерланды
  tier: 2
  parents:
    - { id: northern-renaissance, type: evolved }
    - { id: caravaggism, type: influence }
  summary: >
    Тихий свет из окна, натюрморты, пейзажи и портреты бюргеров: живопись для дома, а не для церкви.
  description: |
    Протестантская торговая республика покупала картины для жилых комнат, и художники специализировались
    на жанрах: натюрморт, пейзаж, бытовая сцена, групповой портрет. Рембрандт пишет «Ночной дозор»
    с караваджистской светотенью, Вермеер — «Девушку с жемчужной серёжкой» и залитые мягким светом интерьеры.
  traits:
    - Мягкий рассеянный свет из окна
    - Бытовые сцены, натюрморты, пейзажи
    - Точность фактур — шёлк, металл, стекло
    - Небольшие форматы для домашних интерьеров
  names: [Рембрандт, Ян Вермеер, Франс Хальс, Якоб ван Рёйсдал, Питер де Хох]
  example:
    file: 1665 Girl with a Pearl Earring.jpg
    title: Девушка с жемчужной серёжкой
    author: Ян Вермеер
    year: ок. 1665
    place: Маурицхёйс, Гаага
  wiki: Dutch Golden Age painting
  links:
    - { title: "Dutch Golden Age", url: "https://www.theartstory.org/movement/dutch-golden-age/", src: "The Art Story", lang: en }

- id: palladianism
  name: Палладианство
  orig: Palladian architecture
  aliases: [палладианская архитектура, Палладио, вилла Ротонда]
  start: 1570
  end: 1800
  dates: XVI – XVIII века
  era: renaissance
  domain: [architecture]
  region: Италия, Англия, Россия, США
  tier: 3
  parents:
    - { id: high-renaissance, type: evolved }
    - { id: ancient-rome, type: revival }
  summary: >
    Симметричные виллы с портиками-храмами по чертежам Андреа Палладио — от Виченцы до Петербурга и Вирджинии.
  description: |
    Палладио изучал руины Рима и построил вокруг Виченцы виллы, где фасад украшен античным портиком, а план
    идеально симметричен. Его «Четыре книги об архитектуре» стали учебником для всей Европы: английские
    поместья, русские усадьбы и даже Белый дом выросли из палладианской идеи.
  traits:
    - Строгая симметрия плана и фасада
    - Портик с фронтоном, как у храма
    - Математически выверенные пропорции
    - Белые оштукатуренные объёмы
  names: [Андреа Палладио, Иниго Джонс, Джакомо Кваренги, Томас Джефферсон]
  example:
    file: Villa Almerico Capra Andrea Palladio Vicenza giugno 2017.jpg
    title: Вилла Ротонда (Альмерико-Капра)
    author: Андреа Палладио
    year: 1567–1592
    place: Виченца, Италия
  wiki: Palladian architecture
  links: []

- id: rococo
  name: Рококо
  orig: Rococo
  aliases: [рокайль, Фрагонар, Буше, галантный стиль]
  start: 1730
  end: 1780
  dates: ок. 1730 – 1780
  era: renaissance
  domain: [art, design, architecture]
  region: Франция, Германия, Европа
  tier: 2
  parents:
    - { id: baroque, type: evolved }
  summary: >
    Барокко становится лёгким и игривым: пастельные тона, раковины-рокайли, качели и флирт в садах.
  description: |
    После смерти Людовика XIV аристократия переезжает из парадных залов в уютные салоны. Барочная мощь
    сменяется изяществом: асимметричные завитки-рокайли, позолота, зеркала и пастель. Фрагонар пишет
    «Качели» — девушка взлетает, роняя туфельку, а поклонник прячется в кустах роз.
  traits:
    - Пастельные тона — розовый, голубой, золото
    - Асимметричный орнамент-рокайль (раковина)
    - Галантные, легкомысленные сюжеты
    - Интимные масштабы салонов и будуаров
  names: [Антуан Ватто, Франсуа Буше, Жан Оноре Фрагонар, Франческо Растрелли]
  example:
    file: Joean Honoré Fragonard - The Swing.jpg
    title: Качели
    author: Жан Оноре Фрагонар
    year: 1767
    place: Собрание Уоллеса, Лондон
  wiki: Rococo
  links:
    - { title: "Rococo", url: "https://www.theartstory.org/movement/rococo/", src: "The Art Story", lang: en }

- id: chinoiserie
  name: Шинуазри
  orig: Chinoiserie
  aliases: [китайщина, китайский стиль в Европе, шинуазри]
  start: 1730
  end: 1800
  dates: XVIII век
  era: renaissance
  domain: [design, architecture]
  region: Европа
  tier: 3
  parents:
    - { id: rococo, type: evolved }
    - { id: shan-shui, type: influence }
  summary: >
    Европейская фантазия о Китае: павильоны с загнутыми крышами, фарфор, лаковые шкафчики и обои с пагодами.
  description: |
    Торговля фарфором, шёлком и чаем рождает моду на всё «китайское» — точнее, на воображаемый Китай.
    Шинуазри сливается с рококо: в парках строят китайские домики, интерьеры оклеивают обоями с птицами
    и пагодами, а мейсенская мануфактура копирует восточный фарфор. Это первый массовый «экзотический» стиль Европы.
  traits:
    - Пагоды, загнутые крыши, мостики
    - Фарфор, лак, шёлковые обои
    - Сине-белая палитра и позолота
    - Свободная фантазия вместо точной копии
  names: [Китайский домик в Сан-Суси, Китайский дворец в Ораниенбауме, Франсуа Буше]
  example:
    file: Chinese House (Sanssouci).jpg
    title: Китайский домик в парке Сан-Суси
    year: 1755–1764
    place: Потсдам, Германия
  wiki: Chinoiserie
  links: []

- id: ukiyo-e
  name: Укиё-э
  orig: Ukiyo-e
  aliases: [японская гравюра, укиёэ, «картины плывущего мира», Хокусай]
  start: 1660
  end: 1900
  dates: ок. 1660 – 1900
  era: renaissance
  domain: [art, design]
  region: Япония
  tier: 1
  parents:
    - { id: yamato-e, type: evolved }
  summary: >
    Японская цветная гравюра на дереве: актёры, куртизанки, пейзажи и волны с плоским цветом
    и смелой линией.
  description: |
    «Картины плывущего мира» печатались тиражами в Эдо для горожан: портреты актёров кабуки,
    красавиц, сцены развлечений, позже — пейзажные серии Хокусая и Хиросигэ. Плоские заливки,
    выразительный контур и неожиданное кадрирование в XIX веке потрясли европейских художников.
  traits:
    - Плоские цветовые заливки без светотени
    - Чёткий выразительный контур
    - Смелое, «обрезанное» кадрирование
    - Асимметричная композиция
    - Серийность и тиражность
  names: [Кацусика Хокусай, Утагава Хиросигэ, Китагава Утамаро, Тосюсай Сяраку]
  example:
    file: Tsunami by hokusai 19th century.jpg
    title: Большая волна в Канагаве
    author: Кацусика Хокусай
    year: ок. 1831
    place: Метрополитен-музей, Нью-Йорк
  wiki: Ukiyo-e
  links:
    - { title: "Ukiyo-e Japanese Woodblock Prints", url: "https://www.theartstory.org/movement/ukiyo-e-japanese-woodblock-prints/", src: "The Art Story", lang: en }

- id: mughal-miniature
  name: Могольская миниатюра
