    - { claim: "В живописи термин относят к первым десятилетиям XVI века и к Леонардо, Микеланджело, Рафаэлю и Тициану", field: dates, source: ng-glossary-high-renaissance }
    - { claim: "Для Высокого Возрождения характерны центрические композиции и техническое мастерство в рисунке", field: description, source: britannica-high-renaissance }
    - { claim: "Юлий II поручил Браманте план перестройки Рима; «Афинская школа» — в комнате личных покоев папы", field: description, source: britannica-high-renaissance }
    - { claim: "Сфумато — лессировки, создающие дымчатый эффект и мягкие контуры", field: traits, source: louvre-mona-lisa-record }
    - { claim: "Свод Сикстинской капеллы расписан в 1508–1512 годах", field: description, source: vatican-sistine-ceiling }
    - { claim: "Полезность терминов «Высокое Возрождение» и «маньеризм» оспаривается; резкой границы около 1520 года во Флоренции нет", field: scope, source: franklin-2005 }
  review:
