      подтверждения указаны у каждой записи. Даты, описание и изображения карточки полностью не проверялись.
  parents:
    - id: mannerism
      type: reaction
      status: verified
      note: >-
        Для натурализма самого Караваджо установлена реакция на позднеманьеристскую искусственность; караваджизм
        обозначает последующую рецепцию его художественных решений. Подтверждение относится к исходной программе
        и её восприятию, а не к доказанному одинаковому полемическому намерению всех последователей.
      sources:
        - ra26-d2-caravaggio-empathy
        - ra26-d2-caravaggist
  summary: >
    Луч света из темноты выхватывает грязные пятки и живые лица: священная история как уличная сцена.
  description: |
    Караваджо отказался от маньеристской изысканности и стал писать святых с римских бедняков. Его фирменный
    приём — тенебризм: глубокая тьма и резкий направленный свет, как в театре. «Призвание апостола Матфея»
    разыгрывается в таверне. За ним пошли сотни караваджистов от Неаполя до Утрехта.
  traits:
    - Тенебризм — резкий свет и глубокая тень
    - Натурщики с улицы, грубый реализм
    - Драматичный, «остановленный» момент
    - Фигуры в натуральную величину на тёмном фоне
  names: [Караваджо, Артемизия Джентилески, Хусепе де Рибера, Жорж де Латур]
