    Католическая церковь отвечает на Реформацию искусством, которое должно потрясать чувства. Бернини
    превращает мрамор в ткань и облака: его «Экстаз святой Терезы» поставлен в капелле как спектакль
    с потайным светом. Фасады изгибаются волной, потолки расписаны иллюзорными небесами, а Рубенс пишет
    вихри пышных тел.
  traits:
    - Динамика, диагонали, изгибы
    - Театральный свет и контрасты
    - Синтез архитектуры, скульптуры и живописи
    - Пышность, золото, иллюзорные плафоны
  names: [Джан Лоренцо Бернини, Франческо Борромини, Питер Пауль Рубенс, Диего Веласкес]
  example:
    file: Ecstasy of St. Theresa.jpg
    title: Экстаз святой Терезы
    author: Джан Лоренцо Бернини
    year: 1647–1652
    place: Санта-Мария-делла-Виттория, Рим
