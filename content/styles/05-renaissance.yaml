    к чувствам зрителя. Барокко ценит величие, чувственное богатство, драму и движение и размывает границы между
    видами искусства. Бернини в «Экстазе святой Терезы» заставляет камень парить и ставит сцену как театр со скрытым
    источником света, а Рубенс становится главным выразителем динамики и чувственной избыточности барочной живописи.
