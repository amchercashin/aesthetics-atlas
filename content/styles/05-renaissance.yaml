      6 утверждений сверено; снято «часто пирамидой» и упоминание Медичи и Сфорца как заказчиков; дата «Моны Лизы» — по
      записи Лувра, «Афинская школа» 1509–1511 по Smarthistory, «Сотворение Адама» — дата всего свода. Локальные копии:
