  parents:
    - id: high-renaissance
      type: influence
      status: verified
      note: >-
        Маньерист Перино дель Вага перерабатывал достижения Рафаэля и Микеланджело. Influence отражает
        документированные образцы без объявления всего маньеризма простой следующей стадией.
      sources:
        - ra26-mannerism
  summary: >
    Вытянутые фигуры, закрученные позы, тесное пространство и холодные цвета: изощрённый язык итальянского
    искусства после 1520 года.
  description: |
    Маньеризмом историки называют искусство Италии примерно после 1520 года — Понтормо, Пармиджанино,
    Бронзино. Фигуры удлинены и закручены в «змеевидную линию», пространство сгущено, цвета холодные
    и неожиданные. «Мадонна с длинной шеей» Пармиджанино — элегантная и чуть тревожная. Позже Эль Греко
    разовьёт этот язык в собственный мистический стиль.

    Граница с Высоким Возрождением условна: часть исследователей не видит резкого перелома около 1520 года,
    а объяснение «после совершенства художникам осталось играть с формой» — оценка, а не история.
  traits:
    - Удлинённые, изысканные фигуры
    - «Змеевидная» закрученная поза
    - Неустойчивое, тесное пространство
    - Холодные, неестественные цвета
