        Косые линии дождя, мост, срезанный краем листа, и плоские заливки цвета: смелое кадрирование тиражной гравюры.
      sources: [met-55433]
  summary: >
    Японская цветная гравюра на дереве: актёры, куртизанки, пейзажи и волны с плоским цветом
    и смелой линией.
  description: |
    Слово укиё сначала выражало буддийскую мысль о бренности жизни, а затем стало означать мир развлечений больших
    городов. Гравюры эпохи Эдо чаще всего показывали куртизанок и актёров кабуки, потом — знаменитые виды, как в сериях
    Хокусая и Хиросигэ. С 1765 года печатают многоцветные листы: отдельная доска на каждый цвет, а над листом работают
    художник, резчик, печатник и издатель. После открытия японских портов в 1853 году эти гравюры попадают в Европу
    и меняют живопись импрессионистов и постимпрессионистов.
