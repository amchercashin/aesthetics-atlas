      title: Афинская школа
      author: Рафаэль Санти
      year: 1509–1511
      place: Ватикан, Станца делла Сеньятура
      credit: источник копии не установлен
      license: роспись — общественное достояние; права на снимок не установлены
      reference: https://www.museivaticani.va/content/museivaticani/en/collezioni/musei/stanze-di-raffaello/stanza-della-segnatura/scuola-di-atene.html
      whyRepresentative: Уравновешенная многофигурная композиция с центральной перспективой и идеализированными фигурами вокруг Платона и Аристотеля.
      sources: [vatican-school-of-athens, smarthistory-school-of-athens]
    - asset: assets/works/creation-of-adam.jpg
      title: Сотворение Адама
      author: Микеланджело Буонарроти
      year: 1508–1512
      place: Сикстинская капелла, Ватикан
      note: Дата всей росписи свода; для этой сцены в записи Ватикана отдельной даты нет.
      credit: источник копии не установлен
      license: роспись — общественное достояние; права на снимок не установлены
      reference: https://www.museivaticani.va/content/museivaticani/en/collezioni/musei/cappella-sistina/volta.html
      whyRepresentative: Монументальные анатомически убедительные тела и ясная композиционная связь через протянутые руки.
      sources: [vatican-sistine-ceiling]
  summary: >
    Леонардо, Микеланджело и Рафаэль строят крупные уравновешенные композиции, моделируют форму светом
    и тенью и работают в монументальном масштабе.
  description: |
    На рубеже XV–XVI веков в Милане, Флоренции и Риме складывается язык, который потом назовут Высоким
    Возрождением. Леонардо строит моделировку на сфумато — дымчатых лессировках без жёстких контуров —
    и пишет «Мону Лизу». Микеланджело в 1508–1512 годах расписывает свод Сикстинской капеллы, Рафаэль —
    станцы Ватикана с «Афинской школой». Композиции строятся как уравновешенное целое вокруг центра,
    а фигуры идеализированы и анатомически убедительны.

    За этим языком стоит прежде всего папский заказ: Юлий II поручает Браманте перестройку Рима, а Рафаэль
    расписывает комнату в его личных покоях. Позднейшая традиция называла это «вершиной» Ренессанса; это
    оценка, а не историческое объяснение.
  traits:
    - Уравновешенные композиции вокруг центра
    - Сфумато — мягкие переходы без контура
    - Идеализированная, анатомически убедительная фигура
    - Монументальный масштаб и ясное построение
  promptCues:
    - Пирамидальная, уравновешенная композиция
    - "Сфумато: мягкие переходы тона без резкого контура"
    - Объём, вылепленный светом и тенью
    - Дальний пейзаж в голубоватой дымке
  names: [Леонардо да Винчи, Микеланджело, Рафаэль, Браманте, Тициан]
  evidence:
