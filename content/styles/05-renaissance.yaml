      place: Падуя
      note: Роспись капеллы; снимок Зайрона, 30 сентября 2017 года.
      whyRepresentative: >-
        Ярусы сцен на синем поле складываются в единый рассказ, а фигуры внутри сцен стоят на земле и имеют объём.
      sources: [ra26-duccio]
    - file: Duccio_maesta1021.jpg
      title: Маэста Дуччо
      author: Дуччо ди Буонинсенья
      year: 1308–1311
      place: Музей Опера-дель-Дуомо, Сиена
      whyRepresentative: >-
        Золотой фон и ряды святых держатся итало-византийской традиции, а цвет и тонко очерченные фигуры смягчают её строгость.
  summary: >
    Джотто возвращает фигурам объём и вес, а сценам — пространство с ощутимой глубиной.
  description: |
    На рубеже XIII–XIV веков итальянская живопись меняется. Её ещё питает византийская традиция, но у Джотто фигуры
    становятся объёмными, чувства — разнообразными и человечными, а пространство обретает почти измеримую глубину.
    В капелле Скровеньи в Падуе, расписанной около 1305 года, сцены идут единым циклом; в «Оплакивании» простой пейзаж
    и толпа скорбящих направляют взгляд к горю Марии. Дуччо в Сиене идёт другим путём: цвет, тонко очерченные фигуры
    и более тесная связь с Византией.
  traits:
    - Объёмные, весомые фигуры
    - Пространство с ощутимой глубиной
    - Разнообразные, человечные чувства и жесты
    - Фресковые циклы в капеллах
  names: [Джотто, Чимабуэ, Дуччо, Симоне Мартини]
