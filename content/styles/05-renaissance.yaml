  end: 1527
  dates: ок. 1490 – 1527
  dateKind: period
  approx: true
  dateNote: >
    Британника: от начала 1490-х годов до разграбления Рима в 1527 году. Лондонская национальная галерея относит термин
    в живописи к первым десятилетиям XVI века. Граница условна — часть исследователей не видит резкого стилистического
    перелома около 1520 года.
  era: renaissance
  domain: [art, architecture]
  medium: [painting, sculpture, architecture, drawing]
  subjects: [portrait, religion-myth, figure, any]
  region: Рим, Флоренция, Милан, Венеция
  tier: 1
  kind: period
  scopeNote: >
    Термин описывает короткий период итальянского искусства и узкий круг мастеров. Сами понятия
    «Высокое Возрождение» и «маньеризм» в современной науке обсуждаются как условные.
  parents:
