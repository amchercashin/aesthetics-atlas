    - field: dates
      claim: >-
        По Memoria Chilena, металлургия мапуче имеет доиспанские истоки, но серебряное дело приобрело массовый
        размах в конце XVIII века и достигло расцвета в XIX веке, после чего пошло на спад при оккупации Араукании.
      source: memoriachilena-plateria-mapuche
    - field: description
      claim: >-
