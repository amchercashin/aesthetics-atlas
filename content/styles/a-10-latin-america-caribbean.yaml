  wiki: { en: Mapuche silverwork, ru: Мапуче }
  summary: >-
    Традиционная серебряная ювелирная ковка и чеканка мастеров мапуче (рютран): подвесные нагрудные пластины
    трапелакуча и сикиль, головные обручи трарилонко, крупные булавки тупу и серьги чавай.
  description: >-
    По очерку Чилийского музея доколумбова искусства и материалам Национальной библиотеки Чили (Memoria Chilena),
    ремесло обработки серебра у мапуче — рютран (rütran) — сложилось как синтез доиспанской ковки листового
    металла (ранее применявшейся для меди) и привнесённого плавления. Интенсивный взлёт серебряного дела
    пришёлся на конец XVIII и особенно XIX век, когда в результате активной торговли на границе (La Frontera)
    в земли мапуче хлынули серебряные монеты: мастера-ювелиры (рютрафе) не пускали их в денежный оборот, а
    переплавляли и расплющивали молотом в тонкие пластины, звенья и подвески. Серебро стало главным видимым
    знаком положения вождей (лонко и ульменов), частью свадебного приданого и праздничного женского костюма, а
    также украшением конской сбруи — стремян, шпор и ременных накладок.


    Классический женский убор объединяет подвижную сочленённую архитектуру металла и тёмный шерстяной текстиль:
    вокруг головы носят звеньевой обруч трарилонко (trarilonko) с подвесными дисками, в ушах — крупные плоские
    серьги чавай (chaway), плащ скалывают длинными булавками тупу (tupu) и катаве со сферической или плоской
    головкой (миссионер Фрай Диего де Оканья упоминал такие булавки у женщин мапуче ещё в 1600 году), а грудь
    закрывают многоярусные нагрудные пластины сикиль (sikil) и цепи-подвески трапелакуча (trapelakucha) с
    крестами, птицами и антропоморфными фигурами. После оккупации Араукании в конце XIX века изготовление
    конской сбруи и утвари сошло на нет, но традиция женских украшений сохраняется мастерами Араукании и сегодня.
    От доколумбового золотого и серебряного литья Анд серебро мапуче отличается плоскостной чеканкой, шарнирной
    подвесной конструкцией и звонким ритмом монетных дисков, а от скифского звериного стиля — строгой
    фронтальной симметрией и прямым встраиванием в складки костюма.
