  scopeNote: >-
    Перуанские ручные шелкографические афиши чича и выросшая из них уличная типографика Лимы и нагорья Хунин
    с конца 1960-х годов по корпусу документальных снимков 2013–2022 годов и кураторским материалам
    Смитсоновского фестиваля и Художественного музея Эри. Сама музыка чича, фотопортретные офсетные флаеры
    без ручного леттеринга и коммерческая сувенирная продукция сюда не входят.
