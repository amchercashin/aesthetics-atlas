  wiki: { en: Art of Haiti }
  summary: >-
    Обзор расцвета гаитянской живописи с 1940-х вокруг Центра искусств в Порт-о-Пренсе: от сакральных видений
    Эктора Ипполита и исторических хроник Филоме Обена до воображаемых городов Префета Дюффо.
  description: >-
    По официальной истории Центра искусств в Порт-о-Пренсе (Le Centre d'Art), в 1944 году американский
    акварелист ДеУитт Питерс вместе с гаитянскими интеллектуалами и художниками (Морисом Борно, Альбером
    Мангонесом, Филиппом Тоби-Марселеном, Жео Рампоно и др.) открыл первую в стране открытую мастерскую и
    выставочную площадку. С 1945 года вокруг Центра сформировалась мощная волна самобытных мастеров, которых
    зарубежная критика (включая кубинского критика Хосе Гомеса Сикре в 1945 году и Андре Бретона в 1948 году)
    поспешила окрестить «наивными» — формула, которую сам Центр искусств сегодня неизменно берёт в кавычки.
    В 1950-е мастера Центра создали знаменитые росписи собора Святой Троицы в Порт-о-Пренсе, а их архив с
    1944 года в 2017 году был включён в региональный реестр ЮНЕСКО «Память мира».


    Обзор объединяет глубоко несхожие авторские и региональные линии, представленные пятью работами 1946–1976
    годов из Художественного музея Милуоки: сакральную симметрию Эктора Ипполита («В храме», ок. 1947),
    документальную историческую ясность северной школы Филоме Обена («Повстанцы Леконта, июль 1911 года»,
    1946), фантастические многоярусные города Префета Дюффо («Парящий город», 1976), спокойный прибрежный быт
    Риго Бенуа («Строители лодок и рыбаки», ок. 1953) и ритмичную монументальность коллективного труда у
    Кастеры Базиля («Кумбит», 1953). При всех различиях манер эти картины сближают открытый звучный цвет,
    ясный контур и пристальное внимание к духовной, исторической и повседневной жизни острова. От народной
    живописи Конго с её рекламными надписями и городской сатирой гаитянскую сцену отличают более тесная связь
    с историческим повествованием, пейзажем и сакральной символикой.
  traits:
    - Насыщенный, звучный локальный цвет и ясная, легко читаемая силуэтная композиция
    - Широкий спектр сюжетов — сакральные сцены, национальная история, сельский труд кумбит и воображаемые города
    - Чёткая повествовательная ритмика с множеством фигур, лодок, домов и тропической растительности
    - Разнообразие авторских почерков (от строгой фронтальной симметрии до скрупулёзной хроники и фантастической архитектуры)
