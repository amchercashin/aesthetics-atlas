  admission:
    language: >-
      Гладкие округлые объёмы, открытая «народная» палитра (голубой, зелёный, жёлтый, розовый), ярусные
      тропические пейзажи и гипертрофированный масштаб тела и предметов.
    corpus: >-
      Пять самостоятельных полотен 1924–1928 годов из четырёх музейных собраний (MALBA, Музей Гренобля,
      Пинакотека Сан-Паулу, MAM Рио-де-Жанейро), охватывающих периоды Pau-Brasil и Антропофагии.
    distinctness: >-
      Отличается от европейского кубизма мягкой биоморфной цельностью и тропической палитрой, а от
      мексиканского мурализма — станковой камерностью и фольклорно-сновидческой пластикой.
    significance: >-
      Ключевая фигура бразильского модернизма: крупнейшие ретроспективы в MASP (2019, 92 работы), MoMA и AIC
      (2017–2018), Музее Люксембурга и Музее Гуггенхайма в Бильбао (2024–2025).
    sources: [masp-tarsila-popular-2019, guggenheim-bilbao-tarsila-2025, malba-tarsila-abaporu]
