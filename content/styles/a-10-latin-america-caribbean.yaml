  summary: >-
    Многослойная обратная аппликация женщин народа гуна из Панамы и Колумбии: прорезанные и подшитые слои
    яркого хлопка образуют плотные лабиринты линий, морских существ и космологических знаков.
  description: >-
    По описанию Чикагского института искусств и Музея молы в Панаме (MuMo), мола — нагрудные и спинные панели
    традиционной женской блузы народа гуна (ранее в литературе также «куна»), живущего на архипелаге Гуна-Яла
    (Сан-Блас) в Панаме и в приграничной Колумбии. Мастерица складывает несколько слоёв цветной хлопчатобумажной
    ткани, прорезает концентрические рисунки в верхних слоях, аккуратно подворачивает срезы внутрь и пришивает
    их потайным швом, открывая лежащие ниже цвета — эта техника называется обратной аппликацией и часто
    дополняется прямой аппликацией и вышивкой тамбурным, обмёточным и строчным швами. По кураторской записи
    Чикагского института искусств, сложные узоры молы выросли из традиционной росписи тела, а с распространением
    фабричных тканей стали главным текстильным языком гуна и важным знаком культурной автономии, закреплённой
    после восстания дуле 1925 года.


    В XX веке рядом с блузами для ношения появились отдельные панели, создаваемые как самостоятельные
    художественные произведения. Постоянная экспозиция Музея молы (одобренная пятью правящими советами гуна)
    выделяет геометрические, природные, космологические и повествовательные сюжеты: от строгих абстрактных
    решёток до парных скатов, крабов, птиц и сцен из жизни островов. От европейской бумажной вырезки и польских
    выцинанок молу отличает текстильная глубина многоступенчатых прорезей и штриховое заполнение фона, а от
    текстиля куба с вышивкой по рафии — яркий контраст промышленного хлопка (алого, чёрного, оранжевого,
    жёлтого и бирюзового) и непрерывный двойной или тройной контур вокруг каждой фигуры.
  traits:
    - Многослойная обратная аппликация с концентрическими цветными контурами, проступающими из-под верхнего слоя
    - Насыщенная палитра алого, чёрного, оранжевого, жёлтого, малинового и синего хлопка
    - Плотная ритмическая зашивка всего поля короткими вертикальными прорезями, зубцами и точками без пустот
    - Соединение строгой геометрической симметрии с живыми образами морской фауны, растений и мифов
