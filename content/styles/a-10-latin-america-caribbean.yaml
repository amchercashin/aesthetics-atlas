    - "Чистая насыщенная палитра небесно-голубого, изумрудно-зелёного, ярко-жёлтого, розового и тёплой охры"
    - "Смелая игра масштабов с монументальными, слегка гипертрофированными формами на простом горизонте"
    - "Сказочный тропический лаконизм ярусного пейзажа и скульптурная ясность каждого силуэта"
