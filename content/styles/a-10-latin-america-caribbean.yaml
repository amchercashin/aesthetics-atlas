        украшения и детали конской сбруи вождей (лонко и ульменов); сегодня в Араукании традиция продолжается
        в ювелирных украшениях.
      source: memoriachilena-plateria-mapuche
    - field: description
      claim: >-
        Чилийский музей доколумбова искусства называет технику рютран (rutran) синтезом доиспанской работы с
        листовым металлом и привнесённого плавления и перечисляет основные типы украшений (trarilonko, chaway,
        trapelakucha, sikil, akucha, tupu).
      source: chileprecolombino-mapuche-art
    - field: description
      claim: >-
        Фрай Диего де Оканья в 1600 году описывал женщин мапуче, скалывающих квадратную накидку на груди золотой
        или серебряной булавкой тупу (topo); тип булавки восходит к андской традиции инков.
      source: va-mapuche-shawl-pin-o382363
