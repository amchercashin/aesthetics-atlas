  wiki: { en: "Chicha (art)" }
  summary: >-
    Уличные концертные афиши Лимы и Анд, печатаемые вручную методом шелкографии: кислотно-флуоресцентные
    градиенты, ручной объёмный леттеринг с толстым чёрным контуром и энергия городской мигрантской культуры.
  description: >-
    По материалам программы «Перу: Пачамама» Смитсоновского фестиваля фольклора (2015) и выставки «Revolución
    Chicha» Художественного музея Эри (2023–2024), перуанская графика чича возникла в Лиме на волне массовой
    внутренней миграции из Анд и Амазонии с конца 1960-х годов рядом с музыкой чича (андской кумбией). Мастера,
    вышедшие из центрального нагорья Хунин, перенесли призматические, кричаще яркие цветовые сочетания
    традиционной вышивки и праздничной одежды на дешёвые уличные афиши. Производство остаётся ремесленным:
    леттеринг рисуют и вырезают вручную, а флуоресцентные краски (кислотно-зелёную, лимонную, фуксию,
    оранжевую) накатывают ракелем через шёлковую сетку — часто сразу двумя цветами в один проход, чтобы
    получить светящийся радужный градиент на чёрном или контрастном фоне.


    Пионером афиш чича в Лиме Смитсоновский очерк называет Педро «Monky» Толомео, создававшего фосфоресцирующие
    концертные плакаты для легендарных групп Los Shapis и Chacalón y La Nueva Crema, а новое признание языку
    принесли типограф и муралист Эллиот Тупак и коллективы вроде Amapolay и Familia Gutiérrez, переведшие
    уличный леттеринг в галереи, городские росписи и социальный протестный плакат. В отличие от американского
    психоделического плаката 1960-х с его текучей, намеренно трудночитаемой вязью, чича-афиша держит жёсткую
    читаемость концертного объявления (крупная дата, место и имя ансамбля в плотных рамках), а от граффити
    отличается тиражной трафаретной печатью и регулярной оклейкой городских стен.
  traits:
    - Флуоресцентные неоновые краски (кислотно-зелёный, жёлтый, оранжевый, фуксия) с резкими градиентными переливами
    - Ручной динамичный леттеринг с толстой чёрной обводкой, объёмной тенью и белым контуром-бликом
    - Ремесленная шелкография с вырезанными вручную трафаретами и плотной многоярусной вёрсткой объявления
    - Контрастная рамка и сплошная уличная оклейка из одного или двух склеенных листов на стенах города
  promptCues:
    - "Кислотно-флуоресцентные градиенты неоново-зелёного, лимонного, ярко-оранжевого и фуксии на чёрном фоне"
    - "Смелая ручная шелкография с плотным чёрным контуром, белой обводкой-бликом и выразительной объёмной тенью"
    - "Плотная декоративная композиция уличной афиши с резкими контрастными рамками и вибрирующим цветом"
    - "Энергичная ручная графика и ремесленная фактура трафаретной печати без мягких полутонов"
