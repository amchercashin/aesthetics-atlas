  wiki: { en: Tarsila do Amaral, ru: "Амарал, Тарсила ду" }
  summary: >-
    Бразильский модернизм Тарсилы ду Амарал 1920-х: округлые обобщённые объёмы, контрастная «деревенская»
    палитра, сказочная тропическая флора и гипертрофированный масштаб тела в циклах Pau-Brasil и Антропофагии.
  description: >-
    По материалам ретроспектив MASP (2019), Музея Гуггенхайма в Бильбао (2025) и каталожной записи MALBA,
    Тарсила ду Амарал (1886–1973) сформировала свой зрелый визуальный язык в 1923–1929 годах между Парижем и
    Сан-Паулу. После парижских занятий у Андре Лота, Альбера Глеза и особенно Фернана Леже она соединила
    конструктивную ясность кубизма с бразильским «деревенским вкусом» (caipira), выведя собственную палитру:
    «чистый синий, фиолетово-розовый, яркий жёлтый, поющий зелёный». В период Pau-Brasil (1924–1927) —
    «A Cuca», «Carnaval em Madureira», «O Vendedor de Frutas» — пейзажи и жанровые сцены строятся из гладких
    цветных планов, обобщённых холмов, пальм, башен и сказочных существ с чёткой, почти игрушечной пластикой.


    В 1928 году картина «Абапору» (название на языке тупи-гуарани означает «человек, который ест человека»),
    подаренная мужу, поэту Освалду ди Андради, вдохновила «Антропофагический манифест» — программу критического
    «переваривания» европейского авангарда ради самостоятельного бразильского искусства. В полотнах этого круга
    («Abaporu», «Urutu») формы становятся монументальными, обтекаемо-биоморфными и сновидческими: крошечная
    голова контрастирует с гигантской ступнёй и рукой рядом с кактусом под палящим диском солнца. От жёсткого
    аналитического кубизма её манеру отличают цельный плавный объём без дробления граней и открытый тропический
    цвет, а от мексиканского мурализма — камерный станковый масштаб, отсутствие пафосной риторики и мягкая
    фольклорная ирония.
  traits:
    - Округлые, гладко моделированные объёмы без дробления граней и резких мазков
    - Открытая «деревенская» палитра — чистый голубой, изумрудно-зелёный, ярко-жёлтый, розовый и охра
    - Утрированный, гротескный масштаб фигур и предметов (огромные стопы, плоды, кактусы, гигантское яйцо)
    - Ярусные тропические пейзажи с обобщёнными холмами, пальмами, домиками и фольклорными существами
  promptCues:
