    сохранившиеся работы карточки — с I века до н. э. Конец условен — смещение последнего западного императора
    в 476 году.
  era: antiquity
  domain: [architecture, art]
  medium: [architecture, sculpture, relief, painting, mosaic]
  subjects: [portrait, city, any]
  region: Римская империя
  tier: 1
  kind: overview
  review:
    status: reviewed
    date: "2026-11-08"
    scope: [relations, dates, text, images, gallery]
    note: >-
      Связи — 16.10.2026, границы у записи. 08.11.2026: даты — по очерку Метмузея о римских копиях и Британнике.
      Описание — 7 утверждений сверено; сняты акведуки и термы (источника не открыто) и «то, что Греции и не снилось».
