  summary: >
    Куросы с «архаической улыбкой» и чернофигурные вазы: Греция усваивает восточные образцы и ищет свой язык.
  description: |
    В VII веке до н. э. геометрический узор уступает более натуралистичному стилю, пришедшему с контактами на
    Ближнем Востоке и в Египте. В VI веке в святилищах и на кладбищах ставят куросов и кор — мраморные фигуры
