  contexts:
    - id: web-1-0
      type: related-context
      status: verified
      note: >-
        Подтверждена конкретная художественная переработка пользовательского веба: Dreaming the Chinese Web
        Gabriele de Seta (2015) использует элементы GeoCities 1996–1997. Это подтверждённый культурный контекст;
