    Скевоморфный дизайн наделяет цифровой объект декоративными чертами его реального прообраза, чтобы пользователь применил знакомый опыт: например, книжная полка с деревянной текстурой на планшете Kindle Fire.
    При Стиве Джобсе такие решения широко применялись в Mac OS X и приложениях Apple. После ухода Скотта Форстолла часть его обязанностей принял Джонатан Айв, и с iOS 7 в 2013 году Apple перешла к более простому дизайну.
