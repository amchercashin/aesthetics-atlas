- id: y2k-aesthetic
  name: Y2K
  orig: Y2K aesthetic
  aliases: [y2k, эстетика нулевых, миллениум, Y2K futurism]
  searchKeywords: [iMac G3, хром]
  start: 1997
  end: 2004
  dates: 1997 – 2004
  approx: true
  dateKind: period
  era: digital
  domain: [design, internet]
  medium: [product-design, digital-art, graphic-design, fashion]
  subjects: [any]
  region: США, Япония, весь мир
  tier: 1
  kind: [period, internet-aesthetic]
  kindNote: "Дизайн-язык рубежа 1990–2000-х; само название «Y2K-эстетика» — позднее, из интернет-сообществ."
  compare:
    - id: early-cgi
      note: >-
        Редакционное сопоставление, не утверждение о происхождении. CGI — один из видимых материалов
        ретрофутуристического Y2K-корпуса. Сопоставление точнее происхождения всей эстетики от технического
        способа производства изображений.
      sources:
        - ra26-y2k
        - ra26-computer-history
  scopeNote: >-
    Ретроспективное объединение потребительского и цифрового футуризма рубежа тысячелетий. Наряду с прозрачным
    пластиком и хромом включает отдельный игровой корпус: Evan Collins относит Wipeout (1995) и WipEout 2097
    (1996) к Y2K. Это ранние примеры перед условным интервалом 1997–2004; киберпанковый визуальный мир этих игр
    не описывает всю эстетику.
  dateNote: >-
    1997–2004 — условный интервал основного корпуса карточки. CARI относит период актуальности к 1990-м годам; источники расходятся. Ранние игровые примеры Wipeout (1995) и WipEout
    2097 (1996) показаны как предыстория; год рождения единого стиля этим не устанавливается.
  evidence:
    - claim: Evan Collins включает Wipeout и WipEout 2097 в Y2K-корпус. Это ретроспективная классификация 2016 года.
      field: scopeNote
      source: ra26-d4-y2k-collins
    - claim: >-
        Nicky Place называет Akira и Blade Runner источниками визуального мира WipEout 2097; интервью Ian
        Anderson о графике tDR опубликовано отдельно.
      field: description
      source: ra26-d4-wipeout-original
    - claim: Период актуальности у CARI и перечень образов
      field: dates
      source: cari-y2k
    - claim: iMac G3, 1998, полупрозрачный цветной поликарбонат
      field: traits
      source: vam-imac
  review:
    status: reviewed
    date: "2026-11-09"
    scope: [relations, dates, text, images, gallery]
    note: >-
      Связи — 16.10.2026, границы у записи. 09.11.2026: даты — условный интервал сохранён, а расхождение с CARI названо в примечании; описание — 3 утверждения сверено; снято «последний момент, когда технологии казались праздником», «проблема 2000» и возрождение 2020-х. Главная иллюстрация — Музей Виктории и Альберта.
      Галерея: источник копий не установлен, годы приведены к сроку выпуска модели.
  parents:
    - id: space-age
      type: influence
      status: verified
      note: >-
        Evan Collins прямо прослеживает передачу форм Space Age 1960-х и ультрамодернизма 1970-х в
        потребительский Y2K-дизайн, в том числе изменённые пластиковые объёмы. Это влияние: речь о развитии
        форм, а не обязательной сознательной реконструкции эпохи каждым дизайнером. Источник — ретроспективное
        интервью архивиста.
      sources:
        - ra26-d2-y2k-collins
    - id: cyberpunk
      type: influence
      status: verified
      note: >-
        Влияние ограничено игровым ответвлением Y2K на примере WipEout 2097. Nicky Place называет Akira и Blade
        Runner источниками визуального мира игры; авторский A–Z Evan Collins прямо включает Wipeout и 2097 в
        Y2K-корпус. Игры 1995–1996 годов здесь — ранние примеры перед условным потребительским интервалом
        1997–2004. Это не объяснение всех логотипов Ian Anderson, всей серии Wipeout или всей Y2K-эстетики.
      sources:
        - ra26-d4-wipeout-original
        - ra26-d4-y2k-collins
  gallery:
    - asset: assets/works/y2k-imac-1.jpg
      title: "Y2K: iMac G3"
      author: Apple, дизайнер Джонатан Айв
      year: 1998–2003
      credit: источник копии не установлен
      license: права не установлены; образовательное использование
      nonfree: true
      reference: https://collections.vam.ac.uk/item/O158296/imac-g3-personal-computer-ive-jonathan/
      note: Экран с цветочной заставкой, модель на снимке не установлена.
      whyRepresentative: Полупрозрачный корпус и округлые синие детали делают компьютер домашней вещью.
      sources: [vam-imac]
    - asset: assets/works/y2k-imac-2.jpg
      title: "Y2K: розовый iMac"
      author: Apple, дизайнер Джонатан Айв
      year: 1998–2003
      credit: источник копии не установлен
      license: права не установлены; образовательное использование
      nonfree: true
      reference: https://collections.vam.ac.uk/item/O158296/imac-g3-personal-computer-ive-jonathan/
      whyRepresentative: Розовый полупрозрачный пластик корпуса, клавиатуры и мыши показывает конфетную палитру.
      sources: [vam-imac]
  summary: >
    Цифровой футуризм рубежа тысячелетий: полупрозрачный цветной пластик, хром, блеск и капли.
  description: |
    Ретроспективное название потребительского и цифрового футуризма рубежа тысячелетий. iMac G3 Джонатана Айва (1998) заменил серый корпус полупрозрачным цветным поликарбонатом и повлиял на формы и цвета бытовой техники.
    CARI описывает этот образ будущего так: кожаные брюки, серебристые тени, блестящая одежда, градиенты и округлая электроника.

    В игровом корпусе Wipeout и WipEout 2097 соединяют футуристические миры с графикой The Designers Republic. Evan Collins включает обе игры в свою Y2K-подборку; Nicky Place называет «Акиру» и «Бегущего по лезвию» источниками облика WipEout 2097.
  traits:
    - Полупрозрачный цветной пластик
    - Округлые корпуса
    - Блеск, серебро, градиенты
    - Голубой, розовый и другие конфетные цвета
  promptCues:
    - Прозрачный цветной пластик
    - Хром, жидкий металл и голограммы
    - Капли, пузыри и сферы
    - Серебристый, голубой, лаймовый и розовый
  names: [Джонатан Айв, Designers Republic]
  example:
    file: IMac G3 Bondi Blue, three-quarters view.png
    title: Компьютер iMac G3 Bondi Blue
    author: Apple, дизайнер Джонатан Айв
    year: 1998
    whyRepresentative: >-
      Полупрозрачный сине-зелёный корпус с округлой спиной заменил привычный серый ящик.
    sources: [vam-imac]
  wiki: Y2K aesthetic
  links:
    - { title: "Y2K", url: "https://cari.institute/aesthetics/y2k-aesthetic", src: "CARI Institute", lang: en }
    - { title: "Y2K", url: "https://aesthetics.fandom.com/wiki/Y2K", src: "Aesthetics Wiki", lang: en }

