  description: |
    Выставка «Superflat» Такаси Мураками в 2000 году утверждала, что японская визуальная культура — от
    гравюр укиё-э до аниме — всегда была «плоской», и эта плоскость отражает общество потребления. Мураками
    стал японским Уорхолом: его разноцветные улыбающиеся цветы украшают и музеи, и сумки Louis Vuitton,
    и обложки Канье Уэста.
  traits:
