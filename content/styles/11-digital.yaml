    Ольга Лялина в работе «Мой парень вернулся с войны» (1996) рассказывает кинематографичную историю с помощью фреймов браузера, гипертекста и изображений. Алексей Шульгин в «Form Art» (1997) сделал материалом композиций кнопки и поля HTML.
