- id: web-1-0
  name: Web 1.0 (эстетика GeoCities)
  orig: Web 1.0 / Old Web
  aliases: [GeoCities, олдвеб, old web, веб 90-х, Netscape, under construction]
  start: 1994
  end: 2004
  dates: 1994 – 2004
  era: digital
  domain: [internet, design]
  region: Интернет
  tier: 2
  kind: period
  contexts:
    - id: pixel-art
      type: uses-technique
      status: verified
      note: >-
        В архивном корпусе GB2312 GeoCities 1996–1997 прямо документированы pixel-art dragons рядом с другими
        графическими элементами. Это использование техники Pixel Art в части раннего веба, не происхождение
        всего Web 1.0 из пиксель-арта. Обычный растр не считается автоматически Pixel Art.
      sources:
        - ra26-d2-chinese-web
    - id: punk-graphics
      type: related-context
      status: verified
      note: >-
        Bráulio Amado и Joe Geis независимо описывают создание GeoCities fan sites / сайтов панк-групп в
        собственной DIY-практике. Это контакт музыкальной среды с ранним любительским вебом. Ретроспективные
        интервью не показывают исходные страницы и не прослеживают перенос конкретных панк-графических приёмов в
        GIF, таблицы или фоновые текстуры.
      sources:
        - ra26-d3-amado
        - ra26-d3-joe-geis
  origin: unknown
  review:
    status: partial
    date: "2026-10-16"
    note: >-
      16.10.2026 проверены исторические отношения и связанные с ними контексты и сопоставления; границы
      подтверждения указаны у каждой записи. Даты, описание и изображения карточки полностью не проверялись.
  parents: []
  gallery:
    - asset: assets/works/web1-sugarcubes.jpg
      title: "GeoCities: Sugar Cubes"
      author: Неизвестный автор
      year: 1990-е
      credit: GeoCities archive
      license: ©; образовательное использование
      nonfree: true
      reference: https://en.wikipedia.org/wiki/Web_1.0
      whyRepresentative: Яркие фоны, таблицы и декоративные гифки — эстетика домашних страниц 1990-х.
    - asset: assets/works/web1-shrine.jpg
      title: "GeoCities: домашняя страница"
      author: Неизвестный автор
      year: 1990-е
      credit: GeoCities archive
      license: ©; образовательное использование
      nonfree: true
      reference: https://en.wikipedia.org/wiki/Web_1.0
      whyRepresentative: Центрированный заголовок, счётчики и наивная вёрстка — язык Web 1.0.
  summary: >
    Домашние страницы 90-х: мигающие GIF, счётчики посетителей, фоны со звёздами и вечное «Under construction».
  description: |
    Когда веб стал доступен всем, каждый мог сделать свою страницу на GeoCities или Narod.ru — без дизайнеров
    и правил. Анимированные гифки, бегущие строки, таблицы, «веб-безопасные» кислотные цвета, гостевые книги
    и счётчики посетителей. Это была DIY-культура интернета, которую через двадцать лет с нежностью
    возродят Neocities, уирдкор и веб-брутализм.
  traits:
    - Мигающие GIF и бегущие строки
    - Кислотные «веб-безопасные» цвета на тёмных фонах
    - Таблицы, рамки, счётчики посетителей
    - Значки «Under construction» и «Best viewed in Netscape»
  names: [GeoCities, Angelfire, Narod.ru, Netscape Navigator]
  palette: ["#000080", "#00ffff", "#ff00ff", "#ffff00", "#c0c0c0"]
  paletteNote: Редакторская подборка из «веб-безопасной» палитры 216 цветов — тёмно-синий, циан, маджента, жёлтый, серый.
  example:
    asset: assets/illustrations/web-1-0.svg
    title: Домашняя веб-страница в духе 1990-х
    author: Редакция атласа
    year: 2026
    role: reconstruction
    note: >-
      Оригинальная схема, созданная для атласа в 2026 году; не исторический скриншот и не изображение
      реального продукта.
    whyRepresentative: >-
      Звёздный фон, ссылки, рамки, счётчик и плашка Under construction сведены в учебный макет. Мигающая
      анимация не воспроизводится.
  wiki: GeoCities
  links:
    - { title: "Old Web", url: "https://aesthetics.fandom.com/wiki/Old_Web", src: "Aesthetics Wiki", lang: en }
    - { title: "Web 1.0", url: "https://en.wikipedia.org/wiki/Web_1.0", src: "Wikipedia", lang: en }

- id: y2k-aesthetic
  name: Y2K
  orig: Y2K aesthetic
  aliases: [y2k, эстетика нулевых, миллениум, iMac G3, хром, Y2K futurism]
  start: 1997
  end: 2004
  dates: 1997 – 2004
  era: digital
  domain: [design, internet]
  region: США, Япония, весь мир
  tier: 1
  kind: [period, internet-aesthetic]
  kindNote: "Дизайн-язык рубежа 1990–2000-х; само название «Y2K-эстетика» — позднее, из интернет-сообществ."
  compare:
    - id: early-cgi
      note: >-
        Редакционное сопоставление, не утверждение о происхождении. CGI — один из видимых материалов
        ретрофутуристического Y2K-корпуса. Сопоставление точнее происхождения всей эстетики от технического
        способа производства изображений.
      sources:
        - ra26-y2k
        - ra26-computer-history
  scopeNote: >-
    Ретроспективное объединение потребительского и цифрового футуризма рубежа тысячелетий. Наряду с прозрачным
    пластиком и хромом включает отдельный игровой корпус: Evan Collins относит Wipeout (1995) и WipEout 2097
    (1996) к Y2K. Это ранние примеры перед условным интервалом 1997–2004; киберпанковый визуальный мир этих игр
    не описывает всю эстетику.
  dateNote: >-
    1997–2004 — условный интервал основного корпуса карточки. Ранние игровые примеры Wipeout (1995) и WipEout
    2097 (1996) показаны как предыстория; год рождения единого стиля этим не устанавливается.
  evidence:
    - claim: Evan Collins включает Wipeout и WipEout 2097 в Y2K-корпус. Это ретроспективная классификация 2016 года.
      field: scopeNote
      source: ra26-d4-y2k-collins
    - claim: >-
        Nicky Place называет Akira и Blade Runner источниками визуального мира WipEout 2097; интервью Ian
        Anderson о графике tDR опубликовано отдельно.
      field: description
      source: ra26-d4-wipeout-original
  review:
    status: partial
    date: "2026-10-16"
    note: >-
      16.10.2026 проверены исторические отношения и связанные с ними контексты и сопоставления; границы
      подтверждения указаны у каждой записи. Даты, описание и изображения карточки полностью не проверялись.
  parents:
    - id: space-age
      type: influence
      status: verified
      note: >-
        Evan Collins прямо прослеживает передачу форм Space Age 1960-х и ультрамодернизма 1970-х в
        потребительский Y2K-дизайн, в том числе изменённые пластиковые объёмы. Это влияние: речь о развитии
        форм, а не обязательной сознательной реконструкции эпохи каждым дизайнером. Источник — ретроспективное
        интервью архивиста.
      sources:
        - ra26-d2-y2k-collins
    - id: cyberpunk
      type: influence
      status: verified
      note: >-
        Влияние ограничено игровым ответвлением Y2K на примере WipEout 2097. Nicky Place называет Akira и Blade
        Runner источниками визуального мира игры; авторский A–Z Evan Collins прямо включает Wipeout и 2097 в
        Y2K-корпус. Игры 1995–1996 годов здесь — ранние примеры перед условным потребительским интервалом
        1997–2004. Это не объяснение всех логотипов Ian Anderson, всей серии Wipeout или всей Y2K-эстетики.
      sources:
        - ra26-d4-wipeout-original
        - ra26-d4-y2k-collins
  gallery:
    - asset: assets/works/y2k-imac-1.jpg
      title: "Y2K: iMac G3"
      author: Apple
      year: 1998–2001
      credit: Apple
      license: © Apple
      nonfree: true
      reference: https://en.wikipedia.org/wiki/Y2K_aesthetic
      whyRepresentative: Прозрачный цветной корпус и округлые формы — предметный символ Y2K.
    - asset: assets/works/y2k-imac-2.jpg
      title: "Y2K: розовый iMac"
      author: Apple
      year: 1999–2001
      credit: Apple
      license: © Apple
      nonfree: true
      reference: https://en.wikipedia.org/wiki/Y2K_aesthetic
      whyRepresentative: Кислотные цвета и глянцевый пластик — характерная палитра Y2K.
  summary: >
    Оптимистичный цифровой футуризм рубежа тысячелетий: прозрачный цветной пластик, хром, пузыри и голограммы.
  description: |
    Накануне 2000 года мир ждал будущего — и одновременно боялся «проблемы 2000». Дизайн ответил прозрачным
    цветным пластиком iMac G3 и Game Boy Color, хромированными 3D-шрифтами, капельками, голографическими
    плёнками и серебристыми костюмами в клипах. Это был, пожалуй, последний момент, когда технологии
    казались чистым праздником. С 2020-х эстетика переживает мощное возрождение.

    В игровом корпусе Wipeout и WipEout 2097 соединяют футуристические миры с графикой The Designers Republic. Evan Collins включает обе игры в свою Y2K-подборку; Nicky Place называет «Акиру» и «Бегущего по лезвию» источниками облика WipEout 2097.
  traits:
    - Прозрачный цветной пластик
    - Хром, жидкий металл, голограммы
    - Капли, пузыри, сферы
    - Серебристый, голубой, лаймовый и розовый
  promptCues:
    - Прозрачный цветной пластик
    - Хром, жидкий металл и голограммы
    - Капли, пузыри и сферы
    - Серебристый, голубой, лаймовый и розовый
  names: [Джонатан Айв, Hype Williams, Designers Republic]
  example:
    file: IMac G3 Bondi Blue, three-quarters view.png
    title: Компьютер iMac G3 Bondi Blue
    author: Apple, дизайнер Джонатан Айв
    year: 1998
  wiki: Y2K aesthetic
  links:
    - { title: "Y2K", url: "https://cari.institute/aesthetics/y2k-aesthetic", src: "CARI Institute", lang: en }
    - { title: "Y2K", url: "https://aesthetics.fandom.com/wiki/Y2K", src: "Aesthetics Wiki", lang: en }

- id: frutiger-aero
  name: Фрутигер-аэро
  orig: Frutiger Aero
  aliases: [frutiger aero, фрутигер аэро]
  searchKeywords: [аэро, Windows Vista, Windows 7, пузыри и трава, Web 2.0 Gloss, Aqua]
  start: 2005
  end: 2013
  dates: ок. 2005 – 2013
  dateKind: popularity
  approx: true
  dateNote: >
    Это «период актуальности» визуального языка, а не годы жизни направления: название придумано задним
    числом, а сама эстетика вернулась как ностальгия в 2020-х.
  revivals:
    - { start: 2020, note: "Ностальгическое возвращение в интернет-сообществах" }
  era: digital
  domain: [design, internet]
  medium: [ui, graphic-design, digital-art]
  region: Весь мир
  tier: 1
  kind: [period, internet-aesthetic]
  kindNote: "Дизайн-язык периода, получивший имя задним числом в интернет-сообществе исследователей эстетик."
  scopeNote: >
    Корпоративный и интерфейсный визуальный язык середины 2000-х — начала 2010-х и его поздняя
    ностальгическая волна. Название ретроспективное: в своё время у стиля не было общего имени.
  compare:
    - id: y2k-aesthetic
      note: >-
        Визуальное сопоставление глянцевых и прозрачных интерфейсных образов. Aqua 2000 и ретроспективные Y2K /
        Aero-корпуса дают предмет для сравнения, но не доказывают происхождение одной целой эстетики от другой.
        Заголовок интервью Dazed 2023 года описывает также смену волн ностальгии.
      sources:
        - ra26-d3-apple-aqua
        - ra26-d4-y2k-collins
        - ra26-d4-aero-sofi
  origin: unknown
  parents: []
  summary: >
    Глянцевый оптимизм нулевых: пузыри, капли воды, зелёная трава, голубое небо и стеклянные кнопки Windows Vista.
  description: |
    Название соединяет шрифт Frutiger и дизайн-язык Windows Aero. Его придумали задним числом
    исследователи Consumer Aesthetics Research Institute (CARI), чтобы описать визуальный язык
    примерно 2005–2013 годов: прозрачные «аэро»-панели Windows Vista и 7, глянцевые иконки, обои с травой
    и небом, рыбками и пузырями, гуманистические гротески в рекламе. Это была эстетика экологичной,
    светлой цифровой утопии. В 2020-х она вернулась как ностальгия поколения, выросшего на этих экранах.
  traits:
    - Глянец, стекло, отражения
    - Вода, пузыри, трава, голубое небо, полярное сияние
    - Бирюзово-зелёные и синие градиенты
    - Гуманистические гротески — Frutiger, Segoe
  promptCues:
    - Глянец, стекло и отражения
    - Вода, пузыри, трава и голубое небо
    - Бирюзово-зелёные и синие градиенты
    - Мягкие блики и ощущение свежести
  names: [Windows Vista, Windows 7, Nokia, Wii]
  evidence:
    - { claim: "Ретроспективный термин; период актуальности — середина 2000-х — начало 2010-х (около 2005–2013); название — от шрифта Frutiger и Windows Aero; авторы названия по CARI — Froyo Tam, Sofi Xian", field: dates, source: cari-frutiger-aero }
  review:
    status: partial
    date: "2026-10-16"
    note: >-
      Даты переведены в «период актуальности» по CARI; убрана неподтверждённая дата появления термина (было
      «2017»). 16.10.2026 проверены исторические отношения и связанные с ними контексты и сопоставления; границы
      подтверждения указаны у каждой записи.
  example:
