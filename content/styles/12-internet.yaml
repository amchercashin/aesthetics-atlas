    является объяснением всего музыкального жанра или всех Outrun-образов.
  parents:
    - id: cyberpunk
      type: influence
      status: verified
      note: >-
        Влияние ограничено обложкой Shattered (Renz Wilde, 2018). Wilde объясняет арт-дирекшен как комикс,
        который мог бы читать персонаж Blade Runner, и называет работы PekoeBlaze / C. A. Brown. Лейбл
        подтверждает соавторство Brown и Wilde и дату релиза. Это рассказ Wilde как соавтора оформления, а не
        интервью Brown и не объяснение происхождения музыкального жанра или всех неоновых сеток Outrun.
      sources:
        - ra26-d3-wilde
        - ra26-d3-shattered-release
