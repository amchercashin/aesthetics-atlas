    year: 2011 (фотография)
    role: illustration
    note: Фотография старого коттеджа до указанной волны cottagecore; иллюстрирует её визуальные мотивы.
    whyRepresentative: Сад, соломенная кровля и сельский дом соответствуют мотивам домашней пасторали.
