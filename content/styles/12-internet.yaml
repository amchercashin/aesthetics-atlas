- id: vaporwave
  name: Вейпорвейв
  orig: Vaporwave
  aliases: [vaporwave, вейпорвейв, вапорвейв, aesthetic, Ａｅｓｔｈｅｔｉｃ]
  start: 2011
  end: null
  dates: 2011 – наши дни
  era: internet
  domain: [internet, design]
  region: Интернет
  tier: 1
  kind: internet-aesthetic
  parents:
    - { id: early-cgi, type: revival }
    - { id: seapunk, type: influence, note: "Сцены пересекались в Tumblr 2011–2012 годов; что вейпорвейв вырос именно из сипанка, не установлено." }
    - { id: glitch-art, type: influence }
    - { id: classical-greece, type: revival }
  summary: >
    Ироничная ностальгия по потребительскому раю 80–90-х: античные бюсты, розово-бирюзовые
    градиенты, Windows 95, японские иероглифы и пальмы.
  description: |
    Вейпорвейв появился как микрожанр электронной музыки — замедленные корпоративные мелодии
    и поп-хиты — и сразу получил узнаваемый визуальный язык. Альбом Macintosh Plus «Floral Shoppe»
    (2011) с бюстом Гелиоса на фоне шахматного пола стал его иконой.

    Это одновременно пародия на поздний капитализм и тоска по будущему, которое обещали
    торговые центры и ранние компьютеры. С ним часто путают синтвейв, но это отдельная сцена
    со своей историей: синтвейв ностальгирует по 80-м всерьёз, вейпорвейв — с иронией.
  traits:
    - Розово-бирюзовые и фиолетовые градиенты
    - Античные бюсты, пальмы, дельфины, шахматный пол
    - Интерфейсы Windows 95 и низкополигональная 3D-графика
    - Японская катакана, широкие ｓｐａｃｅｄ буквы
    - Глитч, VHS-шум, корпоративная эстетика 80–90-х
  names: [Macintosh Plus (Vektroid), James Ferraro, Daniel Lopatin, Saint Pepsi]
  example:
    file: "enwiki:Macintosh Plus - Floral Shoppe album cover.jpg"
    title: Обложка альбома «Floral Shoppe»
    author: Macintosh Plus (Vektroid)
    year: 2011
  gallery:
    - { file: "Vaporwave art example.png", title: "Пример вейпорвейв-коллажа", year: "2010-е" }
  wiki: Vaporwave
  links:
    - { title: "Vaporwave", url: "https://aesthetics.fandom.com/wiki/Vaporwave", src: "Aesthetics Wiki", lang: en }

- id: synthwave
  name: Синтвейв (аутран)
  orig: Synthwave / Outrun
  aliases: [synthwave, outrun, ретровейв, retrowave, неоновый закат]
  start: 2008
  end: null
  dates: 2008 – наши дни
  era: internet
  domain: [internet, design]
  region: Франция, интернет
  tier: 2
  kind: internet-aesthetic
  parents:
    - { id: early-cgi, type: revival }
    - { id: cyberpunk, type: influence }
  summary: >
    Неоновый закат над бесконечной сеткой, хромированные буквы и спортивная машина: 80-е, какими их помнит VHS.
  description: |
    Французские музыканты Kavinsky и College, а затем фильм «Драйв» (2011) вернули звук синтезаторов 80-х,
    а с ним — визуальный набор: сетка-горизонт, полосатое солнце, неон, пальмы, хром и спортивные машины
    в стиле игры OutRun. В отличие от ироничного вейпорвейва, синтвейв ностальгирует всерьёз и стал
    массовой эстетикой обложек, постеров и игр.
  traits:
    - Неоновые розовый, фиолетовый, бирюзовый
    - Сетка-горизонт и полосатое закатное солнце
    - Хромированные надписи с бликом
    - Машины, пальмы, ночной город
  names: [Kavinsky, College, Perturbator, «Драйв», «Хотлайн Майами»]
  example:
    file: Synthwave cyberspace sunset (low res).jpg
    title: Закат в киберпространстве
    author: G. Casqueiro
  wiki: Synthwave
  links:
    - { title: "Synthwave", url: "https://aesthetics.fandom.com/wiki/Synthwave", src: "Aesthetics Wiki", lang: en }

- id: corporate-memphis
  name: Корпоративный Мемфис
  orig: Corporate Memphis
  aliases: [corporate memphis, Alegria, плоские человечки, «стиль Фейсбука»]
