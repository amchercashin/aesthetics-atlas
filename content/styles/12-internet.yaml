- id: vaporwave
  name: Вейпорвейв
  orig: Vaporwave
  aliases: [vaporwave, вейпорвейв, вапорвейв, aesthetic, Ａｅｓｔｈｅｔｉｃ]
  start: 2011
  end: null
  dates: 2011 – наши дни
  era: internet
  domain: [internet, design]
  region: Интернет
  tier: 1
  parents:
    - { id: early-cgi, type: revival }
    - { id: seapunk, type: evolved }
    - { id: glitch-art, type: influence }
    - { id: classical-greece, type: revival }
  summary: >
    Ироничная ностальгия по потребительскому раю 80–90-х: античные бюсты, розово-бирюзовые
    градиенты, Windows 95, японские иероглифы и пальмы.
  description: |
    Вейпорвейв появился как микрожанр электронной музыки — замедленные корпоративные мелодии
    и поп-хиты — и сразу получил узнаваемый визуальный язык. Альбом Macintosh Plus «Floral Shoppe»
    (2011) с бюстом Гелиоса на фоне шахматного пола стал его иконой.

    Это одновременно пародия на поздний капитализм и тоска по будущему, которое обещали
    торговые центры и ранние компьютеры. Вейпорвейв породил целое семейство эстетик —
    от синтвейва до liminal space.
  traits:
    - Розово-бирюзовые и фиолетовые градиенты
    - Античные бюсты, пальмы, дельфины, шахматный пол
    - Интерфейсы Windows 95 и низкополигональная 3D-графика
    - Японская катакана, широкие ｓｐａｃｅｄ буквы
    - Глитч, VHS-шум, корпоративная эстетика 80–90-х
  names: [Macintosh Plus (Vektroid), James Ferraro, Daniel Lopatin, Saint Pepsi]
  example:
    file: "enwiki:Macintosh Plus - Floral Shoppe album cover.jpg"
    title: Обложка альбома «Floral Shoppe»
    author: Macintosh Plus (Vektroid)
    year: 2011
  gallery:
    - { file: "Vaporwave art example.png", title: "Пример вейпорвейв-коллажа", year: "2010-е" }
  wiki: Vaporwave
  links:
    - { title: "Vaporwave", url: "https://aesthetics.fandom.com/wiki/Vaporwave", src: "Aesthetics Wiki", lang: en }

- id: synthwave
  name: Синтвейв (аутран)
  orig: Synthwave / Outrun
  aliases: [synthwave, outrun, ретровейв, retrowave, неоновый закат]
  start: 2008
  end: null
  dates: 2008 – наши дни
  era: internet
  domain: [internet, design]
  region: Франция, интернет
  tier: 2
  parents:
    - { id: early-cgi, type: revival }
    - { id: cyberpunk, type: influence }
  summary: >
    Неоновый закат над бесконечной сеткой, хромированные буквы и спортивная машина: 80-е, какими их помнит VHS.
  description: |
    Французские музыканты Kavinsky и College, а затем фильм «Драйв» (2011) вернули звук синтезаторов 80-х,
    а с ним — визуальный набор: сетка-горизонт, полосатое солнце, неон, пальмы, хром и спортивные машины
    в стиле игры OutRun. В отличие от ироничного вейпорвейва, синтвейв ностальгирует всерьёз и стал
    массовой эстетикой обложек, постеров и игр.
  traits:
    - Неоновые розовый, фиолетовый, бирюзовый
    - Сетка-горизонт и полосатое закатное солнце
    - Хромированные надписи с бликом
    - Машины, пальмы, ночной город
  names: [Kavinsky, College, Perturbator, «Драйв», «Хотлайн Майами»]
  example:
    file: Synthwave cyberspace sunset (low res).jpg
    title: Закат в киберпространстве
    author: G. Casqueiro
  wiki: Synthwave
  links:
    - { title: "Synthwave", url: "https://aesthetics.fandom.com/wiki/Synthwave", src: "Aesthetics Wiki", lang: en }

- id: corporate-memphis
  name: Корпоративный Мемфис
  orig: Corporate Memphis
  aliases: [corporate memphis, Alegria, плоские человечки, «стиль Фейсбука»]
  start: 2017
  end: null
  dates: 2017 – наши дни
  era: internet
  domain: [design]
  region: Кремниевая долина, весь мир
  tier: 2
  parents:
    - { id: flat-design, type: evolved }
    - { id: memphis-design, type: revival }
  summary: >
    Плоские человечки с крошечными головами и длинными фиолетовыми руками на сайтах всех стартапов мира.
  description: |
    В 2017 году студия Buck создала для Facebook иллюстративный стиль Alegria: плоские фигуры с непропорционально
    длинными конечностями, маленькими головами и нереальными цветами кожи — нарочито нейтральные и
    «инклюзивные». Стиль мгновенно разошёлся по корпоративным сайтам, приложениям и госуслугам, а затем
    стал объектом насмешек как символ безликого техно-оптимизма.
  traits:
    - Плоские фигуры с длинными конечностями
    - Маленькие головы, условные цвета кожи
    - Яркие пастельные фоны и геометрия
    - Бодрый, обезличенный оптимизм
  names: [Buck (Alegria), Humaaans, Slack, Airbnb]
  example:
    file: Corporate Memphis (2019).png
    title: Иллюстрация в стиле корпоративного Мемфиса
    author: Katharina Brenner
    year: 2019
  wiki: Corporate Memphis
  links:
    - { title: "Corporate Memphis", url: "https://aesthetics.fandom.com/wiki/Corporate_Memphis", src: "Aesthetics Wiki", lang: en }

- id: cottagecore
  name: Коттеджкор
  orig: Cottagecore
  aliases: [cottagecore, деревенский уют, пастораль]
  start: 2018
  end: null
  dates: 2018 – наши дни
  era: internet
  domain: [internet, design]
  region: Tumblr, TikTok
  tier: 2
  parents:
    - { id: arts-and-crafts, type: revival }
    - { id: romanticism, type: influence }
  summary: >
    Идиллия сельской жизни: домашний хлеб, полевые цветы, льняные платья и коттедж с соломенной крышей.
  description: |
    Коттеджкор вырос на Tumblr и расцвёл в TikTok во время локдауна 2020 года: мечта о простой жизни
    на природе — выпечка, сад, вышивка, грибы и цветы. Это современная версия пасторали и романтической
    тоски по деревне, а по духу — наследник движения искусств и ремёсел с его ручным трудом
    и цветочными узорами.
  traits:
    - Природа, цветы, сад, выпечка
    - Лён, кружево, винтажные платья
    - Тёплый мягкий свет, пастельно-землистая палитра
    - Ручной труд и домашний уют
  names: [Тейлор Свифт («folklore»), Animal Crossing]
  example:
    file: Anne Hathaways Cottage 1 (5662418953).jpg
    title: Коттедж Энн Хэтэуэй
    place: Стратфорд-апон-Эйвон, Англия
  wiki: Cottagecore
  links:
    - { title: "Cottagecore", url: "https://aesthetics.fandom.com/wiki/Cottagecore", src: "Aesthetics Wiki", lang: en }

- id: dark-academia
  name: Дарк-академия
  orig: Dark academia
  aliases: [dark academia, тёмная академия, «Тайная история»]
  start: 2015
  end: null
  dates: 2015 – наши дни
  era: internet
  domain: [internet, design]
