- id: liminal-space
  name: Лиминальные пространства
  orig: Liminal space
  aliases: [liminal space, лиминальность, лиминальное пространство]
  searchKeywords: [Закулисье, Backrooms, пустые коридоры, Kane Pixels]
  start: 2019
  end: null
  dates: 2019 – наши дни
  dateKind: popularity
  dateNote: 2019 — тред на 4chan, из которого выросло «Закулисье»; фотографии пустых пространств, конечно, существовали и раньше.
  era: internet
  domain: [internet]
  medium: [photography, digital-art]
  region: Интернет
  tier: 1
  kind: internet-aesthetic
  origin: unknown
  parents: []
  compare:
    - { id: metaphysical-painting, note: "Пустые площади, косой свет и тревожная тишина. Это визуальная аналогия; историческое влияние де Кирико на интернет-эстетику не подтверждено." }
    - { id: vaporwave, note: "Пустые торговые центры и коммерческие интерьеры 80–90-х как предмет ностальгии. Пересечение мотивов, а не установленное происхождение." }
  summary: >
    Пустые коридоры, торговые центры ночью и бассейны без людей: места «между», которые кажутся знакомыми и чужими.
  description: |
    В мае 2019 года на доске /x/ форума 4chan попросили выложить картинки, от которых «не по себе». Одним
    из ответов стало фото пустого офиса с жёлтыми стенами и лампами дневного света; позже анонимный
    комментарий назвал это место «Закулисьем» (Backrooms). Вокруг таких снимков сложилась эстетика
    «лиминальных пространств» — коридоров отелей, пустых школ, парковок, бассейнов. Эффект — тревожная
    ностальгия и ощущение сна.

    Пустые площади де Кирико и пустые торговые центры вейпорвейва позволяют сопоставить эти изображения.
    Это визуальные аналогии; историческое влияние требует отдельного подтверждения.
  traits:
    - Пустые транзитные пространства — коридоры, холлы, бассейны
    - Флуоресцентный свет, ковролин, жёлтые стены
    - Отсутствие людей и ощущение «застывшего времени»
    - Любительская фотография среднего качества
  names: [Закулисье (Backrooms), Kane Pixels]
  evidence:
    - { claim: "Май 2019: тред на /x/ 4chan, фото пустого офиса с жёлтыми стенами, позже названное «the Backrooms»", field: dates, source: vice-backrooms-2022 }
  review: { status: partial, date: 2026-10-13, note: "Сверены дата и история «Закулисья»; генеалогические связи заменены сопоставлениями. Происхождение самой эстетики не установлено." }
