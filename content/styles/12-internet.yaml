  description: |
    Вейпорвейв — интернет-микрожанр, эстетика и мем начала 2010-х годов, основанный на замедленных семплах лёгкого джаза, лифтовой музыки и R&B 1980–1990-х.
    Он вырос как ироничный вариант чилвейва; среди пионеров называют Джеймса Ферраро, Дэниела Лопатина и Рамону Лэнгли. Альбом Macintosh Plus «Floral Shoppe» (2011) задал образец жанра.
    Вокруг него сложилось двусмысленное или сатирическое отношение к потребительскому капитализму и ностальгия по развлечениям, цифровым технологиям и рекламе.
  traits:
