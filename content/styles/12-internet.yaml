- id: dreamcore
  name: Дримкор
  orig: Dreamcore
  aliases: [dreamcore, дримкор, сновидческая эстетика]
  start: 2020
  end: null
  dates: 2020-е – наши дни
  era: internet
  domain: [internet]
  region: Интернет
  tier: 2
  kind: internet-aesthetic
  parents:
    - id: weirdcore
      type: evolved
      status: unverified
      note: >-
        Открытый вопрос: пересечение образов и сообществ не устанавливает момент отделения dreamcore от
        weirdcore или направление происхождения.
    - id: surrealism
      type: influence
      status: unverified
      note: >-
        Видна визуальная параллель с сюрреалистическими приёмами; документированное влияние исторического
        движения на эту интернет-сцену пока не установлено.
  summary: >-
    Сновидческие коллажи: знакомые пространства становятся невозможными, вызывая ностальгию, удивление или
    тревогу.
  description: >
    Дримкор объединяет изображения, напоминающие логику сна: несоединимые пространства, облака в комнате,
    двери в небе и знакомые предметы в странном окружении. Палитра может быть мягкой, но настроение не
    ограничено спокойствием — встречаются тревога и дезориентация.


    Границы с уирдкором и лиминальными пространствами размыты. Точная дата «отделения» от уирдкора не
    подтверждена; сходство с сюрреалистическими приёмами само по себе не доказывает исторического влияния
    движения.
  traits:
