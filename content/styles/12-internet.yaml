- id: glassmorphism
  name: Глассморфизм
  orig: Glassmorphism
  aliases: [glassmorphism, неоморфизм, neumorphism, Liquid Glass, матовое стекло]
  start: 2020
  end: null
  dates: 2020 – наши дни
  era: internet
  domain: [design, internet]
  region: Весь мир
  tier: 3
  parents:
    - { id: material-design, type: evolved }
    - { id: frutiger-aero, type: revival }
    - { id: skeuomorphism, type: revival }
  summary: >
    Полупрозрачные панели матового стекла над размытыми цветными пятнами: объём возвращается в плоский интерфейс.
  description: |
    В 2020 году дизайнеры на Dribbble увлеклись неоморфизмом — мягкими выпуклыми кнопками — и глассморфизмом:
    панелями, похожими на матовое стекло, через которые просвечивают яркие градиенты. Эффект размытия фона
    вошёл в macOS Big Sur и Windows 11, а в 2025 году Apple сделала «жидкое стекло» (Liquid Glass) основой
    всех своих систем. Это тихое возвращение Frutiger Aero и скевоморфизма.
  traits:
    - Матовое стекло, размытие фона
    - Яркие цветные пятна и градиенты позади
    - Тонкие светлые обводки и мягкие тени
    - Объём без текстур
  names: [macOS Big Sur, Windows 11 (Fluent), Apple Liquid Glass]
  example:
    file: Glassmorphism ejemplo.jpg
    title: Пример глассморфизма
    author: CarlosEduardoPA
  wiki: Glassmorphism
  links:
    - { title: "Glassmorphism", url: "https://aesthetics.fandom.com/wiki/Glassmorphism", src: "Aesthetics Wiki", lang: en }

- id: solarpunk
  name: Соларпанк
  orig: Solarpunk
  aliases: [solarpunk, соларпанк, зелёное будущее, экоутопия]
  start: 2014
  end: null
  dates: 2014 – наши дни
  era: internet
  domain: [internet, art, architecture]
  region: Интернет
  tier: 2
  parents:
    - { id: art-nouveau, type: revival }
    - { id: afrofuturism, type: influence }
    - { id: cyberpunk, type: reaction }
  summary: >
    Оптимистичная противоположность киберпанку: солнечные панели, сады на небоскрёбах и модерн из зелени.
  description: |
    Соларпанк возник в Tumblr около 2014 года как ответ на мрачные антиутопии: что, если будущее будет
    светлым, зелёным и справедливым? Его образы — города, заросшие садами, солнечные батареи и ветряки,
    витражи и формы ар-нуво, ремонт вместо потребления. В 2020-х эстетика стала знаменем климатического
    оптимизма в архитектуре и иллюстрации.
  traits:
    - Зелень на зданиях, вертикальные сады
    - Солнечные панели, ветряки, витражи
    - Плавные формы в духе ар-нуво
    - Тёплый свет, белый, зелёный и золотой
  names: [Hayao Miyazaki (вдохновение), Vincent Callebaut, Stefano Boeri]
  example:
    file: Berlin Friedrichstraße Utopia 2048 small file.jpg
    title: Фридрихштрассе в 2048 году (визуализация)
    author: Aerroscape & Lino Zeddies
  wiki: Solarpunk
  links:
    - { title: "Solarpunk", url: "https://aesthetics.fandom.com/wiki/Solarpunk", src: "Aesthetics Wiki", lang: en }

