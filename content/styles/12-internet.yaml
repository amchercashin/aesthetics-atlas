  summary: >
    Романтика старых университетов: готические галереи, библиотеки, твид, свечи и греческая поэзия.
  description: |
    Эстетика выросла из поклонников романа Донны Тартт «Тайная история» и фильма «Общество мёртвых поэтов»:
    культ классического образования, старых библиотек и готических кампусов Оксфорда и Кембриджа.
    Тёмные деревянные интерьеры, твидовые пиджаки, свечи, книги и чуть меланхолии — в TikTok во время
    пандемии она стала массовой.
  traits:
    - Готические кампусы и старые библиотеки
    - Тёмное дерево, кожа, твид, свечи
    - Коричнево-оливковая, чернильная палитра
    - Классическая литература и меланхолия
  names: [Донна Тартт, «Общество мёртвых поэтов», Оксфорд]
