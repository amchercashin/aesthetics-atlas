- id: dreamcore
  name: Дримкор
  orig: Dreamcore
  aliases: [dreamcore, дримкор, сновидческая эстетика]
  start: 2020
  end: null
  dates: 2020 – наши дни
  era: internet
  domain: [internet]
  region: Интернет
  tier: 2
  parents:
    - { id: weirdcore, type: evolved }
    - { id: surrealism, type: influence }
  summary: >
    Мягкая версия уирдкора: облака, пастельные поля, двери в небе и тихое ощущение сна наяву.
  description: |
    Дримкор отделился от уирдкора в 2020–2021 годах в TikTok. Здесь те же любительские снимки и коллажи,
    но вместо угрозы — нежность и меланхолия: бесконечные лестницы, облака в комнате, поля, пастельный свет
    и надписи о детстве. Это интернет-сюрреализм: сон, который снится сразу миллионам.
  traits:
    - Пастельные, мягкие тона
    - Облака, небо, поля, вода
    - Невозможные пространства и двери в никуда
    - Ностальгия и спокойная меланхолия
  names: []
