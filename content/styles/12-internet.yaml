- id: liminal-space
  name: Лиминальные пространства
  orig: Liminal space
  aliases: [liminal space, лиминальность, Закулисье, Backrooms, пустые коридоры]
  start: 2019
  end: null
  dates: 2019 – наши дни
  era: internet
  domain: [internet]
  region: Интернет
  tier: 1
  parents:
    - { id: vaporwave, type: evolved }
    - { id: metaphysical-painting, type: influence }
  summary: >
    Пустые коридоры, торговые центры ночью и бассейны без людей: места «между», которые кажутся знакомыми и чужими.
  description: |
    В 2019 году на 4chan появились «Закулисье» (Backrooms) — фото пустого офиса с жёлтыми обоями и гудящими
    лампами, а Twitter-аккаунты стали собирать «лиминальные пространства»: коридоры отелей, пустые
    школы, парковки. Эффект — тревожная ностальгия и ощущение сна. Это прямой наследник пустых площадей
    де Кирико и пустых торговых центров вейпорвейва.
  traits:
    - Пустые транзитные пространства — коридоры, холлы, бассейны
    - Флуоресцентный свет, ковролин, жёлтые стены
    - Отсутствие людей и ощущение «застывшего времени»
    - Любительская фотография среднего качества
  names: [Закулисье (Backrooms), Kane Pixels]
  example:
    file: Disney’s Contemporary Liminal Hallway.jpg
    title: Коридор отеля
    year: 2020-е
  gallery:
    - { file: "Corridor Stanley Hotel Estes Park Colorado 2024.jpg", title: "Коридор отеля «Стэнли»", year: "2024" }
  wiki: { en: Liminal space (aesthetic), ru: Лиминальное пространство }
  links:
    - { title: "Liminal Space", url: "https://aesthetics.fandom.com/wiki/Liminal_Space", src: "Aesthetics Wiki", lang: en }

- id: weirdcore
  name: Уирдкор
  orig: Weirdcore
  aliases: [weirdcore, вирдкор, уиердкор]
  start: 2019
  end: null
  dates: 2019 – наши дни
  era: internet
  domain: [internet]
  region: Интернет
  tier: 1
  parents:
    - { id: liminal-space, type: evolved }
    - { id: web-1-0, type: revival }
    - { id: surrealism, type: influence }
  summary: >
    Тревожные «воспоминания, которых не было»: пустые комнаты, шумные фото низкого качества,
    глаза в небе и подписи вроде «ты здесь уже был».
  description: |
    Уирдкор складывается из любительских снимков с плохой камеры, грубых коллажей в стиле
    ранних редакторов и коротких фраз, обращённых прямо к зрителю. Он играет с чувством
    дезориентации и ложной памяти и близок к dreamcore и liminal space, но жёстче и тревожнее.
  traits:
    - Низкое качество, шум и пересвет старых камер
    - Пустые интерьеры, детские площадки, бассейны
    - Глаза, смайлики, радуги и облака как вставки
    - Короткие тревожные подписи пиксельным шрифтом
    - Ощущение ложного воспоминания
  names: []
  example:
    file: Weirdcore 862761.jpg
    title: Пример уирдкор-изображения
    year: 2020-е
  wiki: Weirdcore
  links:
    - { title: "Weirdcore", url: "https://aesthetics.fandom.com/wiki/Weirdcore", src: "Aesthetics Wiki", lang: en }
