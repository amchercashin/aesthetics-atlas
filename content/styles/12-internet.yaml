  summary: >
    Детство 90-х и нулевых как эстетика: основные цвета, наклейки, мелки, детские передачи и бусины.
  description: |
    Кидкор собирает образы детских комнат и телевизора 90-х: основные цвета, радуги, смайлики, мелки,
