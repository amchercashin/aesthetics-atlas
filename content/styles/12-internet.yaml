  summary: >
    Плоские человечки с крошечными головами и длинными фиолетовыми руками на сайтах всех стартапов мира.
  description: |
    В 2017 году студия Buck создала для Facebook иллюстративный стиль Alegria: плоские фигуры с непропорционально
    длинными конечностями, маленькими головами и нереальными цветами кожи — нарочито нейтральные и
    «инклюзивные». Стиль мгновенно разошёлся по корпоративным сайтам, приложениям и госуслугам, а затем
    стал объектом насмешек как символ безликого техно-оптимизма.
  traits:
    - Плоские фигуры с длинными конечностями
    - Маленькие головы, условные цвета кожи
    - Яркие пастельные фоны и геометрия
    - Бодрый, обезличенный оптимизм
