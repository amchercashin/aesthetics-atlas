- id: ai-aesthetic
  name: Нейросетевая эстетика
  orig: AI art aesthetic
  aliases: [AI-арт, ИИ-арт, AI art]
  searchKeywords: [нейросети, DeepDream, GAN, Midjourney, Stable Diffusion, DALL·E, генеративное искусство]
  scopeNote: >
    Не стиль, а метод: изображения, созданные генеративными моделями. Карточка описывает узнаваемые
    визуальные клише моделей 2015–2026 годов. Генеративное и компьютерное искусство в целом (с 1960-х)
    шире — см. «Компьютерное искусство».
  start: 2015
  end: null
  dates: 2015 – наши дни
  era: internet
  domain: [internet, art]
  region: Весь мир
  tier: 1
  kind: [technique, trend]
  kindNote: "Это метод создания изображений, а не единый стиль; карточка описывает узнаваемые визуальные клише генеративных моделей."
  parents:
    - { id: computer-art, type: evolved }
    - { id: glitch-art, type: influence }
    - { id: surrealism, type: influence }
  summary: >
    От психоделических собачьих морд DeepDream до гладких «идеальных» картинок Midjourney: визуальный язык машин.
  description: |
    В 2015 году DeepDream от Google превратил фотографии в галлюцинации из глаз и собачьих морд. Затем
    генеративно-состязательные сети дали размытые портреты: «Эдмон де Белами» от коллектива Obvious ушёл
    с аукциона Christie's за 432 тысячи долларов. С 2022 года диффузионные модели — DALL·E, Midjourney,
    Stable Diffusion — сделали генерацию массовой, а её узнаваемый глянец, сияние и «слишком идеальные» детали
    стали отдельной, спорной эстетикой эпохи.
  traits:
    - Сюрреалистичные, «галлюцинаторные» детали
    - Гладкий глянец и мягкое кинематографичное сияние
    - Смешение стилей и эпох по запросу
    - Странные ошибки — пальцы, тексты, перетекающие формы
  names: [DeepDream, Obvious, Refik Anadol, Midjourney, Stable Diffusion]
  example:
