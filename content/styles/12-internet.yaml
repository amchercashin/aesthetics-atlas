      year: 2026
      whyRepresentative: >-
        Детская площадка на зелёном холме под пустым небом выглядит одновременно приветливо и странно.
  summary: >-
    Сновидческие коллажи: знакомые пространства становятся невозможными, вызывая ностальгию, удивление или
    тревогу.
  description: >
    Дримкор — сюрреалистическая интернет-эстетика, ставшая популярной в начале и середине 2020-х годов. Она соединяет знакомое и сновидческое: облака, длинные коридоры, оптические иллюзии,
    смутно узнаваемые старые места. Настроение может быть уютным, жутким или тревожным.


    Точное происхождение неясно. Границы с уирдкором и лиминальными пространствами размыты; сходство с сюрреалистическими приёмами само по себе не доказывает исторического влияния
    движения.
