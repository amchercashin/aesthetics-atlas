    Коттеджкор вырос на Tumblr и расцвёл в TikTok во время локдауна 2020 года: мечта о простой жизни
    на природе — выпечка, сад, вышивка, грибы и цветы. Это современная версия пасторали и романтической
    тоски по деревне, а по духу — наследник движения искусств и ремёсел с его ручным трудом
    и цветочными узорами.
