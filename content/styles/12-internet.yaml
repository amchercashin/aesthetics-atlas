- id: glassmorphism
  name: Глассморфизм
  orig: Glassmorphism
  aliases: [glassmorphism, матовое стекло, frosted glass]
  searchKeywords: [неоморфизм, neumorphism, Liquid Glass, Acrylic, Fluent Design]
  start: 2020
  end: null
  dates: ок. 2020 – наши дни
  dateKind: popularity
  approx: true
  dateNote: Около 2020 года — всплеск на дизайнерских платформах. Системные полупрозрачные материалы (Microsoft Acrylic, Apple Liquid Glass) — отдельная линия со своими датами.
  era: internet
  domain: [design, internet]
  medium: [ui]
  region: Весь мир
  tier: 3
  kind: [design-system, trend]
  kindNote: "Приём интерфейсного дизайна и тренд дизайнерских платформ; системные материалы Apple и Microsoft — родственные, но самостоятельные решения."
  scopeNote: >
    Полупрозрачные «стеклянные» панели с размытием фона. Не путать с неоморфизмом: там элемент выдавлен
    из того же материала, что и фон, светлой и тёмной тенями, без прозрачности. Apple Liquid Glass
    и Microsoft Acrylic — системные материалы из этого семейства, а не синонимы термина.
  parents:
    - { id: material-design, type: influence, note: "Слои с глубиной и тенями Material Design — контекст, в котором появились «стеклянные» панели; прямая связь не установлена." }
  compare:
    - { id: frutiger-aero, note: "Глянец, стекло и прозрачность интерфейсов 2000-х. Сходство материала, а не доказанное возрождение." }
    - { id: skeuomorphism, note: "Интерес к физическому материалу в интерфейсе — но без имитации кожи и дерева." }
  summary: >
    Полупрозрачные панели матового стекла над размытыми цветными пятнами: объём возвращается в плоский интерфейс.
  description: |
    Около 2020 года на Dribbble и в дизайнерских блогах обсуждали сразу два приёма. Неоморфизм — мягкие
    кнопки, будто выдавленные из фона. Глассморфизм — панели, похожие на матовое стекло, сквозь которые
    просвечивают яркие градиенты.

    Полупрозрачные материалы с размытием есть и в операционных системах: Microsoft описывает Acrylic
    из Fluent Design как полупрозрачную текстуру с размытием и шумом, а в июне 2025 года Apple представила
    Liquid Glass — материал, который отражает и преломляет окружение, сразу для всех своих платформ.
    С Frutiger Aero глассморфизм часто сравнивают: это сходство материала, а не доказанная преемственность.
  traits:
    - Матовое стекло, размытие фона
    - Яркие цветные пятна и градиенты позади
    - Тонкие светлые обводки и мягкие тени
    - Объём без текстур
  names: [Microsoft Fluent (Acrylic), Apple Liquid Glass]
  evidence:
    - { claim: "Неоморфизм — выпуклая форма из того же материала, что и фон (а не панель над ним)", field: scope, source: hype4-neumorphism }
    - { claim: "Acrylic — полупрозрачная текстура Fluent Design: прозрачность, размытие, шум, тонирование", field: description, source: ms-acrylic }
    - { claim: "Liquid Glass (июнь 2025) — полупрозрачный материал, отражает и преломляет окружение; iOS, iPadOS, macOS, watchOS, tvOS 26", field: description, source: apple-liquid-glass-2025 }
  review: { status: partial, date: 2026-10-13, note: "Разделены термины и поисковые слова, сверены системные материалы. Дата «около 2020» и связь с Material Design не подтверждены источниками." }
  example:
