    Интернет-эстетика пустых переходных мест: коридоров, лестниц, лобби, стоянок, закрытых торговых центров. Без людей привычное место кажется странным и может вызывать ностальгию, грусть, покой или тревогу.
    В мае 2019 года на доске /x/ форума 4chan попросили выложить картинки, от которых «не по себе»; одним из ответов стало фото пустого офиса с жёлтыми стенами, позже названное «Закулисьем» (Backrooms).
    Интерес вырос в пандемию, когда пустые общественные места стали обычным зрелищем.
  traits:
    - Пустые транзитные пространства — коридоры, холлы, бассейны
    - Флуоресцентный свет, ковролин, жёлтые стены
    - Отсутствие людей и ощущение «застывшего времени»
    - Любительская фотография среднего качества
