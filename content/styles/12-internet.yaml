- id: solarpunk
  name: Соларпанк
  orig: Solarpunk
  aliases: [solarpunk, соларпанк]
  searchKeywords: [зелёное будущее, экоутопия, Миядзаки, Винсент Каллебо, Стефано Боэри]
  start: 2014
  end: null
  dates: 2014 – наши дни (слово — с 2008)
  dateKind: practice
  dateNote: С 2014 года — визуальная эстетика в Tumblr; слово появилось раньше как название литературного жанра.
  termAttested: { year: 2008, source: rotb-solarpunk-2008, note: "Употребление к маю 2008 года подтверждено; что это первое употребление — нет." }
  era: internet
  domain: [internet, art, architecture]
  medium: [illustration, architecture, digital-art]
  region: Интернет
  tier: 2
  kind: [internet-aesthetic, movement]
  kindNote: "Одновременно жанр фантастики, визуальная эстетика и социальное движение."
  parents:
    - { id: art-nouveau, type: revival, status: verified, sources: [flynn-solarpunk-2014], note: "Флинн (2014) пишет, что визуальный образ задал пост в Tumblr с соларпанком «в эстетике ар-нуво и эдвардианского сада»." }
    - { id: afrofuturism, type: influence }
    - { id: cyberpunk, type: reaction, status: verified, sources: [flynn-solarpunk-2014], note: "Флинн прямо противопоставляет соларпанк «нигилистическому» киберпанку." }
  summary: >
    Оптимистичная противоположность киберпанку: солнечные панели, сады на небоскрёбах и модерн из зелени.
  description: |
    Слово «solarpunk» встречается уже в мае 2008 года — в блоге Republic of the Bees как название
    возможного литературного жанра о будущем на возобновляемой энергии. Визуальная эстетика сложилась
    позже: в сентябре 2014 года Адам Флинн писал, что Tumblr «загорелся» от поста художницы Olivia
    с соларпанком в духе ар-нуво и эдвардианского сада, и называл визуальный язык открытым и развивающимся.

    Его образы — города, заросшие садами, солнечные батареи и ветряки, витражи и плавные формы ар-нуво,
    ремонт вместо потребления. Соларпанк сознательно отвечает мрачным антиутопиям: что, если будущее
    будет светлым, зелёным и справедливым?
  traits:
    - Зелень на зданиях, вертикальные сады
    - Солнечные панели, ветряки, витражи
    - Плавные формы в духе ар-нуво
    - Тёплый свет, белый, зелёный и золотой
  names: [Olivia (Land of Masks and Jewels), Адам Флинн]
  evidence:
    - { claim: "Слово «solarpunk» употреблено в мае 2008 года как название литературного жанра", field: termAttested, source: rotb-solarpunk-2008 }
    - { claim: "Сентябрь 2014: пост в Tumblr с соларпанком в эстетике ар-нуво; визуальный язык «открытый и развивающийся»", field: dates, source: flynn-solarpunk-2014 }
  review: { status: partial, date: 2026-10-13, note: "Разделены история слова (2008) и визуальной сцены (2014); связи с ар-нуво и киберпанком подтверждены текстом 2014 года. Влияние афрофутуризма не проверено." }
  example:
    file: Berlin Friedrichstraße Utopia 2048 small file.jpg
    title: Фридрихштрассе в 2048 году (визуализация)
    author: Aerroscape & Lino Zeddies
    role: illustration
    whyRepresentative: Современная архитектурная визуализация с садами на фасадах и солнечными панелями — типичный образ соларпанка, а не историческое произведение.
  wiki: Solarpunk
  links:
    - { title: "Solarpunk", url: "https://aesthetics.fandom.com/wiki/Solarpunk", src: "Aesthetics Wiki", lang: en }
    - { title: "Solarpunk: Notes toward a manifesto (2014)", url: "https://web.archive.org/web/20150628114055/http://hieroglyph.asu.edu/2014/09/solarpunk-notes-toward-a-manifesto/", src: "Project Hieroglyph, архив", lang: en }
