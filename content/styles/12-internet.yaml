  description: |
    Музыкальный микрожанр, основанный на саундтреках фильмов 1970–1980-х годов; среди первых его представителей — французы Kavinsky и College. Шире он стал известен после фильма «Драйв» (2011) и игры Hotline Miami (2012).
    Слово outrun, от аркады 1986 года, стали применять и к ретроэстетике 1980-х вообще: магентовому неону, линиям сетки, следам видеокассеты.
