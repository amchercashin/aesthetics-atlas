    нотой — отсюда близость к уирдкору и dreamcore, которые используют те же детские мотивы.
  traits:
    - Основные цвета — красный, жёлтый, синий
    - Радуги, смайлики, звёзды, наклейки
    - Игрушки, мелки, пластик, бусины
    - Детская «наивная» графика
