      reference: https://printsandprintmaking.gov.au/works/5018/
      title: Aralpaia Ar Zenikula, 1998
      author: Alick Tipoti
      credit: Australian Prints + Printmaking / National Gallery of Australia
      license: © Alick Tipoti
      nonfree: true
      whyRepresentative: Плотный линогравюрный узор с фигурами, лодкой и морскими мотивами.
  summary: >-
    Современная региональная печатная графика связывает сильный контраст, подробный линейный рисунок,
    рассказы и новые предметные мотивы; художники сохраняют собственные системы формы.
  description: >-
    Обзор объединяет три листа трёх художников. Он помогает увидеть современную печатную сцену Торресова
    пролива, не подменяя её искусством аборигенов материковой Австралии и не объявляя все островные
    культуры одинаковыми. QAGOMA связывает заметное развитие линогравюры и ксилографии с 1990-ми;
    выбранные предметы начинаются позже.


    У Типоти крупная фигура погружена в плотный орнаментальный рисунок. У Мисси горизонтальная
    композиция и ручной цвет иначе распределяют внимание. У Робинсона современный предметный мир входит
    в сложное графическое поле. Различие этих решений и есть основание для обзора рядом с
