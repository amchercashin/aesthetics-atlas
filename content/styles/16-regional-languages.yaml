      author: Francesco Bini
      whyRepresentative: "Резной ларец для перьев: геометрический узор и скульптурная рукоять."
  summary: >-
    Резные панели и сосуды соединяют объём, линейные борозды, спирали и ракушечные вставки; значения и
    формы различаются по назначению и местной традиции.
  description: >-
    Whakairo — большое поле знаний и изготовления предметов, не один национальный орнамент. Этот обзор
    ограничен тремя деревянными вещами XIX века: сосудом waka huia, панелью с именем Титоковару и
    панелью Тене Вайтере. Различие именного резчика, неизвестного мастера и культурной принадлежности
    сохраняется.


    Корпус позволяет сравнить резьбу на округлом сосуде и на вертикальной панели. Частые борозды и
    насечки связываются с более крупными фигурами, а pāua выделяет глаза. Панель Вайтере вводит лица,
    показанные в разных положениях. Эти наблюдения не переносятся автоматически на резьбу по камню,
    кости или все художественные практики маори.
  traits:
    - Крупная фигура и мелкая резная поверхность работают в разном масштабе
    - Параллельные борозды, насечки и спиральные участки создают плотный ритм
    - Резьба учитывает объём сосуда или вертикаль панели
    - Вставки pāua выделяют глаза и контрастируют с деревом и краской
