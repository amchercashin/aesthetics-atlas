      note: Инсталляция, не работа с письмом; показана как контекст.
  summary: >-
    Знаки выглядят знакомым письмом, но меняют правила чтения: вымышленные иероглифы, английские слова в
    квадрате и слова как пространственные фигуры.
  description: >-
    Это авторский язык работы со зрительным доверием к письму. Книги и свитки Book from the Sky
    предлагают убедительный вид печатного текста без читаемого языка. В учебном классе Square Word
    Calligraphy английское слово, напротив, можно разобрать внутри формы, похожей на китайский знак. В
    Monkeys Grasp for the Moon письменные формы становятся звеньями подвесной скульптуры.


    Карточка не описывает китайскую каллиграфию вообще и не охватывает все проекты студии. Её отличие от
    обычной типографики — изменение самого отношения между знаком и чтением; от общего концептуального
    искусства — повторяемая работа с конкретной формой письма, книгой и телесным масштабом знака.
  traits:
    - Убедительная регулярность строк и квадратных знаков вызывает ожидание чтения
    - Зрительный облик знака расходится с его привычной языковой функцией
    - Книга, учебное упражнение и инсталляция превращают чтение в действие
    - Знак может выйти из плоскости и стать самостоятельной пространственной формой
