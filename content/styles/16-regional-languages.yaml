  summary: >-
    Графическая роспись деревянных прялок строится из рядов животных, узких орнаментальных поясов и
    тонких тёмных росчерков на тёплом поле дерева.
  description: >-
    Карточка посвящена историческим мезенским прялкам, а не всей современной сувенирной продукции с
    похожим орнаментом. Три предмета, включая одну опубликованную деталь, показывают, как высокая
    лопасть расчленяется на полосы: мелкие знаки и повторяющиеся животные образуют ритм по всей
    поверхности. Ограниченный колорит сочетается с очень разной плотностью письма.


    В отличие от золотисто-растительной Хохломы здесь важнее графический ряд и незакрашенное дерево. От
    городецких цветочных и жанровых композиций корпус отличается тонким линейным рисунком и более
    строгим поярусным устройством. Предположения о древних символах не превращены в доказанную
    генеалогию.
  traits:
    - Горизонтальные фризы с повторяющимися конями, оленями и птицами
    - Тёмные тонкие линии, штрихи и красно-коричневые акценты на поле дерева
    - Чередование геометрических поясов и более свободных фигурных рядов
    - Рисунок подчинён вытянутой лопасти и переходит на ножку прялки
