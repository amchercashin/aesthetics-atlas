      title: El Anatsui - Man's Cloth
      author: hahnchen
      whyRepresentative: Металлическая драпировка из переплетённых фрагментов.
  summary: >-
    Множество металлических фрагментов соединяется проволокой в гибкую поверхность, где цветовые полосы,
    разрывы и складки образуют изменяемую скульптуру.
  description: >-
    Три полотна 2006–2007 годов показывают авторскую систему модульной сборки. Металлические элементы
    сохраняют следы упаковки и повторяются как маленькие цветовые единицы. На расстоянии они
    складываются в полосы и большие поля; вблизи видны соединения и различия деталей. Развеска меняет
    складки и пространственный силуэт.


    Сходство с тканью является осмысленным контекстом, но сами работы не ткутся из нитей. Музейные
    тексты связывают их с кенте, в том числе традициями асанте и эве. От кенте корпус отличается
    материалом, свободной драпировкой и индивидуальной композицией; от общего ассамбляжа — устойчивой
    системой гибкого полотна и полосной сборки.
  traits:
    - Мелкие металлические элементы соединены гибкими проволочными связями
    - Различия цвета деталей складываются в крупные полосы, сетки и поля
    - Складки и свободный край делают поверхность пространственной
    - Материал сохраняет признаки прежней упаковки и ручной обработки
