    - file: Ife terracotta head of a queen from ITA YEMO.jpg
      title: Терракотовая голова из Ифе
    - file: Yoruba-bronze-head.jpg
      title: Йорубская бронзовая голова
  summary: >-
    Точная моделировка головы соединяется с ритмами насечек, причёски, украшений и знаков статуса;
    сходная пластическая задача решается в металле и глине.
  description: >-
    Корпус сопоставляет латунную человеческую голову, терракотовую человеческую голову и голову лошади.
    Это самостоятельные предметы, а не три фотографии знаменитой латунной головы. Формальная точность не
    равна документальному портретному сходству: назначение и личность некоторых изображённых остаются
    спорными.


    Объём лица моделируется мягко, но поверхность может быть расчленена частыми вертикальными линиями,
    причёской и украшениями. Голова лошади показывает, что круг образов шире человеческого лица. Ифе не
    объединено с придворным искусством Бенина и не выведено из Египта или Греции только на основании
    натурализма.
  traits:
    - Тонкая моделировка лица или головы с ясным объёмом щёк, глаз и губ
    - Линейные насечки и орнаментальные детали соотносятся с мягкой поверхностью
    - Причёска, головной убор и сбруя выделены самостоятельным ритмом
    - Терракота и медные сплавы требуют различать материал, сохранность и следы краски
