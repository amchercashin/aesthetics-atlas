  summary: >-
    Толстый гибкий контур, крупные глаза и немногие насыщенные цветовые поля придают фигурам плотность и
    узнаваемость без академической светотени.
  description: >-
    Карточка ограничена темперной фигурацией, представленной тремя работами NGMA. Ранние академические
    портреты, тональные пейзажи и всё наследие Роя не объявляются одним неизменным стилем. Даты
    выбранных вещей музей не сообщает.


    Контур здесь одновременно очерчивает тело и задаёт ритм: изгиб шеи, глаза и лапы или соседние
    человеческие лица подчинены общей системе. Музей описывает осознанное обращение художника к
    Калигхату и другим местным источникам. От Калигхата этот корпус отличается устойчивой авторской
    переработкой фигур, от повествовательного бенгальского свитка — организацией отдельного замкнутого
    изображения.
  traits:
    - Широкий непрерывный контур несёт основную информацию о форме
    - Насыщенные плоские поля заменяют подробную моделировку светом
    - Крупные глаза и сокращённые детали лица или животного
    - Повтор фигур и внутренних линий создаёт ясный ритм замкнутой композиции
