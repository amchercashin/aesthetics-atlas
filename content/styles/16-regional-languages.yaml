  summary: >-
    Плотный рисунок из фигур, мелких заполнений и контрастных прорезей делает лист одновременно
    повествовательным изображением и орнаментальным полем.
  description: >-
    Три гравюры из собрания Cairns показывают ограниченный авторский корпус, не всё искусство Торресова
    пролива. Основные фигуры задают структуру, затем пространство заполняется мелкими мотивами.
    Чёрно-белая печать и ручная раскраска дают разные способы увидеть этот рисунок.


    Источник QAG связывает работу художника с рассказами старших и резьбой островных предметов. Это
    документированный культурный контекст, а не разрешение самостоятельно расшифровывать каждый знак. От
    регионального обзора узел отличается глубиной рассмотрения одной практики; от японской укиё-э —
    техникой линогравюры, организацией плотного поля и другим культурным контекстом.
  traits:
    - Крупные основные фигуры встроены в плотную сеть мелких мотивов
    - Резкий контраст сохраняет читаемость при высокой подробности
    - Прорезанные линии и небольшие светлые участки ритмически заполняют лист
    - Ручная раскраска может выделять части внутри той же графической системы
