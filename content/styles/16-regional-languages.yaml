  end: 1700
  era: renaissance
  dateKind: corpus
  dates: около 1575 — XVII век; выбранные блюда
  medium:
    - ceramics
    - decorative-arts
  region: Изник, Османская Анатолия; современная Турция
  aliases:
    - Изникская керамика
    - İznik
    - Iznik pottery
    - Изник
  gallery:
    - file: Turkey;_Iznik_-_Two_Tiles_-_Google_Art_Project.jpg
      title: Изникские изразцы
    - file: Rustem Pasha Mosque mihrab tiles DSCF2406.jpg
      title: Изразцы мечети Рюстема-паши
  summary: >-
    Чёткий рисунок под прозрачной глазурью связывает белое поле, насыщенный цвет, цветочные или фигурные
    мотивы и самостоятельный орнамент борта.
  description: >-
    Три блюда показывают разные композиционные решения одного керамического центра: цветы и птицы,
    радиальный рисунок и корабль. Музей описывает материал как stonepaste — кварцевую керамическую
    массу; это не автоматически фарфор. Корпус не заменяет изразцы, архитектурные ансамбли и всю историю
    производства Изника.


    Поверхность организована рисунком и белыми промежутками, а борт может работать самостоятельным
    поясом. От общего обзора исламского искусства этот узел отличается конкретным медиумом и центром. От
    китайского фарфора, с которым музей связывает часть раннего репертуара, его отличает османская
    переработка мотивов, палитры и композиции.
  traits:
    - Чёткая контурная линия и насыщенные участки под прозрачной глазурью
    - Белое поле активно разделяет мотивы и сохраняет рисунок читаемым
    - Орнамент борта соотносится с центральным изображением, не обязательно повторяя его
    - Растительные, геометрические и фигурные решения допускают разные ритмы на круглой форме
