      title: Брихадисвара
  summary: >-
    Южноиндийская пластика соединяет округлый объём тела, ясный силуэт и точно поставленные жесты;
    фигуры воспринимаются со всех сторон.
  description: >-
    Выбранный корпус состоит из трёх самостоятельных медносплавных скульптур: Парвати, танцующего Шивы и
    пары Шивы с Парвати. Слово «бронзы» здесь — привычное название корпуса; музей осторожнее определяет
    материал как медный сплав. Это локальная пластическая традиция, не обзор всей художественной
    культуры Индии.


    Округлый торс и узкая талия создают непрерывное движение поверхности. У танцующего Шивы руки и ореол
    разворачивают это движение в пространственный рисунок, у стоящей Парвати его удерживает изгиб оси
    тела. От каменной пластики Гандхары корпус отличается обработкой поверхности, организацией одежды и
    индуистской иконографией; от голов Ифе — масштабом целой фигуры и работой жеста.
  traits:
    - Плавные переходы округлых объёмов и подчёркнутый изгиб оси тела
    - Чёткие положения кистей и рук формируют самостоятельный силуэт
    - Украшения и детали одежды ритмически расчленяют гладкую поверхность
    - Божественная фигура организует пространство вокруг себя, а не только фронтальную плоскость
