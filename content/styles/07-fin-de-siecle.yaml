  dateNote: >
    Британника: основная волна начинается около 1905 года с группы «Мост» (1905–1913); «Синий всадник» устраивал выставки в 1911–1914 годах. Конечная граница условна.
  era: fin-de-siecle
  domain: [art]
  medium: [painting, print, moving-image, architecture]
  subjects: [landscape, portrait, city, any]
