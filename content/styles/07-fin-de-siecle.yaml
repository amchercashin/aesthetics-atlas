    whyRepresentative: >-
      Вихрящиеся мазки неба и условный цвет передают переживание, а не вид из окна.
    sources: [moma-starry-night]
  evidence:
    - { claim: "Перемены в импрессионизме примерно с 1886 года; Сезанн, Гоген, Сёра, Ван Гог", field: dates, source: tate-post-impressionism }
    - { claim: "Термин Роджера Фрая, 1910; художники не считали себя группой; выражение чувства вместо оптического впечатления", field: description, source: ra26-post-impressionism }
    - { claim: "Сезанн и Пуссен; Гоген отказался от работы с натуры", field: description, source: tate-post-impressionism }
