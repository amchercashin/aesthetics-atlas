      sources:
        - ra26-preraphaelite-legacy
  gallery:
    - file: Casa_Batllo_Overview_Barcelona_Spain_cut.jpg
      title: Дом Бальо, Гауди
    - file: Victor_Horta_Hotel_Tassel.JPG
      title: Отель Тассель, Орта
  summary: >
    Линия «удар бича»: стебли, лилии, женские волосы и стрекозы прорастают в афишах, вокзалах и дверных ручках.
  description: |
    Модерн хотел покончить с копированием старых стилей и создать новый язык для всего — от вокзала до
    ложки. Его источник — природа: изгибы растений, водоросли, насекомые. Альфонс Муха рисует афиши с
    ореолами из волос и цветов, Гимар — входы в парижское метро в виде чугунных стеблей, Гауди — дома без
    прямых углов, Шехтель — особняки в Москве.
  traits:
    - Плавная линия «удар бича»
    - Растительные и женские мотивы
    - Единство архитектуры, мебели, плаката, ювелирки
    - Витражи, гнутый металл, майолика
  promptCues:
    - Плавная изогнутая линия «удар бича»
    - "Растительные мотивы: стебли, лилии, листья"
    - Декоративная рамка и орнамент вокруг изображения
    - Мягкие природные тона и золото
  names: [Альфонс Муха, Эктор Гимар, Виктор Орта, Антонио Гауди, Фёдор Шехтель]
