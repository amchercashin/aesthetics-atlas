  gallery:
    - file: Baigneurs_a_Asnieres.jpg
      title: Сёра. Купальщики в Аньере
    - file: Georges_Seurat_-_Models_(Poseuses)_-_BF811_-_Barnes_Foundation.jpg
      title: Сёра. Позирующие
  summary: >
    Импрессионизм, поставленный на научную основу: картина складывается из тысяч точек чистого цвета.
  description: |
    Жорж Сёра изучал оптику и теорию цвета и решил, что смешивать краски должен глаз зрителя, а не палитра.
    Его «Воскресный день на острове Гранд-Жатт» написан мелкими точками дополнительных цветов и строится
    с почти архитектурной неподвижностью. Синьяк развил метод в мозаичный дивизионизм с крупными мазками.
  traits:
    - Точки и мазки чистого цвета
    - Оптическое смешение в глазу зрителя
    - Застывшие, геометризованные фигуры
    - Научный подход к свету и цвету
  names: [Жорж Сёра, Поль Синьяк, Анри-Эдмон Кросс, Тео ван Рейссельберге]
  example:
    file: A Sunday on La Grande Jatte, Georges Seurat, 1884.jpg
