    Импрессионизм на основе оптики: картина складывается из мелких мазков чистого цвета.
  description: |
    Термин предложил в 1886 году критик Феликс Фенеон. Сёра опирался на тогдашние теории оптики и цвета: крошечные
    мазки чистых цветов ставятся рядом, а смешивает их глаз зрителя. «Воскресный день на острове Гранд-Жатт» дебютировал
    в 1886 году на восьмой, последней выставке импрессионистов. Метод подхватили Синьяк, Кросс, Люс и Писсарро,
    а в Бельгии его приняла группа «Двадцать».
  traits:
