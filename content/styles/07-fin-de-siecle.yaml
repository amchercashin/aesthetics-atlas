      title: Кирхнер. Улица в Берлине
      author: Эрнст Людвиг Кирхнер
      year: 1913
      place: Музей современного искусства, Нью-Йорк
      whyRepresentative: >-
        Вытянутые острые фигуры и кричащий розовый передают тревогу большого города.
    - file: Large_Blue_Horses.jpg
      title: Марк. Большие синие кони
      author: Франц Марк
      year: 1911
      place: Центр искусств Уокера, Миннеаполис
      whyRepresentative: >-
        Синие кони среди цветных холмов: цвет выражает чувство, а не окраску животных.
  summary: >
    Мир, искажённый тревогой: кричащие цвета, рубленые формы и лица, в которых видна душа на грани.
  description: |
    Экспрессионисты выражали субъективные переживания, а не вид мира: цвета неестественно ярки, формы искажены, мазок свободен.
    Корни школы — у Ван Гога, Мунка и Энсора в 1885–1900 годах. Около 1905 года в Дрездене возникает группа «Мост» во главе
    с Кирхнером, а в Мюнхене Кандинский и Марк собирают «Синий всадник», который идёт к абстракции. Экспрессионизм затронул
    также сцену и кино.
  traits:
    - Искажённые формы и перспектива
    - Кричащие, контрастные цвета
    - Резкие, «рубленые» мазки и линии
    - Тревога, одиночество, большой город
  promptCues:
