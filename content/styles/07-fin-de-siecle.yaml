      type: evolved
      status: verified
      note: >-
        Постимпрессионизм объединяет разные ответы на импрессионизм, а не одну школу. Историческая связь
        подтверждена при сохранении этой оговорки.
      sources:
        - ra26-post-impressionism
        - ra26-impressionism
  gallery:
    - file: Paul_Gauguin_056.jpg
      title: Гоген. Таитянские женщины на пляже
      author: Поль Гоген
      year: 1891
      place: Музей Орсе, Париж
      whyRepresentative: >-
        Плоские пятна яркого цвета и замкнутые контуры заменяют наблюдение природы условным изображением.
    - file: Les_Joueurs_de_cartes,_par_Paul_Cézanne.jpg
      title: Сезанн. Игроки в карты
      author: Поль Сезанн
      year: около 1890
      place: Музей Орсе, Париж
      whyRepresentative: >-
        Фигуры и стол построены плотными плоскостями цвета: форма важнее мгновенного впечатления.
  summary: >
    Разные ответы на импрессионизм: Сезанн строит форму, Ван Гог выражает чувство, Гоген ищет символ.
  description: |
    Термин придумал в 1910 году критик Роджер Фрай; сами художники группой себя не считали. С конца 1880-х годов Гоген, Сёра,
    Ван Гог и Сезанн ищут свои пути выразить чувство, а не только оптическое впечатление. Сезанн хотел «переделать Пуссена
    с натуры», Гоген отказался от работы с натуры ради интенсивного цвета, а Ван Гог в «Звёздной ночи» соединил настроение,
    выражение и символ.
  traits:
    - Выразительный, личный мазок
    - Условный, эмоциональный цвет
    - Упрощённая, построенная форма
    - Плоские силуэты и контуры (Гоген)
  promptCues:
    - Плотный выразительный мазок
    - Условный, эмоциональный цвет
    - Упрощённая форма, построенная из объёмов
    - Плоские силуэты с тёмным контуром
  names: [Поль Сезанн, Винсент ван Гог, Поль Гоген, Анри де Тулуз-Лотрек]
  example:
