- id: expressionism
  name: Экспрессионизм
  orig: Expressionism
  aliases: [экспрессионисты, Мост, Синий всадник, Мунк, Крик]
  start: 1905
  end: 1925
  dates: 1905 – 1925
  era: fin-de-siecle
  domain: [art]
  medium: [painting, print, moving-image, architecture]
  subjects: [landscape, portrait, city, any]
  region: Германия, Австрия, Скандинавия
  tier: 1
  kind: movement
  compare:
    - id: fauvism
      note: >-
        Редакционное сопоставление, не утверждение о происхождении. Музей сопоставляет цвет и спонтанный мазок
        двух направлений, указывая общие источники. Это не подтверждает однонаправленное влияние фовизма на весь
        экспрессионизм.
      sources:
        - ra26-fauvism
  review:
    status: partial
    date: "2026-10-16"
    scope: [relations]
    note: >-
      16.10.2026 проверены исторические отношения и связанные с ними контексты и сопоставления; границы
      подтверждения указаны у каждой записи. Даты, описание и изображения карточки полностью не проверялись.
  parents:
    - id: post-impressionism
      type: influence
      status: verified
      note: >-
        Музей прямо называет Ван Гога среди общих предшественников фовизма и немецкого экспрессионизма. Уточнить
        influence конкретных произведений, не прямое происхождение всего экспрессионизма.
      sources:
        - ra26-fauvism
    - id: symbolism
      type: influence
      status: verified
      note: >-
        Подтверждён персональный канал через Мунка: музей описывает его индивидуальный символизм и определяющую
        роль предшественника немецкого экспрессионизма. Ограничить influence этой рецепцией; общая
        эмоциональность разных движений сама по себе доказательством не является.
      sources:
        - ra26-d2-munch
  gallery:
    - file: Kirchner_1913_Street,_Berlin.jpg
      title: Кирхнер. Улица в Берлине
    - file: Large_Blue_Horses.jpg
      title: Марк. Большие синие кони
  summary: >
    Мир, искажённый тревогой: кричащие цвета, рубленые формы и лица, в которых видна душа на грани.
  description: |
    Экспрессионисты изображали не мир, а своё переживание мира. Его предтеча — «Крик» Эдварда Мунка, где
    небо и пейзаж корчатся вместе с фигурой. В Дрездене группа «Мост» пишет города резкими углами,
    в Мюнхене «Синий всадник» Кандинского и Марка идёт к абстракции. Экспрессионизм охватил кино, театр
    и архитектуру.
  traits:
    - Искажённые формы и перспектива
    - Кричащие, контрастные цвета
    - Резкие, «рубленые» мазки и линии
    - Тревога, одиночество, большой город
  promptCues:
    - Искажённые формы и перспектива
    - Кричащие, контрастные цвета
    - Резкие, «рубленые» мазки и линии
    - Угловатые силуэты и тревожная атмосфера
  names: [Эдвард Мунк, Эрнст Людвиг Кирхнер, Франц Марк, Эмиль Нольде, Эгон Шиле]
