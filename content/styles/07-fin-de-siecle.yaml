      как характеристика всей группы. Главная иллюстрация — страница файла Commons с данными собрания. Галерея — 2 изображения, подписи по
      страницам файлов Commons.
  parents:
    - id: post-impressionism
      type: influence
      status: verified
      note: >-
        Музей прямо называет Ван Гога среди общих предшественников фовизма и немецкого экспрессионизма. Это
        влияние конкретных произведений, а не прямое происхождение всего экспрессионизма.
      sources:
