  summary: >
    Не изображать, а намекать: сны, мифы, смерть и тайна в сумеречных, мерцающих образах.
  description: |
    Символизм возник как французское литературное течение 1880-х годов; манифест Жана Мореаса вышел в 1886 году. В ответ на
    рационализм и материализм символисты ставили субъективность и идею выше описания природы. Вскоре так стали называть
    живопись воображаемых миров с загадочными фигурами из литературы, Библии и мифов: Моро и Редон во Франции, Кнопф в Бельгии.
    «Остров мёртвых» Бёклина — тёмные кипарисы, белая фигура в лодке и неподвижная вода.
  traits:
    - Мистические, сновидческие сюжеты
    - Мифы, смерть, роковые женщины
    - Сумеречный, мерцающий колорит
    - Образ как символ, а не описание
  names: [Арнольд Бёклин, Гюстав Моро, Одилон Редон, Михаил Врубель, Фернан Кнопф]
