    - id: japonisme
      type: influence
      status: verified
      note: >-
        The Met прямо описывает японские формы и японизм как источник ар-нуво; Бёрдсли — конкретный пример
        композиционной рецепции.
      sources:
        - ra26-art-nouveau
    - id: symbolism
      type: influence
      status: verified
      note: >-
        Символистские формы через дизайнеров и прикладные искусства вносили вклад в ар-нуво. Уточнить этот
        канал, а не однолинейное происхождение целого стиля.
