    - Резкие, «рубленые» мазки и линии
    - Угловатые силуэты и тревожная атмосфера
  names: [Эдвард Мунк, Эрнст Людвиг Кирхнер, Франц Марк, Эмиль Нольде, Эгон Шиле]
