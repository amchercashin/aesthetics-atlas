        линий, наряду с Arts and Crafts и другими источниками.
      sources:
        - ra26-art-nouveau
    - id: pre-raphaelites
      type: influence
      status: verified
      note: >-
        The Met прямо называет прерафаэлитское наследие среди источников ар-нуво. Это дополнительный
