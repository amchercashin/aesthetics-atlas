      по страницам файлов Commons; у «Танца» сказано, что он написан позже распада группы.
  parents:
    - id: post-impressionism
      type: influence
      status: verified
      note: >-
        Ван Гог и другие мастера конца XIX века — источники фовистических практик. Влияние идёт от конкретных
        имён, а не от всей категории постимпрессионизма.
      sources:
        - ra26-fauvism
    - id: neo-impressionism
      type: influence
      status: verified
      note: >-
        Матисс экспериментировал с неоимпрессионистическим методом под воздействием Синьяка. Подтверждение
        относится к этой фазе и этому мастеру.
      sources:
        - ra26-neoimpressionism
  gallery:
    - file: Matissedance.jpg
      title: Матисс. Танец
      author: Анри Матисс
      year: 1910
      place: Эрмитаж, Санкт-Петербург
      note: Написан уже после распада группы.
      whyRepresentative: >-
        Три цвета и упрощённые фигуры продолжают фовистскую свободу цвета в большом формате.
    - file: Bonheur_Matisse.jpg
      title: Матисс. Радость жизни
      author: Анри Матисс
      year: 1905–1906
      whyRepresentative: >-
        Плоские чистые цвета и упрощённый рисунок заменяют глубину и естественную окраску.
  summary: >
    «Дикие» цвета прямо из тюбика: зелёный нос, оранжевое небо, красное дерево — цвет освобождается от предмета.
  description: |
    Летом 1905 года в Коллиуре Матисс и Дерен пришли к неестественному цвету и живым мазкам. Когда работы показали на Осеннем
    салоне, критик Луи Воксель назвал их «дикими зверями» — фовами. Цвет больше не описывает предмет: фигуры и пространство
    складываются из ярких плоскостей. К 1908 году многие из группы обратились от фовизма к кубизму.
  traits:
    - Чистый, нереалистичный цвет
    - Широкие свободные мазки
    - Упрощённый рисунок
    - Цвет как выражение чувства
  promptCues:
    - Чистый, нереалистичный цвет прямо из тюбика
    - Широкие свободные мазки
    - Упрощённый рисунок
    - Контрастные дополнительные цвета рядом
  names: [Анри Матисс, Андре Дерен, Морис де Вламинк, Рауль Дюфи]
  example:
