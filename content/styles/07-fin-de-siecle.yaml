  parents:
    - id: impressionism
      type: evolved
      status: verified
      note: >-
        Сёра и Синьяк участвовали в заключительной независимой выставке 1886 года, а Писсарро осваивал их метод.
        Уточнить преемственность выставочного круга и дальнейшее расхождение техники.
      sources:
