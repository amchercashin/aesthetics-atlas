- id: nabis
  name: Наби
  orig: Les Nabis
  aliases: [пророки]
  searchKeywords: [Серюзье, Боннар, Вюйар, Морис Дени, Талисман]
  start: 1888
  end: 1900
  dates: 1888 – 1900
  dateKind: period
  dateNote: >
    Тейт: группа действовала в 1888–1900 годах; Метрополитен-музей — выставки до 1899 года.
  era: fin-de-siecle
  domain: [art, design]
  medium: [painting, print, graphic-design]
  subjects: [landscape, everyday-life, any]
  region: Франция
  tier: 3
  kind: school
  review:
    status: reviewed
    date: "2026-11-09"
    scope: [relations, dates, text, images, gallery]
    note: >-
      Связи — 16.10.2026, границы у записи. 09.11.2026: даты — по Тейт и Метрополитен-музею; описание — 4 утверждения сверено. Галерея: «Зелёный
      Христос» Гогена заменён плакатом Боннара, потому что работ самих наби на изображениях не было; «Жёлтый Христос» помечен как
      предшественник. Главная иллюстрация — очерк Метрополитен-музея и Британника.
  parents:
    - id: post-impressionism
      type: influence
      status: verified
      note: >-
        Серюзье усвоил идеи Гогена и передавал их наби. Влияние идёт от Гогена, а не от всей ретроспективной
        категории постимпрессионизма.
      sources:
        - ra26-nabis
  gallery:
    - file: Paul_Gauguin_-_The_Yellow_Christ_(Le_Christ_jaune)_1889.jpg
      title: Гоген. Жёлтый Христос
      author: Поль Гоген
      year: 1889
      role: precursor
      note: Гоген не входил в группу; его уроки стали отправной точкой для Серюзье.
      whyRepresentative: >-
        Ровные плоскости жёлтого и красного с контуром показывают язык, который Серюзье принёс друзьям.
    - file: France-Champagne_-_affiche_-_PB_(Pierre_Bonnard)_-_btv1b90038712.jpg
      title: Боннар. France-Champagne
      author: Пьер Боннар
      year: 1891
      place: Национальная библиотека Франции, Париж
      whyRepresentative: >-
        Плоские пятна цвета, жирный контур и шрифт, слитый с рисунком: живопись выходит на плакат.
  summary: >
    «Картина — это плоская поверхность, покрытая красками»: декоративные пятна цвета вместо иллюзии.
  description: |
    Осенью 1888 года Боннар, Дени и другие ученики Академии Жюлиана под началом Серюзье образовали братство «наби», от
    еврейского слова «пророки». Серюзье привёз из Понт-Авена почти абстрактный пейзаж, написанный под руководством Гогена, —
    его назвали «Талисманом». Дени сформулировал главное: прежде чем стать боевым конём или обнажённой, картина — это
    поверхность с красками. Наби ценили узор и орнамент и размывали границу между живописью и ремеслом.
  traits:
    - Плоские декоративные пятна цвета
    - Упрощённый рисунок и жирный контур
    - Узор и орнамент вместо иллюзии глубины
    - Работа с плакатом и прикладными формами
  names: [Поль Серюзье, Морис Дени, Пьер Боннар, Эдуар Вюйар]
  example:
    file: Paul Sérusier - The Talisman - Google Art Project.jpg
    title: Талисман
    author: Поль Серюзье
    year: 1888
    place: Музей Орсе, Париж
    whyRepresentative: >-
      Пейзаж сведён к ярким пятнам цвета на маленькой дощечке почти до беспредметности.
    sources: [ra26-nabis, britannica-nabis]
  evidence:
    - { claim: "Группа действовала в 1888–1900 годах; плоские пятна цвета, жирный контур, упрощённый рисунок", field: dates, source: tate-nabis }
    - { claim: "Братство осени 1888 года; «наби» — пророки; «Талисман», Понт-Аван, узор и орнамент", field: description, source: ra26-nabis }
    - { claim: "Изречение Дени о картине как поверхности с красками", field: description, source: britannica-nabis }
  wiki: Les Nabis
  links:
    - { title: "Les Nabis", url: "https://www.theartstory.org/movement/les-nabis/", src: "The Art Story", lang: en }

