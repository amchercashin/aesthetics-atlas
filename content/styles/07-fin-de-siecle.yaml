    - id: art-nouveau
      type: related-context
      status: verified
      note: >-
        Венский сецессион связан с австрийским ар-нуво. Контекст точнее evolved: это объединение художников с
        разными практиками, а не единый дочерний стиль.
      sources:
        - ra26-secession
  parents:
    - id: symbolism
      type: influence
      status: verified
      note: >-
        Belvedere называет символистские источники Klinger, Stuck, Khnopff и Toorop, распространение через
        Vienna Secession и роль этих идей у Klimt и Moser. Оставить influence с конкретным кругом и каналом;
        организационная принадлежность к сецессиону не делает каждого участника символистом.
      sources:
        - ra26-d2-vienna-symbolism
  gallery:
    - file: Gustav_Klimt_046.jpg
      title: Климт. Портрет Адели Блох-Бауэр I
    - file: Gustav_Klimt_-_Beethovenfries,_"Die_Sehnsucht_nach_dem_Glück"_(nach_Richard_Wagners_Interpretation_der_IX._Sinfonie_von_Ludwig_van_Beethoven)_-_5987_-_Österreichische_Galerie_Belvedere.jpg
      title: Климт. Бетховенский фриз
  summary: >
    Золото, орнамент и геометрия Вены: Климт, Венские мастерские и павильон с золотой «капустой».
  description: |
    Молодые художники во главе с Густавом Климтом вышли из официального Дома художников и основали
    Сецессион под девизом «Времени — его искусство, искусству — его свобода». Климт в «Поцелуе» кутает
    влюблённых в золотые мантии из квадратов и спиралей. Венский модерн строже французского: больше
    прямоугольников и сеток, что предвещает ар-деко и модернизм.
  traits:
    - Золото и сусальное золото на холсте
    - Орнамент из квадратов, кругов и спиралей
    - Геометризация модерна, сетки и прямоугольники
    - Синтез живописи, архитектуры и дизайна
  names: [Густав Климт, Коломан Мозер, Йозеф Хоффман, Йозеф Мария Ольбрих, Эгон Шиле]
