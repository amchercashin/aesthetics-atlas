  tier: 1
  kind: movement
  compare:
    - id: fauvism
      note: >-
        Редакционное сопоставление, не утверждение о происхождении. Музей сопоставляет цвет и спонтанный мазок
        двух направлений, указывая общие источники. Это не подтверждает однонаправленное влияние фовизма на весь
        экспрессионизм.
      sources:
