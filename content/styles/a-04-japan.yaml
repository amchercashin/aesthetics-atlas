  summary: >-
    Халаты айнов из луба вяза и хлопка с широкими нашитыми полосами ткани и тонкой вышивкой: симметричный
    орнамент из завитков и угловатых ломаных линий на спине, вороте, рукавах и подоле.
  description: >-
    По описанию Met, айны Северной Японии исторически отличались от японцев языком, религией и искусством, а
    ткани принадлежат к их самым известным работам. Ткань аттуш делали из внутреннего луба вяза, липы или
    крапивы. Луб собирали мужчины, а рисунок, ткачество, шитьё и украшение выполняли женщины для своих
    семей; девочки учились узорам с раннего возраста.


    Халаты из аттуша и хлопка украшали вышивкой или аппликацией с вышивкой. Широкие нашитые полосы — чаще
    белые, иногда красные или набивные — образуют на спине симметричный орнамент из завитков и ломаных
    линий, а тонкая вышивка идёт вдоль них. В отличие от вышивки по всему полотну, здесь узор держат крупные
    контрастные полосы, сосредоточенные у ворота, рукавов, подола и в центре спины. Значения и местные
    названия мотивов карточка не приводит.
  traits:
    - Халат из луба вяза (аттуш) или хлопка
    - Широкие нашитые полосы контрастной ткани у ворота, рукавов, подола и на спине
    - Симметричный орнамент из завитков и угловатых ломаных линий
    - Тонкая вышивка завитками рядом с крупными нашитыми полосами
