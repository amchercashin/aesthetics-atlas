  wiki: { en: Shin-hanga, ru: Син-ханга }
  summary: >-
    Японская цветная ксилография XX века, возродившая укиё-э по заказу издателя Ватанабэ: дождь, сумерки и
    цветущие сады в мягких растяжках тона, птицы на тёмном фоне, крупные портреты актёров кабуки.
  description: >-
    Около 1915 года токийский издатель Сёдзабуро Ватанабэ назвал новое движение «син-ханга» — «новые
    гравюры». По Те Папа, он понял, что традицию укиё-э нужно приспособить к современной жизни. Метод остался
    прежним: художник даёт рисунок по заказу издателя, а резьбу и печать выполняют мастера. Очерк Центра
    исследований искусства Университета Рицумэйкан добавляет, что такие листы печатали на более плотной бумаге,
    резали тончайшие линии, брали лучшие пигменты со слюдой и доводили печать с растяжкой тона и наложение
    оттисков до предела.


    Сюжеты меняются мягче техники. Пейзажи Кавасэ Хасуя — дождь, сумерки, огни в воде, у Ёсиды Хироси вид
    открывается сквозь завесу цветущих ветвей, у Охары Косона птица сидит на ветке на тёмном фоне, у Натори
    Сюнсэна крупный портрет актёра получает новый психологический реализм. В отличие от пейзажей Хиросигэ,
    здесь меньше графической условности и больше атмосферного света; в отличие от «творческих гравюр», где
    автор сам режет и печатает, это по-прежнему коллективная работа под рукой издателя.
  traits:
    - Атмосферный свет — дождь, сумерки, отражения огней, мягкие растяжки тона (бокаси)
    - Тонкие линии и многослойная печать с богатыми пигментами
    - Знакомые жанры укиё-э — пейзаж, «цветы и птицы», актёрский портрет — в новой подаче
    - Коллективное производство — рисунок художника, резьба и печать мастеров издателя
