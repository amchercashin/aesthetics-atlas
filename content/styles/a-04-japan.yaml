  summary: >-
    Декоративная живопись и прикладное искусство Японии от Коэцу и Сотацу до Корина и Хоицу: яркие цвета
    и тушь на золоте, обобщённые цветы, волны и ирисы, ритм повторов и крупный разворот по ширме.
  description: >-
    По очерку Met, Ринпа — часть возрождения в эпоху Эдо местной художественной традиции, ямато-э. Темы о
    природе и временах года брали из японской литературы — «Повести о Гэндзи», «Исэ моногатари», придворной
    поэзии Хэйан. Начало положили киотские купцы Хонъами Коэцу и Таварая Сотацу: каллиграфия Коэцу ложилась
    поверх декоративной живописи Сотацу, создавая «узор на узоре». Название дано по Огате Корину, хотя
    организованной или наследственной школы не было.


    Корин писал яркими красками или тушью, часто по золотому фону, и обобщал мотив сильнее
    предшественников; его узоры переходили на ткани, лак и керамику. В начале XIX века Сакаи Хоицу
    перенёс стиль в Эдо и сосредоточился на временах года, а его ученик Судзуки Кицу добавил натурализма.
    В отличие от повествовательных свитков ямато-э, здесь главное — поверхность: мотив вырван из сцены,
    повторён и разложен по золоту ширмы.
  traits:
    - Яркие минеральные цвета и тушь на золотом или серебряном фоне
    - Обобщённый природный мотив — ирисы, волны, вьюнки — повторяется как узор
    - Крупный ритмичный разворот по створкам ширмы с диагоналями и пустым полем
    - Единство живописи, каллиграфии и прикладных вещей — узор переходит на ткань, лак, керамику
