  summary: >-
    Пейзажи вдоль дорог и в окрестностях Эдо, где главное — погода и время суток: снег, ливень косыми и
    вертикальными линиями, ночь, крошечные путники и неожиданная точка зрения.
  description: >-
    Карточка охватывает пейзажные серии Утагавы Хиросигэ 1830–1850-х годов: «Пятьдесят три станции
    Токайдо», «Восемь видов Оми» и «Сто знаменитых видов Эдо». В отличие от листов Хокусая, где Фудзи
    служит постоянной точкой сравнения, здесь сюжет задаёт погода. Снег глушит звуки Камбары, ливень в Сёно
    передан чёткими косыми линиями, а дождь в Карасаки — завесой тонких вертикальных штрихов поверх мягких
    переходов тона. Met подчёркивает, что Камбара и Сёно, по-видимому, выдуманы: это не топографическая
    запись, а образ места.


    В поздних «Видах Эдо» Хиросигэ резко меняет точку зрения: огромный ястреб нависает над снежной
    равниной, и масштаб переднего плана подчёркивает суровость погоды. Авторская подпись не отменяет
    коллективного производства: на зонте в листе из Сёно стоит фамилия издателя Такэноути, а имена резчиков и
    печатников в выбранных записях не названы.
  traits:
    - Погода и время суток как сюжет — снег, ливень, ночной дождь
    - Дождь передан графически — косыми или вертикальными линиями поверх тонового фона
    - Мелкие фигуры путников и носильщиков в большом пространстве
    - Неожиданная точка зрения и крупный передний план в поздних вертикальных листах
