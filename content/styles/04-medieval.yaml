    Ямато-э складывается вокруг японских сюжетов, мест и придворной литературы, отличавшихся от тем
    китайской живописи кара-э. В повествовательных свитках встречаются яркие непрозрачные краски, условные
    лица и вид на интерьер со снятой крышей; существуют и монохромные варианты.


    Ширмы, раздвижные панели и свитки рассказывают о временах года и литературных героях. Приёмы ямато-э
    сохраняются и перерабатываются в эпоху Эдо; показанная сцена из «Повести о Гэндзи» относится к началу
    XVII века.
  traits:
    - Японская литература, местные пейзажи и времена года
