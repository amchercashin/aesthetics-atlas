    собственные школы — новгородская, псковская, московская. Андрей Рублёв пишет «Троицу», где три ангела
    вписаны в круг, а голубец и золото звучат как музыка. Обратная перспектива и условное пространство
    здесь не недостаток, а способ показать иной мир.
  traits:
