    Храмы-горы, покрытые танцующими апсарами и многокилометровыми рельефами мифов.
  description: |
    Храм в индуизме — модель космической горы Меру, и строители Индии и Юго-Восточной Азии превращают его
    в каменную вселенную. Кхмеры возводят Ангкор-Ват с пятью башнями-лотосами и галереями рельефов
    «Пахтанья молочного океана». Поверхность целиком отдана танцовщицам, богам и битвам.
