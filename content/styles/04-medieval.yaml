  gallery:
    - file: Hagia_Sophia_(228968325).jpeg
      title: Собор Святой Софии
    - file: Μονή_Οσίου_Λουκά_1290.jpg
      title: Монастырь Осиос Лукас
  summary: >
    Мерцающие золотом мозаики, фронтальные фигуры с огромными глазами и купола, парящие над пространством храма.
  description: |
    Христианская Римская империя со столицей в Константинополе превратила античное мастерство в язык
    священного. Объём и перспектива уходят, золотой фон уводит фигуры из земного пространства, а взгляд
    становится прямым и неподвижным. Мозаики Равенны и купол Святой Софии задали канон, на котором
    выросла иконопись православного мира.
  traits:
    - Золотой фон вместо пространства
    - Фронтальные, вытянутые, неподвижные фигуры
    - Мозаика из смальты, мерцающая при свете свечей
    - Иерархия и строгий канон изображения
    - Купол как образ неба
  promptCues:
    - Сплошной золотой фон вместо пространства
    - Мозаика из мерцающей смальты
    - Фронтальные, вытянутые, неподвижные формы
    - Тёмный контур и плоские глубокие цвета
  names: [Святая София, Сан-Витале в Равенне, Феофан Грек, монастырь Хора]
  example:
    file: Mosaic of Justinian I - San Vitale - Ravenna 2016.jpg
    title: Император Юстиниан со свитой (мозаика)
    year: ок. 547
    place: Базилика Сан-Витале, Равенна
  wiki: Byzantine art
  links:
    - { title: "Byzantine Art", url: "https://www.worldhistory.org/Byzantine_Art/", src: "World History Encyclopedia", lang: en }
  compare:
    - id: fayum-portraits
      note: >-
        Сопоставление фронтальности и выразительного взгляда. Оно не устанавливает прямое происхождение
        византийской живописи от фаюмского портрета.

