- id: byzantine-art
  name: Византийское искусство
  orig: Byzantine art
  aliases: [Византия, византийская мозаика, Равенна, Святая София]
  start: 330
  end: 1453
  dates: 330 – 1453
  era: medieval
  domain: [art, architecture]
  region: Восточная Римская империя
  tier: 1
  parents:
    - { id: ancient-rome, type: evolved }
    - { id: fayum-portraits, type: influence }
  summary: >
    Мерцающие золотом мозаики, фронтальные фигуры с огромными глазами и купола, парящие над пространством храма.
  description: |
    Христианская Римская империя со столицей в Константинополе превратила античное мастерство в язык
    священного. Объём и перспектива уходят, золотой фон уводит фигуры из земного пространства, а взгляд
    становится прямым и неподвижным. Мозаики Равенны и купол Святой Софии задали канон, на котором
    выросла иконопись православного мира.
  traits:
    - Золотой фон вместо пространства
    - Фронтальные, вытянутые, неподвижные фигуры
    - Мозаика из смальты, мерцающая при свете свечей
    - Иерархия и строгий канон изображения
    - Купол как образ неба
  names: [Святая София, Сан-Витале в Равенне, Феофан Грек, монастырь Хора]
  example:
    file: Mosaic of Justinian I - San Vitale - Ravenna 2016.jpg
    title: Император Юстиниан со свитой (мозаика)
    year: ок. 547
    place: Базилика Сан-Витале, Равенна
  wiki: Byzantine art
  links:
    - { title: "Byzantine Art", url: "https://www.worldhistory.org/Byzantine_Art/", src: "World History Encyclopedia", lang: en }

- id: old-russian-icons
  name: Древнерусская иконопись
  orig: Russian icon painting
  aliases: [икона, Рублёв, Троица, Дионисий, новгородская школа]
  start: 988
  end: 1700
  dates: 988 – XVII век
  era: medieval
  domain: [art]
  region: Русь
  tier: 2
  parents:
    - { id: byzantine-art, type: evolved }
  summary: >
    Византийский канон, прочитанный по-русски: светлые краски, мягкие силуэты и тишина «Троицы» Рублёва.
  description: |
    После крещения Руси греческие мастера приносят икону и фреску, но уже к XIV–XV векам складываются
    собственные школы — новгородская, псковская, московская. Андрей Рублёв пишет «Троицу», где три ангела
    вписаны в круг, а голубец и золото звучат как музыка. Обратная перспектива и условное пространство
    здесь не недостаток, а способ показать иной мир.
  traits:
    - Обратная перспектива
    - Плоские светлые цвета — киноварь, голубец, охры
    - Ритм силуэтов, вписанных в круг и вертикаль
    - Яичная темпера на доске, золото
  names: [Андрей Рублёв, Феофан Грек, Дионисий, Симон Ушаков]
  example:
    file: Angelsatmamre-trinity-rublev-1410.jpg
    title: Троица
    author: Андрей Рублёв
    year: 1411 или 1425–1427
    place: Государственная Третьяковская галерея, Москва
  wiki: Russian icons
  links: []

- id: insular-art
  name: Островное искусство
  orig: Insular art
  aliases: [Келлская книга, ирландские рукописи, кельтский орнамент]
  start: 600
  end: 900
  dates: ок. 600 – 900
  era: medieval
  domain: [art, design]
  region: Ирландия, Британия
  tier: 3
  parents:
    - { id: celtic-art, type: evolved }
    - { id: byzantine-art, type: influence }
  summary: >
    Монашеские рукописи, где буквы превращаются в лабиринты плетёнки, спиралей и фантастических зверей.
  description: |
    Ирландские и нортумбрийские монахи переписывали Евангелия и украшали их так плотно, что одна буква
    могла занимать целую страницу. Кельтские спирали, германская плетёнка и средиземноморские образы
    соединились в «ковровые страницы» Келлской книги и Линдисфарнского Евангелия — вершину книжного
    искусства раннего Средневековья.
  traits:
    - Инициалы на всю страницу
    - Плетёнка, спирали, «ковровые страницы»
    - Стилизованные звери и люди, вплетённые в узор
    - Пергамент, яркие минеральные краски
  names: [Келлская книга, Линдисфарнское Евангелие, Книга из Дарроу]
  example:
    file: KellsFol034rChiRhoMonogram.jpg
    title: Страница с монограммой Хи-Ро, Келлская книга
    year: ок. 800
    place: Тринити-колледж, Дублин
  wiki: Insular art
  links: []

- id: viking-art
  name: Искусство викингов
  orig: Viking art
  aliases: [скандинавский звериный стиль, стиль Урнес, рунические камни]
  start: 750
  end: 1100
  dates: ок. 750 – 1100
  era: medieval
  domain: [art, design]
  region: Скандинавия
  tier: 3
  parents:
    - { id: scythian-animal-style, type: influence }
    - { id: insular-art, type: influence }
  summary: >
    Звери, змеи и драконы, сплетённые в тугие петли на носах кораблей, брошах и порталах деревянных церквей.
  description: |
    Скандинавы унаследовали германский звериный стиль и довели его до виртуозной абстракции. Стили Борре,
    Еллинг и Урнес — это всё более изящные переплетения длинных тел, лап и голов. Резной портал церкви
    в Урнесе, созданный уже при христианстве, — последняя и самая утончённая вспышка этой традиции.
  traits:
    - Сплетённые звери и змеи
    - Вытянутые S-образные тела и петли
    - Резьба по дереву, металлические фибулы
    - Абстрактный ритм вместо сюжета
  names: [Осебергский корабль, рунический камень из Еллинга, церковь в Урнесе]
  example:
    file: Carvings in north wall portal, Urnes Stave Church-1.jpg
    title: Резьба портала каркасной церкви в Урнесе
    year: ок. 1070
    place: Урнес, Норвегия
  wiki: Viking art
  links:
    - { title: "Viking Art", url: "https://www.worldhistory.org/Viking_Art/", src: "World History Encyclopedia", lang: en }

- id: romanesque
  name: Романский стиль
  orig: Romanesque
  aliases: [романика, романская архитектура]
  start: 1000
  end: 1200
  dates: ок. 1000 – 1200
  era: medieval
  domain: [architecture, art]
  region: Западная Европа
  tier: 2
  parents:
    - { id: ancient-rome, type: evolved }
    - { id: byzantine-art, type: influence }
  summary: >
    Толстые стены, полукруглые арки и тяжёлые своды: монастыри и соборы как крепости веры.
  description: |
    После 1000 года Европа покрывается каменными церквями. Строители возрождают римскую полукруглую арку
    и свод, но стены остаются массивными, окна — небольшими. На порталах появляются выразительные рельефы
    Страшного суда. Пизанский собор с аркадами и полосатым мрамором — образец итальянской романики.
  traits:
    - Полукруглые арки и цилиндрические своды
    - Толстые стены и маленькие окна
    - Массивные, «крепостные» объёмы
    - Скульптура тимпанов и капителей
  names: [Пизанский собор, аббатство Клюни, собор в Шпайере, Сант-Фуа в Конке]
  example:
    file: Pisa Cathedral 2014.jpg
    title: Пизанский собор
    author: Бускето
    year: 1063–1118
    place: Пиза, Италия
  wiki: Romanesque architecture
  links:
    - { title: "Romanesque Architecture", url: "https://www.worldhistory.org/Romanesque_Architecture/", src: "World History Encyclopedia", lang: en }

- id: gothic
  name: Готика
  orig: Gothic
  aliases: [готический стиль, готический собор, Gothic architecture]
  start: 1140
  end: 1500
  dates: ок. 1140 – 1500
  era: medieval
  domain: [architecture, art]
  region: Франция, затем вся Европа
  tier: 1
  parents:
    - { id: romanesque, type: evolved }
  summary: >
    Соборы, растворённые в свете: стрельчатые арки, рёбра сводов, контрфорсы и огромные
    витражи-розы.
  description: |
    Готика родилась в аббатстве Сен-Дени под Парижем, где аббат Сугерий захотел, чтобы церковь
    наполнял «божественный свет». Инженерные находки — стрельчатая арка, нервюрный свод и
    аркбутаны — позволили поднять стены ввысь и заменить их стеклом.
  traits:
    - Стрельчатые арки и вертикальный порыв
    - Нервюрные своды и аркбутаны снаружи
    - Витражи и окна-розы
    - Скульптурные порталы
    - Каменное кружево — пинакли, вимперги
  names: [аббат Сугерий, Шартрский собор, Нотр-Дам де Пари, Кёльнский собор]
  example:
    file: Chartres cathedral (West façade).jpg
    title: Шартрский собор, западный фасад
    year: 1145–1220
    place: Шартр, Франция
  wiki: Gothic architecture
  links:
    - { title: "Gothic Architecture", url: "https://www.worldhistory.org/Gothic_Architecture/", src: "World History Encyclopedia", lang: en }

- id: international-gothic
  name: Интернациональная готика
  orig: International Gothic
  aliases: [мягкий стиль, братья Лимбург, часослов герцога Беррийского]
  start: 1375
  end: 1450
  dates: ок. 1375 – 1450
  era: medieval
  domain: [art]
  region: Франция, Бургундия, Богемия, Италия
  tier: 3
  parents:
    - { id: gothic, type: evolved }
  summary: >
    Придворная утончённость: изящные фигуры, роскошные ткани, лазурь и золото миниатюр часословов.
  description: |
    На рубеже XIV–XV веков дворы Европы обмениваются художниками, и складывается общий изысканный стиль:
    плавные силуэты, сказочные замки, подробные пейзажи и мода. Братья Лимбург в «Великолепном часослове
    герцога Беррийского» показывают месяцы года — пахарей, пиры и охоты под звёздными календарями.
  traits:
    - Плавные, удлинённые фигуры
    - Драгоценные цвета — ультрамарин, киноварь, золото
    - Подробные пейзажи и бытовые сцены
    - Придворная мода и роскошь
  names: [братья Лимбург, Джентиле да Фабриано, Уилтонский диптих]
  example:
    file: Les Très Riches Heures du duc de Berry octobre.jpg
    title: Октябрь. «Великолепный часослов герцога Беррийского»
    author: Братья Лимбург
    year: ок. 1412–1416
    place: Музей Конде, Шантийи
  wiki: International Gothic
  links: []

- id: islamic-art
  name: Исламское искусство
  orig: Islamic art
  aliases: [исламский орнамент, арабеска, гирих, мукарнас, изразцы]
  start: 650
  end: 1900
  dates: VII – XIX века
  era: medieval
  domain: [art, architecture, design]
  region: От Испании до Индии
  tier: 1
  parents:
    - { id: byzantine-art, type: influence }
    - { id: achaemenid-art, type: influence }
  summary: >
    Бесконечный геометрический узор, арабеска и каллиграфия, покрывающие купола, изразцы и ковры.
  description: |
    Избегая изображения живых существ в сакральном пространстве, исламские мастера развили орнамент до
    уровня высшей математики: звёздные гирихи, сталактитовые мукарнасы, растительная арабеска и каллиграфия
    сливаются в единый ритм. От Альгамбры в Гранаде до мечети Шаха в Исфахане — это искусство бесконечности.
  traits:
    - Сложная геометрия — звёзды, многоугольники, гирих
    - Арабеска — бесконечный растительный узор
    - Каллиграфия как главный декор
    - Глазурованные изразцы, бирюза и кобальт
    - Мукарнасы — «сталактитовые» своды
  names: [Альгамбра, Купол Скалы, мечеть Шаха в Исфахане, Самарканд]
  example:
    file: Dome interior of Shah Mosque (Isfahan) 2014 (1).jpg
    title: Купол мечети Шаха (Имама)
    year: 1611–1629
    place: Исфахан, Иран
  wiki: Islamic art
  links:
    - { title: "Islamic Art", url: "https://www.worldhistory.org/Islamic_Art/", src: "World History Encyclopedia", lang: en }

- id: persian-miniature
  name: Персидская миниатюра
  orig: Persian miniature
  aliases: [иранская миниатюра, Бехзад, Реза Аббаси, книжная миниатюра]
  start: 1250
  end: 1700
  dates: XIII – XVII века
  era: medieval
  domain: [art]
  region: Иран, Средняя Азия
  tier: 3
  parents:
    - { id: islamic-art, type: evolved }
    - { id: shan-shui, type: influence }
  summary: >
    Драгоценные книжные картины: сады, пиры и поэмы в сияющих красках, увиденные будто сверху.
  description: |
    После монгольских завоеваний в Иран приходит китайская живопись, и из встречи с исламской книжной
    традицией рождается миниатюра. Мастера Тебриза, Герата и Исфахана иллюстрируют «Шахнаме» и «Хамсе»
    Низами: пространство разворачивается ярусами, краски сияют, а детали можно рассматривать часами.
  traits:
    - Высокая точка зрения, пространство ярусами
    - Чистые драгоценные цвета и золото
    - Тонкая линия и множество деталей
    - Сады, архитектура и поэтические сюжеты
  names: [Камал ад-Дин Бехзад, Султан Мухаммад, Реза Аббаси]
  example:
    file: Khamseh Nizami 001.jpg
    title: Миниатюра к «Хамсе» Низами
    author: Султан Мухаммад
    year: 1539–1543
    place: Британская библиотека, Лондон
  gallery:
    - { file: "Reza Abbasi - Two Lovers (1630).jpg", title: "Двое влюблённых", author: "Реза Аббаси", year: "1630" }
  wiki: Persian miniature
  links: []

- id: shan-shui
  name: Китайская пейзажная живопись шань-шуй
  orig: Shan shui
  aliases: [горы и воды, гохуа, живопись тушью, Фань Куань]
  start: 900
  end: 1700
  dates: X – XVII века
  era: medieval
  domain: [art]
  region: Китай
  tier: 2
  parents:
    - { id: ancient-chinese-art, type: evolved }
  summary: >
    «Горы и воды», написанные тушью на шёлке: человек — крошечная фигура в бескрайнем мире.
  description: |
    При династии Сун пейзаж становится высшим жанром китайской живописи. Фань Куань ставит перед зрителем
    отвесную гору, у подножия которой еле видны путники. Пустота, туман и движение кисти важны так же,
    как изображённое. Шань-шуй соединён с каллиграфией и поэзией и на века задаёт эстетику Восточной Азии.
  traits:
    - Монохромная тушь, градации серого
    - Пустота и туман как часть композиции
    - Вертикальные свитки, несколько точек зрения
    - Каллиграфический мазок кисти
    - Крошечный человек среди огромной природы
  names: [Фань Куань, Го Си, Ма Юань, Ни Цзань]
  example:
    file: Fan Kuan - Travelers Among Mountains and Streams - Google Art Project.jpg
    title: Путники среди гор и потоков
    author: Фань Куань
    year: ок. 1000
    place: Музей Гугун, Тайбэй
  wiki: Shan shui
  links: []

- id: yamato-e
  name: Ямато-э
  orig: Yamato-e
  aliases: [японская живопись, эмаки, свитки, Гэндзи-моногатари]
  start: 900
  end: 1600
  dates: X – XVI века
  era: medieval
  domain: [art]
  region: Япония
  tier: 3
  parents:
    - { id: shan-shui, type: influence }
  summary: >
    Японская придворная живопись: длинные свитки-эмаки, дома без крыш и плоские яркие цвета.
  description: |
    В эпоху Хэйан японские художники отделяют свою манеру от китайской: тушевую монохромность сменяют
    яркие непрозрачные краски, а повествование разворачивается на горизонтальных свитках. Приём «снятой
    крыши» позволяет заглянуть в покои героев «Повести о Гэндзи». Отсюда вырастут школы Тоса и, позднее,
    укиё-э.
  traits:
    - Горизонтальные свитки-эмаки
    - Вид сверху, «снятая крыша»
    - Плоские яркие минеральные краски
    - Лица-схемы «линия-глаз, крючок-нос»
  names: [«Гэндзи-моногатари эмаки», школа Тоса, «Свитки о зверях-шутниках»]
  example:
    file: Hakubyo Genji monogatari emaki - scroll 1-5.jpg
    title: Свиток «Повести о Гэндзи»
    year: XIV век
  wiki: Yamato-e
  links: []

- id: wabi-sabi
  name: Ваби-саби и дзэн-эстетика
  orig: Wabi-sabi
  aliases: [ваби-саби, дзэн, чайная церемония, раку, японский минимализм]
  start: 1400
  end: null
  dates: XV век – наши дни
  era: medieval
  domain: [art, design]
  region: Япония
  tier: 2
  parents:
    - { id: shan-shui, type: influence }
  summary: >
    Красота несовершенного, неполного и мимолётного: грубая чаша раку, мох на камне, пустота сада.
  description: |
    Из дзэн-буддизма и чайной церемонии Сэн-но Рикю вырастает эстетика, в которой трещина, асимметрия
    и патина ценнее блеска. Чаша раку лепится вручную и несёт следы пальцев; сад камней в Рёан-дзи
    состоит почти из пустоты. Через Фрэнка Ллойда Райта и модернистов эти идеи пришли в минимализм
    и современный интерьер.
  traits:
    - Асимметрия и следы руки
    - Природные материалы, патина, трещины
    - Приглушённые землистые тона
    - Пустота и тишина как часть композиции
  names: [Сэн-но Рикю, Тёдзиро, сад Рёан-дзи, кинцуги]
  example:
    file: Tea Bowl, Named “Amadera (Nunnery)”.jpg
    title: Чаша для чая «Амадэра»
    author: Тёдзиро
    year: конец XVI века
  wiki: Wabi-sabi
  links: []

- id: khmer-temple-art
  name: Индуистское и кхмерское храмовое искусство
  orig: Hindu and Khmer temple art
  aliases: [Ангкор-Ват, кхмерская архитектура, храмы Индии, апсары]
  start: 600
  end: 1300
  dates: VII – XIII века
