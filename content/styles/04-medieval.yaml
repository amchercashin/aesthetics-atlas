  description: >
    Кхмерские столицы ангкорского периода соединяли храмы, водоёмы и городские ансамбли. Ангкор был
    задуман как символическая вселенная по индийской космологии; храм-гора выражает её порядок.


    Ангкор-Ват связан с индуистской традицией, Байон — с буддийским этапом кхмерского храмового искусства.
    Эта карточка ограничена кхмерскими памятниками и не объединяет с ними Кхаджурахо в Индии или Боробудур
    на Яве.
