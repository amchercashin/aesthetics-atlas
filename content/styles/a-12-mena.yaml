  dateNote: >-
    Сохранившиеся османские каллиграфические альбомы с полями из мраморной бумаги восходят к XVI–XVII векам
    (Met 1982.120.3; Собрание Халили MSS 0274), а ранний турецкий трактат об эбру датируют временем после 1615 года;
    в 2014 году турецкое искусство эбру включено в Репрезентативный список ЮНЕСКО (00644) как живая традиция
    передачи от мастера к ученику.
  medium:
