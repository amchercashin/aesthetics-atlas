  summary: >-
    Иранский модернизм 1960–1970-х, переплавивший шиитские обетные святыни, талисманные сетки, печати, бытовые замки
    и буквы персидского письма в плотную современную живопись и скульптуру.
  description: >-
    Название «саккахане» ввёл иранский критик и преподаватель Тегеранского колледжа декоративных искусств Карим
    Эмами (в 1962–1963 годах, после III Тегеранской биеннале 1962 года). В иранских городах саккахане — это уличная
    питьевая ниша-фонтан в память о мучениках Кербелы с металлической решёткой, к которой горожане привязывают
    ленты, замки, свечи, бусы, ладони-аламы и листки с молитвами. Эмами увидел в этой народной «витрине частного
    благочестия» точную метафору для нового поколения иранских модернистов, которые в обход дворцовой придворной
    эстетики обратились к уличной религиозной, фольклорной и ремесленной визуальной культуре.


    И Met, и статья Хамида Кешмиршекана в Encyclopaedia Iranica подчёркивают: саккахане не было жёстко оформленной
    группой с общим манифестом, а некоторые художники (например, Насер Овиси и Жазе Табатабаи) позже возражали
    против причисления себя к «школе». Тем не менее в 1960–1970-х годах между их работами возникла мощная визуальная
    перекличка. Чарльз Хосейн Зендеруди и Фарамарз Пиларам превратили талисманные таблицы, печати, цифры и штемпели
    в плотные декоративно-графические поля, лишив каллиграфию элитарного пиетета и работая буквой как ритмическим
    знаком. Скульптор Парвиз Танаволи собирал ассамбляжи из решёток, клеток, замков и поэтических строк (включая
    «Клетку, клетку, клетку» 1966 года в Tate), а позже создал знаменитую серию «Хич» (перс. «ничто» — в суфийском
    смысле). Мансур Гандриз опирался на текстиль и металл, Масуд Арабшахи — на доисламские рельефы Ахеменидов, а
    Садек Табризи и Насер Овиси — на повествовательную «кофейную живопись» кахвехане и классическую персидскую поэзию.
  traits:
    - Превращение букв, цифр, талисманных таблиц и штампов в плотную ритмическую фактуру вне буквального чтения текста
    - Переработка народных шиитских и бытовых предметов — обетных ладоней-аламов, решёток, замков, светильников и печатей
    - Богатая декоративная палитра бирюзы, золота, серебра, киновари, охры и глубокого индиго
    - Стилистическая неоднородность: от плоских знаковых полотен и шелкографий до раскрашенных ассамбляжей и бронзовой пластики
