    - "Симметричные ритуальные и бытовые эмблемы — навершия, решётки, медальоны, арки и геометрические рельефы на плоском фоне"
    - "Сочетание матовой темперы с золотой и серебряной металлической краской, бирюзой, глубоким кобальтом, охрой и киноварью"
    - "Фактурная ручная поверхность на бумаге, холсте или дереве, соединяющая народную знаковую графику с послевоенным модернизмом"
