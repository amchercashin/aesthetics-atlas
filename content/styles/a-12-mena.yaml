  description: >-
    Монир Шахруди Фарманфармаян (1922–2019; в ряде каталогов 1924–2019) провела двенадцать формирующих лет в
    Нью-Йорке (с 1945 года), где сблизилась с кругом послевоенного американского авангарда, а после возвращения в
    Иран и посещения зеркального святилища Шах-Черах в Ширазе в 1970-х годах нашла собственный скульптурный язык.
    Она стала первой современной художницей, перенёсшей многовековое иранское архитектурное ремесло айне-кари
    (выкладывание срезанных кусочков посеребрённого зеркала в гипсовом растворе, известное в Иране с XVI–XVII веков)
    из убранства дворцов и мавзолеев в автономные настенные рельефы и отдельно стоящие скульптуры.


    По материалам V&A и официальной биографии её фонда, сложнейшая ручная резка зеркал и сборка в гипсе выполнялись
    в тегеранской мастерской в тесном сотрудничестве с иранскими мастерами-устадами, прежде всего Хаджи устадом
    Мохаммадом Навидом. При этом саму геометрическую систему задавала художница: от раннего соединения зеркальной
    сетки с традиционной каджарской обратной росписью по стеклу («Что-то старое, что-то новое», 1974, Tate) и
    строгих изометрических кубов («Без названия», 1976, Tate) она пришла к зрелым «семействам» правильных
    многоугольников — пятиугольникам, шестиугольникам и восьмиугольникам («Вариации на тему шестиугольника», 2006,
    V&A; «Пятиугольник», 2008, Tate; «Четвёртое семейство: восьмиугольник», 2013, Mia). Каждое движение зрителя
    пересобирает отражения в сотнях скошенных граней, превращая математическую схему в живую световую среду.
  traits:
    - Настенные рельефы и объёмные скульптуры из вручную вырезанных зеркальных граней, утопленных в гипсовую основу
    - Композиции строятся вокруг семейств правильных многоугольников (треугольника, пяти-, шести- и восьмиугольника) и лучевой симметрии
    - Сочетание серебристых зеркал с цветным стеклом, обратной росписью по стеклу и традиционными синими бусинами-оберегами
    - Постоянное изменение рисунка света и отражения при малейшем смещении точки взгляда зрителя
