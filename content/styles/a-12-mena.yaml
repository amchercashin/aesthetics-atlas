    Аль-катт аль-асири (локальное название — нагаш) — самобытная настенная живопись юго-западной провинции Асир на
    Аравийском полуострове, исторически создававшаяся исключительно женщинами для украшения меджлиса — главной
    гостевой комнаты каменного или глинобитного дома. Как зафиксировано в номинации ЮНЕСКО (2017) и полевом
    репортаже Алии Юнис в AramcoWorld (2013), хозяйки приглашали родственниц и соседок разных возрастов расписывать
    стены сообща, передавая орнаментальный словарь из рук в руки без шаблонов. Эта локальная женская практика
    принципиально не сводится к «общеисламскому» архитектурному орнаменту: её строй ближе к кочевому ткачеству
    ас-саду и горным домовым оберегам.


    Роспись опоясывает комнату по белой гипсовой штукатурке непрерывными горизонтальными регистрами, огибая ниши и
    деревянные оконные рамы цветными полосами. В словаре мотивов, записанном со слов мастериц Умм Абдуллы (Халимы
    бинт Абдуллы) и хранителей деревни Риджаль-Альмаа, базовые прямые полосы называются мосолат, каждый квадратный
    клейм с индивидуальной композицией — хатма, а ряды треугольников с тонкими ветвящимися «деревцами» наверху —
    банат («девочки», нередко посвящавшиеся дочерям дома). До прихода фабричных красок и кобальтово-синего пигмента
    примерно 70–80 лет назад палитра строилась на местных минералах, древесном угле, красном камне мешига, смоле
    дерева сомгха и зелени трав, а кисти делали из козьей шерсти и тонких прутьев. Одной из самых известных мастериц
    XX века стала Фатима Абу Гахас из Риджаль-Альмаа, расписавшая интерьер Каср-Бадера и передавшая ремесло новому
    поколению женщин Асира.
  traits:
    - Непрерывные горизонтальные пояса орнамента по ослепительно белой гипсовой стене, огибающие оконные и дверные проёмы
    - Ритмичные ряды треугольников банат с тонкими ветвящимися навершиями, ромбов, зигзагов и квадратных клейм хатма
    - Две исторические палитры: ранняя землисто-минеральная (чёрный, охра, красно-коричневый, жёлтый, травяной зелёный) и более поздняя с ярким синим и алым
    - Свободный ручной рисунок без трафаретов: чёткий чёрный каркас линий с последующим плотным заполнением цветом
