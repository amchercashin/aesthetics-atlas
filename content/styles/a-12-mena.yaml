  summary: >-
    Постколониальная педагогическая и художественная революция в Марокко 1960–1970-х: абстрактная геометрия,
    волновые мотивы, медь, кожа и дерево на стыке программы Баухауса и арабо-амазигских ремёсел.
  description: >-
    Школа Касабланки выросла из радикальной реформы муниципальной Школы изящных искусств, основанной французскими
    колониальными властями в 1920-х годах и опиравшейся на копирование античных гипсов. После обретения Марокко
    независимости (1956) новым директором школы в 1962 году стал художник Фарид Белькахия (руководил до 1974 года).
    Он открыл доступ марокканским студентам и женщинам и пригласил преподавать единомышленников: в 1964 году пришли
    историк искусства Тони Марени и живописец Мохамед Мелехи, в 1965-м — антрополог Берт Флинт (курс африканского и
    амазигского народного искусства), в 1966-м — Мохамед Шабаа (графический дизайн и декоративное искусство). По
    путеводителю Tate St Ives, преподаватели объединили искусство, ремесло, дизайн и архитектуру под влиянием
    междисциплинарной модели Баухауса и одновременно отказались от европейского станкового масла как единственной нормы.


    Студенты и наставники ездили по Марокко, документируя сельские ковры, амазигские украшения, роспись потолков,
    татуировки, каллиграфию и керамику, а затем переводили эти знаки на язык жёсткой геометрической абстракции,
    графики и общественных рельефов. В 1965 году начал выходить исследовательский бюллетень Maghreb Art, в 1966-м —
    авангардный журнал Souffles, а в 1969 году Белькахия, Мелехи, Шабаа и их коллеги устроили на площади в Марракеше
    и в Касабланке уличную выставку-манифест Présence Plastique в знак протеста против колониального «Весеннего
    салона». В собственной пластике лидеры школы выработали яркие авторские интонации: Мелехи писал целлюлозной
    краской по дереву вибрирующие волновые ленты и концентрические диски, Шабаа соединял оптические решётки с
    монументальными резными деревянными рельефами для общественных зданий, а Белькахия перешёл от чеканной меди к
    выделанной коже (веллуму), окрашенной хной и природными пигментами.
  traits:
    - Синтез жёсткокраевой геометрической абстракции, оптических волн и локальных арабо-амазигских знаков
    - Сознательный отказ от традиционного холста и масла в пользу ремесленных и промышленных материалов — дерева, меди, веллума, целлюлозной краски и природных красителей
    - Интеграция живописи, графики, типографики журналов и монументальных общественных рельефов с архитектурой и городской средой
    - Насыщенные чистые цветовые плоскости (алый, охра, травяно-зелёный, ультрамарин, шафран) рядом с тёплой некрашеной текстурой дерева и кожи
  promptCues:
