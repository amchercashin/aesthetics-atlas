  summary: >-
    Турецкое искусство мраморирования бумаги на воде: природные пигменты с бычьей желчью плавают по загущённому
    раствору, слагаются в облачные разводы, гребенчатые волны или цветы и одним касанием переносятся на лист.
  description: >-
    Эбру (от перс. абри / тур. эбр — «облачный» или «поверхность воды») — традиционная техника создания монотипных
    узоров на поверхности воды с последующим переносом рисунка на бумагу, занявшая центральное место в османском
    книжном деле и переплёте. Раннюю историю мраморирования бумаги нельзя сводить к одному источнику: близкие водные
    техники известны в Восточной Азии (японское суминагаси), Центральной Азии и Сефевидском Иране (очерк Met
    разбирает рядом османский альбом шейха Хамдуллы и сефевидский «Мантик ат-тайр» ок. 1600 года). В османских
    мастерских Стамбула техника получила развёрнутую систему подтипов и стала постоянной оправой для каллиграфических
    листов муракка, форзацев и обложек.


    Природные земляные и растительные пигменты растирают с водой и добавляют капли бычьей желчи, управляющей
    поверхностным натяжением, после чего набрызгивают кистями на лоток с загущённой водой (трагакантом или
    каррагинаном). Базовый слой нерасчёсанных капель образует «баттал-эбру»; проведение стержнем туда-обратно даёт
    узор «гельгит», а проход гребнем — плотные ритмические ряды «тараклы». В XVIII веке стамбульский мастер
    Хатип Мехмед Эфенди (ум. 1773) развил концентрические мотивы «хатип-эбру», вытянутые иглой по готовому фону,
    а на рубеже XIX–XX веков и в XX столетии линия мастеров Озбеклер Теккеси — Эдхем Эфенди, Неджмеддин Окъяй
    (1883/1885–1976, создатель цветочного «чичекли-эбру» с тюльпанами, гиацинтами и гвоздиками и каллиграфического
    «язылы-эбру») и Мустафа Дюзгюнман (1920–1990) — закрепила современный канон, передаваемый в Турции от мастера
    к ученику (включён в список ЮНЕСКО в 2014 году).
  traits:
    - Монотипный перенос плавающего на загущённой воде пигментного слоя на впитывающую бумагу без повторения оттиска
    - Устойчивые классические подтипы: крапчатый баттал, встречные волны гельгит, гребенчатый тараклы, концентрический хатип и цветочный чичекли
    - Органическая текучесть границ с тонкими белыми прожилками между каплями и мягкой минеральной палитрой
    - Историческая связь с каллиграфическими альбомами муракка, декоративными полями рукописей и переплётными форзацами
  promptCues:
