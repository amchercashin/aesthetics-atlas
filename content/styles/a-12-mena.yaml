  wiki: { en: Ottoman miniature }
  summary: >-
    Придворная книжная живопись Османской империи из мастерской наккашхане: ясные документальные хроники походов,
    праздничных шествий и топографических планов городов без лирической туманности персидского эпоса.
  description: >-
    Османская миниатюра (тасвир, накыш) складывалась при дворе султанов в Стамбуле начиная со второй половины XV века,
    когда при Мехмеде II и особенно после кампаний Селима I (1514–1517) в имперскую мастерскую наккашхане при дворце
    Топкапы пришли иранские, арабские и балканские мастера. При Сулеймане Великолепном в скриптории числилось свыше
    ста двадцати художников и книжных мастеров; именно тогда османская книга обрела собственный художественный язык,
    отчётливо отличный от лирико-поэтической персидской традиции. Главным заказчиком выступал не меценат любовных поэм,
    а имперская историография: придворные летописцы-шехнамеджи (такие как Сейид Локман Ашури) и живописцы
    фиксировали походы, осады, дипломатические приёмы, цеховые парады и родословные династии.


    Три ключевых рубежа задают узнаваемый облик традиции. В 1537 году полимат и картограф Матракчи Насух создал в
    рукописи «Бейан-и Меназил» (описание иракского похода Сулеймана) безлюдные панорамы-планы Стамбула, Галаты,
    Тебриза и крепостей, где архитектура развёрнута с высоты птичьего полёта. Во второй половине XVI века главный
    придворный художник Наккаш Осман и его мастерская («Зубдат ат-таварих» 1583, «Хюнернаме» и «Сурнаме-и Хюмаюн»
    1580-х) выработали строгий документальный строй с чётким членением пространства, парадными шеренгами сановников
    и ремесленных гильдий и безошибочной передачей костюмов и архитектурных силуэтов. В «Эпоху тюльпанов» при
    Ахмеде III мастер Левни (ум. 1732) оживил канон в праздничной хронике «Сурнаме-и Вехби» (ок. 1720) и камерном
    портретном альбоме муракка (Топкапы H.2164), добавив индивидуальную мимику, мягкие пастельные тона и свободное
    движение фигур.
