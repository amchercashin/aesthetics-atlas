  summary: >-
    Магрибская архитектурная мозаика из выколотых вручную кусочков глазурованной терракоты: сотни плотно
    подогнанных звёзд, ромбов и лент собираются в бесшовный геометрический ковёр на стенах, фонтанах и колоннах.
  description: >-
    Зеллидж (араб. аз-заллидж) — ремесленная архитектурная облицовка Магриба, сложившаяся в монументальный канон
    в Марокко эпохи Маринидов (XIV век) и Саадитов (XVI век) и непрерывно живая в мастерских Феса и Марракеша.
    Её принципиально нельзя путать с фабричной или расписной печатной плиткой с нанесённым поверх рисунком:
    подлинный зеллидж — это наборная мозаика. Как показывают каталоги музея Бата в Фесе (MWNF), сначала
    обожжённые глиняные квадраты покрывают однотонной оловянной глазурью (белой, медово-охристой, кобальтовой,
    изумрудно-зелёной, фиолетово-чёрной), затем мастер-нарезчик размечает на них фигуры и острым молотком-тесаком
    выкалывает отдельные элементы, скашивая терракотовый черепок под глазурью на конус, чтобы лицевые грани
    сомкнулись вплотную без широких швов.


    Геометрические построения зеллиджа (тестир) разворачиваются из деления окружности на равные доли: вокруг
    восьми-, двенадцати- и шестнадцатилучевых звёзд белые или цветные ленты-плетёнки образуют бесконечную
    математическую решётку. Для плавных криволинейных арабских надписей и растительных завитков маринидские
    мастера применяли родственный приём выемчатого (рельефного) зеллиджа: с чёрноглазурованных плиток молотком
    аккуратно скалывали глазурь фона, оставляя тёмные буквы в невысоком рельефе над матовой охристой терракотой.
    В классических дворах Феса и Марракеша панель зеллиджа всегда образует нижний ярус трёхчастной системы
    стены — под эпиграфическим фризом, зубчатой лентой шарафа, резным гипсовым стуком и потолком из кедра.
  traits:
    - Наборная мозаика из отдельных вручную выколотых кусочков однотонной глазурованной терракоты (а не печатная плитка)
    - Геометрические сети тестир со звёздами, ромбами и переплетающимися белыми или сине-чёрными лентами
    - Контраст глянцевой, чуть живой от ручного скола глазури в нижнем ярусе стены с матовым резным стуком выше
    - Особая разновидность выемчатого зеллиджа для курсивной арабской эпиграфики по обнажённому терракотовому фону
