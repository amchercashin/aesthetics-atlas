- id: neo-expressionism
  name: Неоэкспрессионизм
  orig: Neo-expressionism
  aliases: [неоэкспрессионизм, Баския, новые дикие, трансавангард]
  start: 1978
  end: 1990
  dates: 1978 – 1990
  era: postmodern
  domain: [art]
  region: США, Германия, Италия
  tier: 3
  kind: movement
  parents:
    - { id: expressionism, type: revival }
    - { id: graffiti-street-art, type: influence }
  summary: >
    После минимализма и концептуализма — снова грубая, яркая, фигуративная живопись: Баския, Кифер, «новые дикие».
  description: |
    К концу 1970-х многим надоело искусство идей, и живопись вернулась с размахом. Жан-Мишель Баския пришёл
    из уличного граффити (SAMO) и заполнил холсты коронами, черепами, анатомическими схемами и зачёркнутыми
    словами. В Германии Ансельм Кифер и Георг Базелиц писали темы истории и травмы. Арт-рынок 1980-х
    сделал неоэкспрессионистов звёздами.
  traits:
    - Грубая, экспрессивная фигуративность
    - Яркие цвета, наивный рисунок
    - Слова, символы, зачёркивания
    - Большие форматы и миф художника
  names: [Жан-Мишель Баския, Джулиан Шнабель, Ансельм Кифер, Георг Базелиц, Франческо Клементе]
  example:
    file: "enwiki:Untitled acrylic and mixed media on canvas by --Jean-Michel Basquiat--, 1984.jpg"
    title: Без названия
    author: Жан-Мишель Баския
    year: 1984
  wiki: Neo-expressionism
  links:
    - { title: "Neo-Expressionism", url: "https://www.theartstory.org/movement/neo-expressionism/", src: "The Art Story", lang: en }

- id: deconstructivism
  name: Деконструктивизм
  orig: Deconstructivism
  aliases: [деконструктивизм, Гери, Хадид, Либескинд]
  start: 1982
  end: null
  dates: 1980-е – наши дни
  era: postmodern
  domain: [architecture]
  region: Весь мир
  tier: 2
  kind: movement
  parents:
    - { id: constructivism, type: revival }
    - { id: postmodern-architecture, type: reaction }
  summary: >
    Здания, которые будто взорвались и застыли: изломанные плоскости, наклонные стены и титановые волны.
  description: |
    В 1988 году MoMA показала выставку «Деконструктивистская архитектура» с проектами Гери, Хадид, Колхаса,
    Либескинда и других. Они ломали прямой угол, напоминая о конструктивистах, и вдохновлялись философией
    Деррида. Компьютерное проектирование позволило построить невозможное: музей Гуггенхайма Фрэнка Гери
    в Бильбао из изогнутых титановых листов изменил целый город.
  traits:
    - Изломанные, наклонные, фрагментированные объёмы
    - Отказ от прямого угла и симметрии
    - Титан, сталь, стекло, сложные оболочки
    - Компьютерное проектирование форм
  names: [Фрэнк Гери, Заха Хадид, Даниэль Либескинд, Рем Колхас, Coop Himmelb(l)au]
  example:
    file: Museo Guggenheim, Bilbao (31273245344).jpg
    title: Музей Гуггенхайма в Бильбао
    author: Фрэнк Гери
    year: 1997
    place: Бильбао, Испания
  wiki: Deconstructivism
