- id: punk-graphics
  name: Панк-графика и DIY
  orig: Punk visual art
  aliases: [панк, зины, DIY, коллаж из вырезок, Джейми Рид]
  start: 1976
  end: 1990
  dates: 1976 – 1990
  era: postmodern
  domain: [design, art]
  medium: [graphic-design, typography, print]
  subjects: [any]
  region: Великобритания, США
  tier: 2
  kind: movement
  compare:
    - id: dada
      note: >-
        Редакционное сопоставление, не утверждение о происхождении. Сопоставление коллажа и провокации
        допустимо. Исследование предупреждает против распространения личных источников Рида и Макларена на весь
        панк; revival всего дада не установлено.
      sources:
        - ra26-punk-study
  parents:
    - id: pop-art
      type: influence
      status: verified
      note: >-
        MAD разбирает прямое заимствование Barney Bubbles из постеризованных изображений и цветовых блоков
        обложек Interview Warhol в афише Elvis Costello, Live Stiffs (1977). Влияние ограничено этим конкретным
        панк/постпанк-оформлением; не подменять Pop Art любой популярной культурой.
      sources:
        - ra26-d2-punk-mad
  summary: >
    Буквы, вырезанные из газет, как в письме с угрозой, ксерокс, булавки и «сделай сам».
  description: |
    Панк-рок 1976–1977 годов принёс эстетику дешёвой ярости. Джейми Рид оформил «God Save the Queen» Sex
    Pistols, заклеив глаза королевы буквами из газет. Самиздатовские зины печатались на ксероксе, флаеры
    клеились из вырезок. Главный принцип — DIY: не нужно уметь, нужно делать. Отсюда растут гранж-типографика,
    стрит-арт и нынешний «уродливый» дизайн.
  traits:
    - Буквы из газетных вырезок
    - Ксерокс, грубый контраст, грязь
    - Коллаж, булавки, рваные края
    - Провокация и анти-эстетика
  names: [Джейми Рид, Реймонд Петтибон, Линдер, Малкольм Макларен]
  example:
    file: "enwiki:Sex Pistols - God Save the Queen.jpg"
    title: Обложка сингла «God Save the Queen»
    author: Джейми Рид для Sex Pistols
    year: 1977
