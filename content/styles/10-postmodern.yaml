- id: early-cgi
  name: Ранняя компьютерная графика
  orig: Early computer graphics (CGI)
  aliases: [3D-графика 80-х, «Трон», чайник Юта, CGI, рейтрейсинг]
  start: 1975
  end: 1995
  dates: 1975 – 1995
  era: postmodern
  domain: [internet, design]
  region: США, Япония
  tier: 2
  kind: technique
  parents:
    - { id: computer-art, type: evolved }
  summary: >
    Глянцевые шары на шахматной доске, светящиеся каркасные сетки «Трона» и знаменитый чайник Юта.
  description: |
    В 1975 году в Университете Юты сделали трёхмерную модель обычного чайника — она стала «Hello, world!»
    компьютерной графики. Дальше пошли фильм «Трон» (1982) с неоновыми каркасами, рейтрейсинговые
    зеркальные шары на клетчатом полу, заставки телеканалов и первые 3D-логотипы. Эта синтетическая
    эстетика станет главным материалом для вейпорвейва, синтвейва и Y2K.
  traits:
    - Зеркальные шары, хром, клетчатый пол
    - Каркасные сетки и неоновые контуры
    - Идеальные, стерильные поверхности
    - Закатные градиенты и «цифровой горизонт»
  names: [Мартин Ньюэлл, Тёрнер Уиттед, «Трон», Pixar]
  example:
    file: Utah teapot simple.png
    title: Чайник Юта
    author: Мартин Ньюэлл (модель 1975)
    year: 1975
  wiki: Computer-generated imagery
  links:
