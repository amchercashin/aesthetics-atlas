- id: hyperrealism
  name: Фотореализм и гиперреализм
  orig: Photorealism / Hyperrealism
  aliases: [фотореализм, гиперреализм, суперреализм, photorealism]
  searchKeywords: [Ричард Эстес, Чак Клоуз, Рон Мьюик]
  scopeNote: >
    Объединяет фотореализм — живопись по фотографии конца 1960-х — 1970-х — и более широкий термин
    «гиперреализм», позже распространившийся и на скульптуру. Различие терминов обсуждается; здесь они
    собраны как близкие.
  start: 1968
  end: 2000
  dates: 1968 – 2000-е
  era: postmodern
  domain: [art]
  medium: [painting]
  subjects: [portrait, still-life, city, any]
  region: США
  tier: 3
  kind: movement
  parents:
    - id: pop-art
      type: influence
      status: verified
      note: >-
        Thyssen описывает заимствование американским Photorealism конца 1960-х сюжетов и интереса к стереотипным
        массовым изображениям из Pop Art. Влияние ограничено ранней американской фотореалистической ветвью;
        поздний международный гиперреализм шире этого корпуса.
      sources:
        - ra26-d2-hyperrealism
  gallery:
    - file: Hyperrealism painting by Payam Morshedi.jpg
      title: Пайам Моршеди. Гиперреализм
    - file: Robert Bechtle, Dwellingː New Acquisitions, Iris & B. Gerald Cantor Center for Visual Arts, Stanford University 06.jpg
      title: Бечтли. Жилище
  summary: >
    Картины, неотличимые от фотографии: хромированные закусочные, витрины и отражения, написанные кистью.
  description: |
    Вслед за поп-артом художники взяли фотографию как исходник и стали переносить её на холст с машинной
    точностью. Ричард Эстес писал витрины Нью-Йорка со сложными отражениями, Джон Бедер — придорожные
    закусочные, Чак Клоуз — гигантские лица. Позже гиперреалисты в скульптуре вроде Рона Мьюика довели
    иллюзию до жути.
  traits:
    - Фотографическая точность
    - Хром, стекло, отражения, неон
    - Городская повседневность Америки
    - Холодная, безоценочная интонация
  names: [Ричард Эстес, Чак Клоуз, Ральф Гоингс, Джон Бедер, Рон Мьюик]
  example:
    file: John's Diner by John Baeder.jpg
    title: John’s Diner with John’s Chevelle
    author: Джон Бедер
    year: 2007
    sources:
      - commons-hyperrealism-example
  wiki: Photorealism
  links:
    - { title: "Photorealism", url: "https://www.theartstory.org/movement/photorealism/", src: "The Art Story", lang: en }
  review:
    status: partial
    date: "2026-10-16"
    scope: [relations, images]
    note: >-
      Подпись конкретного изображения дополнена по странице файла; это не полная верификация истории
      направления. 16.10.2026 проверены исторические отношения и связанные с ними контексты и сопоставления;
      границы подтверждения указаны у каждой записи.
- id: postmodern-architecture
  name: Постмодернизм в архитектуре
  orig: Postmodern architecture
  aliases: [постмодерн, архитектурный постмодернизм, Грейвз, Вентури]
  start: 1972
  end: 2000
  dates: 1972 – 1990-е
  era: postmodern
  domain: [architecture, design]
  medium: [architecture]
  subjects: [city]
  region: США, Европа
  tier: 2
  kind: movement
  compare:
    - id: historicism
      note: >-
        Редакционное сопоставление, не утверждение о происхождении. Историческое цитирование и смешение
        допускают сравнение с эклектикой XIX века. Они не доказывают сознательное revival конкретной школы
        историзма.
      sources:
        - ra26-postmodern
  review:
    status: partial
    date: "2026-10-16"
    scope: [relations]
    note: >-
      16.10.2026 проверены исторические отношения и связанные с ними контексты и сопоставления; границы
      подтверждения указаны у каждой записи. Даты, описание и изображения карточки полностью не проверялись.
  parents:
    - id: international-style
      type: reaction
      status: verified
      note: >-
        MoMA прямо описывает проект Грейвса как отход от формальных и функциональных основ интернационального
        стиля. Подтверждение реакции ограничить этой архитектурной линией, не всеми постмодернистскими
        практиками.
      sources:
        - ra26-graves
        - ra26-postmodern
  summary: >
    «Меньше — это скучно»: колонны и фронтоны возвращаются — в цвете, гипертрофированные и с иронией.
  description: |
    Роберт Вентури ответил Мису: «Less is a bore». Постмодернисты вернули в архитектуру историю, символ
    и декор, но в виде цитат и шуток. Майкл Грейвз построил Портленд-билдинг с гигантскими плоскими
    пилястрами и гирляндами, Чарльз Мур — «Пьяцца д'Италия» из неоновых колонн. Многие здания эпохи
    сегодня кажутся комиксом на классику.
  traits:
    - Исторические формы как ирония и цитата
    - Яркие цвета, пастель, контрасты
    - Гипертрофированные фронтоны, арки, колонны
    - Смешение высокого и популярного
  names: [Роберт Вентури, Майкл Грейвз, Чарльз Мур, Альдо Росси, Филип Джонсон]
  example:
    file: Portland Building 1982.jpg
    title: Портленд-билдинг
    author: Майкл Грейвз
    year: 1982
    place: Портленд, США
  gallery:
    - asset: assets/works/postmodern-550-madison.jpg
      title: 550 Madison Avenue (AT&T Building)
