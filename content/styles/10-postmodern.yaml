    note: >-
      Связи — 16.10.2026, границы у записи. 09.11.2026: даты — по Тейт и музею Тиссена; описание — 5 утверждений сверено; снято «довели иллюзию до жути» и перечень сюжетов отдельных художников. Главная иллюстрация — страница файла с данными автора.
      Галерея: снимок музейной этикетки под подписью «Бечтли. Жилище» заменён скульптурой Мьюика (Р2): картины на нём не было.
- id: postmodern-architecture
  name: Постмодернизм в архитектуре
  orig: Postmodern architecture
  aliases: [постмодерн, архитектурный постмодернизм]
  searchKeywords: [Грейвз, Вентури]
  start: 1972
  end: 2000
  dates: 1970-е – 1990-е
  approx: true
  dateKind: period
  dateNote: >
    Тейт: термин появился около 1970 года. Музей Виктории и Альберта: радикальная окраина 1970-х стала господствующим стилем 1980-х. Отметки 1972 и 2000 условны.
  era: postmodern
  domain: [architecture, design]
  medium: [architecture]
  subjects: [city]
  region: США, Европа
  tier: 2
  kind: movement
  compare:
    - id: historicism
      note: >-
        Редакционное сопоставление, не утверждение о происхождении. Историческое цитирование и смешение
        допускают сравнение с эклектикой XIX века. Они не доказывают сознательное revival конкретной школы
        историзма.
      sources:
        - ra26-postmodern
  review:
    status: reviewed
    date: "2026-11-09"
    scope: [relations, dates, text, images, gallery]
    note: >-
      Связи — 16.10.2026, границы у записи. 09.11.2026: даты — по Тейт и Музею Виктории и Альберта; описание — 4 утверждения сверено; снято «Less is a bore» и «комикс на классику»: открытого источника на цитату нет; Вентури и Росси убраны из имён.
      Главная иллюстрация — Британника и страница файла, снятого в 1982 году. Галерея: у копии AT&T источник не установлен, упоминание SOM снято; Пьяцца д'Италия — Фонд культурного ландшафта, у неё указан соавтор.
  parents:
    - id: international-style
      type: reaction
      status: verified
      note: >-
        MoMA прямо описывает проект Грейвса как отход от формальных и функциональных основ интернационального
        стиля. Подтверждение реакции ограничить этой архитектурной линией, не всеми постмодернистскими
        практиками.
      sources:
        - ra26-graves
        - ra26-postmodern
  summary: >
    Колонны и фронтоны возвращаются — в цвете, преувеличенные и с иронией.
  description: |
    Постмодернизм стал реакцией на идеи модернизма; термин появился около 1970 года. В архитектуре вернулись историческая отсылка, цвет и орнамент. Майкл Грейвз ввёл их в Портленд-билдинг,
    у здания AT&T Филипа Джонсона в Нью-Йорке (1984) верх напоминает шкаф чиппендейл, а площадь Пьяцца д'Италия в Новом Орлеане (1978) создали Чарльз Мур и фирма Perez & Associates.
    Из радикальной окраины 1970-х постмодернизм превратился в господствующий стиль 1980-х.
  traits:
    - Исторические формы как ирония и цитата
    - Яркие цвета, пастель, контрасты
    - Гипертрофированные фронтоны, арки, колонны
    - Смешение высокого и популярного
  names: [Майкл Грейвз, Чарльз Мур, Филип Джонсон]
  example:
    file: Portland Building 1982.jpg
    title: Портленд-билдинг
    author: Майкл Грейвз
    year: 1982
    place: Портленд, США
    note: Снимок августа 1982 года, примерно за восемь недель до открытия.
    whyRepresentative: >-
      Плоский фасад с крупными пилястрами-символами, гирляндами и резким цветом: классика превращена в цитату.
    sources: [britannica-graves, commons-portland-1982, portland-gov-building]
  evidence:
    - { claim: "Термин появился около 1970 года; реакция на модернизм", field: dates, source: tate-postmodernism }
    - { claim: "Радикальная окраина 1970-х, господствующий стиль 1980-х", field: description, source: ra26-postmodern }
    - { claim: "Портленд-билдинг: исторические отсылки, цвет и орнамент", field: traits, source: britannica-graves }
    - { claim: "AT&T Building, 1984, верх в духе чиппендейл", field: description, source: britannica-johnson }
