  summary: >
    Подписи-теги на поездах метро превращаются в многоцветные «куски», а затем — в мировой музейный стрит-арт.
  description: |
    В начале 1970-х подростки Нью-Йорка начали расписывать вагоны метро своими именами. Теги выросли
    в огромные «пис» с объёмными буквами wildstyle, персонажами и эффектами. Вместе с хип-хопом граффити
    разошлось по миру, а в 2000-х стрит-арт Бэнкси, Shepard Fairey и других стал одним из самых узнаваемых
    языков современной культуры.
  traits:
