- id: hyperrealism
  name: Фотореализм и гиперреализм
  orig: Photorealism / Hyperrealism
  aliases: [фотореализм, гиперреализм, суперреализм, photorealism]
  searchKeywords: [Ричард Эстес, Чак Клоуз, Рон Мьюик]
  scopeNote: >
    Объединяет фотореализм — живопись по фотографии конца 1960-х — 1970-х — и более широкий термин
    «гиперреализм», позже распространившийся и на скульптуру. Различие терминов обсуждается; здесь они
    собраны как близкие.
  start: 1968
  end: 2000
  dates: конец 1960-х – 2000-е
  approx: true
  dateKind: period
  dateNote: >
    Тейт и музей Тиссена: фотореализм появился в конце 1960-х годов. Тейт отмечает новый интерес к нему в начале 1990-х; конец периода условен.
  era: postmodern
  domain: [art]
  medium: [painting, sculpture]
  subjects: [portrait, still-life, city, any]
  region: США
  tier: 3
  kind: movement
  parents:
    - id: pop-art
      type: influence
      status: verified
      note: >-
        Thyssen описывает заимствование американским Photorealism конца 1960-х сюжетов и интереса к стереотипным
        массовым изображениям из Pop Art. Влияние ограничено ранней американской фотореалистической ветвью;
        поздний международный гиперреализм шире этого корпуса.
      sources:
        - ra26-d2-hyperrealism
  gallery:
    - file: Hyperrealism painting by Payam Morshedi.jpg
      title: Пайам Моршеди. Гиперреализм
      author: Пайам Моршеди
      year: 2002 (по странице файла)
      note: На изображении виден водяной знак автора.
      whyRepresentative: >-
        Кожа, волосы и ткань переданы с точностью снимка: виртуозность письма скрывает мазок.
    - file: Ron Mueck Chicken man 2019.jpg
      title: Рон Мьюик. Chicken / Man
      author: Рон Мьюик
      year: 2019
      place: Художественная галерея Крайстчерча
      whyRepresentative: >-
        Гиперреализм в скульптуре: кожа и волосы фигуры воспроизведены с иллюзорной точностью.
  summary: >
    Картины, похожие на фотографию: закусочные, витрины и отражения, написанные кистью.
  description: |
    В конце 1960-х годов в США галерист Луис Мейзел назвал фотореалистами художников, которые использовали камеру как подспорье и механически переносили снимок на холст.
    Такая живопись отказывалась от личного почерка ради фотографической ясности и эмоциональной нейтральности, а обыденные сюжеты сближали её с поп-артом.
    Признание пришло на «Документе 5» в Касселе в 1972 году; Ричард Эстес заново придумал городскую ведуту. В начале 1990-х новые камеры и цифровая техника вернули интерес к направлению.
  traits:
    - Фотографическая точность
    - Хром, стекло, отражения
    - Городская повседневность
    - Эмоционально нейтральная интонация
  names: [Ричард Эстес, Луис Мейзел, Одри Флэк, Джон Бедер, Рон Мьюик]
  example:
    file: John's Diner by John Baeder.jpg
    title: John’s Diner with John’s Chevelle
    author: Джон Бедер
    year: 2007
    note: Поздняя работа художника, масло на холсте.
    whyRepresentative: >-
      Закусочная, старая машина и деревья написаны с чёткостью снимка, без заметного мазка и авторской оценки.
    sources:
      - commons-hyperrealism-example
  evidence:
