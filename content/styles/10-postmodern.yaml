- id: pixel-art
  name: Пиксель-арт
  orig: Pixel art
  aliases: [пиксельная графика, 8-бит, 16-бит, спрайты]
  start: 1975
  end: null
  dates: 1975 – наши дни
  era: postmodern
  domain: [internet, design]
  region: США, Япония, весь мир
  tier: 2
  kind: technique
  parents:
    - { id: computer-art, type: evolved }
  summary: >
    Изображение, собранное вручную по квадратику: от спрайтов аркад и приставок до инди-игр и NFT.
  description: |
    Ограниченная память ранних компьютеров и приставок заставила художников рисовать каждый пиксель вручную,
    с палитрой из нескольких цветов. Из технического ограничения выросла самостоятельная эстетика: читаемые
    силуэты, дизеринг, изометрия. Сегодня пиксель-арт — сознательный выбор инди-разработчиков, иллюстраторов
    и интерфейсов, а 8-битная ностальгия питает Web 1.0 и уирдкор.
  traits:
    - Видимые квадратные пиксели
    - Ограниченная палитра и дизеринг
    - Чёткие, читаемые силуэты
    - Изометрия и тайловые сцены
  names: [Сьюзан Кэр, Марк Феррари, Пол Робертсон, eBoy]
