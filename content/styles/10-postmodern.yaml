  aliases: [новая волна в типографике, New Wave typography, Swiss Punk, гранж-типографика]
  searchKeywords: [Вайнгарт, Эйприл Грейман, Дэвид Карсон, Ray Gun, Emigre, Design Quarterly]
  start: 1977
  end: 1998
  dates: конец 1970-х – 1990-е
  dateKind: practice
  approx: true
  era: postmodern
  domain: [design]
  medium: [graphic-design, typography]
  subjects: [any]
  region: Швейцария, США
  tier: 3
  kind: movement
  scopeNote: >-
    Карточка объединяет две волны отказа от модернистской сетки: «новую волну» конца 1970-х — 1980-х, выросшую
    из базельской школы и соединившуюся с первыми Macintosh, и гранж-типографику 1990-х. Это редакционное
    объединение последовательных этапов, а не одно движение с общей программой.


    В музыкальной и журнальной графике здесь представлен также Невилл Броуди. Его панк-линия относится к
    обложкам и The Face; она не является общей предысторией базельской типографики, работ Грейман и
    гранж-типографики Карсона.
  parents:
    - id: swiss-style
      type: reaction
      status: verified
      sources:
        - moma-greiman-dq133
      note: >-
        MoMA: Грейман училась швейцарскому модернизму в Базеле, а затем оказалась в авангарде движения,
        отказавшегося от сеток, гротесков и «чистого» вида модернистской типографики.
    - id: punk-graphics
      type: influence
      status: verified
      note: >-
        Влияние punk документировано для ранних обложек Neville Brody, Fetish / Cabaret Voltaire и его
        журнальной практики The Face: его собственные интервью и современный работам профиль называют печатные
        ориентиры и профессиональные контакты. Этот канал не объясняет начало программы Weingart в 1968 году и
        не приписывается автоматически Greiman или Carson.
      sources:
        - ra26-d4-brody-1986
