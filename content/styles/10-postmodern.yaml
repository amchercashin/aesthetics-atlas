  summary: >
    Будущее, в котором центр — африканская культура: космические фараоны Сан Ра, фанк-корабли и Ваканда.
  description: |
    Джазмен Сан Ра в 1970-х выступал в костюмах египетских фараонов-космонавтов и снял фильм «Space Is the
    Place». Parliament-Funkadelic летал на «Материнском корабле». Термин «афрофутуризм» появился в 1990-х,
    а в 2010-х эстетика стала массовой благодаря Жанель Монэ и фильму «Чёрная пантера» с его Вакандой.
  traits:
    - Космос и древний Египет вместе
    - Африканские узоры, ткани и символы в футуристическом ключе
    - Золото, металл, яркие цвета
    - Музыка как источник образов
  names: [Сан Ра, Джордж Клинтон, Октавия Батлер, Жанель Монэ, Рут Картер]
