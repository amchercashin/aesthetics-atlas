  summary: >
    Пластиковый ламинат в горошек, кислотные цвета и мебель-игрушки: дерзкий ответ «хорошему вкусу».
  description: |
    В 1980 году Этторе Соттсасс собрал у себя в Милане молодых дизайнеров, и под песню Боба Дилана «Stuck
