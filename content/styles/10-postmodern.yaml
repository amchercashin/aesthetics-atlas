  scopeNote: >
    Карточка объединяет две волны отказа от модернистской сетки: «новую волну» конца 1970-х — 1980-х,
    выросшую из базельской школы и соединившуюся с первыми Macintosh, и гранж-типографику 1990-х.
    Это редакционное объединение последовательных этапов, а не одно движение с общей программой.
  parents:
    - { id: swiss-style, type: reaction, status: verified, sources: [moma-greiman-dq133], note: "MoMA: Грейман училась швейцарскому модернизму в Базеле, а затем оказалась в авангарде движения, отказавшегося от сеток, гротесков и «чистого» вида модернистской типографики." }
    - { id: punk-graphics, type: influence }
  summary: >
    Типографика, разорвавшая сетку: наложенные слои, растр и пиксели, разреженный набор, а в 1990-х —
    нечитаемость как стиль.
  description: |
    Вольфганг Вайнгарт, преподававший в Базеле, начал ломать строгий швейцарский стиль изнутри: слои,
    растры, ступенчатые строки. Его ученики принесли «новую волну» в Америку. Эйприл Грейман, учившаяся
    в Базеле, в Лос-Анджелесе сделала компьютер инструментом дизайна: выпуск Design Quarterly №133
    «Does It Make Sense?» (1986) целиком собран в MacDraw из пиксельного видео, текста и чужих изображений.
    В 1990-х Дэвид Карсон в журнале Ray Gun довёл разрушение сетки до нечитаемости — это назвали
    гранж-типографикой.
  traits:
    - Сломанная сетка и наложенные слои
    - Разные кегли и шрифты в одной строке
    - Растр, пиксели, шум, фотокопия
    - Выразительность важнее читаемости
  names: [Вольфганг Вайнгарт, Эйприл Грейман, Дэвид Карсон, Невилл Броуди]
