- id: cyberpunk
  name: Киберпанк
  orig: Cyberpunk
  aliases: [киберпанк, «Бегущий по лезвию», неон, high tech low life]
  start: 1982
  end: null
  dates: 1982 – наши дни
  era: postmodern
  domain: [design, art]
  region: США, Япония
  tier: 1
  kind: movement
  kindNote: "Жанр научной фантастики и его визуальный язык в кино, иллюстрации и играх."
  parents:
    - { id: punk-graphics, type: influence }
    - { id: high-tech, type: influence }
  summary: >
    «Высокие технологии, низкая жизнь»: неоновый дождь, иероглифы на рекламе, мегакорпорации и импланты.
  description: |
    Фильм «Бегущий по лезвию» Ридли Скотта и роман «Нейромант» Уильяма Гибсона в 1982–1984 годах создали
    образ будущего, который до сих пор узнаётся мгновенно: перенаселённый мегаполис под вечным дождём,
    неон и голограммы, азиатские вывески, грязь и хром. Аниме «Акира» и «Призрак в доспехах» сделали
    стиль мировым, а гонконгские улицы — его реальным прототипом.
  traits:
    - Неон в темноте и дождь
    - Плотный мегаполис, вывески, иероглифы
    - Хром, провода, импланты
    - Контраст роскоши корпораций и нищеты улиц
  names: [Ридли Скотт, Сид Мид, Уильям Гибсон, Кацухиро Отомо, Мамору Осии]
  example:
    file: "enwiki:Blade Runner spinner flyby.png"
    title: Кадр из фильма «Бегущий по лезвию»
    author: Ридли Скотт, художник Сид Мид
