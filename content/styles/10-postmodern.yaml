    title: Здание Lloyd's
    author: Ричард Роджерс
    year: 1978–1986
    place: Лондон
  wiki: High-tech architecture
  links: []

- id: memphis-design
  name: Мемфис
  orig: Memphis Group
  aliases: [Memphis Milano, Соттсасс, мемфис-дизайн, 80-е]
  start: 1981
  end: 1988
  dates: 1981 – 1988
  era: postmodern
  domain: [design]
  region: Италия
  tier: 1
  kind: school
  parents:
    - { id: pop-art, type: evolved }
    - { id: art-deco, type: influence }
  summary: >
    Пластиковый ламинат в горошек, кислотные цвета и мебель-игрушки: дерзкий ответ «хорошему вкусу».
  description: |
    В 1980 году Этторе Соттсасс собрал у себя в Милане молодых дизайнеров, и под песню Боба Дилана «Stuck
    Inside of Mobile with the Memphis Blues Again» родилось название. Книжный шкаф «Карлтон» похож на
    тотем из цветных пластиковых плоскостей. Мемфис был коммерческим провалом и культурной бомбой: его
    узоры на десятилетия определили облик 80-х и вернулись в «корпоративном Мемфисе» 2010-х.
  traits:
    - Пластиковый ламинат с узорами — горошек, зигзаги, «червячки»
    - Кислотные и пастельные цвета вместе
    - Геометрические, игрушечные формы
    - Ирония против функционализма
  names: [Этторе Соттсасс, Микеле де Лукки, Натали дю Паскье, Мартин Бедин, Майкл Грейвз]
  example:
    file: Carlton Bookcase, by Ettore Sottsass, 1981, wood veneer and plastic laminate, Inv. FNAC 1980, Musée des Arts Décoratifs, Paris (01).png
    title: Книжный шкаф «Карлтон»
    author: Этторе Соттсасс
    year: 1981
    place: Музей декоративного искусства, Париж
  gallery:
    - { file: "Memphis-Milano Movement.jpg", title: "Предметы группы Memphis" }
  wiki: Memphis Group
  links: []

- id: punk-graphics
  name: Панк-графика и DIY
  orig: Punk visual art
  aliases: [панк, зины, DIY, коллаж из вырезок, Джейми Рид]
  start: 1976
  end: 1990
  dates: 1976 – 1990
  era: postmodern
  domain: [design, art]
  region: Великобритания, США
  tier: 2
  kind: movement
  parents:
    - { id: dada, type: revival }
    - { id: pop-art, type: influence }
  summary: >
    Буквы, вырезанные из газет, как в письме с угрозой, ксерокс, булавки и «сделай сам».
  description: |
    Панк-рок 1976–1977 годов принёс эстетику дешёвой ярости. Джейми Рид оформил «God Save the Queen» Sex
    Pistols, заклеив глаза королевы буквами из газет. Самиздатовские зины печатались на ксероксе, флаеры
    клеились из вырезок. Главный принцип — DIY: не нужно уметь, нужно делать. Отсюда растут гранж-типографика,
    стрит-арт и нынешний «уродливый» дизайн.
  traits:
    - Буквы из газетных вырезок
    - Ксерокс, грубый контраст, грязь
    - Коллаж, булавки, рваные края
    - Провокация и анти-эстетика
  names: [Джейми Рид, Реймонд Петтибон, Линдер, Малкольм Макларен]
  example:
    file: "enwiki:Sex Pistols - God Save the Queen.jpg"
    title: Обложка сингла «God Save the Queen»
    author: Джейми Рид для Sex Pistols
    year: 1977
  gallery:
    - { file: "UK and US zines.jpg", title: "Британские и американские зины" }
  wiki: { en: Punk visual art, ru: Панк }
