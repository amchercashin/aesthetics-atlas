- id: graffiti-street-art
  name: Граффити и стрит-арт
  orig: Graffiti and street art
  aliases: [граффити, стрит-арт, теги, Бэнкси, нью-йоркские поезда]
  start: 1970
  end: null
  dates: 1970 – наши дни
  era: postmodern
  domain: [art]
  region: Нью-Йорк, затем весь мир
  tier: 1
  kind: technique
  parents:
    - { id: pop-art, type: influence }
  summary: >
    Подписи-теги на поездах метро превращаются в многоцветные «куски», а затем — в мировой музейный стрит-арт.
  description: |
    В начале 1970-х подростки Нью-Йорка начали расписывать вагоны метро своими именами. Теги выросли
    в огромные «пис» с объёмными буквами wildstyle, персонажами и эффектами. Вместе с хип-хопом граффити
    разошлось по миру, а в 2000-х стрит-арт Бэнкси, Shepard Fairey и других стал одним из самых узнаваемых
    языков современной культуры.
  traits:
    - Объёмные буквы, wildstyle, теги
    - Аэрозольная краска, яркие контуры
    - Публичное пространство как холст
    - Трафареты, стикеры, муралы
  names: [Донди Уайт, Lee Quiñones, Futura, Кит Харинг, Бэнкси]
  example:
    file: Bus129 dondi ny 1984.jpg
    title: Граффити Донди Уайта
    author: Донди Уайт
    year: 1984
    place: Нью-Йорк
  wiki: Graffiti
  links:
