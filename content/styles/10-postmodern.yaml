      year: 1984
      place: Нью-Йорк
      credit: SOM / Britannica
      license: © SOM; образовательное использование
      nonfree: true
      reference: https://www.som.com/projects/550-madison-avenue/
      whyRepresentative: Небоскрёб с разорванным фронтоном и историческими цитатами — икона постмодернистской архитектуры.
    - { file: "Piazza d'Italia, New Orleans, from Commerce Street, 22 May 2024.jpg", title: "Пьяцца д'Италия", author: "Чарльз Мур", year: "1978" }
