    Здесь объединены разные авторские линии Lowbrow и Pop Surrealism. Влияние Дали относится к живописи Todd
    Schorr, а влияние Warhol и Lichtenstein — к Niagara и её связи с lowbrow / Juxtapoz-средой. Эти частные
    случаи не описывают происхождение всей сцены у Robert Williams в 1970-х.
  parents:
    - id: surrealism
      type: influence
      status: verified
      note: >-
        San José Museum of Art прямо называет Дали одним из источников тщательно выписанных фантастических
        картин Todd Schorr, представителя Pop Surrealism. Влияние ограничено этим авторским корпусом; Lowbrow не
        является простым возрождением исторического сюрреализма.
      sources:
        - ra26-d2-schorr
    - id: pop-art
      type: influence
      status: verified
      note: >-
        Влияние ограничено корпусом Niagara: в интервью 2009 года она прямо признаёт воздействие Warhol и
        Lichtenstein. Её связь с lowbrow / pop-surrealist окружением документирует интервью 2022 года. Это
        персональный пример, не происхождение Lowbrow у Williams в 1970-х: его собственное интервью называет
        другие опоры и критикует Pop Art.
      sources:
        - ra26-d3-niagara-2009
