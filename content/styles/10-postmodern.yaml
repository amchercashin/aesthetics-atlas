    - { claim: "Новый интерес в начале 1990-х благодаря цифровой технике", field: description, source: tate-photorealism }
    - { claim: "Документа 5, 1972; Эстес и городская ведута", field: description, source: ra26-d2-hyperrealism }
  wiki: Photorealism
  links:
