  summary: >-
    Звери и птицы Приймаченко 1936–1965 годов: зелёный слон, синий бык, золотой павлин, покрытые звёздами, точками
    и цветами, на светлом или ярко-синем поле.
  description: >-
    По очерку Министерства культуры Украины на Google Arts & Culture, Приймаченко ещё при жизни стала классиком
    наивного искусства. Её работы впервые показали в 1936 году, затем в Париже, Варшаве, Монреале и Праге; в
    1966 году она получила Шевченковскую премию и написала больше трёх тысяч картин. Её картины яркие и
    многоцветные, а «бестиарий» населяют львы и слоны, кошачий король, птицы-«украинские танцоры» и красный
    зверь на восьми ножках с клыками — «Угроза войны».


    В работах Национального музея декоративного искусства Украины видно, как устроены эти звери. «Зелёный слон»
    (1936) покрыт синими и красными звёздочками, на спине у него птица в колпаке. У «Синего быка» (1940-е) тело
    усыпано белыми цветочками в красных точках, а голова с рогами повёрнута назад. «Павлин на хмелю» (1965)
    написан гуашью на ярко-синем фоне среди зелёных листьев и ягод. Музей художницы в Иванкове, по очерку,
    уничтожен российскими войсками 25 февраля 2022 года.
  traits:
    - Фантастические звери и птицы, увиденные целиком, в профиль
    - Тело зверя покрыто орнаментом — звёздами, точками, цветами
    - Чистые локальные цвета на белом или ярко-синем поле
    - Цветы и ветки как декоративная рамка вокруг фигуры
