  wiki: { en: Petrykivka painting }
  summary: >-
    Орнаментальная роспись села Петриковка: фантастические цветы, калина, петухи и птицы, свободный мазок на
    белом поле — на стенах, утвари, сундуках и бумаге.
  description: >-
    По тексту ЮНЕСКО (Репрезентативный список, 2013), жители Петриковки расписывают жилища, домашнюю утварь и
    музыкальные инструменты орнаментом с фантастическими цветами и другими природными мотивами, основанными на
    наблюдении местных растений и животных. Роспись полна символов: петух означает огонь и духовное
    пробуждение, птицы — свет, гармонию и счастье, а сама роспись, по народному поверью, защищает от горя и зла.
    Расписывают прежде всего женщины всех возрастов, в каждой семье есть хотя бы одна мастерица, а основам
    учат в местных школах.


    Работы Татьяны Паты в Национальном музее декоративного искусства Украины показывают традицию на бумаге и
    фанере: лёгкий цветок 1913 года, «Зелёный сундук» 1926–1928 годов — расписной сундук рядом с букетом, и
    «Павлины на калине» 1951 года, где две птицы с длинными хвостами сидят в кусте красных гроздьев. От
    русских росписей атлас её отделяет: это украинская сельская традиция, а не промысел.
  traits:
    - Фантастические цветы и травы, выросшие из наблюдения местной природы
    - Птицы, петухи и калина как символы
    - Лёгкие свободные мазки — лепестки, листья, перья
    - Светлое поле стены, утвари или бумаги
