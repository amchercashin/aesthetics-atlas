  admission:
    language: >-
      Фигура в движении в костюме с крупным плоским узором, насыщенный контрастный цвет и гибкая линия;
      в декорации — плотный орнаментальный пейзаж.
    corpus: >-
      Четыре самостоятельных листа к четырём разным балетам 1910–1912 годов; два из них выполнены позже
      премьер (1919 и 1922) и подписаны так.
    distinctness: >-
      Уже «Мира искусства»: не ретроспективная живопись, а театральный эскиз тела в движении; отличается и от
      модерна вообще — это язык сцены и костюма одного художника.
    significance: >-
      Met называет «Шехеразаду» первой оригинальной постановкой «Русских балетов» и одним из самых успешных
      балетов Бакста, а его эскизы хранит и комментирует как отдельный корпус.
    sources:
      - met-bakst-sultan-2015-787-12
      - met-bakst-nijinsky-peri-22-226-1
      - met-bakst-brigand-22-46
  scopeNote: >-
    Четыре театральных эскиза Бакста из Метрополитен-музея к балетам «Нарцисс», «Дафнис и Хлоя», «Пери» и
    «Шехеразада». Станковая живопись, портреты и книжная графика Бакста (в том числе «Ужин» в карточке «Мира
    искусства»), исполненные костюмы и поздние реконструкции постановок в карточку не входят.
  dateNote: >-
    1911 и 1922 — даты листов корпуса по записям Met. Премьеры балетов — 1910–1912; листы к «Шехеразаде» и
    «Пери» датированы 1919 и 1922 годами, то есть сделаны позже первых постановок.
