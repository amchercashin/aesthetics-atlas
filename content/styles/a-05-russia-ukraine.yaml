    Эскизы костюмов и декораций Льва Бакста для «Русских балетов» Дягилева: яркий цвет, крупный узор на
    ткани, гибкая чувственная линия фигуры и пышная зелень декорации.
  description: >-
    Карточка охватывает театральные эскизы Бакста для антрепризы Дягилева «Русские балеты» 1910–1920-х
    годов. По этикеткам Met, Бакст пришёл туда опытным портретистом, иллюстратором и декоратором, а его эскизы
    показывают связь с символизмом и модерном: драматичный цвет и чувственную линию. Для «Дафниса и Хлои»
    он брал позы и узоры с античных ваз, для «Шехеразады» — экзотику Востока, которую современники называли
    «вихрем цвета».


    Фигура на эскизе — не мода и не портрет, а движение тела в костюме: руки раскинуты, ткань несёт крупный
    узор — зигзаги, ромбы, пятна. В декорации к «Нарциссу» тот же язык уходит в пейзаж: тяжёлая перистая
    листва и густой зелёный цвет. В отличие от ретроспективной живописи «Мира искусства», здесь главное —
    сцена и тело в движении. Часть листов выполнена позже премьер, и карточка не выдаёт их за рабочие
    эскизы к первой постановке.
  traits:
    - Фигура в движении — раскинутые руки, изгиб корпуса, лёгкий контур
    - Крупный плоский узор на ткани — зигзаги, ромбы, пятна, золото и серебро
    - Насыщенный контрастный цвет на светлом поле листа
    - Декорация как густой орнаментальный пейзаж с тяжёлой листвой
