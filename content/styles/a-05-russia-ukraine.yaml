    language: >-
      Фантастические звери и птицы с телами, покрытыми орнаментом, в чистых локальных цветах, с цветочной рамкой.
    corpus: Три самостоятельные работы 1936, 1940-х и 1965 годов в акварели и гуаши и «Лев в кровати» в галерее.
    distinctness: >-
      Уже наивного искусства в целом и петриковской росписи: язык одной художницы из села Болотня, построенный на
      зверях, а не на цветочном орнаменте.
    significance: >-
      Очерк Министерства культуры Украины называет Приймаченко классиком наивного искусства, лауреатом
