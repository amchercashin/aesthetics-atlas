  wiki: { en: Mikhail Vrubel, ru: Врубель, Михаил Александрович }
  summary: >-
    Живопись и майолика Михаила Врубеля 1890-х годов: объёмы разбиты на грани и «кристаллизованы», мазок
    мастихином лежит плитками, а в майолике швы между кусками становятся линиями рисунка.
  description: >-
    Карточка охватывает работы Врубеля 1890–1900 годов из Третьяковской галереи: «Демона сидящего», «Пана»,
    майоликовый камин «Микула Селянинович и Вольга» и «Царевну-Лебедь». По тексту музея, в «Демоне» художник
    создаёт свою живописно-пластическую систему: разбивает объёмы на грани, «кристаллизует» их, делает
    полупрозрачными и насыщает светом, а мазки мастихином и широкой кистью превращают цветы в «друзы
    кристаллов». О «Царевне-Лебеди» музей пишет как о «многогранной кристаллической структуре».


    Тот же принцип переходит в майолику: в камине крупные фигурные куски сложены, как мозаика, а швы стали
    линиями рисунка. Сюжеты — Лермонтов, античный миф, былина, опера Римского-Корсакова — служат поводом для
    фантастического, а не иллюстрации. В отличие от ретроспективной графики «Мира искусства», поверхность здесь
    не плавная, а дробная и тяжёлая; от общего модерна врубелевский язык отличает именно эта гранёная фактура.
  traits:
    - Объёмы разбиты на грани и «кристаллизованы», полупрозрачные и насыщенные светом
    - Плотный мазок мастихином и широкой кистью, лежащий плитками
    - Мозаичное членение поверхности — в майолике швы между кусками становятся рисунком
    - Фантастический образ на основе мифа, поэмы или былины, а не иллюстрация
