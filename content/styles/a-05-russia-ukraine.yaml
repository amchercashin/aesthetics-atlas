  summary: >-
    Абрамцевские постройки 1880-х: свободная стилизация средневековой русской архитектуры, сказочный силуэт,
    резьба и многоцветные изразцы — художники кружка Мамонтова против механической эклектики «русского стиля».
  description: >-
    По тексту музея-заповедника «Абрамцево», церковь Спаса (1881–1882) строили участники Мамонтовского кружка
    «по образцу старых русских соборов». Первый проект Поленова восходил к новгородскому Спасу на Нередице;
    Васнецов, увлечённый Кремлём, московскими, ярославскими и ростовскими церквами, изменил пропорции и сделал
    фасады декоративнее. Художники сами чертили фасады и орнаменты и писали иконы, а женщины кружка вышивали
    хоругви и высекали орнамент по камню. Музей называет церковь «тонкой стилизацией под старину», которая
    соединяет элементы разных школ средневековой архитектуры и «считается первым произведением русского модерна».


    Тот же язык, по музею, развит в «Избушке на курьих ножках» Васнецова (1883): сруб на пнях, конёк с резной
    конской головой, совы и летучие мыши на фронтонах, позже ставшие любимыми мотивами модерна. Часовня по
    проекту Васнецова (1891–1892) украшена поясами многоцветных изразцов. Рядом в той же усадьбе стоят
    мастерская Гартмана (1873) и баня Ропета — образцы «псевдорусского стиля», где, по музею, народные мотивы
    соединены механически; Васнецов писал, что такая архитектура его не удовлетворяла.
  traits:
    - Свободная стилизация средневековой русской архитектуры разных школ, а не копия одного образца
    - Сказочный силуэт — избушка на пнях, высокие кровли, главы на массивных барабанах
    - Резной орнамент с символами и пояса многоцветных изразцов
    - Ансамбль, сделанный художниками, — архитектура, иконы, вышивка, резьба
