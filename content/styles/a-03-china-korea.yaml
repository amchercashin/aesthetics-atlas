    продолжается до наших дней. Раньше её называли «монотонной живописью» или «живописью одного цвета», а слово
    «тансэкхва» музей ввёл как официальный термин на большой выставке 2012 года. В ранний круг музей включает Пак
    Собо, Ли Уфана, Чон Санхву, Юн Хёнгына и Ха Чонхёна.


    Дело не в одном цвете, а в методе. Чикагский институт искусств пишет, что работы движения называли
    «пханбоп» — «методами», а критик И Гёнсон описывал их через рисование, растекание, пропитывание и
    выталкивание краски. Чон Санхва многократно наносит и снимает краску, оставляя сырой холст частью
    структуры. Пак Собо проводит карандашом по ещё влажной белой краске и называет это стиранием. Юн Хёнгын
    разбавляет пигменты, и они впитываются в грубую ткань. От американского минимализма тансэкхва отличает
    рукотворный, повторяемый жест и материал холста или конопли, а не промышленная форма.
  traits:
    - Почти однотонное поле — белое, охристое, тёмно-коричневое
    - Повторяемый метод как содержание — линии по влажной краске, нанесение и снятие слоёв
    - Краска впитывается в грубую ткань или открывает её, холст становится частью структуры
    - Ровная, «некомпозиционная» поверхность без главного центра
  scopeNote: >-
    Корейская монохромная живопись 1970-х и позже по выставке Национального музея современного искусства Кореи
    и записям Кливлендского музея и Чикагского института искусств. Поздний период и отдельные авторские языки
    (Ли Уфан, Ха Чонхён) требуют своих карточек.
  dateNote: >-
    Начало — 1970-е по Национальному музею современного искусства Кореи и Чикагскому институту; музей говорит о
    практике «до наших дней», поэтому конец не указан. Слово «тансэкхва» введено как официальный термин в 2012
    году.
