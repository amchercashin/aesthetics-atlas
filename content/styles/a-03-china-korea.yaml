  wiki: { en: Buncheong }
  summary: >-
    Корейская керамика первых двух веков Чосон: серая масса под белым ангобом и зеленоватой глазурью,
    штампованные узоры, свободное сграффито, роспись железом и сосуды, просто облитые ангобом.
  description: >-
    Пунчхон делали в первые двести лет эпохи Чосон; само название придумал в 1930-х годах историк искусства
    Ко Ю-соп. Это свободная группа сосудов из грубоватой серой массы с белым ангобом под зеленоватой
    полупрозрачной глазурью. По очерку Met, материалы и приёмы выросли из селадона Корё, но если корёский
    селадон воплощает классическую утончённость, то пунчхон — дух эксперимента.


    Вопреки представлению о простонародной посуде, в XV веке многое делали для государственных ведомств, и
    их названия оттискивали на сосудах. В Кёнсане предпочитали инкрустацию и штамп с правильным узором, в
    Чолла — свободное процарапывание и сграффито, у горы Кёрён — роспись железом по белому. В XVI веке
    сосуды всё чаще просто покрывали ангобом кистью или окунанием. К концу века пунчхон вытеснил фарфор, а
    японские вторжения 1592–1598 годов прервали традицию; позже её возрождали в Японии и Корее.
  traits:
    - Серая масса под белым ангобом и зеленоватой полупрозрачной глазурью
    - Мелкие оттиснутые узоры, покрывающие сосуд сплошной сеткой
    - Свободное сграффито и процарапанный рисунок пионов и листьев по ангобу
    - Роспись железом и неровные следы кисти или окунания в ангоб
