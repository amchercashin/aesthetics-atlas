      whyRepresentative: >-
        Округлые знаки печатного письма выведены ровным полновесным штрихом на двух свитках, а мелкая подпись
        сбоку написана другой рукой — «квадратной кистью»: два типа письма на одной вещи.
  summary: >-
    Искусство письма кистью и тушью, которое в Китае ценили выше живописи: пять типов письма — от
    печатного до курсива — и личные манеры, где скорость, нажим и сухость штриха выдают пишущего.
  description: >-
    По очерку Met, каллиграфия в традиционном Китае ценилась выше всех других изобразительных искусств и
    стала высоким искусством раньше живописи; с эпохи Сун живопись сблизилась с ней по цели, форме и
    технике. Гибкая кисть даёт штрих разной толщины, а количество туши, скорость и нажим — то влажный, то
    сухой след. Знаки пишут в установленном порядке черт и ставят в столбцы, которые читаются справа налево.


    Письменность сложилась более 3000 лет назад и развилась в пять типов письма, которыми пользуются до сих
    пор: печатное, канцелярское (при поздней Хань, когда кисть вошла в обиход), полукурсив, курсив и
    уставное. Мастера учились, подражая старым образцам, а затем перерабатывали их в личную манеру: курсив
    Хуан Тинцзяня Met называет «картиной ума», а Чжао Чжицянь в XIX веке писал полновесным печатным письмом.
    Обзор не утверждает общего набора признаков: у каждого типа письма и мастера свой язык.
  traits:
    - Штрих гибкой кисти меняет толщину, влажность и скорость в пределах одного знака
    - Знак держится на устойчивой конструкции и установленном порядке черт
    - Столбцы справа налево; ритм строится промежутками между знаками и столбцами
    - Шкала от строгого печатного и уставного письма до слитного курсива
  scopeNote: >-
    Обзор китайской каллиграфии по очерку Met и четырём свиткам XI–XIX веков: курсив Хуан Тинцзяня,
    полукурсив Ми Фу, свиток Елюй Чуцая и печатное письмо Чжао Чжицяня. Отдельные типы письма и мастера,
    каллиграфия Японии и Кореи и современное искусство с иероглифом требуют своих карточек.
  dateNote: >-
    −1000 — условный пересчёт фразы очерка Met «письменность начала складываться более 3000 лет назад»; это
    начало письменности, а не дата первого каллиграфического произведения. Кисть вошла в обиход при поздней
    Хань (II век). Традиция жива, конец не указан.
