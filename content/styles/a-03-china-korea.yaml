      credit: The Metropolitan Museum of Art, уменьшенное изображение записи
      license: охраняемое изображение; копия для некоммерческого атласа
      reference: https://www.metmuseum.org/art/collection/search/49623
      place: Метрополитен-музей
      sources: [met-gao-qifeng-woodpecker]
      whyRepresentative: >-
        Ветка с листьями брошена быстрой каллиграфической кистью, а рыжее оперение дятла выписано подробно, с
        белыми бликами: Met прямо разделяет здесь китайскую кисть и выученный в Японии приём.
  summary: >-
    Живопись Гуандуна первой половины XX века: тушь и краски на свитке, но со светотенью, перспективой и
    бликами, натурные тигры и птицы на фоне тумана или ночи и неожиданные для китайской живописи сюжеты.
  description: >-
    По тексту музея Китайского университета Гонконга, Гао Цзяньфу учился традиционной живописи у Цзюй Ляня,
    затем в Японии и, вернувшись, добивался слияния китайских методов живописи с западной техникой; вместе с
    братом Гао Цифэном и Чэнь Шужэнем он основал Линнаньскую школу. По Met, в Японии Гао изучал новую
    «японскую» живопись, которая соединяла западный реализм — естественный свет, светящийся цвет, перспективу
    и светотень — с восточными материалами и сюжетами. Вернувшись в Китай в 1916 году, он учил «новой
    национальной живописи» с западной лепкой формы, а неожиданный выбор сюжета Met называет важной чертой
    школы.


    Братья начинали с птиц и насекомых, а к тиграм и хищным птицам, по тексту музея, перешли под влиянием
    японской живописи, где свирепость зверя подчёркивали снегом или лунной ночью. В «Дятле» Гао Цифэна ветка
    написана размашистой кистью по образцу китайских цветов и птиц XVIII века, а оперение — описательно, с
    белыми бликами. Чжао Шаоан, по Met, — самый влиятельный художник второго поколения школы, известной
    реализмом западного толка. От шанхайских мастеров того же времени Линнань отличают тени, объём и
    атмосферный фон, вписанные в традиционный свиток с надписями.
  traits:
