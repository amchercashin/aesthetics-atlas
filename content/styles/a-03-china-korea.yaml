  wiki: { en: Bojagi }
  summary: >-
    Корейские квадратные обёрточные ткани: лоскутные чогакпо из сшитых кусочков шёлка складываются в цветные
    прямоугольники, ромбы и концентрические рамки, а вышитые побаги украшены цветами и благопожеланиями.
  description: >-
    По этикеткам Met, до обёрточной бумаги и пакетов в Корее вещи и подарки заворачивали в квадратные и
    прямоугольные ткани — побаги, ими же накрывали блюда с едой. Такие ткани известны с эпохи Чосон, а
    лоскутные были особенно популярны в позднем Чосоне. Шили их женщины всех сословий, и музей называет это
    примером «творческой бережливости»: остатки ткани превращались в новую вещь. Сейчас побаги делают и
    массово, и как авторские работы.


    В лоскутном чогакпо узор рождается из самих швов. Маленькие кусочки шёлка собираются в полосы,
    концентрические рамки или повторяющиеся ромбы, и каждая ткань решена по-своему. В отличие от тканей куба,
    где узор вышивают по готовому полотну, здесь рисунок задан кроем и сшиванием кусков разного цвета.
  traits:
    - Квадратное поле, собранное из маленьких сшитых кусочков шёлка
    - Яркие цветные прямоугольники, полосы и концентрические рамки
    - Видимый шов как линия рисунка
    - Каждая ткань решена по-своему — от строгой геометрии до свободной асимметрии
