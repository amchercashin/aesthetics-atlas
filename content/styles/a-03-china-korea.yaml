  wiki: { en: Korean celadon }
  summary: >-
    Корейский керамический селадон эпохи Корё: серо-зелёная глазурь, мягкие формы сосудов-тыкв и дынь и
    инкрустация санггам — белые и чёрные журавли, облака и цветы, врезанные в массу под глазурью.
  description: >-
    В эпоху Корё (918–1392) селадон был главным типом керамики на Корейском полуострове. Серо-зелёный цвет
    дают железо в массе и глазури и обжиг около 1150 °C в восстановительной среде. По очерку Met,
    технологию глазури и печей сначала переняли у сунского Китая, и ранние сосуды сознательно повторяют
    китайские формы и мотивы: лотосы, пионы, водоплавающих птиц у пруда.


    С середины XII века корёские мастера и заказчики перешли к собственному вкусу, а производство
    сосредоточилось в Пуане и Канджине на юго-западе. Вершиной стала инкрустация санггам, редкая в Китае:
    узор вырезают по сухой массе, заполняют белым и чёрным шликером и покрывают прозрачной глазурью. Отсюда
    сочетание чистой формы, белых журавлей и облаков и зелёного поля. Выросший из этой традиции пунчхон
    Чосон грубее и свободнее.
  traits:
    - Серо-зелёная полупрозрачная глазурь, оттенки от зелёного к голубоватому
    - Природные формы сосудов — тыквы, дыни, бамбуковые членения — и стройный мэбён
    - Резной и процарапанный узор под глазурью, мягко проступающий в её толще
    - Инкрустация санггам — белые и чёрные журавли, облака и цветы на зелёном поле
