        цвета яркие: та смелая манера, которую Met называет общей для шанхайской школы.
  summary: >-
    Живопись Шанхая поздней Цин и начала XX века: яркие цвета и насыщенная тушь, фигуры, цветы и птицы для
    нового городского покупателя, смелая «эпиграфическая» кисть и надписи в композиции.
  description: >-
    По этикеткам Met, шанхайская школа поздней Цин опиралась на исторические образцы, но выработала смелую
    манеру ярких цветов и насыщенной туши. Жэнь И (Жэнь Божэнь), учившийся в портретной мастерской, к 1870-м
    годам стал ведущим художником Шанхая и создал популярный насыщенный цветом стиль для фигур, цветов и птиц
    и пейзажа. В «Журавлях, сосне и лишайнике» композиция собрана из сцепленных треугольников; Met сопоставляет
    её с резьбой печатей и, возможно, с силуэтами японских ширм.


    У Чаншо перенял у Чжао Чжицяня «вкус эпиграфиста» — нарочито наивную, чуть неуклюжую кисть по образцу
    надписей на древних камнях. Его цветы и камни — не виды с натуры, а отвлечённые композиции с круглой
    кистью, контрастом формы и пустоты и сильными диагоналями; их охотно покупал новый городской класс
    Шанхая. В отличие от учёного пейзажа шаньшуй, здесь в центре цвет, крупный мотив и рынок, а стихотворная
    надпись становится частью композиции.
  traits:
    - Яркий цвет и насыщенная тушь в одном мотиве
    - Крупные фигуры, цветы, птицы и камни на почти пустом фоне
    - Круглая «эпиграфическая» кисть, контраст формы и пустоты, сильные диагонали
    - Стихотворная надпись и печати как часть композиции свитка
