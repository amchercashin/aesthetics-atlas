  summary: >-
    Мода молодых рабочих-мигрантов в городах Китая около 2008–2013 годов: огромные начёсанные причёски ярких
    цветов, дешёвая вызывающая одежда, «марсианский язык» и группы QQ.
  description: >-
    По тексту Rockbund Art Museum, шаматэ — транслитерация английского smart. Так называли субкультуру,
    популярную среди молодых сельских рабочих-мигрантов в городах Китая и известную дешёвой, но вызывающей
    одеждой, причёсками и цветом волос. Она возникла около 2008 года; участники писали «марсианским языком»,
    собирались в группах QQ и в сетевой танцевальной игре, а вне сети — в парикмахерских и на роллердромах.
    Около 2012 года насмешки и травля вытеснили саму моду, и шаматэ исчезли.


    Фотограф Алекс Хуаньфа Чэн пишет, что большинство участников — второе поколение сельских фабричных рабочих;
    преувеличенные причёски они носили «как дикобразы, защищающиеся от дискриминации», а достоинство и чувство
    принадлежности искали в сетевых сообществах. Основателем шаматэ оба источника называют Ло Фусина. С
    2019–2020 годов о шаматэ снова говорят после фильма Ли Ифаня «Шаматэ, я тебя люблю»; снимки в карточке —
    из модного проекта Чэна, который возрождает этот облик, а не из 2008–2013 годов.
  traits:
    - Огромные начёсанные причёски с иглами, гребнями и веерами
    - Яркие искусственные цвета волос — розовый, красный, голубой, белый
    - Дешёвая вызывающая одежда, кожа, цепи, кеды
    - Сетевая культура QQ и «марсианский язык»
  scopeNote: >-
    Облик шаматэ по тексту Rockbund Art Museum и проекту Чэна. Снимков 2008–2013 годов и кадров фильма Ли
    Ифаня в карточке нет: все три изображения — поздняя модная постановка.
  dateNote: >-
    Около 2008 года — начало по Rockbund и Чэну. Конец условен: Rockbund говорит о травле около 2012 года,
    Чэн — о её начале в 2013 году. Возвращение — фильм Ли Ифаня (показ в декабре 2019 года) и уличная
    реклама спектакля в Шанхае в феврале 2023 года.
