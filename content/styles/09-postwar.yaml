- id: abstract-expressionism
  name: Абстрактный экспрессионизм
  orig: Abstract Expressionism
  aliases: [абэкс, живопись действия, нью-йоркская школа]
  searchKeywords: [Поллок, дриппинг]
  start: 1943
  end: 1959
  dates: 1940-е – 1950-е
  approx: true
  dateKind: period
  dateNote: >
    Тейт и МоМА относят движение к 1940–1950-м годам, Метрополитен называет начало 1940-х. Точных границ нет: 1943 и 1959 — условные отметки на шкале.
  era: postwar
  domain: [art]
  medium: [painting]
  subjects: [abstraction, any]
  region: США
  tier: 1
  kind: movement
  review:
    status: reviewed
    date: "2026-11-09"
    scope: [relations, dates, text, images, gallery]
    note: >-
      Связи — 16.10.2026, границы у записи. 09.11.2026: даты — по Тейт, МоМА и Метрополитен, конец сдвинут с 1965 на 1950-е; описание — 5 утверждений сверено; снято,
      что сюрреалисты «принесли» автоматизм, бежав от войны: Тейт говорит о влиянии их идеи и автоматизма Миро. Главная иллюстрация — Метрополитен. Галерея:
      «Лавандовый туман» был подписан как «Женщина I» де Кунинга — подпись исправлена по Национальной галерее; № 5 — страница файла enwiki.
  parents:
    - id: surrealism
      type: influence
      status: verified
      note: >-
        Сюрреалистические приёмы и среда повлияли на ранних абстрактных экспрессионистов. Influence точнее
        происхождения всего движения из сюрреализма.
      sources:
        - ra26-abstract-expressionism
    - id: abstract-art
      type: influence
      status: verified
      note: >-
        Европейские абстрактные практики были одним из источников американского послевоенного движения. Уточнить
        несколько линий влияния и самостоятельные условия Нью-Йорка.
      sources:
        - ra26-abstract-expressionism
  gallery:
    - file: enwiki:No._5,_1948.jpg
      title: Поллок. № 5, 1948
      author: Джексон Поллок
      year: 1948
      whyRepresentative: >-
        Сплетение нитей и брызг краски заполняет холст от края до края, без главного места в композиции.
    - file: Number 1, 1950 (Lavender Mist) by Jackson Pollock (1950).jpg
      title: Поллок. Номер 1, 1950 (Лавандовый туман)
      author: Джексон Поллок
      year: 1950
      place: Национальная галерея искусства, Вашингтон
      whyRepresentative: >-
        Краска накапана, набрызгана и налита слоями; название, предложенное критиком, говорит о световом эффекте, а лавандовой краски в картине нет.
      sources: [nga-lavender-mist]
  summary: >
    Краска, пролитая и разбрызганная жестом по большим холстам: Нью-Йорк выходит на передний край современного искусства.
  description: |
    Американские живописцы 1940–1950-х годов, в основном работавшие в Нью-Йорке, искали абстракцию, которая действовала бы выразительно и эмоционально.
    Опорой стали идея сюрреалистов об искусстве из бессознательного и автоматизм Миро. Поллок клал холст на пол и лил на него краску, двигаясь вокруг;
    вместе с де Кунингом его относят к живописи действия. Ротко, Ньюман и Стилл строили простые композиции из больших полей цвета.
    Движение первым вывело Нью-Йорк на передний край международного современного искусства.
  traits:
    - Большие холсты — «Осенний ритм» шириной более пяти метров
    - Сплетения брызг и потёков краски
    - Беспредметная композиция без единого центра
    - Видимый след движения руки
  promptCues:
    - Огромный холст «во всю стену»
    - Жест, брызги и потёки краски
    - Видимый процесс письма и слои краски
    - Абстракция без единого центра композиции
  names: [Джексон Поллок, Виллем де Кунинг, Франц Клайн, Ли Краснер, Аршил Горки]
  example:
    file: "enwiki:Autumn Rhythm.jpg"
    title: Осенний ритм (Номер 30)
    author: Джексон Поллок
    year: 1950
    place: Метрополитен-музей, Нью-Йорк
    whyRepresentative: >-
      Холст шириной больше пяти метров покрыт потёками чёрной, белой и коричневой краски: виден ритм движения, а не изображение предмета.
    sources: [met-autumn-rhythm]
  evidence:
    - { claim: "Новые формы абстрактного искусства американских живописцев 1940–1950-х годов", field: dates, source: tate-abstract-expressionism }
    - { claim: "Начало движения — начало 1940-х годов", field: dates, source: ra26-abstract-expressionism }
    - { claim: "Сюрреалистическая идея бессознательного и автоматизм Миро; Поллок клал холст на пол и лил краску", field: description, source: tate-abstract-expressionism }
    - { claim: "Ротко, Ньюман и Стилл — простые композиции с большими полями цвета", field: description, source: tate-abstract-expressionism }
    - { claim: "Первым вывело Нью-Йорк на передний край международного современного искусства", field: summary, source: moma-abstract-expressionism }
  wiki: Abstract expressionism
  links:
    - { title: "Abstract Expressionism", url: "https://www.theartstory.org/movement/abstract-expressionism/", src: "The Art Story", lang: en }
    - { title: "Abstract Expressionism", url: "https://www.tate.org.uk/art/art-terms/a/abstract-expressionism", src: "Tate", lang: en }

