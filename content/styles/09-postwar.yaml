    Наум Габо в «Стоячей волне» 1919–1920 годов использовал мотор, Александр Калдер с 1930 года создавал мобили, которые движутся от воздуха. Крупным явлением кинетическое искусство
    стало в конце 1950-х и 1960-х годах. В 1960 году Жан Тэнгли показал в саду МоМА самоуничтожающуюся скульптуру «Посвящение Нью-Йорку», собранную из хлама.
  traits:
    - Реальное движение — от воздуха или мотора
    - Металл и проволока
    - Равновесие подвешенных элементов
    - Время как часть работы
  names: [Наум Габо, Александр Калдер, Жан Тэнгли, Хесус Рафаэль Сото]
  example:
