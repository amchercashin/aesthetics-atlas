    спроектировал сам Билл, открыли их в 1955 году. Здесь развивали проектирование как исследовательскую и системную практику. Сотрудничество с промышленностью
    включало работу Ханса Гугелота с Braun: радиолу SK 4 в 1956 году создали Гугелот и Дитер Рамс.
