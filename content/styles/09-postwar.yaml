    мебель и бытовые вещи. Стул Вернера Пантона стал первым, сделанным из одного куска материала, а кресло-шар Ээро Аарнио напоминало космическую капсулу. Дом «Футуро» Матти Сууронена
    (1968) выполнен из полиэстера, армированного стекловолокном.
  traits:
    - Литой пластик и стеклопластик
    - Капсулы, сферы, овалы
    - Белый цвет и яркие пластики
    - Образы космических кораблей и летающих тарелок
  names: [Вернер Пантон, Ээро Аарнио, Матти Сууронен, Петер Гичи]
  example:
    file: Futuro Pinakothek München 6491.jpg
    title: Дом «Футуро»
    author: Матти Сууронен
    year: 1968
    place: Пинакотека современности, Мюнхен
    note: Снимок 2019 года.
    whyRepresentative: >-
      Овальная оболочка из стеклопластика с овальными иллюминаторами стоит на опорах, как приземлившийся аппарат.
    sources: [boijmans-futuro, eflux-futuro]
  evidence:
    - { claim: "От спутника 1957 года до высадки на Луну 1969 года", field: dates, source: vam-space-age-chairs }
    - { claim: "Формованный пластик; стул Пантона из одного куска; кресло-шар Аарнио", field: description, source: vam-space-age-chairs }
    - { claim: "Футуро, 1968, полиэстер со стекловолокном", field: traits, source: boijmans-futuro }
  gallery:
    - file: Space_Needle_2011-07-04.jpg
      title: Спейс-Нидл
      author: Джон Грэм-младший и Виктор Стайнбрук
      year: 1962
      place: Сиэтл
      note: Снимок 2011 года.
      whyRepresentative: >-
        Верхняя часть в форме летающей тарелки на изогнутых опорах построена к Всемирной выставке 1962 года.
