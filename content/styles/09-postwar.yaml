    - id: constructivism
      type: influence
      status: verified
      note: >-
        V&A прямо связывает компьютерную графику John Pearson с конструктивистской рациональной программой,
        сетками и ограниченной палитрой; пример — Season’s Greetings (1990), E.969-2008. Уточнить именно
        Pearson: соседний абзац того же текста о Mihai Nadin не содержит этого утверждения. Это частный канал,
        не происхождение всего computer art.
      sources:
        - ra26-d2-computer-pearson
  gallery:
    - file: VERTICAL-HORIZONTAL_NUMBER_THREE_(1964)_BY_A._MICHAEL_NOLL.jpg
      title: Нолл. Vertical-Horizontal № 3
      author: А. Майкл Нолл
      year: 1964
      place: Музей компьютерной истории, Маунтин-Вью
      note: Снимок 2023 года в экспозиции.
      whyRepresentative: >-
        Прямоугольные траектории заданы программой: цифровая ветвь, геометрия и случайность.
      sources: [dam-noll]
    - file: Drawing Machine 1.jpg
      title: Рисующая машина Десмонда Пола Генри
      author: Десмонд Пол Генри
      year: 1960-е
      role: illustration
      note: Снимок устройства; данные со страницы файла, изображения принадлежат наследникам Генри.
      whyRepresentative: >-
        Открытый механизм с рычагами и перьями над листом показывает аналоговый способ рисования.
      sources: [scm-henry-machine]
  summary: >-
    Раннее машинное искусство: электромеханические рисунки, программируемые плоттеры, геометрия и
    случайность.
  description: >
    А. Майкл Нолл сделал первые компьютерные работы в Bell Labs в 1962 году, Фридер Наке с 1964 года выводил рисунки на чертёжном автомате Zuse Graphomat, а в 1965 году прошли первые выставки
    компьютерной графики, где показывали работы Нолла, Наке и Георга Ниса. Художник задавал вычислительные правила, в том числе управляемую случайность.


    Десмонд Пол Генри использовал другой принцип: электромеханические устройства на основе аналогового
    бомбового прицела оставляли сложные траектории. Такой рисунок не следует описывать как исполнение
    цифровой программы. Карточка объединяет эти ранние машинные практики для сравнения методов.
  traits:
    - Линии, сетки, повторения и вариации
    - В цифровых работах — алгоритмы и управляемая случайность
    - В аналоговых машинах — траектории механизма
    - Художник проектирует процесс, а не только единичный рисунок
  names: [Георг Нис, Фридер Наке, А. Майкл Нолл, Вера Мольнар, Десмонд Пол Генри]
  example:
    file: Picture produced by Drawing Machine 1.jpg
    title: Рисунок Drawing Machine 1
    author: Десмонд Пол Генри
    year: 1962
    note: Год — по подписи автора на листе.
    whyRepresentative: >-
      Аналоговая ветвь машинного искусства: линии образованы электромеханическим устройством Генри. Не
      пример программируемого плоттера.
    sources: [scm-henry-machine]
  wiki: Computer art
  links:
    - { title: "Digital Art", url: "https://www.theartstory.org/movement/digital-art/", src: "The Art Story", lang: en }
  searchKeywords:
    - Компьютерное искусство
    - генеративное искусство
    - плоттерная графика
    - алгоритмическое искусство
  dateKind: period
  scopeNote: >-
    Машинное искусство примерно 1960–1990 годов: аналоговые рисующие устройства и ранняя цифровая графика.
    Генеративное искусство шире этой выборки и продолжается после 1990 года.
  evidence:
    - claim: >-
        Машины Генри используют аналоговый электромеханический механизм; это отдельная практика от
        программируемых цифровых плоттеров.
      field: description
      source: scm-henry-machine
    - claim: Первые работы Нолла — 1962 год, выставка в 1965 году.
      field: dates
      source: dam-noll
    - claim: Наке с 1964 года работал с Zuse Graphomat Z64; выставки 1965 года вместе с Нисом.
      field: description
      source: dam-nake
  review:
    status: reviewed
    date: "2026-11-09"
    scope: [relations, dates, text, images, gallery]
    note: >-
      Связи — 16.10.2026, границы у записи. 09.11.2026: даты — по Цифровому музею искусства, рамки названы условными; описание — 4 утверждения сверено. Главная иллюстрация — Музей науки, год 1962 по подписи на листе. Галерея:
      Boundary Functions Скотта Снибби (1998–1999) заменена снимком рисующей машины Генри: работа позже рамок карточки; у Нолла указана экспозиция.
