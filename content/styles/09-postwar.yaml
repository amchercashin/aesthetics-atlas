      sources: [artchive-ocean-park]
  summary: >
    Большие поля цвета вместо жеста и сюжета: ветвь абстрактного экспрессионизма и её беспредметное продолжение в 1960-х.
  description: |
    Термин сначала относили к работам Марка Ротко, Барнетта Ньюмана и Клиффорда Стилла примерно с 1950 года: «живописцами цветового поля»
    их назвал в истории абстрактного экспрессионизма Ирвинг Сэндлер. Около 1960 года более беспредметный вариант появился у Хелен Франкенталер,
    Морриса Луиса, Кеннета Ноланда, Альмы Томас и Сэма Гиллиама: они отказались и от мифологического содержания, и от личного выразительного мазка.
  traits:
    - Крупные цветовые поля определяют композицию
    - Отказ от предмета и от выразительного мазка
    - Мягкие границы у Ротко, ровные полосы у Буша
    - Тонкие просвечивающие слои краски
  names: [Марк Ротко, Барнетт Ньюман, Клиффорд Стилл, Хелен Франкенталер, Моррис Луис]
  example:
