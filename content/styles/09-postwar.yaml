- id: abstract-expressionism
  name: Абстрактный экспрессионизм
  orig: Abstract Expressionism
  aliases: [абэкс, Поллок, живопись действия, нью-йоркская школа, дриппинг]
  start: 1943
  end: 1965
  dates: 1943 – 1965
  era: postwar
  domain: [art]
  region: США
  tier: 1
  kind: movement
  review:
    status: partial
    date: "2026-10-16"
    note: >-
      16.10.2026 проверены исторические отношения и связанные с ними контексты и сопоставления; границы
      подтверждения указаны у каждой записи. Даты, описание и изображения карточки полностью не проверялись.
  parents:
    - id: surrealism
      type: influence
      status: verified
      note: >-
        Сюрреалистические приёмы и среда повлияли на ранних абстрактных экспрессионистов. Influence точнее
        происхождения всего движения из сюрреализма.
      sources:
        - ra26-abstract-expressionism
    - id: abstract-art
      type: influence
      status: verified
      note: >-
        Европейские абстрактные практики были одним из источников американского послевоенного движения. Уточнить
        несколько линий влияния и самостоятельные условия Нью-Йорка.
      sources:
        - ra26-abstract-expressionism
  summary: >
    Огромные холсты, по которым краска разбрызгана, пролита и размазана жестом: Нью-Йорк становится столицей искусства.
  description: |
    Европейские сюрреалисты, бежавшие от войны в Нью-Йорк, принесли идею автоматизма, и американцы довели
    её до масштаба. Джексон Поллок клал холст на пол и разбрызгивал краску, двигаясь вокруг, — «живопись
    действия». Де Кунинг писал яростными мазками, Ротко и Ньюман — огромными полями цвета. После войны
    Нью-Йорк стали считать новым центром западного искусства вместо Парижа.
  traits:
    - Монументальные холсты «во всю стену»
    - Жест, брызги, потёки — дриппинг
    - Чаще всего абстракция (но у де Кунинга — и фигуративные «Женщины»)
    - Видимый жест и процесс письма («живопись действия»)
  names: [Джексон Поллок, Виллем де Кунинг, Франц Клайн, Ли Краснер, Аршил Горки]
  example:
    file: "enwiki:Autumn Rhythm.jpg"
    title: Осенний ритм (Номер 30)
    author: Джексон Поллок
    year: 1950
    place: Метрополитен-музей, Нью-Йорк
  wiki: Abstract expressionism
  links:
    - { title: "Abstract Expressionism", url: "https://www.theartstory.org/movement/abstract-expressionism/", src: "The Art Story", lang: en }
    - { title: "Abstract Expressionism", url: "https://www.tate.org.uk/art/art-terms/a/abstract-expressionism", src: "Tate", lang: en }

- id: color-field
  name: Живопись цветового поля
  orig: Color field painting
  aliases:
    - колор-филд
    - живопись цветового поля
    - color field
  start: 1948
  end: 1970
  dates: 1948 – 1970
  era: postwar
  domain: [art]
  region: США
  tier: 3
  kind: movement
  contexts:
    - id: abstract-expressionism
      type: related-context
      status: verified
      note: >-
        Color Field описано как одна из ветвей зрелого абстрактного экспрессионизма. Контекст точнее генеалогии,
        представляющей направление как внешнего потомка.
      sources:
        - ra26-abstract-expressionism
  origin: unknown
  review:
    status: partial
    date: "2026-10-16"
    note: >-
      16.10.2026 проверены исторические отношения и связанные с ними контексты и сопоставления; границы
      подтверждения указаны у каждой записи. Даты, описание и изображения карточки полностью не проверялись.
  parents: []
  summary: >
    Большие светящиеся поля цвета, в которые зритель погружается, как в медитацию.
  description: |
    Внутри абстрактного экспрессионизма сложилось тихое крыло: Марк Ротко, Барнетт Ньюман, Клиффорд Стилл
    отказались от жеста ради цвета. Мягкие прямоугольники Ротко будто парят и вибрируют, а сам художник
    хотел, чтобы перед его картинами плакали. Хелен Франкенталер и Моррис Луис позже стали заливать
    разбавленную краску прямо в ткань холста.
  traits:
    - Крупные цветовые отношения определяют композицию
    - Мягкие края у Ротко, резкие разделения у Ньюмана, рваные контуры у Стилла
    - Разные способы нанесения краски, включая впитывание в холст
    - Цвет и масштаб важнее предметного сюжета
  names: [Марк Ротко, Барнетт Ньюман, Клиффорд Стилл, Хелен Франкенталер, Моррис Луис]
  example:
    file: enwiki:No. 9, 1948, Mark Rothko at NGA 2023.jpg
    title: № 9 (мультиформа)
    author: Марк Ротко
    year: 1948
    place: Национальная галерея искусства, Вашингтон
    note: >-
      Ранняя работа Ротко 1948 года, до устойчивой схемы крупных прямоугольников; не универсальный образец
      всех признаков направления.
    whyRepresentative: >-
      Неровные цветовые массы показывают поиск композиции полями цвета, но отличаются от поздних мягких
      прямоугольников Ротко.
  wiki: Color field
  links:
    - { title: "Color Field Painting", url: "https://www.theartstory.org/movement/color-field-painting/", src: "The Art Story", lang: en }
  searchKeywords:
    - Ротко
    - Ньюман
    - пост-живописная абстракция

- id: swiss-style
  name: Швейцарский стиль
  orig: International Typographic Style
  aliases: [интернациональный типографический стиль, Helvetica, модульная сетка, Мюллер-Брокман]
  start: 1950
  end: 1975
  dates: 1950 – 1970-е
  era: postwar
  domain: [design]
  region: Швейцария, затем весь мир
  tier: 2
  kind: movement
  review:
    status: partial
    date: "2026-10-16"
    note: >-
      16.10.2026 проверены исторические отношения и связанные с ними контексты и сопоставления; границы
      подтверждения указаны у каждой записи. Даты, описание и изображения карточки полностью не проверялись.
  parents:
    - id: bauhaus
      type: influence
      status: verified
      note: >-
        Баухаус — один из источников швейцарской типографической среды наряду с местными школами и новой
        типографикой. Это влияние одной из программ, не единая линия происхождения.
      sources:
        - ra26-swiss
    - id: constructivism
      type: influence
      status: verified
      note: >-
        Подтверждена конструктивистская составляющая швейцарской графики через европейскую транснациональную
        среду, Stankowski, Lohse, Neuburg и Max Bill, а также новую типографику. Ограничить влияние этим
        каналом; не утверждать прямое ученичество всех швейцарских дизайнеров у русских конструктивистов.
      sources:
        - ra26-d2-swiss-government
        - ra26-d2-modern-poster
  summary: >
    Модульная сетка, гротеск без засечек, флажковый набор и объективность: язык, на котором говорят аэропорты и корпорации.
  description: |
    Дизайнеры Базеля и Цюриха — Армин Хофман, Йозеф Мюллер-Брокман, Эмиль Рудер — превратили уроки Баухауса
    в строгую систему. Модульная сетка, асимметрия, крупные шрифты Akzidenz и Helvetica, фотография вместо
    иллюстрации: информация должна быть ясной и нейтральной. Стиль стал международным языком навигации,
    корпоративной айдентики и, позже, веб-дизайна.
  traits:
    - Модульная сетка
    - Гротески — Helvetica, Univers, Akzidenz
    - Асимметричная вёрстка, флажковый набор
    - Фотография и геометрия вместо иллюстрации
  names: [Йозеф Мюллер-Брокман, Армин Хофман, Эмиль Рудер, Макс Мидингер]
  example:
    file: 1959 - Gewerbemuseum Basel - Alte und neue Formen in Japan.jpg
    title: Плакат «Старые и новые формы в Японии»
    author: Армин Хофман
    year: 1959
    place: Музей прикладного искусства, Базель
  wiki: International Typographic Style
  links: []

- id: ulm-school
  name: Ульмская школа дизайна
  orig: Ulm School of Design
  aliases: [HfG Ulm, Ульмская школа дизайна]
  searchKeywords:
    - Дитер Рамс
    - Braun
    - «меньше, но лучше»
    - Макс Билл
    - Ульмская школа и функционализм
    - функционализм
  start: 1953
  end: 1968
  dates: 1953 – 1968
  era: postwar
  domain: [design]
  region: Германия
  tier: 3
  kind: school
  contexts:
    - id: swiss-style
      type: related-context
      status: verified
      note: >-
        Архивная запись Se 219.17 документирует совместный учебный корпус Айхера и Мюллера-Брокманна «Упаковка»,
        1962/63. Это институциональный контакт представителя Swiss Style с HfG Ulm. Опись не показывает сами
        работы и не доказывает заимствование сетки всей школой или влияние на промышленный дизайн Braun.
      sources:
        - ra26-d3-hfg-seeling
  parents:
    - id: bauhaus
      type: evolved
      status: verified
      note: >-
        Ульмская школа институционально и педагогически связана с Баухаусом через Макса Билля и преподавателей.
        Evolved здесь означает развитие образовательной программы, а не буквальное продолжение учреждения.
      sources:
        - ra26-ulm
  summary: Школа, связавшая проектирование вещей и визуальных систем с исследованием, методами и ясностью функции.
  description: >
    Высшую школу дизайна в Ульме основали Инге Айхер-Шолль, Отль Айхер и Макс Билл. В 1953–1968 годах здесь
    развивали проектирование как исследовательскую и системную практику. Сотрудничество с промышленностью
    включало работу Ханса Гугелота с Braun; радиола SK 4 создана Гугелотом и Дитером Рамсом.


    Функционалистский дизайн продолжился после закрытия школы. Поздние принципы Рамса относятся к этому
    наследию, а не ко всему периоду существования HfG.
  traits:
    - Белый, серый, точечные цветовые акценты
    - Модульность и системность
    - Предельная ясность функции
    - Честные материалы — пластик, металл, оргстекло
  names:
    - Инге Айхер-Шолль
    - Отль Айхер
    - Макс Билл
    - Ханс Гугелот
    - Дитер Рамс
  example:
    file: 1956 Braun Phonosuper SK4 Schneewittchensarg.JPG
    title: Радиола Braun SK 4
    author: Ханс Гугелот, Дитер Рамс
    year: 1956
  gallery:
    - file: Max-bill junghans retouched.jpg
      title: Кухонные часы Junghans с таймером
      author: Макс Билл
      year: 1956–1957
      sources:
        - moma-max-bill-clock
  wiki: Ulm School of Design
  links: []
  dateKind: institution
  scopeNote: >-
    Карточка посвящена HfG Ulm в годы работы школы. Позднейший функционализм Braun и принципы Дитера Рамса
    выходят за этот интервал.
  evidence:
