  summary: >
    Грубый бетон, массивные объёмы и честная конструкция: архитектура социального государства.
  description: |
    Название идёт от béton brut — «необработанный бетон» Ле Корбюзье. Британские архитекторы Смитсоны
    и их последователи строили жилые комплексы, университеты и театры из открытого бетона со следами
    опалубки. Барбикан в Лондоне — целый город-крепость с садами и озером. Долго ненавидимый, сегодня
    брутализм — культовая эстетика интернета.
  traits:
    - Открытый бетон со следами опалубки
    - Массивные, скульптурные объёмы
    - Повторяющиеся модули и ячейки
    - Честно показанная конструкция
