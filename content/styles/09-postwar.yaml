    рекламе, комиксам, товарам. Энди Уорхол повторил 32 банки супа Campbell's и шелкографические Мэрилин,
    Рой Лихтенштейн увеличил точки растра из комиксов. Поп-арт стёр границу между высоким искусством
    и рекламой — и сам стал мощнейшим брендом.
