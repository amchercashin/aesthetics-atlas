    - id: surrealism
      type: influence
      status: verified
      note: >-
        Для поздних психоделических афиш Lee Conklin, включая плакат Fillmore West 27 августа–1 сентября 1968,
        профильный разбор указывает сюрреалистические источники. Ограничить influence этим плакатным корпусом;
        самоназвание psychedelic surrealism у Peter Max служит дополнительным контекстом, но не единственным
        доказательством генеалогии.
      sources:
        - ra26-d2-psychedelic-aiga
  summary: >
    Плавящиеся буквы, кислотные цвета и узоры, вдохновлённые ЛСД, рок-концертами и модерном.
  description: |
    Сан-Франциско 1966–1967 годов: концертные плакаты для Fillmore и Avalon, светошоу из масла и воды,
    газета San Francisco Oracle. Художники брали изгибы модерна Мухи, вибрации оп-арта и сюрреалистические
    образы и добавляли кислотные контрастные цвета. Буквы растекаются так, что текст почти не читается —
    и это было частью опыта.
  traits:
