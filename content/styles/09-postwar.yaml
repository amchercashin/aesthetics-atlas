    Название восходит к béton brut — «необработанному бетону» Ле Корбюзье. Выражением «новый брутализм» в 1954 году воспользовались Элисон и Питер Смитсон,
    а критик Рейнер Бэнем описал им подход этих архитекторов. Стиль широко применяли в правительственных зданиях, университетах и социальном жилье — в Англии, США,
    Бразилии, Индии и Японии. Жилой комплекс Барбикан в Лондоне начали строить в 1965 году и возводили 11 лет. К 1980-м годам брутализм в основном вышел из моды.
