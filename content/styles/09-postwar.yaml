  start: 1960
  end: 1990
  dates: 1960 – 1990
  approx: true
  dateNote: >
    Рамки карточки условны. Первые компьютерные работы Нолла — 1962 год, первые выставки компьютерной графики — 1965 год.
  era: postwar
  domain: [art, internet]
  medium: [digital-art, drawing]
  subjects: [abstraction, any]
  region: Германия, Великобритания, США
  tier: 2
  kind:
    - technique
    - overview
  kindNote: >-
    Обзор ранних машинных методов; аналоговые устройства и программируемые цифровые компьютеры не образуют
    единого стиля.
  parents:
    - id: op-art
      type: influence
      status: verified
      note: >-
        А. Майкл Нолл сам связывает компьютерную работу Ninety Parallel Sinusoids с оп-артом и Current Бриджет
        Райли. Подтверждён этот конкретный канал 1960-х годов, не влияние на всё компьютерное искусство.
      sources:
