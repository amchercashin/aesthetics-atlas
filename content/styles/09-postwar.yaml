- id: mid-century-modern
  name: Мидсенчури-модерн
  orig: Mid-century modern
  aliases: [mid-century modern, модернизм середины века, Имзы, скандинавский модерн]
  start: 1945
  end: 1969
  dates: 1945 – 1969
  era: postwar
  domain: [design, architecture]
  region: США, Скандинавия
  tier: 1
  kind: period
  review:
    status: partial
    date: "2026-10-16"
    note: >-
      16.10.2026 проверены исторические отношения и связанные с ними контексты и сопоставления; границы
      подтверждения указаны у каждой записи. Даты, описание и изображения карточки полностью не проверялись.
  parents:
    - id: bauhaus
      type: influence
      status: verified
      note: >-
        Эмиграция преподавателей и европейские модернистские программы влияли на послевоенный дизайн. Influence
        точнее происхождения всей ретроспективной категории Mid-century modern.
      sources:
        - ra26-midcentury
        - ra26-bauhaus
    - id: organic-architecture
      type: influence
      status: verified
      note: >-
        Для калифорнийского послевоенного жилья документирована линия Wright/Bazett House → Joseph Eichler →
        массовые современные дома. Влияние ограничено архитектурной ветвью Mid-century modern; источник не
        относится автоматически к мебели Eames/Saarinen или всему международному дизайну середины века.
      sources:
        - ra26-d2-eichler-survey
  summary: >
    Тёплый модернизм пригорода: стеклянные стены, гнутая фанера, мебель Имзов и тиковые комоды.
  description: |
    После войны модернизм переехал в частный дом. Калифорнийские архитекторы строили одноэтажные дома
    со стеклянными стенами и открытыми балками, Чарльз и Рэй Имз — мебель из гнутой фанеры и пластика,
    скандинавы — светлую мебель из тика и бука. Стиль стал вновь модным в 2000-х благодаря сериалу «Безумцы».
  traits:
    - Чистые линии и органичные изгибы
    - Гнутая фанера, тик, стеклопластик
    - Стеклянные стены, связь дома с садом
    - Яркие акценты на нейтральном фоне
  names: [Чарльз и Рэй Имз, Арне Якобсен, Ээро Сааринен, Джордж Нельсон, Ханс Вегнер]
