- id: swiss-style
  name: Швейцарский стиль
  orig: International Typographic Style
  aliases: [интернациональный типографический стиль]
  searchKeywords: [Helvetica, модульная сетка, Мюллер-Брокман]
  start: 1945
  end: 1975
  dates: 1940-е – 1970-е
  approx: true
  dateKind: period
  dateNote: >
    Купер-Хьюитт: стиль сложился в Швейцарии в 1940–1950-е годы; Британника описывает его после Второй мировой войны в разделе о графике 1945–1975 годов. Конец условен.
  era: postwar
  domain: [design]
  medium: [graphic-design, typography]
  subjects: [any]
  region: Швейцария, затем весь мир
  tier: 2
  kind: movement
  review:
    status: reviewed
    date: "2026-11-09"
    scope: [relations, dates, text, images, gallery]
    note: >-
      Связи — 16.10.2026, границы у записи. 09.11.2026: даты — по Купер-Хьюитт и Британнике, начало сдвинуто на вторую половину 1940-х; описание — 6 утверждений сверено;
      снято «веб-дизайн» и Akzidenz как общая черта, Мидингер убран из имён: в прочитанных источниках нет. Главная иллюстрация — страница файла Commons с данными
      эмузея; подпись места уточнена: плакат выставки. Галерея: Гайссер — Швейцарская национальная библиотека; у обложки сказано, что это цифровой макет.
  parents:
    - id: bauhaus
      type: influence
      status: verified
      note: >-
        Баухаус — один из источников швейцарской типографической среды наряду с местными школами и новой
        типографикой. Это влияние одной из программ, не единая линия происхождения.
      sources:
        - ra26-swiss
    - id: constructivism
      type: influence
      status: verified
      note: >-
        Подтверждена конструктивистская составляющая швейцарской графики через европейскую транснациональную
        среду, Stankowski, Lohse, Neuburg и Max Bill, а также новую типографику. Ограничить влияние этим
        каналом; не утверждать прямое ученичество всех швейцарских дизайнеров у русских конструктивистов.
      sources:
        - ra26-d2-swiss-government
        - ra26-d2-modern-poster
  gallery:
    - file: Geisser Plakat Mohrenball 1969.jpg
      title: Гайссер. Плакат карнавального бала
      author: Роберт Гайссер
      year: 1969
      place: Санкт-Галлен; графическое собрание Швейцарской национальной библиотеки
      whyRepresentative: >-
        Шрифт без засечек набран двумя колонками влево без выключки, а плоские чёрные силуэты заполняют красное поле.
    - file: TM Typographische Monatsblätter 1959 6.jpg
      title: Обложка Typographische Monatsblätter, 6/7.1959
      author: Эмиль Рудер
      year: 1959
      note: Цифровое воссоздание обложки по скану из книги о Рудере — так сказано на странице файла.
      whyRepresentative: >-
        Две строки шрифта без засечек у верхнего края держат почти пустую плоскость: асимметрия вместо украшения.
  summary: >
    Модульная сетка, шрифт без засечек и нейтральная подача: графический язык, который после войны приняли международные корпорации.
  description: |
    После Второй мировой войны дизайнеры Швейцарии и Германии свели модернистскую графику в цельную систему — швейцарский, или интернациональный
    типографический, стиль. Они искали нейтральную и объективную подачу, строили модульные сетки и ценили шрифты без засечек. Армин Хофман преподавал
    в базельской школе; Йозеф Мюллер-Брокман в цюрихских концертных плакатах передавал ритм музыки геометрией и шрифтом; Эмиль Рудер делал обложки
    журнала Typographische Monatsblätter. Принципы стиля приняли международные корпорации: единые знаки, цвета и шрифты, сетка для вывесок и изданий.
  traits:
    - Модульная сетка
    - Шрифты без засечек
    - Асимметричная вёрстка, набор влево без выключки
    - Геометрия и плоские силуэты вместо повествовательной иллюстрации
  names: [Йозеф Мюллер-Брокман, Армин Хофман, Эмиль Рудер, Макс Мидингер]
  example:
    file: 1959 - Gewerbemuseum Basel - Alte und neue Formen in Japan.jpg
    title: Плакат «Старые и новые формы в Японии»
    author: Армин Хофман
    year: 1959
    place: выставка в Музее прикладного искусства (Gewerbemuseum), Базель
    whyRepresentative: >-
      Косая геометрическая сетка из чёрных плоскостей и небольшой блок шрифта без засечек в свободном поле.
    sources: [commons-hofmann-japan]
  evidence:
    - { claim: "Стиль сложился в Швейцарии в 1940–1950-е годы", field: dates, source: cooperhewitt-hofmann }
    - { claim: "После войны — нейтральный и объективный подход, модульные сетки; принятие корпорациями", field: description, source: britannica-graphic-design-1945-75 }
    - { claim: "Хофман преподавал в базельской школе; важность шрифтов без засечек", field: description, source: cooperhewitt-hofmann }
    - { claim: "Мюллер-Брокман и цюрихские концертные плакаты", field: description, source: britannica-graphic-design-1945-75 }
    - { claim: "Рудер и обложки Typographische Monatsblätter", field: description, source: letterform-tm }
  wiki: International Typographic Style
  links: []

