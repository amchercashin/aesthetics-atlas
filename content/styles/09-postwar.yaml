    - id: constructivism
      type: revival
      status: verified
      note: >-
        Garage документирует возврат Leonid Pavlov к авангардным формам в середине 1950-х после сталинского
        историзма; названы его учителя Vesnin и Leonidov. Возрождение ограничено этой персональной линией и
        отдельными региональными рецепциями; весь советский модернизм не объявляется восстановлением
        конструктивизма.
      sources:
        - ra26-d2-pavlov
        - ra26-d2-parallel-modernity
  summary: >
    После «борьбы с излишествами» — стекло, бетон и смелые формы: дворцы пионеров, санатории-тарелки и здания-конструкторы.
  description: |
    Хрущёвское постановление 1955 года положило конец сталинскому ампиру. Советские архитекторы вернулись
    к модернизму и наследию конструктивизма, а к 1970-м строили всё смелее: санаторий «Дружба» в Ялте
    похож на летающую тарелку, а бывшее Министерство автодорог в Тбилиси — на сложенные в небе брусья.
  traits:
    - Бетон, стекло, мозаичные панно
    - Смелые консоли и необычные формы
    - Типовое домостроение рядом с уникальными объектами
    - Космическая и научная символика
