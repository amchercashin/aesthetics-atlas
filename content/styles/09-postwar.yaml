- id: computer-art
  name: Раннее компьютерное искусство
  orig: Computer art
  aliases:
    - раннее компьютерное искусство
    - early computer art
  start: 1960
  end: 1990
  dates: 1960 – 1990
  era: postwar
  domain: [art, internet]
  region: Германия, Великобритания, США
  tier: 2
  kind:
    - technique
    - overview
  kindNote: >-
    Обзор ранних машинных методов; аналоговые устройства и программируемые цифровые компьютеры не образуют
    единого стиля.
  parents:
    - id: op-art
      type: influence
      status: verified
      note: >-
        А. Майкл Нолл сам связывает компьютерную работу Ninety Parallel Sinusoids с оп-артом и Current Бриджет
        Райли. Подтверждён этот конкретный канал 1960-х годов, не влияние на всё компьютерное искусство.
      sources:
        - ra26-noll-firsthand
    - id: constructivism
      type: influence
      status: verified
      note: >-
        V&A прямо связывает компьютерную графику John Pearson с конструктивистской рациональной программой,
        сетками и ограниченной палитрой; пример — Season’s Greetings (1990), E.969-2008. Уточнить именно
        Pearson: соседний абзац того же текста о Mihai Nadin не содержит этого утверждения. Это частный канал,
        не происхождение всего computer art.
      sources:
        - ra26-d2-computer-pearson
  summary: >-
    Раннее машинное искусство: электромеханические рисунки, программируемые плоттеры, геометрия и
    случайность.
  description: >
    В 1960-х Георг Нис, Фридер Наке и А. Майкл Нолл создавали программы для геометрических изображений на
    плоттерах. Художник задавал вычислительные правила, в том числе управляемую случайность.


    Десмонд Пол Генри использовал другой принцип: электромеханические устройства на основе аналогового
    бомбового прицела оставляли сложные траектории. Такой рисунок не следует описывать как исполнение
    цифровой программы. Карточка объединяет эти ранние машинные практики для сравнения методов.
  traits:
    - Линии, сетки, повторения и вариации
    - В цифровых работах — алгоритмы и управляемая случайность
    - В аналоговых машинах — траектории механизма
    - Художник проектирует процесс, а не только единичный рисунок
  names: [Георг Нис, Фридер Наке, А. Майкл Нолл, Вера Мольнар, Десмонд Пол Генри]
  example:
    file: Picture produced by Drawing Machine 1.jpg
    title: Рисунок Drawing Machine 1
    author: Десмонд Пол Генри
    year: 1960-е
    whyRepresentative: >-
      Аналоговая ветвь машинного искусства: линии образованы электромеханическим устройством Генри. Не
      пример программируемого плоттера.
  wiki: Computer art
  links:
    - { title: "Digital Art", url: "https://www.theartstory.org/movement/digital-art/", src: "The Art Story", lang: en }
  searchKeywords:
    - Компьютерное искусство
    - генеративное искусство
    - плоттерная графика
    - алгоритмическое искусство
  dateKind: period
  scopeNote: >-
    Машинное искусство примерно 1960–1990 годов: аналоговые рисующие устройства и ранняя цифровая графика.
    Генеративное искусство шире этой выборки и продолжается после 1990 года.
  evidence:
    - claim: >-
        Машины Генри используют аналоговый электромеханический механизм; это отдельная практика от
        программируемых цифровых плоттеров.
      field: description
      source: scm-henry-machine
  review:
    status: partial
    date: "2026-10-16"
    note: >-
      Сверено различие аналогового и цифрового методов; датировка конкретного листа остаётся приблизительной,
      цифровой плоттерный пример ещё не подобран. 16.10.2026 проверены исторические отношения и связанные с ними
      контексты и сопоставления; границы подтверждения указаны у каждой записи.
