    Искусство — это идея, а не вещь: стул, фото стула и словарная статья о стуле рядом на стене.
  description: |
    Концептуализм ставит идею выше законченного предмета: решения принимаются заранее, а исполнение второстепенно. Как отдельное движение он сложился во второй половине 1960-х годов.
    «Фонтан» Дюшана (1917) часто называют первой концептуальной работой. Джозеф Кошут в «Одном и трёх стульях» показывает деревянный стул, его фотографию и увеличенную словарную статью.
    В Москве с 1976 года работала группа «Коллективные действия» Андрея Монастырского, в ранних акциях которой участвовал Илья Кабаков.
  traits:
