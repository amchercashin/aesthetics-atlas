  parents:
    - id: constructivism
      type: influence
      status: verified
      note: >-
        Конструктивизм входил в основания практики Рейнхардта, признанного предшественником минимализма. Это
        ограниченная опосредованная линия, не происхождение всего минимализма из конструктивизма.
      sources:
        - ra26-reinhardt
        - ra26-geometric
    - id: abstract-expressionism
      type: reaction
      status: verified
      note: >-
        MoMA описывает минимализм начала 1960-х как реакцию на личный жест и успех абстрактного экспрессионизма.
        Это реакция на абстрактный экспрессионизм, а не развитие из Color Field.
      sources:
        - ra26-conceptual
  summary: >
    Повторяющиеся металлические ящики, кирпичи на полу и флуоресцентные лампы: объект без метафор и эмоций.
  description: |
    Минималисты отвергли и драму абстрактного экспрессионизма, и иронию поп-арта. Дональд Джадд делал
    «специфические объекты» — одинаковые ящики, изготовленные на фабрике, Карл Андре клал на пол металлические
    плиты, Дэн Флавин работал с лампами дневного света. «Ты видишь то, что видишь», — говорил Фрэнк Стелла.
    Эстетика минимализма потом перешла в архитектуру, интерьер и моду.
  traits:
    - Простые геометрические формы
    - Серийность и повтор одинаковых модулей
    - Промышленные материалы и изготовление
    - Отказ от метафор и выражения чувств
  names: [Дональд Джадд, Карл Андре, Дэн Флавин, Сол Левитт, Агнес Мартин]
