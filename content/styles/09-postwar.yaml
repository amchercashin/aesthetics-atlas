    - { claim: "Название главы у Ирвинга Сэндлера", field: description, source: tate-colour-field }
    - { claim: "Около 1960 года — Франкенталер, Луис, Ноланд, Томас, Гиллиам", field: description, source: tate-colour-field }
    - { claim: "Отказ от мифологического содержания и выразительного мазка", field: traits, source: tate-colour-field }
