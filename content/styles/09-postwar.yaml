    - Простые геометрические объёмы
    - Органы управления и циферблаты без украшений
    - Открытый бетон и дерево в корпусах школы
  names:
    - Инге Айхер-Шолль
    - Отль Айхер
    - Макс Билл
    - Ханс Гугелот
    - Дитер Рамс
