  summary: >-
    Цифровые коллажи и видео группы AES+F 2005–2012 годов: десятки моделей застыли в позах живой картины на
    гладком смонтированном фоне, где эпохи и места смешаны, а сюжет отсылает к старой живописи.
  description: >-
    AES+F — Татьяна Арзамасова, Лев Евзович, Евгений Святский и Владимир Фридкес. Карточка охватывает три части
    «Трилогии лиминального пространства», которую Мультимедиа Арт Музей в 2012 году впервые показал целиком как Ад,
    Рай и Чистилище. Last Riot (2005–2008) впервые показан в российском павильоне Венецианской биеннале 2007 года:
    андрогинные подростки ведут бескровную войну против самих себя в пейзаже от пустынного пляжа до заснеженного
    вулкана. «Пир Трималхиона» (с 2009 года) по «Сатирикону» Петрония разыгрывает на курорте игру «хозяев» и
    «слуг», которые меняются ролями. Allegoria Sacra (с 2011 года) переносит «Священную аллегорию» Беллини в
    международный аэропорт.


    Каждый проект — это видеоинсталляция и серия больших цифровых коллажей. По сайту коллектива, в Last Riot
    впервые появилась их алгоритмическая анимация — морфинг фотографий; среди отсылок авторы называют Караваджо,
    Дейнеку, Calvin Klein и компьютерную игру America's Army, а в «Пире Трималхиона» — маньеризм, римские фрески
    и туристическую рекламу. Музей сравнивает
    «сомнамбулический танец-бой» Last Riot с эстетикой Караваджо. Политический и социальный сюжет у группы
    меняется от проекта к проекту, а постоянным остаётся способ построения кадра: многолюдная сцена из фотографий
    моделей, сведённых в один гладкий, одинаково резкий цифровой коллаж.
  traits:
    - Многофигурная сцена — десятки моделей застыли в позах живой картины
    - Гладкая цифровая поверхность — фотографии моделей сведены в один одинаково резкий кадр
    - Смешение эпох и мест в одном пейзаже — снег и пляж, курорт и храмы, аэропорт и джунгли
    - Композиция и жесты отсылают к старой живописи — Караваджо, маньеризм, Беллини
