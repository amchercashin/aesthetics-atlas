  summary: >-
    Метод Павла Филонова и его ленинградской школы «Мастера аналитического искусства»: картина растёт из множества
    мелко прописанных ячеек, лица и фигуры дробятся и повторяются, поле заполнено без пустот.
  description: >-
    «Мастера аналитического искусства» (МАИ) — коллектив, который в 1925 году образовали учащиеся Академии
    художеств (тогда ВХУТЕИНа), занимавшиеся у Павла Филонова. По Энциклопедии Санкт-Петербурга, идеология группы
    опиралась на тексты самого Филонова — «Сделанные картины» (1914) и «Декларацию Мирового Расцвета» (1923).
    Занимались на квартире мастера на улице Литераторов; за годы через коллектив прошли больше семидесяти
    художников. В 1927 году МАИ показали первую выставку в Доме печати и поставили там «Ревизора», в начале 1930-х
    группа раскололась, а последним общим делом стало оформление «Калевалы» (1933): 11 страничных иллюстраций и
    52 заставки, работой руководил Филонов. Совместные занятия продолжались до его смерти в 1941 году.


    Русский музей пишет о «формулах» Филонова как о композициях на напряжённых ритмах, кристаллизации отдельных
    форм и особой кладке красок, вплавляющихся одна в другую; фигуры и предметы растворяются в общем движении, а
    лица дробятся и повторяются. Голова для Филонова — модель мироздания. У учеников тот же принцип виден в
    сплошной проработке поля: у Гурвича — точкой и штрихом туши, у Евграфова — теснотой фигур и вещей, у Порет —
    в узкой заставке, где каждая деталь прописана отдельно. В отличие от кубофутуризма форма здесь не
    разламывается на плоскости, а собирается из множества мелких клеток. По тексту выставки в Куму, учеников
    Филонова преследовали, его работы не выставлялись до перестройки и были заново открыты только в 1980-е.
  traits:
    - Форма собрана из множества мелких ячеек, каждая прописана отдельным мазком или штрихом
    - Поле заполнено целиком, без пустот — фигуры, дома и вещи теснятся вплотную
    - Лица и фигуры дробятся, повторяются и растворяются в общем узоре
    - В графике — плотная штриховка и точка тушью с проработкой каждой детали
