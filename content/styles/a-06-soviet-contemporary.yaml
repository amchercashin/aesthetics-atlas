  summary: >-
    Движение позднесоветских нонконформистов: готовые знаки официального искусства — лозунг, красный цвет, профиль
    вождя, героический жест — взяты целиком и поставлены в чужой контекст, где пародия обнажает их пустоту.
  description: >-
    Термин придумали Виталий Комар и Александр Меламид в Москве в 1972 году: гость мастерской назвал их картины на
    советских образах советским вариантом поп-арта, и они ответили родовым именем по той же модели — Sots Art, от
    «социалистический». Так пишет Маргарита Тупицына в каталоге первой музейной выставки соц-арта (New Museum,
    Нью-Йорк, 1986). Независимо от них к тем же мотивам пришёл Эрик Булатов, в 1975 году к движению присоединился
    скульптор Леонид Соков; работали и Александр Косолапов и Леонид Ламм. Выставиться группой в Москве так и не
    удалось, а «Двойной автопортрет» Комара и Меламида погиб на «Бульдозерной выставке» 15 сентября 1974 года.


    По Zimmerli, соц-арт иронично обнажал абсурд официального искусства: как поп-арт отвечал на
    перепроизводство товаров, так соц-арт — на перепроизводство идеологии. Тупицына показывает приёмы: Булатов
    кладёт поверх обычного пейзажа слово «Опасно», Комар и Меламид пишут лозунги на красной ткани и подписывают
    их, Соков делает грубые механические фигурки вождей против гладкой официальной скульптуры, Косолапов
    накладывает советские символы на чужой культурный текст. После эмиграции в Нью-Йорк Комар и Меламид
    перенесли тот же язык в «Ностальгический соцреализм» — картины в академической манере.
  traits:
