  summary: >-
    Объекты Николая Полисского, которые он строит вместе с жителями деревни Никола-Ленивец: большие каркасы из
    дерева, лозы и брусков в форме маяка, мозга, башни или арки стоят в поле и на берегу Угры.
  description: >-
    Полисский поселился в Никола-Ленивце в 1989 году и десять лет писал маслом пейзажи. В 2000 году, по тексту
    Мультимедиа Арт Музея, он попросил жителей деревни вылепить на берегу Угры линию из 250 снеговиков — с этого
    проекта парк начинает свою историю. С тех пор Полисский работает с артелью деревенских мастеров —
    «Никола-Ленивецкими промыслами», — которых называет соавторами, и берёт только природные материалы сельского
    быта: дерево, лозу, траву. Часть объектов задумана эфемерными и сгорает на Масленице, другие стоят годами.


    Корпус — четыре долговечных объекта парка. «Маяк» (2004) — восемнадцатиметровая башня, собранная за три
    месяца без единого гвоздя на металлическом каркасе. «Вселенский разум» (2012) — огромный деревянный мозг,
    «Бобур» (2013) — цитата формы, обнажающей конструкцию, «Белые ворота» (2016) — античная арка, которой материал
    даёт новый смысл. Парк называет Полисского основателем и почти единственным представителем русского ленд-арта,
    а критик Милена Орлова в тексте МАММ возражает: материал Полисского — не ветки и дерево, а народная мифология и
    вера в ручной труд. В отличие от ленд-арта 1960–1970-х годов, где материалом служат сами земля и камень, здесь
    в пейзаж ставится узнаваемая постройка, сплетённая руками артели.
  traits:
    - Большой каркас из дерева, лозы или брусков стоит в открытом поле или на берегу
    - Поверхность набрана из множества одинаковых элементов — прутьев, гнутых досок, брусков
    - Узнаваемая форма — маяк, арка, мозг, «обнажённая» конструкция — переведена в сельский материал
    - Масштаб соотнесён с пейзажем — объект виден издалека, к нему подходят через поле
