  parents: []
  review:
    status: reviewed
    date: "2026-10-28"
    scope: [relations, dates, text, images, gallery]
    note: >-
      Первая сверка, 28.10.2026. Связи: исторических связей с другими карточками атласа источники не дают,
      root оставлен. Даты — по Conard 2009 и Weber et al. 2022; прежняя строка «35 000 – 11 000 до н. э.»
      смешивала «лет назад» и «до н. э.». Описание — по статьям о Холе-Фельс, Виллендорфе и Мальте и по
      материалам Моравского музея и Национального археологического музея Франции; «десятки статуэток» и
      «символы плодородия» сняты, Костёнки убраны: открытого источника о них нет. Главная иллюстрация —
      подпись по Weber et al. 2022 (было «ок. 25 000 до н. э.»). Галерея — 2 изображения, подписи по
      материалам музеев-хранителей.
  gallery:
    - file: Vestonicka_venuse_edit.jpg
      title: Вестоницкая Венера
      author: автор неизвестен
      year: ок. 29 000 лет назад
      place: Моравский музей, Брно; на снимке — выставка «Охотники на мамонтов», Национальный музей, Прага, 2007
      whyRepresentative: >-
        Обожжённая глина: тяжёлая грудь и бёдра, лицо без черт, только прорези глаз — обобщённое тело-знак.
      sources: [mzm-venuse-2019]
    - file: Venus_de_Brassempouy.jpg
      title: «Дама с капюшоном» из Брассемпуи
      author: автор неизвестен
      year: граветт, верхний палеолит
      place: Национальный археологический музей, Сен-Жермен-ан-Ле (MAN 47019)
      whyRepresentative: >-
        Голова из бивня мамонта с сеткой капюшона или причёски и проработанным лицом — исключение среди безликих
        фигурок и напоминание, что «венеры» не одинаковы.
      sources: [man-brassempouy-2025]
  summary: >
    Небольшие фигурки из бивня мамонта, камня и обожжённой глины — прежде всего женские, часто
    с преувеличенными грудью, животом и бёдрами. Фигурка из Холе-Фельс — одно из древнейших известных
    фигуративных изображений.
  description: |
    Женские статуэтки верхнего палеолита находят от запада Европы до Прибайкалья: от Брассемпуи в Ландах
    и Холе-Фельс в Швабской Юре до Виллендорфа на Дунае, Дольни-Вестонице в Моравии и Мальты в Прибайкалье.
    Фигурке из Холе-Фельс, вырезанной из бивня мамонта, не меньше 35 000 лет; известные граветтские «венеры»
    моложе её минимум на 5000 лет. Виллендорфская Венера (около 30 000 лет) вырезана из оолитового известняка,
    которого нет в окрестностях находки, и была окрашена в красный; Вестоницкая Венера (около 29 000 лет)
    вылеплена из глины и обожжена.

    У многих фигурок преувеличены грудь, живот и бёдра, а лицо не проработано, но голова из Брассемпуи
    показывает и лицо. Как их понимать, спорят: специалисты Моравского музея связывают Вестоницкую Венеру
    с шаманистской картиной мира, а мальтинские фигурки Л. Лбова читает как изображения людей разного
    возраста, в том числе детей.
  traits:
    - Размер умещается в ладони
    - Преувеличенные грудь, живот и бёдра
    - Лицо чаще не проработано или скрыто «причёской»
    - Материалы — бивень мамонта, известняк, обожжённая глина
  names: [Венера Виллендорфская, Венера из Холе-Фельс, Вестоницкая Венера, Брассемпуи, Мальта (Сибирь)]
  evidence:
