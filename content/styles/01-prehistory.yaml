- id: petroglyphs
  name: Петроглифы доисторических традиций
  orig: Petroglyphs
  aliases: [наскальные рисунки, наскальные изображения, писаницы, Онежские петроглифы]
  start: -11000
  end: -1
  dates: ок. 11 000 до н. э. – I тыс. до н. э.
  dateNote: >
    Интервал охватывает примеры этой карточки, а не всю историю техники. В Валь-Камонике скалы начали
    выбивать в конце верхнего палеолита, 13 000–10 000 лет назад (≈ 11 000–8000 до н. э.; на шкале — ранняя
    граница), больше всего изображений появилось в железном веке, в I тыс. до н. э.; выбивали их и позже,
    в римское время, средневековье и новое время. Онежские петроглифы — неолит, V – середина III тыс. до н. э.
    Петроглифы старше и моложе этих рамок есть в других регионах, но в выборку не входят.
  era: prehistory
  domain: [art]
  medium: [rock-art]
  subjects: [animals, figure, any]
  region: По всему миру
  tier: 3
  kind: [technique, overview]
  kindNote: "Техника (выбивание и гравировка по камню), встречающаяся в независимых традициях по всему миру."
  parents: []
  summary: >
    Изображения, выбитые, процарапанные или вышлифованные на скалах: охотники и олени, лодки, птицы,
    диски и полумесяцы.
  description: >
    Петроглифы получают, удаляя материал поверхности камня: выбивают, процарапывают или шлифуют
    изображение. Наскальную живопись создают нанесением пигмента. Эти техники могут сосуществовать;
    открытая скала и пещера сами по себе не задают последовательность развития. Точного способа
    датировать сами выбитые изображения пока нет: возраст выводят из наложений одних фигур на другие,
    из стиля и из археологического окружения.


    Здесь собраны доисторические примеры из разных регионов. В Валь-Камонике в Альпах скалы выбивали
    с конца верхнего палеолита до железного века; на одной Большой скале Накуане больше двух тысяч
    изображений — от позднего неолита до раннего железного века. Онежские петроглифы оставили неолитические
    жители берегов озера; к середине III тыс. до н. э. вода поднялась и почти на тысячу лет скрыла их.
    В Сахаре, на плато Месак, гравюры с быками стоят на обрядовых площадках скотоводов 5430–5150 лет назад
