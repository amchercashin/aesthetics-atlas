  summary: >
    Древнейшие известные изображения: трафареты ладоней, быки, лошади, бизоны и олени, нанесённые охрой,
    марганцем и углём на стены пещер.
  description: |
    Наибольший опубликованный минимальный возраст наскального изображения — у трафарета ладони в пещере
    Лианг-Метандуно на индонезийском острове Муна: слой кальцита над ним показывает, что рисунку не меньше
    67 800 лет. Минимальный возраст трафарета из испанской пещеры Мальтравьесо на 1,1 тыс. лет меньше; авторы
    его датировки считают, что рисовали неандертальцы, и эта атрибуция оспаривается. Позже появляются целые
    «залы»: в Шове (около 36 000 лет назад), в Ласко (около 23–21 тыс. лет назад) и в Альтамире, где
    полихромных бизонов написали около 14 500 лет назад. Пигменты — оксиды железа и марганца и уголь, свет
    давали каменные лампы: в Ласко их нашли больше сотни.

    Панно складывались в несколько приёмов: в Ласко обычно сначала рисовали лошадей, потом быков и оленей.
    Иногда выступ или край стены достраивал часть силуэта, хотя таких фигур немного. Зачем это делалось,
    спорят поколения исследователей: охотничья магия, тотемизм, структурный порядок пещеры, шаманизм.
  traits:
    - Животные в профиль, переданные несколькими уверенными линиями
    - Природные пигменты — охра, уголь, марганец
    - Выступ или трещина стены иногда достраивает силуэт
    - Отпечатки и трафареты ладоней
    - Нет рамки, горизонта и сюжета в привычном смысле
  promptCues:
