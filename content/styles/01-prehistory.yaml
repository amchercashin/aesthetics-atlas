- id: aboriginal-art
  name: Искусство аборигенов Австралии
  orig: Australian Aboriginal art
  aliases: [аборигенное искусство]
  searchKeywords: [точечная живопись, dot painting, рентгеновский стиль, Какаду, Анбангбанг, Гвион, Кимберли, Папуния]
  start: -26000
  end: null
  dates: ок. 28 000 лет назад – наши дни
  dateKind: archaeological
  approx: true
  dateNote: >
    Начало — фрагмент рисунка углём из скального навеса Наварла-Габарнманг в Арнем-Ленде: по оценке авторов,
    ему около 28 000 лет, а стратиграфия допускает 15 600–45 600 лет. Для шкалы 28 000 лет назад переведены
    в ≈ 26 000 до н. э. Это нижняя граница известного, а не начало традиции. Конца нет: скалы расписывали ещё
    в 1960-х, а традиция продолжается в живописи.
  era: prehistory
  domain: [art]
  medium: [rock-art, painting]
  subjects: [religion-myth, animals, any]
  region: Австралия
  tier: 2
  kind: tradition
  root: true
  parents: []
  review:
    status: reviewed
    date: "2026-10-28"
    scope: [relations, dates, text, images, gallery]
    note: >-
      Первая сверка, 28.10.2026. Связи: своих исторических связей у карточки нет, root оставлен; контексты
      из карточек авторов ссылаются на неё со своими источниками. Даты — по David et al. 2013: прежняя
      «ок. 28 000 до н. э.» путала «лет назад» и «до н. э.». Описание — по David et al. 2013, Finch et al. 2020
      и 2021, May et al. 2019, страницам национального парка Какаду и истории Papunya Tula Artists; сняты
      «старейшая непрерывная традиция Земли», «поражают изяществом», «на холст акрилом», «мировое явление»
      и признак «точки, концентрические круги, линии-тропы» — открытого источника для него не нашлось.
      Главная иллюстрация заменена: у прежней «баррамунди, Какаду» на странице файла нет ни места, ни даты —
      она перенесена в галерею с честной подписью, а главной стала роспись Анбангбанга 1963/64 года, которую
      описывает статья May et al. Галерея — 2 изображения, подписи по страницам файлов Commons и самим снимкам.
  gallery:
    - file: Ubirr_rock_art.JPG
      title: Длинношеяя черепаха, Убирр
      author: автор неизвестен
      year: дата неизвестна
      place: Убирр, Национальный парк Какаду, Австралия
      whyRepresentative: >-
        Внутри контура черепахи линиями разделены панцирь и лапы, а через всё тело проходит одна линия —
        внутреннее строение показано, как в «рентгеновской» манере; рядом видны более бледные фигуры, среди них рыба.
      sources: [kakadu-ubirr]
    - file: Aboriginal art barramundi rock art.jpg
      title: Рыбы баррамунди
      author: автор неизвестен
      year: дата неизвестна
      place: место не указано на странице файла
      whyRepresentative: >-
        У рыб красными линиями показаны хребет с рёбрами и внутренние части, а тело расчерчено тонкой штриховкой.
  summary: >
    Традиция, которую можно проследить десятки тысяч лет: от рисунка углём возрастом около 28 000 лет до
    росписей скал 1960-х и живописи Папуньи.
  description: |
    Древнейший подтверждённый рисунок в Австралии — фрагмент рисунка углём на плите, упавшей с потолка скального
    навеса Наварла-Габарнманг в Арнем-Ленде: по оценке авторов, ему около 28 000 лет. В Кимберли натуралистичных
    животных писали 17–13 тыс. лет назад; роспись кенгуру, сделанная 17 500–17 100 лет назад, — древнейшая
    радиометрически датированная роспись на скале в Австралии. Человеческие фигуры стиля Гвион
    в основном датируют временем около 12 000 лет назад.

    Скалы расписывали и в XX веке. В галерее Анбангбанг в Какаду Наёмболми и Джимонгурр в сезон дождей
    1963/64 года написали предков и рыб в «рентгеновской» манере поверх более ранних росписей в сходном стиле.
    В 1971 году в Папунье учитель Джеффри Бардон предложил мужчинам расписать стену школы, а через год
    художники основали компанию Papunya Tula Artists; их живопись выросла из росписи тела и рисунков на песке.
  traits:
    - Фигуры в «рентгеновском» стиле — видны кости и органы
    - Краска из растёртых минералов на воде; дольше всех держится красный гематит
    - Новые росписи ложатся поверх старых
    - Предки-создатели рядом с рыбами, животными и людьми
  names: [Арнем-Ленд, Кимберли, Гвион, Анбангбанг, Наёмболми, Папуния-Тула, Альберт Наматжира, Эмили Кам Кнгваррей]
  evidence:
    - { claim: "Фрагмент рисунка углём из Наварла-Габарнманг — вероятно, около 28 000 лет; стратиграфия 15 600–45 600 cal BP; древнейшая подтверждённая пиктограмма Австралии", field: dates, source: david-2013 }
    - { claim: "Натуралистичные животные Кимберли — 17–13 тыс. лет назад; кенгуру — 17 500–17 100 лет назад, древнейшая радиометрически датированная in situ роспись Австралии", field: description, source: finch-2021 }
    - { claim: "Фигуры стиля Гвион в основном созданы около 12 000 лет назад", field: description, source: finch-2020 }
    - { claim: "Верхний слой галереи Анбангбанг написан в сезон дождей 1963/64 Наёмболми и Джимонгурром поверх более ранних росписей в сходном стиле: предки Намандьолк (головное украшение dabberrk из перьев белого какаду), Намарркон и Барркинь, три «рентгеновские» рыбы саратога, ряд человеческих фигур", field: description, source: may-2019 }
    - { claim: "Галерея Анбангбанг — главный сайт росписей Буррунгкуй (Нурланджи) в Какаду", field: traits, source: kakadu-burrungkuy }
    - { claim: "В Какаду — натуралистичные животные и традиционные «рентгеновские» росписи; краску готовили, растирая минералы и смешивая их с водой; дольше всех держится красный гематит; старые росписи часто перекрыты новыми", field: traits, source: kakadu-rock-art }
    - { claim: "Большинство «рентгеновских» росписей галереи Убирра, о которой говорит страница, — последних 1500 лет; на них рыбы, водоплавающие птицы, валлаби и другая пища", field: gallery, source: kakadu-ubirr }
    - { claim: "Движение Papunya Tula началось в 1971 году, когда учитель Джеффри Бардон предложил мужчинам расписать стену школы; в 1972 художники основали компанию; стиль — из росписи тела и рисунков на песке", field: description, source: papunya-tula-history }
