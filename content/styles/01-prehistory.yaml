- id: neolithic-art
  name: Неолитическое искусство
  orig: Neolithic art
  aliases: [искусство неолита]
  searchKeywords: [неолит, керамика дзёмон, трипольская культура, Кукутени, Яншао, Хаджылар, пламенный сосуд]
  start: -13000
  end: -3000
  dates: ок. 13 000 – 3000 до н. э.
  dateKind: archaeological
  approx: true
  dateNote: >
    Начало — древнейшая керамика дзёмон: около 15 000–11 800 калиброванных лет назад (≈ 13 000–9800 до н. э.;
    на шкале — ранняя граница). Прежнее начало, 10 000 до н. э., было моложе этой керамики, хотя карточка
    сама на неё ссылается. Конец условный: самые поздние примеры — «пламенные» сосуды среднего дзёмона
    (около 5000 лет назад) и керамика Кукутени-Триполья; в каждом регионе неолит кончается в своё время.
  era: prehistory
  domain: [art, design]
  medium: [ceramics, decorative-arts, sculpture, painting]
  subjects: [ornament]
  region: Евразия
  tier: 2
  kind: overview
  kindNote: "Обзор: собирательная карточка для разных неолитических культур Евразии."
  origin: unknown
  review:
    status: reviewed
    date: "2026-10-28"
    scope: [relations, dates, text, images, gallery]
    note: >-
      Сверка 28.10.2026. Связи проверены 16.10.2026 и перепроверены: своих родителей у обзорной карточки нет;
      входящие контексты принадлежат другим карточкам и сверяются в их партиях. Даты: начало сдвинуто
      с 10 000 до 13 000 до н. э. по Craig et al. 2013 (открытый вопрос F05 закрыт). Описание переписано по
      Craig et al. 2013, эссе Met о дзёмон (открыто 13.10; сегодня Met отвечает 429), текстам музея Уматака
      (Агентство по туризму Японии), пресс-релизам Нагаоки и записям собраний MAA Cambridge и LACMA. Сняты
      «орнаментированные стены», роспись Чатал-Хююка, «ритм и симметрия вместо сюжета», «охра, белая
      и чёрная краски» и обобщение про «спирали, волны и сетки» у всех культур — открытых источников
      для них нет. Главная иллюстрация: снята подпись «Национальный музей, Токио» — она ничем
      не подтверждалась; сосуд найден на Иванохаре. Галерея: фото раскопа Чатал-Хююка убрано — искусства
      на нём не видно, замена не подбиралась; фигурка из Хаджылара была подписана «Керамика дзёмон» —
      подпись исправлена.
  parents: []
  summary: >
    Расписная и лепная керамика и глиняные фигурки неолитических обществ Евразии — от охотников-собирателей
    дзёмон до земледельцев Триполья.
  scopeNote: >
    Обзорная карточка для очень разных культур. Керамика и орнамент здесь не привязаны к земледелию:
    ранние дзёмон в Японии делали одну из древнейших керамик, оставаясь охотниками, рыболовами
    и собирателями.
  description: |
    Карточка собирает декор посуды и фигурок очень разных обществ, и связь с земледелием здесь не обязательна.
    Керамика появилась у охотников-собирателей Восточной Азии 20 000–12 000 лет назад. Дзёмон в Японии лепили
    сосуды уже около 15 000 лет назад, а пищу добывали охотой, рыболовством и собирательством; попытки
    выращивать растения появляются у них, возможно, лишь в среднем дзёмоне. Около 5000 лет назад в бассейне
    реки Синано лепили сосуды «пламенного» типа: четыре гребневидных выступа над краем и зубчатая кромка.
    В таких сосудах готовили еду — на них остался нагар.

    У земледельцев свои системы декора: керамику Кукутени-Триполья в Восточной Европе расписывали
    линиями и спиралями, в китайской культуре Яншао тоже делали расписную посуду. Общей школы у этих
    культур нет — их сводит вместе только эпоха.
  traits:
    - Роспись и лепной рельеф на керамике
    - Спирали и линии, обегающие весь сосуд
    - Скульптурные выступы над краем «пламенных» сосудов дзёмон
    - Глиняные фигурки, расписанные полосами
  names: [керамика дзёмон, Кукутени-Триполье, Яншао, Хаджылар]
  evidence:
    - { claim: "Люди дзёмон добывали пищу собирательством, рыболовством и охотой; ранняя керамика дзёмон — одна из древнейших; культивация растений — возможно, с среднего дзёмона", field: description, source: met-jomon }
    - { claim: "Керамика впервые появилась у охотников-собирателей Восточной Азии 20 000–12 000 cal BP; керамика начального дзёмона — около 15 000–11 800 cal BP", field: dates, source: craig-2013 }
    - { claim: "Сосуды «пламенного» типа — около 5000 лет назад, средний дзёмон; признаки — четыре гребневидных выступа и зубчатые выступы по кромке; у поздних сосудов Уматаки и Иванохары край сильно раскрыт наружу; нагар говорит о том, что в них готовили; большинство находок — в бассейне Синано", field: description, source: jta-umataka }
    - { claim: "Сосуд «пламенного» типа с памятника Иванохара (Нагаока) — время «пламенных» сосудов, около 5000 лет назад; выставлялся у Стоунхенджа в 2022–2023 годах", field: example, source: nagaoka-2022 }
    - { claim: "Черепки керамики Кукутени A расписаны тёмно-коричневыми линиями и спиралями; поздний неолит — энеолит, Кукутени-Триполье", field: traits, source: maa-cucuteni-sherds }
    - { claim: "Расписной сосуд культуры Яншао, 4800–3070 до н. э.", field: description, source: lacma-yangshao-jar }
  example:
