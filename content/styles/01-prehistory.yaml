    - { claim: "Виллендорфской Венере около 30 000 лет; найдена 7 августа 1908 года; хранится в Музее естествознания в Вене; высота 110 мм; оолитовый известняк, окрашена в красный; безликая, с преувеличенными формами", field: example, source: weber-2022 }
    - { claim: "Вестоницкая Венера — около 29 000 лет, вылеплена из глины и обожжена, найдена в 1925 году; специалисты музея связывают её с шаманистской картиной мира", field: description, source: mzm-venuse-2019 }
    - { claim: "«Дама с капюшоном» — грот Папы в Брассемпуи (Ланды), бивень, граветт, раскопки Пиетта 1894 года, MAN 47019", field: description, source: man-brassempouy-2025 }
    - { claim: "Мальта — стоянка в Прибайкалье; антропоморфные фигурки из бивня; часть, по Лбовой, изображает детей разного возраста", field: description, source: lbova-2021 }
  example:
