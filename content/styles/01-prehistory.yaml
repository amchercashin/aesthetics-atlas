  start: -35000
  end: -11000
  dates: ок. 35 000 – 11 000 до н. э.
  era: prehistory
  domain: [art]
  region: Европа, Сибирь
  tier: 2
  kind: tradition
  root: true
  parents: []
  gallery:
    - file: Vestonicka_venuse_edit.jpg
      title: Вестоницкая Венера
    - file: Venus_de_Brassempouy.jpg
      title: Венера из Брассемпуи
  summary: >
    Маленькие фигурки из камня, бивня и кости — прежде всего женские, с подчёркнутыми формами.
    Одни из древнейших известных скульптурных изображений человека.
  description: |
    От Атлантики до Байкала находят десятки статуэток, которые археологи условно называют «венерами»:
    от Холе-Фельс и Виллендорфа до Костёнок и Мальты под Иркутском. Лицо у них обычно не проработано,
    зато грудь, живот и бёдра преувеличены. Это могли быть амулеты, символы плодородия или изображения
    самих себя — главное, что человек уже умел обобщать форму и превращать тело в знак.
  traits:
    - Размер умещается в ладони
    - Преувеличенные грудь, живот и бёдра
    - Лицо не проработано или скрыто «причёской»
    - Материалы — известняк, бивень мамонта, кость, обожжённая глина
  names: [Венера Виллендорфская, Венера из Холе-Фельс, Костёнки, Мальта (Сибирь)]
  example:
    file: Venus of Willendorf frontview retouched 2.jpg
    title: Венера Виллендорфская
    year: ок. 25 000 до н. э.
    place: Музей естествознания, Вена
  wiki: Venus figurine
  links:
    - { title: "Venus of Willendorf", url: "https://www.worldhistory.org/Venus_of_Willendorf/", src: "World History Encyclopedia", lang: en }
  searchKeywords:
    - Палеолитическая пластика
    - Венера Виллендорфская
    - мобильное искусство
  scopeNote: >-
    Выборка женских антропоморфных фигурок верхнего палеолита, традиционно называемых «венерами». Не вся
    палеолитическая пластика и не доказанная единая функция предметов.
  dateKind: archaeological

