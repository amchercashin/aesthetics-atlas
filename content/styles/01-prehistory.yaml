  review:
    status: reviewed
    date: "2026-10-28"
    scope: [relations, dates, text, images, gallery]
    note: >-
      Сверка 28.10.2026 (раньше, 16.10, без галереи). Связи: контекст «неолитическое искусство» перепроверен
      по аннотации Schulz Paulsson 2019. Даты не менялись: начало — по той же статье, конец условный. Страницы
      English Heritage открыты заново. Описание дополнено по отчёту коммуны Карнак (2020) и статье «Дольмен»
      БСЭ; сняты «святилища» в кратком описании, «грубо обработанные камни» (опорные камни оси солнцестояния
      в Стоунхендже как раз тщательно обтёсаны) и «простая форма при огромном масштабе». Главной иллюстрации
      добавлены источники и описание видимого. Галерея: Скара-Брей убрана — это поселение, а не мегалит;
      вместо неё дольмен в долине Жане. Дата этого дольмена на странице файла не указана; общая датировка
      дольменов Кавказа — по статье А. Л. Монгайта в БСЭ.
