    whyRepresentative: >-
      Безликая фигурка высотой 11 см: голова закрыта рядами «причёски», грудь, живот и бёдра преувеличены,
      тонкие руки лежат на груди.
    sources: [weber-2022]
  wiki: Venus figurine
  links:
