- id: paleolithic-cave-art
  name: Палеолитическая наскальная живопись
  orig: Paleolithic cave art
  aliases: [наскальная живопись, пещерная живопись, cave painting]
  searchKeywords: [Ласко, Шове, Альтамира, Сулавеси, Муна, трафарет ладони]
  start: -65800
  end: -10000
  dates: не позже 67 800 лет назад – ок. 10 000 до н. э.
  dateKind: archaeological
  approx: true
  dateNote: >
    Начало — минимальный возраст древнейшего датированного изображения: трафарет ладони на острове Муна
    старше 67 800 лет (погрешность ±3800 лет). Для шкалы возраст «лет назад» переведён в календарный год
    приблизительно (≈ 65 800 до н. э.). Это граница известного, а не дата появления живописи.
  era: prehistory
  domain: [art]
  medium: [rock-art, painting]
  region: Европа, Индонезия, Урал
  tier: 1
  kind: overview
  kindNote: "Обзор: объединяет независимые традиции разных континентов и десятков тысячелетий."
  root: true
  parents: []
  summary: >
    Древнейшие известные изображения: трафареты ладоней, быки, лошади и олени, нанесённые охрой
    и углём на стены пещер.
  description: |
    Самое древнее из надёжно датированных изображений — трафарет ладони в пещере Лианг-Метандуно
    на индонезийском острове Муна: слой кальцита над ним показывает, что рисунку не меньше 67 800 лет.
    Немного моложе по опубликованной датировке трафарет из Испании, который приписывают неандертальцам.
    Гораздо позже, в пещерах Шове, Ласко и Альтамира, появляются целые «залы»: стада быков, бизонов
    и лошадей, написанные минеральными пигментами при свете жировых ламп.

    Художники использовали выпуклости камня как объём, а одни фигуры наслаивали на другие.
    Зачем это делалось — ритуал, охотничья магия, обучение, — до сих пор спорят. Ясно одно:
    стремление изображать мир старше письма, городов и земледелия.
  traits:
    - Животные в профиль, переданные несколькими уверенными линиями
    - Природные пигменты — охра, уголь, марганец
    - Рельеф стены работает как объём фигуры
    - Отпечатки и трафареты ладоней
    - Нет рамки, горизонта и сюжета в привычном смысле
  names: [Лианг-Метандуно (Муна), Леанг-Тедонгнге, Шове, Ласко, Альтамира, Капова пещера]
  evidence:
    - { claim: "Трафарет ладони на о. Муна: минимальный возраст 67,8 тыс. лет (U-серия по кальциту, ±3,8 тыс.)", field: dates, source: oktaviana-2026 }
    - { claim: "Ласко: радиоуглеродные даты около 21–18 тыс. лет назад, датировка изображений обсуждается", field: example, source: lascaux-dating }
  example:
    file: Lascaux painting.jpg
    title: Зал быков, пещера Ласко
    year: ок. 21–18 тыс. лет назад
    place: Дордонь, Франция
    whyRepresentative: Животные в профиль, наложение фигур, рельеф стены, минеральные пигменты.
  gallery:
    - { file: "Lascaux, Megaloceros.jpg", title: "Большерогий олень, Ласко", year: "ок. 21–18 тыс. лет назад" }
  wiki: Cave painting
  links:
    - { title: "Lascaux — официальный сайт", url: "https://archeologie.culture.gouv.fr/lascaux/en", src: "Министерство культуры Франции", lang: en }
    - { title: "Cave Art", url: "https://www.worldhistory.org/Cave_Art/", src: "World History Encyclopedia", lang: en }

- id: venus-figurines
  name: Палеолитическая пластика
  orig: Paleolithic Venus figurines
  aliases: [палеолитические венеры, Венера Виллендорфская, венеры, мобильное искусство]
  start: -35000
  end: -11000
  dates: ок. 35 000 – 11 000 до н. э.
  era: prehistory
  domain: [art]
  region: Европа, Сибирь
  tier: 2
  kind: tradition
  root: true
  parents: []
  summary: >
    Маленькие фигурки из камня, бивня и кости — прежде всего женские, с подчёркнутыми формами.
    Одни из древнейших известных скульптурных изображений человека.
  description: |
    От Атлантики до Байкала находят десятки статуэток, которые археологи условно называют «венерами»:
    от Холе-Фельс и Виллендорфа до Костёнок и Мальты под Иркутском. Лицо у них обычно не проработано,
    зато грудь, живот и бёдра преувеличены. Это могли быть амулеты, символы плодородия или изображения
    самих себя — главное, что человек уже умел обобщать форму и превращать тело в знак.
  traits:
    - Размер умещается в ладони
    - Преувеличенные грудь, живот и бёдра
    - Лицо не проработано или скрыто «причёской»
    - Материалы — известняк, бивень мамонта, кость, обожжённая глина
  names: [Венера Виллендорфская, Венера из Холе-Фельс, Костёнки, Мальта (Сибирь)]
  example:
    file: Venus of Willendorf frontview retouched 2.jpg
    title: Венера Виллендорфская
    year: ок. 25 000 до н. э.
    place: Музей естествознания, Вена
  wiki: Venus figurine
  links:
    - { title: "Venus of Willendorf", url: "https://www.worldhistory.org/Venus_of_Willendorf/", src: "World History Encyclopedia", lang: en }

- id: petroglyphs
  name: Петроглифы
  orig: Petroglyphs
  aliases: [наскальные рисунки, наскальные изображения, писаницы, Онежские петроглифы, Тассилин-Аджер]
  start: -12000
  end: -1000
  dates: ок. 12 000 – 1000 до н. э.
  era: prehistory
  domain: [art]
  region: По всему миру
  tier: 3
  kind: [technique, overview]
  kindNote: "Техника (выбивание и гравировка по камню), встречающаяся в независимых традициях по всему миру."
  parents:
    - { id: paleolithic-cave-art, type: evolved }
  summary: >
    Изображения, выбитые или процарапанные на открытых скалах: охотники, лодки, лоси, солнечные знаки
    и загадочные фигуры.
  description: |
    Когда искусство выходит из пещер на открытый камень, рисунок сменяет гравировка: контур выбивают
    каменным орудием. Петроглифы есть на всех обитаемых континентах — от Сахары до Карелии, где на
    берегу Онежского озера сохранились «Бес» и сотни других фигур. Сюжеты становятся сложнее: появляются
    сцены охоты, ритуальные процессии, лодки и первые схемы, похожие на пиктограммы.
  traits:
    - Контур, выбитый или процарапанный в камне
    - Силуэтные, схематичные фигуры людей и животных
    - Солярные и геометрические знаки
    - Сцены охоты и ритуалов на открытых скалах
  names: [Онежские петроглифы, Беломорские петроглифы, Тассилин-Аджер, Валь-Камоника]
  example:
    file: Onega petroglyphs.jpg
    title: Онежские петроглифы
    year: IV–III тыс. до н. э.
    place: Карелия, Россия
  gallery:
    - { file: "Libya 5321 Meercatze (Gatti Mammoni) Petroglyphs Wadi Methkandoush Luca Galuzzi 2007.jpg", title: "Петроглифы Вади-Меткандуш", year: "ок. 10 000 до н. э." }
  wiki: Petroglyph
  links:
    - { title: "Petroglyph", url: "https://www.worldhistory.org/Petroglyph/", src: "World History Encyclopedia", lang: en }

- id: neolithic-art
  name: Неолитическое искусство
  orig: Neolithic art
  aliases: [искусство неолита]
  searchKeywords: [неолит, керамика дзёмон, трипольская культура, Кукутени, Чатал-Хююк, Яншао]
  start: -10000
  end: -3000
  dates: ок. 10 000 – 3000 до н. э.
  era: prehistory
  domain: [art, design]
  region: Евразия
  tier: 2
  kind: overview
  kindNote: "Обзор: собирательная карточка для разных неолитических культур Евразии."
  parents:
    - { id: paleolithic-cave-art, type: evolved }
  summary: >
    Расписная и лепная керамика, орнаментированные стены и фигурки неолитических обществ Евразии —
    от охотников-собирателей дзёмон до земледельцев Триполья.
  scopeNote: >
    Обзорная карточка для очень разных культур. Керамика и орнамент здесь не привязаны к земледелию:
    ранние дзёмон в Японии делали одну из древнейших керамик, оставаясь охотниками, рыболовами
    и собирателями.
  description: |
    В неолите многие общества переходят к более оседлой жизни, и посуда, стены домов и фигурки
    становятся поверхностями для декора. Связь с земледелием не обязательна: ранние сообщества дзёмон
    в Японии делали глубокие сосуды — одни из древнейших известных — и добывали пищу охотой,
    рыболовством и собирательством; попытки выращивать растения у них появляются, возможно, лишь
    в среднем дзёмоне. Земледельческие культуры — Кукутени-Триполье в Восточной Европе, Яншао в Китае,
    Чатал-Хююк в Анатолии — дают свои системы росписи. Общее у них — декор, покрывающий поверхность
    ритмом спиралей, волн и сеток, а не сценой.
  traits:
    - Орнамент — спирали, волны, меандры, сетки
    - Роспись и лепной декор на керамике
    - Ритм и симметрия вместо сюжета
    - Охра, белая и чёрная краски
  names: [керамика дзёмон, Кукутени-Триполье, Чатал-Хююк, Яншао]
  evidence:
    - { claim: "Люди дзёмон добывали пищу собирательством, рыболовством и охотой; ранняя керамика дзёмон — одна из древнейших; культивация растений — возможно, с среднего дзёмона", field: description, source: met-jomon }
  example:
    file: Jomon Flame Style Pottery, 3000 BC.jpg
    title: Сосуд дзёмон в «пламенном» стиле
    year: ок. 3000 до н. э.
    place: Национальный музей, Токио
  gallery:
    - { file: "Two painted pottery jar. Cucuteni-Tripolje culture. Neues Museum.jpg", title: "Расписные сосуды Кукутени-Триполье", year: "V–IV тыс. до н. э." }
  wiki: Neolithic art
  links:
    - { title: "Jōmon pottery", url: "https://www.worldhistory.org/Jomon_Pottery/", src: "World History Encyclopedia", lang: en }

- id: megaliths
  name: Мегалиты Европы
  orig: European megaliths
  aliases: [мегалиты, мегалитическая архитектура]
  searchKeywords: [менгиры, дольмены, кромлехи, Стоунхендж, Карнак, дольмены Кавказа]
  start: -4500
  end: -1500
  dates: ок. 4500 – 1500 до н. э.
  dateKind: archaeological
  approx: true
  dateNote: >
    Начало — по радиоуглеродным датам древнейших мегалитических гробниц Европы (вторая половина
    V тыс. до н. э.). Конец условен: в разных регионах традиция угасает в разное время.
  era: prehistory
  domain: [architecture]
  medium: [architecture]
  region: Европа, Средиземноморье, Кавказ
  tier: 2
  kind: tradition
  scopeNote: >
    Мегалитические гробницы, менгиры и каменные круги Европы, Средиземноморья и Кавказа. Более ранние
    монументальные постройки Ближнего Востока — например, Гёбекли-Тепе (9600–8200 до н. э.) — сюда
    не входят: это другая традиция со своей хронологией, и в атласе её пока нет.
  parents:
    - { id: neolithic-art, type: evolved }
  summary: >
    Многотонные камни, поставленные кругами, рядами и «столами»: гробницы и святилища
    неолитической и бронзовой Европы.
  description: |
    По радиоуглеродным датам мегалитические гробницы появляются во второй половине V тыс. до н. э.
    почти одновременно на северо-западе Франции, в Средиземноморье и на атлантическом побережье
    Иберии, а затем распространяются по морским путям. Общины перемещают многотонные блоки, ставят
    менгиры, складывают дольмены и кромлехи. В Стоунхендже камни поставили около 2500 года до н. э.
    внутри более раннего кольцевого рва, и памятник ориентирован на солнцестояния. Бретонский Карнак
    тянется рядами тысяч камней, а дольмены Кавказа похожи на каменные дома с круглым входом.
  traits:
    - Грубо обработанные многотонные камни
    - Круги, аллеи и «столы» из блоков
    - Ориентация части памятников по солнцу
    - Простая форма при огромном масштабе
  names: [Стоунхендж, Карнак, дольмены Кавказа]
  evidence:
    - { claim: "Мегалитические гробницы Европы появились во второй половине V тыс. до н. э. на северо-западе Франции, в Средиземноморье и на атлантическом побережье Иберии", field: dates, source: schulz-paulsson-2019 }
    - { claim: "Гёбекли-Тепе — 9600–8200 до н. э.; поэтому вынесен за рамки карточки", field: scope, source: unesco-gobekli-tepe }
    - { claim: "Стоунхендж: ров около 3000, камни около 2500 до н. э.", field: example, source: eh-stonehenge-history }
    - { claim: "Стоунхендж ориентирован на летний восход и зимний закат солнцестояний", field: description, source: eh-understanding-stonehenge }
  review: { status: partial, date: 2026-10-13, note: "Сверены охват, даты, пример и описание. Связь с неолитическим искусством — редакционная, не проверялась." }
  example:
    file: Stonehenge2007 07 30.jpg
    title: Стоунхендж
    year: ров — ок. 3000, камни — ок. 2500 до н. э.
    place: Уилтшир, Англия
    whyRepresentative: Круг из многотонных камней и трилитов — масштаб, простая форма, ориентация по солнцу.
  wiki: Megalith
  links:
    - { title: "Stonehenge", url: "https://www.worldhistory.org/stonehenge/", src: "World History Encyclopedia", lang: en }

- id: aboriginal-art
  name: Искусство аборигенов Австралии
  orig: Australian Aboriginal art
  aliases: [аборигенное искусство, точечная живопись, рентгеновский стиль, dot painting]
  start: -28000
  end: null
  dates: ок. 28 000 до н. э. – наши дни
  era: prehistory
  domain: [art]
  region: Австралия
  tier: 2
  kind: tradition
  root: true
  parents: []
  summary: >
    Старейшая непрерывная художественная традиция Земли: от наскальных росписей «рентгеновского» стиля
    до современной точечной живописи.
  description: |
    Скальные росписи Арнем-Ленда и Кимберли создавались десятки тысяч лет и обновлялись поколениями.
    В «рентгеновском» стиле у животных видны кости и внутренности, а фигуры Гвион-Гвион поражают
    изяществом. В 1971 году в Папуние художники перенесли знаки сновидений на холст акрилом —
    так родилась точечная живопись, ставшая мировым явлением.
  traits:
    - Фигуры в «рентгеновском» стиле — видны кости и органы
    - Точки, концентрические круги, линии-тропы
    - Охра, белая глина, уголь; позже — акрил
    - Изображение как карта мифа и земли
  names: [Арнем-Ленд, Гвион-Гвион, Папуния-Тула, Альберт Наматжира, Эмили Кам Нгварри]
  example:
    file: Aboriginal art barramundi rock art.jpg
    title: Рыба баррамунди в «рентгеновском» стиле
    place: Национальный парк Какаду, Австралия
  wiki: { en: Australian Aboriginal art, ru: Искусство Австралии }
  links: []
