  parents: []
  summary: >
    Изображения, выбитые или процарапанные на открытых скалах: охотники, лодки, лоси, солнечные знаки
    и загадочные фигуры.
  description: >
    Петроглифы получают, удаляя материал поверхности камня: выбивают, процарапывают или шлифуют
    изображение. Наскальную живопись создают нанесением пигмента. Эти техники могут сосуществовать;
    открытая скала и пещера сами по себе не задают последовательность развития.


    Здесь собраны доисторические примеры из разных регионов, в том числе Карелии и Сахары. Общая техника не
    доказывает ни единого происхождения, ни одинакового смысла лодок, животных и геометрических знаков.
  traits:
    - Контур, выбитый или процарапанный в камне
    - Силуэтные, схематичные фигуры людей и животных
    - Солярные и геометрические знаки
    - Сцены охоты и ритуалов на открытых скалах
