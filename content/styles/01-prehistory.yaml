  dateNote: >
    Начало — минимальный возраст фигурки из Холе-Фельс: не меньше 35 000 калиброванных лет назад
    (≈ 33 000 до н. э.). Конец, около 10 000 до н. э., — условная граница верхнего палеолита без
    отдельного источника: поздние фигурки атлас не сверял. Граветтские статуэтки карточки — Виллендорф,
    Дольни-Вестонице, Брассемпуи — моложе Холе-Фельс минимум на 5000 лет.
  era: prehistory
