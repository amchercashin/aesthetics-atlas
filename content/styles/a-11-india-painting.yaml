  wiki: { en: Pithora }
  summary: >-
    Сакральные настенные росписи общин ратхва и соседних народов Западной Индии: ряды пёстрых коней божеств и
    предков, слон, тигры у врат и сцены деревенской жизни внутри цветной прямоугольной рамки на белой стене дома.
  description: >-
    Для общины ратхва в округах Чхота-Удайпур и Панчмахал (Гуджарат), а также соседних общин бхилала, наяк и
    дханак на границе Гуджарата и Мадхья-Прадеша питхора — не украшение интерьера, а священное действие и
    «письмо» (носители традиции называют работу не живописью, а записью). Роспись заказывает хозяин дома
    (гхардхани) по обету в честь главного божества Бабо Питхоро — ради исцеления, урожая, рождения детей или
    благополучия семьи. Традиционно она занимает три внутренние стены прихожей-гостиной (осари), прежде всего
    главную стену размером около 3,3 × 2,5 м, которую накануне белят речной белой глиной (панду) незамужние
    девушки семьи.


    Роспись выполняет потомственная мужская артель мастеров-писцов (лакхара) из деревень вроде Маладжи, Оде или
    Сурси (в частности, известны мастера Мансингхбхай и Харибхай Ратхва), пользуясь бамбуковыми кистями и
    красками, разведёнными на коровьем молоке и настое цветков махуа. Композицию замыкает яркий геометрический
    прямоугольник (рамка — четыре стороны света) с нижними вратами, которые стерегут два тигра или льва. Внутри
    диагональными рядами шествуют украшенные розетками кони божеств и предков (от 5–9 коней в «малом» Ардхо
    Питхоро до 18 со всадниками в «полном» Акхо Питхоро): Баба Ганеш, Бабо Питхоро с попугаем, Питхори Рани с
    веером, Рани Каджал, двенадцатиголовый Баар Матха но Дхани и царь Бходж на слоне; нижнюю зону наполняют
    сцены пахоты, танцев, охоты, звери и приметы современности (велосипеды, поезда, полицейские). По завершении
    жрец-шаман (бадва) в ритуальном пении и трансе «оживляет» и проверяет каждый из мотивов (их насчитывают до
    165). С конца XX века мастера-лакхара, сохраняя домашний ритуал, создают также выставочные росписи в музеях
    (Национальный музей ремёсел в Дели, музей Ваача в Теджгадхе) и работы на холсте.
  traits:
    - Прямоугольная многоцветная геометрическая рамка из ромбов и треугольников, замыкающая всю настенную композицию
    - Диагональные или ярусные шествия стилизованных коней с колесообразными розетками на крупах и всадниками-божествами
    - Насыщенные чистые краски (алый, оранжевый, индиго, зелёный, жёлтый, чёрный) на светлой побелённой или охристой стене
    - Плотная повествовательная космология до 165 мотивов — солнце и луна наверху, тигры у врат, слон с балдахином и деревенский быт
