  wiki: { en: Jangarh Singh Shyam }
  summary: >-
    Личный изобразительный язык художника из общины пардхан-гонд: звери, духи и современные машины собраны из
    плотных вибраций точек, волнистых штрихов и чешуек, впервые давших зримый облик устным мифам гондов на бумаге и холсте.
  description: >-
    Джангарх Сингх Шьям (1962–2001) происходил из общины пардханов — традиционных сказителей и музыкантов,
    хранивших устную мифологию и генеалогии гондов в Мадхья-Прадеше. После того как в 1981 году экспедиция центра
    Бхарат Бхаван под руководством художника Дж. Сваминатана заметила его настенные росписи в деревне Патангарх,
    Шьям переехал в Бхопал и стал работать с бумагой, плакатными красками, тушью, акрилом и маслом. По очерку
    Музея искусства и фотографии в Бангалоре (MAP), он не переносил готовый древний иконографический канон — прежде
    божества пардханских песен не имели зримого образа; Шьям сам изобрёл для них фигуративный язык, превратив
    геометрические узоры домашних стен (дигхна) в живую внутреннюю ткань каждой фигуры.


    В авторском корпусе 1985–1996 годов соединяются два регистра. В цветных работах на бумаге и холсте силуэты
    оленей, духов, богинь и даже самолётов заполнены плотными полями точек, каплевидных чешуек и извивающихся
    полос с отпечатками ладоней и резкими цветовыми перепадами. В монохромных рисунках пером и тушью из собрания
    V&A (1989) тот же принцип работает через густую, почти гипнотическую волнообразную штриховку, собирающую
    оперение птицы и скальный выступ в единую пульсирующую фактуру. Участие в выставке «Маги Земли» в Париже
    (1989) и вхождение работ в собрания V&A, MAP и Метрополитен-музея (полотно «Без названия (стилизованные
    деревья)», ок. 1992, инв. 2023.610) закрепили его индивидуальный корпус отдельно от позднейшей массовой
    школы последователей.
  traits:
    - Плотная внутренняя фактура фигур из точек, каплевидных чешуек, концентрических дуг и волнистых штрихов
    - Превращение рогов, волос, оперения и крон в ветвящиеся декоративные потоки на светлом нейтральном поле
    - Смелое соединение устной мифологии, лесных животных и современных мотивов (включая авиацию и городской быт)
    - Одинаковая напряжённость ритма как в яркой полихромии плакатных красок и акрила, так и в чёрно-белой графике тушью
  promptCues:
