  summary: >-
    Современная школа художников из общины пардхан-гонд в Мадхья-Прадеше (Джангарх Калам): плоские силуэты
    зверей, деревьев и мифологических сцен оживают за счёт индивидуальных узоров-«подписей» из точек, волн и линий.
  description: >-
    Современная живопись пардхан-гонд, часто называемая «Джангарх Калам» («перо Джангарха»), сложилась с 1980-х
    годов в Бхопале и деревнях округа Мандла вокруг учеников и родственников Джангарха Сингха Шьяма. Источники
    MAP, QAGOMA и IGNCA подчёркивают важную границу: речь идёт не о «неизменном древнем стиле всех гондов», а о
    новой художественной школе, рождённой из встречи устных сказительских традиций пардханов, женских ритуальных
    узоров на глиняных стенах и полах (дигхна) и мастерских Бхарат Бхавана в Бхопале.


    Внутри общего визуального языка каждый мастер вырабатывает собственную орнаментальную «подпись» — узнаваемый
    микроузор, заполняющий тело животного, крону дерева или фигуру духа. Венкат Раман Сингх Шьям строит
    многофигурные аллегории на ярких однотонных полях (как кот Марджара в собрании Национальной галереи Виктории
    в Мельбурне); Бхаджжу Шьям — автор проиллюстрированных книг, начавший учеником в мастерской дяди — варьирует
    от контрастных терракотовых силуэтов на чёрном фоне до тончайшего пуантилизма крон; Дурга Бай Вьям, Рам
    Сингх Урвети и дуэт Рамеша и Радхи Текам соединяют мифологический пантеон с книжным повествованием, нередко
    показывая одного персонажа дважды в пределах одного листа ради непрерывного рассказа.
  traits:
