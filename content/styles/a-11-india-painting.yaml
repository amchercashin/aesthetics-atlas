  summary: >-
    Антиколониальное художественное движение начала XX века в Калькутте и Шантиникетане: мягкие многослойные
    акварельные размывки, камерный формат и поэтическое переосмысление могольской миниатюры, Аджанты и японской туши.
  description: >-
    Бенгальская школа сложилась на рубеже XIX–XX веков в Калькутте вокруг художника Абаниндраната Тагора
    (1871–1951, племянника поэта Рабиндраната Тагора — их не следует смешивать) и реформатора Калькуттской
    школы искусств Эрнеста Бинфилда Хэвелла. В разгар движения Свадеши против раздела Бенгалии (1905) школа
    сознательно отвергла британский академический натурализм с его плотным маслом, жёсткой линейной перспективой
    и иллюзионистской светотенью. Вместо этого художники обратились к локальным материалам — акварели и темпере
    на бумаге — и к пан-азиатскому диалогу: по материалам Национальной галереи современного искусства в Нью-Дели
    (NGMA), на Абаниндраната повлияли одновременно могольские миниатюры, книжная графика модерна и визит в
    Калькутту японского теоретика Окакуры Какудзо (1902) и художников Ёкоямы Тайкана и Хисиды Сюнсо (1903),
    познакомивших его с техникой тонкой водной размывки (wash).


    Манифестом школы стала небольшая гуашь-размывка Абаниндраната «Бхарат Мата» (1905, первоначально «Банга
    Мата»): четырёхрукая фигура в шафрановом сари с двойным нимбом и лотосами у ног, несущая зерно, ткань,
    рукопись и чётки. Ученики и соратники мастера — Нандалал Бос (с 1919 года возглавивший школу Кала Бхавана в
    Шантиникетане и копировавший фрески Аджанты и Багха), Кшитиндранат Маджумдар, Асит Кумар Халдар,
    Гаганендранат Тагор, Абдур Рахман Чугтаи — разработали узнаваемый лирический язык с мягкой световой дымкой,
    удлинёнными гибкими силуэтами, сдержанной золотисто-охристой или приглушённо-зелёной гаммой и сюжетами из
    «Махабхараты», Калидасы, «Тысячи и одной ночи», истории Моголов и повседневной жизни Индии.
  traits:
    - Многослойная акварельная размывка (wash) и темпера на бумаге, создающие мягкую светящуюся дымку вместо плотного масла
    - Уплощённое поэтическое пространство и плавный линейный контур без жёсткой академической светотени и перспективы
    - Диалог с историческим наследием Индии и Востока — могольские арки и нимбы, пластика Аджанты, восточноазиатская воздушность
    - Камерный вертикальный формат, приглушённые тёплые охры, шафран, шалфейно-зелёный и дымчато-синий колорит
