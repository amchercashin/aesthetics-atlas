  wiki: { en: Company style }
  summary: >-
    Обзор гибридной живописи XVIII–XIX веков, созданной индийскими мастерами по заказам служащих британской
    Ост-Индской компании: тонкость могольской кисти соединяется с акварелью, светотенью и линейной перспективой.
  description: >-
    «Живописью Компании» (Company Painting, в Индии также Kampani Qalam) называют широкий корпус работ на бумаге
    (реже на слюде и слоновой кости), созданных индийскими художниками в конце XVIII — XIX веке для чиновников,
    натуралистов и путешественников британской Ост-Индской компании. С ослаблением императорского двора в Дели и
    региональных дворов мастера, обученные в могольских, раджпутских и местных мастерских, приспособили
    виртуозную миниатюрную проработку к европейским вкусам: вместо плотной гуаши и условной плоскости появились
    прозрачная акварель на европейской бумаге (в частности, Ватмана), линейная перспектива, падающие тени и
    живописная («picturesque») композиция пейзажа.


    Это не единая «школа» и не безличное ремесло: выставка «Забытые мастера» в Собрании Уоллеса (Лондон) и
    исследования Smarthistory, V&A и The Met возвращают имена выдающихся авторов, работавших в разных городах. В
    Калькутте выходцы из Патны Шейх Зайн-уд-Дин, Бхавани Дас и Рам Дас создали для Мэри и Элайджи Импи (1777–1783)
    более трёхсот листов естественной истории, где птицы, звери и насекомые написаны в натуральную величину с
    ботанической точностью; позже в калькуттском пригороде Каррайя Шейх Мухаммад Амир прославился ясными
    портретами лошадей, экипажей и слуг. В Патне Севак Рам писал панорамные многолюдные праздники и занятия
    горожан; в Дели Гулам Али Хан и мастера его круга (включая листы «Альбома Фрейзера» и рисунки Мазхара Али
    Хана) соединяли проницательный портрет на чистом листе бумаги с точной архитектурной графикой, а Сита Рам
    создавал атмосферные акварельные виды Индии. С распространением фотографии с 1840-х годов традиция пошла на спад.
  traits:
    - Соединение миниатюрной тонкости кисти и орнаментальной детализации с европейской акварелью, светотенью и перспективой
    - Четыре главных тематических круга — флора и фауна, портреты и «типы» занятий, городские праздники, памятники и пейзажи
    - Чистый светлый фон бумаги (часто европейской бумаги Ватмана) с падающими тенями под ногами и копытами для осязаемости объёма
    - Отчётливые локальные различия между центрами — от калькуттских альбомов естественной истории до делийской портретной графики
