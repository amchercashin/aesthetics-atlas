  summary: >-
    Вырезанные силуэты и просветы образуют орнаментальные и повествовательные композиции; цвет может
    создаваться многослойной аппликацией или уступать место чёрному ажуру.
  description: >-
    Обзор сопоставляет три музейные работы середины XX века и недатированную круглую ловичскую вырезку. Две
    повествовательные композиции и круглый орнамент используют многоцветные вставки, а работа Бакулы строит
    сцену из чёрных силуэтов и просветов. Различаются формат, плотность вырезанного рисунка и способы
    соединения фигур.


    Региональные названия полезны для навигации, но не заменяют автора и историю вещи. Объединение мастеров
    описывает у Бакулы разные типы выцинанок, в том числе многоцветные; поэтому один чёрный лист не становится
    правилом для всех Курпе. Отдельные местные традиции и авторские корпуса требуют дальнейшего расширения.
  traits:
    - Сохранённая бумажная форма и вырезанный просвет совместно образуют изображение
    - Цвет может создаваться наложением вырезанных частей на общую основу
    - Зеркальная или радиальная орнаментальная схема сосуществует с протяжённым повествовательным фризом
    - Узкие перемычки и повторяющиеся силуэты могут связывать людей, растения и постройки
  scopeNote: >-
    Четыре самостоятельные вещи: две работы региона Лович из каталога Варшавы, повествовательная вырезка
    Бакулы из Курпе и круглая ловичская вырезка музея Рапперсвиля. Это обзор сопоставимых практик, не
    исчерпывающий каталог всех польских регионов. Альтернативные музейные номера и отдельные фотографии одного
    предмета не увеличивают корпус.
  dateNote: >-
    1940–1960 — условные координаты для подписей «середина XX века» и «1950-е». У круглой работы дата
    отсутствует и в эти границы не подставляется. Издание каталога 2021 и загрузка файла в каталог сайта 2025
    не датируют ни произведения, ни возникновение выцинанок.
