  admission:
    language: >-
      Повторяются самостоятельный лист, соединение изображения с подписью и повествовательное деление
      поверхности; линия и цвет варьируются по технике.
    corpus: >-
      Пять различных предметных записей и композиций из двух собраний. Разные версии «Похорон кота» не
      использованы для набора трёх работ.
    distinctness: >-
      От книжной графики Билибина выбранные листы отличаются самостоятельным листовым устройством и большим
      пояснительным текстом. От пейзажной гравюры Хокусая — структурой рассказа и ролью подписей. Лубок не
      объявлен единственной манерой русской народной графики.
    significance: >-
      Традиция выделена музейной типологией Русского музея и отдельным корпусом исторических популярных листов
      NYPL.
    sources:
