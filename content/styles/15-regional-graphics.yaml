  summary: >-
    Геометрические поля и контрастные бордюры организуют стены, ограды и другие архитектурные поверхности;
    современные проекты переносят эти решения на выставочные панели.
  description: >-
    Выбранный корпус соединяет фрагмент стены неизвестного мастера в Ботшабело, фотографию домашнего ансамбля
    Малангу и её публичный проект на деревянных панелях. Наблюдаемые связи — крупные геометрические поля,
    вложенные границы и согласование рисунка с архитектурной поверхностью. У старой чёрно-белой фотографии
    нельзя восстановить исходную палитру.


    Женская передача навыков и индивидуальные решения художниц имеют значение для этой практики. Современная
    работа Малангу расширяет круг поверхностей и зрителей, но не представляет собой единоличное авторство всей
    традиции. Росписи ндебеле ЮАР не объединены здесь со всеми украшенными домами Африки или с отдельными
    практиками ндебеле Зимбабве.
  traits:
    - Крупные геометрические поля ограничены контрастными линиями
    - Диагонали, треугольники и ступенчатые формы могут сочетаться с прямоугольными модулями
    - Масштаб и направление рисунка связаны со стеной, оградой или сборной панелью
    - В цветных примерах чёрные и белые бордюры разделяют разные цветовые поля
  scopeNote: >-
    Три самостоятельные архитектурные работы по документированным изображениям: неизвестный мастер Ботшабело,
    домашний ансамбль с неуточнённым исполнителем и один публичный мурал Малангу. Корпус не охватывает всех
    центров и поколений ндебеле. Два музейных холста VMFA и BMW Art Car не включены как дополнительные стены.
  dateNote: >-
    1991 — верхняя граница существования первой стены по году журнала, а не установленный год её росписи; 19
    мая 2014 — дата снимка второй. 2024 — дата публичного произведения. Нижняя координата карты условно
    привязана к журнальному свидетельству. Эти числа не датируют происхождение или прекращение традиции.
