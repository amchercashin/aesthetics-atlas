      whyRepresentative: "Мышиная свадьба: силуэты, плотная композиция и простонародный сюжет."
  summary: >-
    Локальная цветная печать соединяет выразительный контур, плоские участки цвета и надписи: от животных и
    праздничных сцен до быта и общественных сюжетов.
  description: >-
    Четыре выбранные композиции показывают работу тёмного контура, локального цвета и текста. «Мышиная
    свадьба» строится двумя горизонтальными последовательностями, «Модернизация» — вокруг велосипеда и двух
    фигур, а лист Nguyen Dang San использует вертикальную иерархию группы с флагом. Такой корпус не сводит
    Донгхо к одной праздничной теме.


    Музей Фукуоки описывает традиционную печать на бумаге Dó с раковинным покрытием и нанесением чёрного
    контура после цветных прогонов. Это описание практики не подменяет предметную запись: у двух конкретных
    оттисков названы только бумага и ксилография, а точный состав листа Nguyen Thi Oanh не сообщён. В корпусе
    сохранены имена известных авторов и анонимность других работ.
  traits:
    - Выразительный тёмный контур разделяет плоские цветные участки
    - Фигуры, предметы и надписи собраны в ясное ограниченное поле
    - >-
      Горизонтальные процессии сосуществуют с центральной бытовой сценой и вертикальной общественной
      композицией
    - Животные, быт и политические сюжеты используют одну локальную печатную среду, не задавая единой темы
  scopeNote: >-
    Четыре разные композиции: Nguyen Thi Oanh, анонимный мастер, анонимный бытовой лист и Nguyen Dang San.
    Дракон представлен только деталью. Корпус ограничен музейными листами; не охватывает всю историю Донгхо и
    не объединяет её с Хангчонг или всей вьетнамской графикой.
  dateNote: >-
    1960–2010 — условная рамка датированных музейных оттисков: «1960-е» у Dragon Dance и печать 2010 у двух
    листов Фукуоки. Исходные дизайны этих двух листов не датированы; год приобретения 2018 не является годом
    создания. «Мышиная свадьба» остаётся без даты; дар 2022 и выставка 2024 её не уточняют. Происхождение
    традиции этим корпусом не датируется.
