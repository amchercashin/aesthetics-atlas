  summary: >-
    Небольшие геометризированные фигуры, тонкая линия и ритмические группы организуют сцены людей, животных и
    деревьев на ткани и архитектурной поверхности.
  description: >-
    В выбранных примерах пространство заполнено множеством маленьких фигур. Парные треугольные формы, линейные
    конечности, круговые группы и повторяющиеся растительные мотивы позволяют собирать протяжённую сцену без
    объёмной моделировки. Корпус показывает как белый рисунок на коричневой основе, так и более тёмный рисунок
    на светлой стене.


    Две работы Маше сопоставлены с ансамблем двух других художников и с документированным совместным процессом
    двух женщин. Музейные и выставочные произведения не заменяют все домашние и ритуальные практики варли. По
    статическим изображениям не выводятся правила всех церемоний, универсальная символика фигур или точная
    древняя дата возникновения традиции.
  traits:
    - Малые геометризированные фигуры соединяются тонкими линиями
    - Повтор небольших форм организует круги, спирали и протяжённые ряды
    - Люди, животные, деревья и архитектура могут сосуществовать в едином поле
    - Контраст линии и основы важен для читаемости; направление светло-тёмного контраста может различаться
  scopeNote: >-
    Три самостоятельных музейных или выставочных произведения и фрагмент четвёртой композиции в процессе
    создания. Портрет Маше и фотографии одного ансамбля не увеличивают корпус. Домашние и ритуальные варианты
    требуют дальнейшего локального исследования; имена двух художниц на фотографии не установлены.
  dateNote: >-
    Около 1990 и 2009 — даты произведений. У росписи Crafts Museum дата отсутствует; 2025 относится к
    выставочной фотографии Fishnet и записи отдельного рабочего процесса. Координаты карты ограничивают это
    документированное сопоставление, а не время существования варли.
