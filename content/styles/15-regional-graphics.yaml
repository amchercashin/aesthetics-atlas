  compare:
    - id: nianhua
      note: >-
        Сопоставляются цветная печатная картинка, роль надписей и праздничные сюжеты. Няньхуа — обзор
        нескольких региональных практик, Донгхо — отдельная местная традиция; историческое влияние конкретных
        мастерских этим сравнением не доказано.
    - id: lubok
      note: >-
        Сравниваются самостоятельные печатные листы и рассказ через фигуры с подписью. Выбранный Донгхо
        использует контур и локальные цветные участки иначе, чем монохромные литографии и резцовые гравюры
        русского корпуса; это различие примеров, не правило для всех вещей.
  evidence:
    - claim: >-
        Музей Фукуоки описывает деревню Донгхо, бумагу Dó, покрытие с раковинным порошком и печать чёрного
        контура после цветов.
      field: technique
