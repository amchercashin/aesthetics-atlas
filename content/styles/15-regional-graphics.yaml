  name: "Китайское вырезание бумаги: обзор"
  orig: Jiǎnzhǐ / 剪纸 / 剪紙 — Chinese paper cutting
  kind: overview
  kindNote: Навигационный обзор разных подходов; единого национального визуального стиля не заявляет.
  start: 1800
  end: 2007
  approx: true
  dates: "корпус: каталожное 1800, XX век и 2007"
  era: xix
  region: Китай; выбранный корпус — Янчжоу и Фошань, один комплект хранится в Тяньцзине
  medium:
    - decorative-arts
    - drawing
  summary: >-
    Силуэт, ажурная линия, просвет и наклеенный фрагмент становятся разными способами построения изображения
    из бумаги.
  description: >-
    Китайское вырезание бумаги объединяет разные местные, авторские и исторические практики. В этом обзоре
    сопоставлены литературно-живописное сочетание вырезанных форм Бао Цзюня, тонкий ажур Чжан Сюфан и
    политическое повествование коллектива Фошань. Они связаны способом работы с бумагой, но не одним набором
    цветов или сюжетов.


    Просвет и сохранённый участок могут образовывать орнамент, птицу, растение или многофигурную сцену.
    Наклеивание и живопись расширяют возможности материала. Национальный обзор оставляет место для
    самостоятельных карточек локальных школ и авторов; выбранные четыре работы не представляют все регионы и
    сообщества Китая.
  traits:
    - Сохранённый силуэт и вырезанный просвет совместно образуют рисунок
    - Тонкие ажурные линии могут сочетаться с крупными плотными участками
    - Подложка, рамка и цвет бумаги влияют на читаемость формы
    - Орнамент, отдельный мотив и многочастный рассказ используют разные композиционные схемы
  scopeNote: >-
    Четыре самостоятельные музейные позиции двух локальных контекстов: Бао Цзюнь, два произведения Чжан Сюфан
    и одна вырезка Фошань. Четырёхчастная ширма посчитана одним комплектом, а не четырьмя работами. Другие
    китайские школы и этнические практики требуют собственных корпусов.
  dateNote: >-
    1800 воспроизводит поле каталога, описание которого указывает более широкий исторический период. У вырезки
    Фошань предметное поле даёт XX век, кураторский текст — начало 1970-х. 2007 у работ Чжан Сюфан взято из их
    подписей, а не из года открытия музея. Даты не устанавливают происхождение техники.
