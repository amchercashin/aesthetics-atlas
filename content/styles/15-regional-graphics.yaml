  approx: true
  dates: "корпус: XX век и запись проекта 2015"
  era: fin-de-siecle
  region: Акан, Гана; два полотна асанте и современная графическая адаптация в Аккре
  medium:
    - textile
    - drawing
  gallery:
    - file: Gyaman Adinkra Symbols.jpg
      title: Символы адинкра
    - file: Adinkra cloth.JPG
      title: Ткань адинкра
    - file: File:Adinkra cloth.JPG
      title: Adinkra cloth
      author: photo of 2D work more than 100 years old
      whyRepresentative: Полотно с повторяющимися знаками-символами и сетчатой композицией.
  summary: >-
    Именованные графические знаки повторяются в полях ткани и могут переходить в самостоятельный рисунок и
    другие художественные среды.
  description: >-
    Адинкра объединяет графический словарь и практику его применения, а не один геометрический узор. В двух
    выбранных полотнах знаки повторяются внутри размеченных полей на готовой ткани. Современный рисунок Абладе
    Гловера выделяет один знак из такого орнаментального окружения.


    Печатная ткань и отдельный рисунок — разные произведения и способы использования графического языка. Знаки
    связаны с традиционным знанием и пословицами, однако значение конкретной композиции нельзя автоматически
    получить из случайного интернет-словаря. Статус имени художника, автора проекта и неизвестного мастера
    ткани сохраняется раздельно.
  traits:
    - Отдельные узнаваемые знаки могут повторяться внутри ограниченного поля
    - Прямые линии и бордюры организуют ткань в группы мотивов
    - На готовой ткани оттиск знака отличается от рисунка, созданного переплетением нитей
    - Графический знак может существовать отдельно от текстильного раппорта
  scopeNote: >-
