  id: lubok
  name: Русский печатный лубок
  orig: Russian lubok / popular prints
  kind: tradition
  kindNote: Издательская и визуальная традиция с разными печатными техниками; не единая авторская манера.
  start: 1600
  end: 1899
  approx: true
  dates: "корпус: XIX век и лист с датировкой XVII–XIX"
  era: renaissance
  region: Россия; в двух записях NYPL указана Москва
  medium:
    - print
    - illustration
  summary: >-
    Самостоятельные печатные листы соединяют образ, повествовательные сцены, заголовок и подписи; религиозные
    и светские варианты используют разные техники.
  description: >-
    Лубок рассматривается здесь как традиция популярной печатной картинки. Выбранные вещи не сводятся к яркой
    раскраске: три литографических листа NYPL монохромны, а музейные резцовые гравюры показывают другой способ
    работы линии и цвета.


    Изображение может занимать одно поле, делиться на сцены или включать множество регистров. Текст поясняет
    персонажей и действия, а заголовок и рамка организуют самостоятельный лист. Сказочная, бытовая и
    религиозная тематика не определяет единую палитру. Именная роль литографа Голышева сохраняется отдельно от
    неизвестного авторства других изображений.
  traits:
    - Заголовок, подписи и изображение составляют самостоятельную листовую композицию
    - События могут распределяться по сценам, регистрам и обрамлённым полям
    - Контур, штрих и печатный текст задают различимые уровни изображения
    - Монохромная печать и раскраска сосуществуют; одной обязательной палитры нет
  scopeNote: >-
    Пять листов: три литографии NYPL 1866–1868 годов и две резцовые гравюры Русского музея. Ранние
    ксилографии, рисованный лубок и современное продолжение требуют расширения корпуса. Не каждая русская
    гравюра включается в лубок только по языку подписи.
  dateNote: >-
    1600–1899 — условная рамка широкого предметного интервала «XVII–XIX» у одного листа, не доказанный период
    существования традиции. У трёх литографий известен год выпуска, но не обязательно создания исходного
    рисунка. Год альбома и годы поступления в музеи не перенесены на произведения.
  creators:
