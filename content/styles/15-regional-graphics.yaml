      field: dates
      source: faam-dongho-modernization-2973
    - claim: В записи 2957 назван Nguyen Dang San; печать 2010 не датирует неизвестный исходный дизайн.
      field: authorship
      source: faam-dongho-peace-2957
    - claim: LNMA подписывает опубликованную деталь Dragon Dance как работу неизвестного мастера Донгхо 1960-х.
      field: corpus
      source: lnma-dongho-dragon-1960s
  admission:
    language: >-
      В выбранных работах повторяются выразительный контур, локальный цвет, ограниченное поле и включение
      надписей; схема сцены меняется вместе с сюжетом.
    corpus: >-
      Четыре различные композиции, одна из которых доступна только в виде детали. Два оттиска с известными
      годами печати имеют разные названия, авторство и изображения; разные фотографии одной вещи не
      добавлялись.
    distinctness: >-
      От многорегионального обзора няньхуа отличается конкретным локальным кругом и документированной печатной
      практикой; от выбранного русского лубка — работой локального цвета и контура. Эти различия проверены на
      ограниченных корпусах, общего предка не назначено.
    significance: >-
      Локальная традиция выделена отдельным жанром в коллекции Фукуоки и предметной выставкой LNMA; названы
      конкретные авторы и сохранены анонимные вещи.
    sources:
      - faam-dongho-collection-2024
      - faam-dongho-modernization-2973
      - faam-dongho-peace-2957
      - lnma-dongho-dragon-1960s
