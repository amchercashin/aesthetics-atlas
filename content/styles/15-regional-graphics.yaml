      title: Bengal Patachitra 2
      author: বাক্যবাগীশ
      whyRepresentative: Свиток с фигурами и растительным бордюром.
  summary: >-
    Расписной свиток организует рассказ вдоль длинной полосы; художники патуа соединяют изображение с песенным
    повествованием и обращаются как к мифам, так и к современным событиям.
  description: >-
    В четырёх выбранных свитках цветные контурные фигуры образуют последовательности по вертикали. Манту
    Читракар и Джаба Читракар используют отдельные поля эпизодов, а в работе о Дурге и Ганге
    последовательность становится более текучей. Монимала Читракар связывает плотное центральное изображение с
    цепочками круглых сцен на полях.


    Музейные и местные первичные тексты описывают разворачивание свитка с песенным рассказом. Здесь проверены
    статические репродукции и предметные подписи; темп, мелодия и взаимодействие конкретного исполнения со
    зрителем не исследованы. Бенгальская практика не объединена с другими традициями, которые также называют
    patachitra, в частности с практиками Одиши.
  traits:
    - Несколько сцен организуются вдоль длинного узкого свитка
    - Контурные фигуры и плоские цветные участки сохраняют читаемость небольшого эпизода
    - Бордюр и повтор мотивов могут связывать разные повествовательные поля
    - >-
      Прямоугольные разделители, свободная последовательность и круговые сцены дают разные способы построения
      рассказа
  scopeNote: >-
    Четыре самостоятельных свитка трёх современных художников Западной Бенгалии в предметных записях QAGOMA.
    Печатные книги по мотивам свитков, отдельные кадры одного свитка и исторические экземпляры в корпус не
    добавлены. Живая песенная практика подтверждается текстами, но не анализом исполнения в этой проверке.
  dateNote: >-
    2010–2014 — даты выбранных произведений. 2001 и 2012 в названиях событий, приобретения 2015–2016 и
    выставка APT8 2015–2016 имеют другие значения. Корпус не устанавливает начало, непрерывность или конец
    всей традиции.
