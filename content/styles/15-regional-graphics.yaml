  maturity: established
  labelStatus: historical
  id: yang-liuqing-nianhua
  name: Янлюцинская театральная гравюра
  orig: Yangliuqing xichu nianhua / 杨柳青戏出年画
  kind: tradition
  kindNote: Ограниченный театральный корпус внутри более широкой янлюцинской популярной графики.
  start: 1875
  end: 1925
  approx: true
  dates: "корпус: конец XIX — начало XX века"
  era: fin-de-siecle
  region: Янлюцин близ Тяньцзиня, Китай
  medium:
    - print
    - illustration
  summary: >-
    Раскрашенные печатные листы переводят театральную сцену в ясное расположение фигур, выразительные жесты и
    подробный костюм.
  description: >-
    Пять выбранных янлюцинских гравюр посвящены театральным сюжетам. Цветные фигуры, костюмные детали, жесты и
    надписи организуют действие; архитектура и пейзаж могут обозначать место либо почти исчезать. Широкие
    свободные участки не исключают подробной проработки одежды и лиц.


    В исследовании четыре листа связаны с мастерской Yixinghe, название которой читается на оттисках; у пятого
    мастерская не установлена. Название мастерской не становится именем одного художника. Театральная ветвь не
    заменяет все янлюцинские благопожелательные картинки, изображения детей и домашних божеств; няньхуа в
    целом — ещё более широкая тема.
  traits:
    - Контур и цветные участки подробно разделяют костюм и силуэт
    - Театральные жесты, оружие и ленты организуют действие
    - Фигуры могут занимать свободное поле или включаться в архитектурное окружение
    - Заголовки и надписи входят в композицию и помогают читать сюжет
  scopeNote: >-
    Пять гравюр из двух литовских музейных собраний по одному предметному исследованию. Даты и атрибуции не
    объявлены независимо перепроверенными музейными заключениями. Другие жанры Янлюцина и другие центры
    няньхуа требуют отдельного корпуса.
  dateNote: >-
    1875–1925 — условное размещение приблизительного музейно-исследовательского интервала «конец XIX — начало
    XX века», а не точные годы каждой работы. 2019 в подписях относится к фотографиям. Печатный выпуск статьи
    обозначен 2020; это не дата произведений.
  creators:
