  compare:
    - id: bilibin-illustration
      note: >-
        Самостоятельные лубочные листы с заголовками и пояснениями сопоставляются с книжной композицией
        Билибина. Это сравнение устройства изображений и текста; влияние конкретного листа не заявлено.
    - id: hokusai-landscape-prints
      note: >-
        Сравниваются самостоятельные печатные листы: в выбранном лубке текст и многочастный рассказ заметнее,
        чем в пейзажном корпусе Хокусая. Ни одна техника не приравнивается ко всей национальной графике.
  evidence:
    - claim: NYPL датирует три самостоятельных литографических листа выпусками 1866 и 1868 годов.
      field: corpus
