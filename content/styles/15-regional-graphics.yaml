  id: adinkra
  name: "Адинкра: печатные ткани и графические знаки"
  orig: Adinkra — Akan stamped textiles and graphic signs
  kind: tradition
  start: 1900
  end: 2015
  approx: true
  dates: "корпус: XX век и запись проекта 2015"
  era: fin-de-siecle
  region: Акан, Гана; два полотна асанте и современная графическая адаптация в Аккре
  medium:
    - textile
    - drawing
  summary: >-
    Именованные графические знаки повторяются в полях ткани и могут переходить в самостоятельный рисунок и
    другие художественные среды.
  description: >-
    Адинкра объединяет графический словарь и практику его применения, а не один геометрический узор. В двух
    выбранных полотнах знаки повторяются внутри размеченных полей на готовой ткани. Современный рисунок Абладе
    Гловера выделяет один знак из такого орнаментального окружения.


    Печатная ткань и отдельный рисунок — разные произведения и способы использования графического языка. Знаки
    связаны с традиционным знанием и пословицами, однако значение конкретной композиции нельзя автоматически
    получить из случайного интернет-словаря. Статус имени художника, автора проекта и неизвестного мастера
    ткани сохраняется раздельно.
  traits:
    - Отдельные узнаваемые знаки могут повторяться внутри ограниченного поля
    - Прямые линии и бордюры организуют ткань в группы мотивов
    - На готовой ткани оттиск знака отличается от рисунка, созданного переплетением нитей
    - Графический знак может существовать отдельно от текстильного раппорта
  scopeNote: >-
    Два музейных полотна и современный рисунок одного знака. Архитектурные, ювелирные и цифровые применения не
    представлены этим корпусом полностью. Рисунок Гловера не заменяет все адинкра, а весь фон его фотографии
    не считается отдельной атрибутированной тканью.
  dateNote: >-
    У Af1935,1005.2 сохранены обе опубликованные датировки — 1934 и первая четверть XX века. Нижняя координата
    1900 условна. Дата 2015-07-31 относится к записи современного проекта, а не к изобретению знака Sankofa
    или всей адинкры. Даты происхождения практики не установлены этим корпусом.
  creators:
    - name: Абладе Гловер
      orig: Ablade Glover
      role: автор выбранного современного рисунка Sankofa
      sources:
        - 89plus-glover-sankofa
    - name: Ханс Ульрих Обрист
      orig: Hans Ulrich Obrist
      role: инициатор проекта Protest against the disappearance of handwriting; не автор рисунка Гловера
      sources:
        - 89plus-glover-sankofa
  corpus:
    - workId: adinkra-bm-af1935-1005-2
      title: Полотно адинкра, Af1935,1005.2
      author: Мастер асанте; имя не указано
      year: 1934 — предметная запись; I четверть XX века — каталог 2008
      medium: Хлопок; окраска индиго и нанесение пигмента по каталогу 2008
      sources:
        - bm-adinkra-1935-1005-2
