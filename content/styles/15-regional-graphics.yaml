      четырёх вещей не выводится.
    corpus: >-
      Четыре независимые композиции с музейными подписями. Три предмета одного разворота различаются
      изображениями и номерами; они не являются тремя видами одной работы.
    distinctness: >-
      Навигационный узел позволяет сравнить местные форматы и авторские решения с китайским вырезанием бумаги
      и печатным лубком. Конкретный просвет и бумажная форма отличают показанные работы от печатного
      воспроизведения силуэта.
    significance: >-
      Вещи сохраняются и подробно описаны местным государственным музеем и польским музеем диаспоры;
      объединение народных мастеров документирует передачу и авторскую вариативность практики.
