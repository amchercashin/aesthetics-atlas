  summary: >-
    Обзор новогодней печатной картинки объединяет парные образы, благопожелательные цветы и театральный
    рассказ, сохраняя различия мастерских и мест.
  description: >-
    Няньхуа — полезное жанровое соседство региональных практик, а не название одной манеры. В выбранном
    корпусе парные фигуры Мяньчжу, цветочный лист Суджоу и многофигурная театральная сцена Янлюцина
    различаются масштабом фигур, заполнением поля, рисунком и цветом. Общий обзор помогает находить эти
    различия, не заменяя самостоятельные местные узлы.


    Парный комплект дверных божеств или детей учитывается как один ансамбль. Тонкая цветочная композиция не
    подгоняется под обязательную ярко-красную палитру; музей называет её новогоднее использование
    предположительным. Китайские популярные гравюры шире жанра няньхуа: язык надписи, техника ксилографии или
    китайский сюжет сами по себе не включают лист в этот обзор.
  traits:
    - >-
      В выбранных вещах встречаются парные фигуры, одиночная благопожелательная композиция и многофигурная
      сцена
    - Печатный контур, цвет и надписи организуют лист по-разному в разных мастерских
    - Симметричная пара и повествовательное поле — разные композиционные решения
    - "От тонкой цветочной графики до насыщенных плоскостей костюма: единой обязательной палитры нет"
  scopeNote: >-
    Четыре композиции из трёх региональных контекстов: два парных комплекта HKBU, корзина цветов British
    Museum и один уже представленный янлюцинский лист. Последний также представлен в янлюцинской карточке и не
    увеличивает число самостоятельных предметов. Другие центры и собственные корпуса Таохуау и Мяньчжу требуют
    продолжения. Для пары 李芳福 региональное чтение опирается на вводный текст коллекции; разночтение имени 李方福
    / 李芳福 не разрешено.
  dateNote: >-
    1700–1999 — условная рамка выбранного корпуса: 1700–1799 у цветочного листа, конец XIX — начало XX у
    театрального и [19--?] у двух парных комплектов. Предположительная столетняя датировка не превращена в
    точный год. Это не период возникновения или завершения няньхуа; copyright сайта 2022 не перенесён на
    работы.
