      стен; от городецкой росписи — архитектурный масштаб и геометрическое членение вместо предметных сцен.
      Это сравнение ограниченных корпусов.
    significance: >-
      Архитектурная практика обсуждается в южноафриканской культурной публикации и в музейных текстах;
      современный публичный проект документирован принимающей институцией. Неизвестное имя домашнего мастера
      не исключает работу из рассмотрения.
