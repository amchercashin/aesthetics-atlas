  summary: >-
    Архитектурная резьба и полихромная роспись общинных мужских домов бай на Палау: вытянутые поперечные
    балки и высокие треугольные фронтоны с повествовательными регистрами легенд в четырёх минеральных красках.
  description: >-
    По очерку журнала «Expedition» Пенсильванского музея и публикациям Государственных музеев Берлина (2022),
    бай (bai) — традиционный общинный дом советов вождей и мужских союзов Палау, возводившийся без гвоздей
    на каменной платформе под крутой двускатной крышей из пальмовых листьев. В традиционных деревнях стояло
    по нескольку бай разного ранга; их сооружение заказывали у мастеров других селений и оплачивали местными
    ценностями удоуд (udoud), так что украшенный дом служил зримым знаком статуса и истории общины. В 1907 году
    мастер-строитель Голегерил и около сорока членов союза Ngaradegangl построили в Короре уменьшенный бай
    «Kekerel Gosobulngau» для берлинского Этнологического музея (в 2022 году палуанские мастера во главе с
    Патриком Теллеем вновь перекрыли его крышу в Форуме Гумбольдта). Сегодня в самом Палау сохранились лишь
    единичные бай, среди которых исторический Бай ра Ирраи в штате Аираи и традиционная реконструкция 1991 года
    при Национальном музее Белау в Короре; силуэт бай изображён и на государственной печати Республики Палау.


    Художественная система бай уникальна для Микронезии тем, что декоративная резьба и повествовательная
    роспись встроены в саму конструкцию — наружные треугольные фронтоны, внутренние поперечные балки-затяжки
    (длиной около 4,5 м и шириной около 30 см, часто расписанные с обеих сторон) и столбы. Вожди и старейшины
    отбирали предания и поучительные эпизоды, главный мастер размечал рисунок, а резчики прорезали неглубокий
    контурный рельеф и раскрашивали его четырьмя природными пигментами, стёртыми на масле ореха паринариума:
    белой известью, чёрной сажей, красной и жёлтой охрой. Один регистр балки вмещает от шести до двадцати
    последовательных сцен с лодками, домами, фигурами людей, рыб и зигзагами, обозначающими речь. Рядом с
    легендами повторяются устойчивые защитные эмблемы: гигантская раковина тридакны ким (kim) вдоль стропил,
    петух, птица богатства делерох, паук Мингидабруткоэль (научивший женщин естественным родам), божество у
    конька крыши и резная женская фигура дилукай (dilukai) над входом. В 1930-е годы под влиянием японского
    художника и фольклориста Хисакацу Хидзикаты сюжетные регистры балок бай породили переносные резные доски
    «сториборд» (storyboards). От маорийской резьбы вакаиро (whakairo), где доминируют глубокий скульптурный
    рельеф и спирали кору, искусство бай отличается плоскостным сюжетным комиксом-повествованием, жёсткой
    поярусно-регистровой разбивкой и ярким четырёхцветным контрастом на белёном или охристом дереве.
  traits:
    - Неглубокий врезной контурный рельеф на треугольных фронтонах и длинных внутренних балках-затяжках
    - Четырёхцветная палитра из минеральных и природных красок — белой извести, сажи, красной и жёлтой охры
    - Горизонтальные повествовательные регистры с повторяющимися силуэтами людей, лодок, домов, рыб и птиц
    - Канонические защитные и статусные эмблемы (раковины ким, петухи, паук, фигура дилукай над входом)
