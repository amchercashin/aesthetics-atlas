  compare:
    - id: emily-kngwarray
      note: >-
        Обе практики связаны с Центральной Австралией и переходом к акрилу на холсте, однако Папуня-Тула
        строится на картографических схемах кругов, дуг и путей Западной пустыни, тогда как Эмили Кам Кнгваррей
        в Утопии развила свободный всепокрывающий ритм широких линий и цветовых пятен. Визуальное сравнение,
        не происхождение.
    - id: yolngu-bark-painting
      note: >-
        Две крупнейшие региональные школы живописи коренных народов Австралии с разными носителями и языком:
        акриловые точки и круговые карты Западной пустыни против природных охр и тончайшей перекрёстной
        штриховки миньтьи на эвкалиптовой коре северо-восточного Арнем-Ленда. Визуальное сравнение, не происхождение.
