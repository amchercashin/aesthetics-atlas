  summary: >-
    Родовая живопись народов йолнгу на листах эвкалиптовой коры из северо-восточного Арнем-Ленда:
    природные охры, тончайшая перекрёстная штриховка кистью из волоса и священные клановые узоры миньтьи.
  description: >-
    По материалам проекта «Maḏayin», подготовленного Художественным собранием Клуге-Руэ (Университет
    Вирджинии) совместно с общинным арт-центром Buku-Larrŋgay Mulka в Йирркале, народы йолнгу
    северо-восточного Арнем-Ленда издавна наносили священные клановые узоры миньтьи (miny’tji) на тела
    участников обрядов и ритуальные предметы. На языке йолнгу эти образы называют мадайин (maḏayin) —
    словом, объединяющим понятия «священное» и «прекрасное». В XX веке — начиная со сборов антрополога
    Дональда Томсона в 1930-е годы и экспедиций 1940–1950-х — мастера перенесли родовые узоры на большие
    выпрямленные листы коры эвкалипта Eucalyptus tetradonta (на языке йолнгу — gaḏayka), превратив живопись
    на коре в зримое свидетельство права кланов на свою землю и море.


    Технология целиком связана со страной (Country): кору срезают со ствола, распрямляют над жаром углей
    под грузом, просушивают и шлифуют внутреннюю сторону. Пигменты — красную и жёлтую охру, белую глину
    гапан (gapan) и чёрный минерал или уголь — добывают в земле и на побережье, растирают в порошок и
    разводят водой со связующим (ранее соком орхидей, сегодня столярным клеем). Тончайшую параллельную и
    перекрёстную штриховку (по всему Арнем-Ленду часто называемую rarrk, а у йолнгу неразрывно связанную
    с клановым узором miny’tji) наносят узкой кистью из прямых человеческих волос или волокна травы. Каждый
    узор — например, огненные и морские ромбы клана Мадаррпа или полосы и повествовательные регистры клана
    Рирратьину — принадлежит конкретному клану одной из двух фратрий (Дува или Йирритья) и передаётся по
    строгим правилам родства (gurruṯu). С конца XX и в XXI веке рядом с классической клановой иконографией
    Вонгу Мунунгурра, Мавалана Марики, Мунгурравуя Юнупингу и Джамбавы Маравили выросло мощное поколение
    женщин-мастеров, включая Нонггирнгу Маравили, создающую свободные авторские вариации молний и огня.
    От скальных росписей Какаду и западного Арнем-Ленда традиция йолнгу отличается переносным форматом
    обработанной коры и мерцающей геометрической сеткой родовых ромбов и полос, а от акриловой живописи
    Папуня-Тула — строго природными охрами и штриховым, а не точечным заполнением поля.
  traits:
    - Натуральная основа из выпрямленной эвкалиптовой коры (Eucalyptus tetradonta) с живой фактурой края
    - Ограниченная четырёхцветная палитра минеральных пигментов — красной и жёлтой охры, белой глины и чёрного
    - Виртуозная перекрёстная штриховка тончайшей кистью, создающая оптическое «мерцание» поверхности
    - Строгая клановая геометрия ромбов, треугольников и регистров (миньтьи) в сочетании с силуэтами тотемных зверей и предков
  promptCues:
    - "Тончайшая ритмичная перекрёстная штриховка тонкой волосяной кистью, дающая эффект оптического мерцания"
    - "Четырёхцветная палитра природных земляных пигментов — красной и жёлтой охры, меловой белой глины и сажи"
    - "Вытянутый вертикальный формат на матовой волокнистой поверхности выпрямленной эвкалиптовой коры"
    - "Чередование геометрических клановых сеток из ромбов и полос со стилизованными силуэтами животных и волн"
