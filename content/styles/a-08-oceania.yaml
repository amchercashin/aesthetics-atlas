  wiki: { en: Pacific Sisters }
  summary: >-
    Городской коллектив художниц и дизайнеров маори и Pasifika из Окленда (с 1991–1992): многосоставные
    костюмы-ассамбляжи из тапы, харакеке, перьев, раковин и переработанного пластика или видеоплёнки для
    перформанса и культурного активизма.
  description: >-
    По материалам ретроспективы Национального музея Новой Зеландии Те Папа «Pacific Sisters: He Toa Tāera |
    Fashion Activists» (2018–2019, затем Художественная галерея Окленда) и очерку Новозеландского музея моды
    (Дорис де Понт, 2019), коллектив Pacific Sisters сложился в Окленде в 1991–1992 годах вокруг художниц и
    дизайнеров новозеландского поколения маори и тихоокеанских диаспор (Pasifika) — Селины Форсайт (Хаами),
    Сюзанны Тамаки, Нифаи (Нефи) Тупаеа, Розанны Рэймонд, Ани О’Нил, а также Лизы Рейханы, Фионы Уолл,
    Генри Ах-Фу Тарипо и других участников. Коллектив сознательно противопоставил собственный образ силы
    и самоиронии («модный активизм», mana wāhine) колониальному стереотипу пассивной «смуглой девы»
    (Dusky Maiden), превращая склады, ночные клубы и галереи Окленда в мультимедийные показы-перформансы
    с живой музыкой, видеопроекциями и танцем.


    Визуальный язык Pacific Sisters строится как коллективный ассамбляж и то, что участницы назвали
    «accessification» — многослойным наращиванием костюма, украшений, головных уборов, плетения и пластики
    тела. Мастерицы соединяют традиционные тихоокеанские и маорийские техники и материалы — лубяную ткань
    тапу (сиапо), новозеландский лён харакеке, панданус, перья, раковины, семена и скорлупу кокоса — с
    находками городской среды: переработанным пластиком, старой магнитной видеоплёнкой, вытканной по
    традиционным схемам, цепями и промышленным текстилем. Эталонным примером стал 27-частный костюм
    «21st Sentry Cyber Sister» (1997, собрание Те Папа), собранный совместно четырьмя участницами как
    «каитиаки» (хранитель) духа коллектива: юбка, браслеты и рюкзак Ани О’Нил, жилет и лиф Розанны Рэймонд,
    пояс маро, накидка и корона из перьев Сюзанны Тамаки, серьги и наручи Нифаи Тупаеа. От традиционной
    ткани сиапо их практику отличает открытая городская гибридность, перформативная театральность и
    соавторство разных медиа, а от концептуального кроя Рэй Кавакубо — привязка к тихоокеанским ремесленным
    фактурам, раковинно-перьевому декору и прямой политической репрезентации диаспор Океании.
  traits:
    - Многосоставные костюмы-ассамбляжи, собранные из десятков отдельных элементов разными участницами
    - Намеренный стык традиционных материалов (тапа, лён харакеке, перья, раковины) и городского вторсырья (видеоплёнка, пластик)
    - Гипертрофированные головные уборы, нагрудники, пояса маро и наслаивание украшений («accessification»)
    - Ориентация на живой перформанс, движение, музыку и образ воина-хранителя вместо подиумного глянца
