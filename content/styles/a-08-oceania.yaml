  compare:
    - id: maori-whakairo
      note: >-
        Две океанийские традиции резных общинных домов собраний: маорийская резьба вакаиро строит образ
        предка через глубокий пластический рельеф и спирали кору, тогда как палуанский бай разворачивает
        плоские многосценовые повествовательные регистры в четырёх минеральных красках. Визуальное сравнение,
        не происхождение.
  review:
    status: reviewed
    date: "2026-11-27"
    scope: [relations, dates, text, images, corpus, gallery]
    note: >-
      27.11.2026: связи — визуальное сопоставление с маорийской резьбой вакаиро (общинные дома Океании без
      утверждения общего происхождения). Даты — документировано до 1862 года (балки коллекции Земпера в
      Дрездене) и до XXI века (реконструкция 1991 года в Короре и работы мастеров в Берлине 2022 года).
      Описание — 4 утверждения по Пенсильванскому музею («Expedition»), Государственным музеям Берлина, SPK
      и записям SKD на Commons. Корпус — 4 файла Commons (Бай ра Ирраи, две балки Дрездена до 1862 года и
      дилукай Метрополитен-музея) плюс 2 снимка реконструкции 1991 года в Национальном музее Белау в галерее
      (оба с ролью reconstruction); все изображения просмотрены. Открыто: индивидуальные имена резчиков
      исторических балок XIX века не сохранились; переносные доски-сториборды XX–XXI веков вынесены за
      рамки корпуса.
