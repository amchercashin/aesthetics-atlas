    Резные и расписные архитектурные элементы общинных домов бай Палау (наружные фронтоны, внутренние
    поперечные балки-затяжки и фронтонные фигуры дилукай) по музейному корпусу XIX века (Дрезден, Мет) и
    архитектурным памятникам Палау. Переносные сувенирные и авторские доски «сториборд», возникшие в
    1930-е годы при участии Хисакацу Хидзикаты, упомянуты как производная ветвь, но в корпус не входят.
