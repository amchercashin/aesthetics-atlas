  scopeNote: >-
    Живописное движение Папуня-Тула и мастеров кооператива Papunya Tula Artists (Западная пустыня,
    Центральная Австралия) с 1971 года по музейному корпусу 1971–1982 годов (NGV, AGSA). В корпус входят
    только публично экспонируемые произведения из музейных собраний; все прочие региональные традиции коренных
    народов Австралии (живопись на коре Арнем-Ленда, акварели Херманнсбурга, школа Утопии) рассматриваются
    отдельно и не сводятся к точечной живописи.
  evidence:
    - field: dates
      claim: >-
        Движение началось в 1971 году, когда учитель Джеффри Бардон предложил мужчинам Папуньи расписать стену
        школы; в 1972 году художники создали собственную компанию Papunya Tula Artists (49 акционеров, около
        120 художников), а в 1980-е открыли мастерские в Кинторе и Кивирркуре.
      source: papunya-tula-history
    - field: description
      claim: >-
        Стиль Папуня-Тула вырос из ритуальной росписи тела и рисунков на песке; для публичного показа художники
        удаляли закрытые сакральные символы и тщательно контролировали родовые мотивы.
      source: papunya-tula-history
    - field: description
      claim: >-
        Ранние доски 1971–1972 годов (включая премированную в 1971 году работу Каапы Тьямпитйинпы и серию
        «Сновидение воды» Джонни Варангкулы Тьюпуррулы) перевели коллективный ритуальный словарь в современную
        станковую живопись; в 2011–2012 годах выставка «Tjukurrtjanu» (NGV и Музей на набережной Бранли)
        представила 200 ранних работ движения.
      source: ngv-tjukurrtjanu-2014
    - field: description
      claim: >-
        «Церемония медового муравья» (1972) Клиффорда Поссума показывает раннюю открытую иконографию (три круга
        гнёзд медовых муравьёв, палки-копалки, ритуальные доски) до того, как в более поздних монументальных
        холстах появились точечные «туманности», скрывающие тайный смысл.
      source: agsa-poss-honey-ant-1972
    - field: description
      claim: >-
        «Женское сновидение» (1982) Дейзи Леуры Накамарры стало первой картиной женщины Западной пустыни,
        приобретённой художественным музеем, и открыло путь широкому участию художниц с середины 1990-х.
      source: agsa-nakamarra-women-1982
