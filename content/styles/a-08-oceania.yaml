  wiki: { en: Sandroing }
  summary: >-
    Эфемерное перформативное искусство центральных и северных островов Вануату: мастер одним пальцем ведёт
    в вулканическом песке или золе непрерывную симметричную линию вокруг заданной сетки, сопровождая её устным рассказом.
  description: >-
    По исследованию Якопо Барона (Journal de la Société des Océanistes, 2026), материалам выставки Музея
    международного народного искусства в Санта-Фе и Культурного центра Вануату (VKS, 2025) и публикации
    проекта IPinCH (Университет Саймона Фрейзера, 2014), сандроинг (на языке бислама — sandroing / sandroa;
    в языках островов встречаются местные названия вроде нитус на Малакуле) — это живая графическая и
    исполнительская традиция центральных и северных островов Вануату. В архипелаге, где бытует более
    135 местных языков, рисунки на песке служат одновременно формой «письма на земле», мнемонической
    опорой для устных преданий, генеалогий, ритуальных законов кастом (kastom) и межъязыкового общения.
    Провозглашённая ЮНЕСКО шедевром устного и нематериального наследия человечества (включена в
    Репрезентативный список в 2008 году), практика остаётся подчёркнуто эфемерной: после завершения рассказа
    рисунок нередко стирают рукой или оставляют ветру.


    Формальное построение сандроинга подчинено строгой алгоритмической дисциплине. Сначала исполнитель
    размечает на ровном вулканическом песке, пыли или очажной золе опорную решётку из перпендикулярных
    линий либо симметричных рядов точек, а затем одним указательным пальцем плавно прокладывает непрерывную
    замкнутую траекторию — по возможности не отрывая палец от земли, не останавливаясь и не проводя дважды
    по одному и тому же отрезку — вплоть до возвращения в исходную точку. Первая систематическая полевая
    запись этой системы была сделана Бернардом Диконом на Малакуле и Амбриме в 1926–1927 годах (включая
    космологический путь Нахал и зооморфные фигуры). Как показывает полевая работа Барона на Амбриме,
    мастера создают новые фигуры — вплоть до «Вертолёта» Кару Ифрема (2018) или современных работ Эдгара
    Хинджа с острова Пентекост о климате и памяти — либо напрямую переводя предмет в непрерывную линию,
    либо преобразуя классическую решётку, либо накладывая несколько смысловых слоёв в одном узоре. От
    кельтского переплетённого орнамента сандроинг отличается временной природой живого жеста и привязкой
    к устному рассказу на земле, а от австралийских рисунков на песке — графической чистотой единой
    непрерывной кривой без цветного заполнения охрой и точками.
  traits:
    - Непрерывная замкнутая линия, прочерченная одним пальцем без отрыва и без повторного прохода по отрезкам
    - Опорная геометрическая решётка из перпендикулярных линий или симметричных точек, организующая траекторию
    - Монохромный линейный рельеф на вулканическом песке, пыли или золе без раскраски
    - Неразрывное единство рисунка, ритма движения руки, устного повествования и последующего стирания образа
