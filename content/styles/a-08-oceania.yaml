  scopeNote: >-
    Традиция живописи природными охрами на эвкалиптовой коре народов йолнгу северо-восточного Арнем-Ленда
    (Йирркала и связанные кланы Дува и Йирритья) по публичному музейному корпусу проекта «Maḏayin»
    (1935–2015). Живопись на коре западного Арнем-Ленда (кунвиньку), полые погребальные столбы ларракить
    и гравировки на металле в этот корпус не входят.
  evidence:
    - field: dates
      claim: >-
        Народы йолнгу веками наносили клановые узоры миньтьи (miny’tji, «мадайин» — священное и прекрасное)
        на тела и обрядовые предметы, а в XX веке перенесли их на эвкалиптовую кору; корпус «Maḏayin»
        охватывает работы от сборов Дональда Томсона 1935 года до XXI века.
      source: madayin-what-is-bark
    - field: description
      claim: >-
        Кору эвкалипта Eucalyptus tetradonta (gaḏayka) срезают топором, выпрямляют над огнём под грузом,
        шлифуют и расписывают минеральными охрами и белой глиной гапан с водой и связующим (ранее соком
        орхидей, ныне клеем) кистями из прямых человеческих волос или травы.
      source: madayin-what-is-bark
    - field: description
      claim: >-
        Выставка «Maḏayin», инициированная старейшиной клана Мадаррпа Джамбавой Маравили в 2015 году совместно
        с Клуге-Руэ и арт-центром Buku-Larrŋgay Mulka, объединила музейные собрания (от Дональда Томсона 1935
        года и экспедиции 1948 года до современных работ) для показа живой связи узоров с землёй и родством.
      source: madayin-origins
    - field: description
      claim: >-
        Нонггирнга Маравили в 2010-е годы подчёркивала, что её огненные и молниевые композиции на коре — не
        закрытые священные узоры клана Мадаррпа, а свободные образы, созданные с соблюдением норм закона йолнгу.
      source: madayin-nonggirrnga-2015
