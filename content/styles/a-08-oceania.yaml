  compare:
    - id: samoan-siapo
      note: >-
        Обе океанийские традиции работают с природными материалами и растительной основой в земляной палитре,
        но сиапо — это мягкая выколоченная лубяная ткань с трафаретным и свободным орнаментом, тогда как
        живопись йолнгу строится на жёсткой эвкалиптовой коре и тончайшей волосяной штриховке миньтьи.
        Визуальное сравнение, не происхождение.
