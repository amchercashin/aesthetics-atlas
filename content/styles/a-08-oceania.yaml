  summary: >-
    Современное движение живописи коренных народов Западной пустыни Австралии, начавшееся в 1971 году в Папунье:
    перенос ритуальной иконографии тела и рисунков на песке в акриловые и эмалевые поля из точек, кругов и путей.
  description: >-
    По официальной хронике кооператива Papunya Tula Artists и очерку старшего куратора Национальной галереи
    Виктории Джудит Райан (2014), движение зародилось в 1971 году в правительственном поселении Папунья
    в 240 км к северо-западу от Алис-Спрингс, когда школьный учитель Джеффри Бардон предложил старейшинам
    расписать стену школы сюжетом о медовом муравье. Интерес внутри общины привёл к появлению переносных
    живописных досок, а в 1972 году мастера народов пинтупи, луритья, анматьерре, варлпири и аррернте основали
    собственную компанию Papunya Tula Artists; в 1980-е годы, с возвращением общин на родные земли, мастерские
    открылись в Кинторе и Кивирркуре на западе пустыни. Первым публичным признанием нового языка стала победа
    Каапы Тьямпитйинпы на премии Caltex в Алис-Спрингс в 1971 году, а с начала 1980-х работы Западной пустыни
    вошли в постоянные собрания художественных музеев Австралии и крупные выставки в Париже и мире.


    Живопись Папуня-Тула выросла из эфемерных ритуальных рисунков на песке, росписи тела и резных священных
    предметов: концентрические круги обозначают места силы, источники и лагеря, извилистые линии — маршруты
    предков (Тьюкуррпа), дуги — сидящих людей. Чтобы показывать эти сюжеты широкой публике без нарушения
    тайных законов, художники постепенно убирали закрытые ритуальные знаки и развивали плотную точечную
    запись — «мерцающие» поля точек, скрывающие сакральный слой и одновременно передающие рельеф пустыни,
    растительность и дождь. В 1971–1972 годах на компактных досках (как у Джонни Варангкулы Тьюпуррулы,
    Клиффорда Поссума и Мика Намарари) соседствуют графическая иконография и первые слои точек; к 1980 году
    возникают монументальные картографические холсты вроде шестиметрового «Духовного сновидения через земли
    Напперби», а с начала 1980-х в движение открыто входят женщины — круглая картина Дейзи Леуры Накамарры
    (1982) стала первой живописью женщины Западной пустыни в музейном собрании. От живописи на коре народов
    йолнгу в Арнем-Ленде Папуня-Тула отличается акрилом на доске и холсте, картографическим взглядом сверху
    и точечной завесой вместо тончайшей перекрёстной штриховки по коре; от поздней же живописи Эмили Кам
    Кнгваррей из Утопии — строгим иконографическим кодом кругов, дуг и путей вместо свободной всепокрывающей
    каллиграфии мазков.
  traits:
    - Картографическая композиция «вид сверху» с концентрическими кругами, дугами и волнистыми линиями маршрутов
    - Плотные поля ритмично расставленных точек, образующие мерцающую поверхность и зрительную завесу
    - Тёплая земляная палитра красной и жёлтой охры, терракоты, сажи и белил на акриле и эмали
    - Смещение от ранних графических досок 1971–1972 годов к многослойным монументальным холстам
  promptCues:
    - "Картографическая композиция с видом сверху, собранная из концентрических кругов, дуг и извилистых полос"
    - "Плотная россыпь мелких ритмичных точек акрила, создающая мерцающую текстуру пустынного рельефа"
    - "Тёплая земляная палитра красной охры, жжёной умбры, золотистого песка, угольно-чёрного и мелового белого"
    - "Плоскостное ритмическое пространство без линейной перспективы и светотеневого объёма"
