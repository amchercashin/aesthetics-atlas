    - field: description
      claim: >-
        По очерку Пенсильванского музея («Expedition»), балки бай (~4,5 м длиной) и фронтоны служили
        мнемоническими визуальными рассказами по выбору вождей; их красили смесью извести, сажи, красной и
        жёлтой охры с маслом ореха паринариума, а в 1930-е годы Хисакацу Хидзиката помог перенести их сюжеты
