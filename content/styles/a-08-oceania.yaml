  compare:
    - id: rei-kawakubo
      note: >-
        Обе практики превращают одежду в скульптурную критическую форму, но у Рэй Кавакубо авангардный образ
        строится через деконструкцию кроя и монохромные ткани, а у Pacific Sisters — через коллективный
        ассамбляж тихоокеанских ремёсел, перьев, раковин и уличного вторсырья. Визуальное сравнение, не происхождение.
    - id: reko-rennie
      note: >-
        Две современные городские практики коренных художников Аотеароа и Австралии, переводящие традиционную
        орнаментику в яркое публичное высказывание о видимости и идентичности, но в разных медиа (костюм и
        живой перформанс против граффити, неона и видео). Визуальное сравнение, не происхождение.
  review:
    status: reviewed
    date: "2026-11-27"
    scope: [relations, dates, text, images, corpus, gallery]
    note: >-
      27.11.2026: связи — подтверждённая техническая связь с тихоокеанской тапой (сиапо) по каталогу Те Папа
      и визуальные сопоставления с Рэй Кавакубо и Реко Ренни; post-internet как более позднее явление не
      привязан генеалогически. Даты — 1991/1992 — наши дни по Те Папа и Новозеландскому музею моды. Описание
      — 4 утверждения по Те Папа и NZFM. Корпус — два музейных костюма Те Папа (FE011080 и FE013045) и две
      архивные фотографии ранних показов 1992–1993 годов из NZFM плюс вид экспозиции Те Папа 2018 года в
      галерее; все репродукции просмотрены. Открыто: записи «Pacific Mama» (FE013251) и «E Leai se Fefe»
      (FE013525) в онлайн-каталоге Те Папа опубликованы без изображений и в корпус не включены.

