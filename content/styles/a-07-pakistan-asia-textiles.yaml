    - "Классическая четырёхцветная гамма — глубокий индиго, кирпично-красная марена, угольно-чёрный и тонкие белые линии"
    - "Симметричная композиция с плотным узорным полем и широким концевым бордюром из цветочных медальонов"
    - "Матовая фактура натурально окрашенного хлопка с живыми микросдвигами ручной многоступенчатой набойки"
