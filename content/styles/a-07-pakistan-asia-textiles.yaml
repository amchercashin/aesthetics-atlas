  summary: >-
    Традиция шёлкового и полушёлкового иката Центральной Азии: нити основы перевязывают и красят до ткачества,
    создавая крупные контрастные узоры с мерцающим «облачным» контуром (абр).
  description: >-
    Местное название техники — «абрбанди» («перевязывание облаков»): до начала ткачества пучки шёлковых нитей
    основы размечают, туго перевязывают участками и последовательно опускают в красильные чаны, тогда как уток
    обычно остаётся однотонным (шёлковым или хлопковым — в полушёлковом адрасе). На ткацком станке краситель,
    слегка просочившийся под обвязку, даёт мягкую ступенчатую размытость краёв — именно этот оптический сдвиг
    мастера и заказчики ценили как знак подлинного абрового узора.


    По материалам V&A, Чикагского института искусств и Public Domain Review, XIX век стал расцветом
    центральноазиатского иката в городах Великого шёлкового пути — Бухаре, Самарканде и центрах Ферганской
    долины, где в отдельных кварталах работали цеха рисовальщиков, перевязчиков, красильщиков и ткачей. Узкие
    полосы сшивали в парадные халаты (хилат, женский мунисак) и многополосные настенные занавесы (парда),
    входившие в приданое и служившие знаком статуса. В отличие от батика, где узор наносят воском на готовое
    полотно, здесь орнамент рождается внутри самой структуры нитей, а от ибанского иката пуа кумбу бухарские
    ткани отличаются открытым цветовым контрастом малинового, жёлтого, бирюзового и фиолетового и крупным
    вертикальным ритмом медальонов, гранатов и зигзагов.
  traits:
    - Характерный «облачный» размытый край узора из-за просачивания краски под обвязку нитей основы
    - Крупные вертикальные раппорты — медальоны, стилизованные гранаты, зигзаги и ромбы на всю ширину полосы
    - Смелое столкновение насыщенных цветов — малинового, шафраново-жёлтого, индиго, бирюзы и сливового
    - Сборка больших занавесов (парда) и халатов из нескольких сшитых узких полос со сдвигом ритма на швах
