  summary: >-
    Народное искусство украшения грузовиков, автобусов и рикш в Пакистане: многослойная эмалевая роспись,
    резная корона тадж над кабиной, чеканный металл, светоотражающая лента, каллиграфия и звенящие цепи.
  description: >-
    На дорогах Пакистана грузовой транспорт превращается в передвижную галерею: кузов покрывают сплошным
    декором без пустых мест, объединяя живопись, резьбу по дереву, чеканный металл, цветной пластик, зеркала и
    подвешенные под днищем цепи с металлическими листьями и колокольчиками (отсюда английское прозвище «jingle
    trucks»). По многолетним исследованиям художницы и профессора Университета Карачи Дуррии Кази (Saudi Aramco
    World, Pulitzer Center), обычай вырос из эмблем транспортных компаний конца 1940-х годов, расцвёл в 1950-х,
    когда переселившийся в Карачи мастер дворцовых росписей из Гуджарата Хаджи Хусейн перенёс цветочные бордюры
    на экипажи и грузовики, и достиг классической полноты в 1960-х на британских машинах Bedford с высокой
    деревянной надстройкой-короной («тадж») над кабиной.


    За кажущимся изобилием скрыта устойчивая композиционная грамматика и разделение цехов (живописцы, резчики,
    чеканщики, мастера светоотражающей ленты): на «короне» тадж над кабиной обычно пишут мечети, святыни и
    священную каллиграфию, на бортах — горные пейзажи, озёра, птиц и зверей в цветочных рамах, на заднем борту —
    крупный портрет (от героев и киноактрис до самого владельца) и двустишия на урду о дороге и молитве матери.
    Центры Пакистана отличаются по почерку: Карачи славится многослойными эмалевыми лессировками (как в работах
    Хайдера Али и кузовного мастера Джамиля Уддина для Смитсоновского фестиваля 2002 года), Пешавар — обилием
    каллиграфии и резьбы по дереву, Равалпинди — аппликацией из цветного пластика, а Синд — стальными павлинами
    и инкрустацией костью.
  traits:
    - Сплошное заполнение всех плоскостей кузова живописными панно, цветочными рамами и светоотражающей лентой
    - Высокая резная деревянная надстройка над кабиной («тадж») со святынями, пейзажами и каллиграфией на урду
    - Многослойная глянцевая эмалевая живопись с открытыми флуоресцентными цветами — бирюзовым, алым, лаймовым и жёлтым
    - Объёмный металлический декор — чеканные павлины, самолёты на капоте, ступенчатые колпаки и звенящие цепи
