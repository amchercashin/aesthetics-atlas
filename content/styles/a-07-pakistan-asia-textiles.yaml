  wiki: { en: National College of Arts }
  summary: >-
    Направление современного искусства, выросшее из отделения миниатюры Национального колледжа искусств в Лахоре:
    ювелирная техника бумаги васли, гуаши и золота соединяется с политикой, сатирой, коллажем и выходом за рамку листа.
  description: >-
    В конце 1980-х — 1990-х годах на отделении миниатюрной живописи Национального колледжа искусств (NCA) в
    Лахоре сложилось явление, получившее на международных выставках (в частности, «Beyond the Page», 2010)
    название «новой» или современной пакистанской миниатюры. По материалам Лахорской биеннале и обзорам
    движения, концептуальный поворот подготовил художник и педагог Захур уль-Ахлак, увидевший в сетке,
    полях и каллиграфии рукописной страницы современный язык живописи, а мастер Башир Ахмад сохранил строгую
    выучку — работу на многослойной бумаге васли, тончайшую кисть, минеральные пигменты, чайные отмывки и
    сусальное золото.


    После прорыва Шахзии Сикандер новое поколение выпускников NCA — Имран Куреши, Айша Халид, Сайра Васим,
    Хадим Али, Нусра Латиф Куреши и их сверстники — превратило камерную придворную традицию в инструмент
    разговора о современности. В работах из собрания Музея Виктории и Альберта ракета прячется под нежной
    могольской листвой поверх газетного шрифта (Куреши), три бурки почти растворяются в мелкой решётке орнамента
    с резкими алыми прорезями (Халид), политическая карикатура помещается в парадную красную рамку (Васим), а
    крылатый Рустам из «Шахнаме» натягивает лук над одуванчиком в память о разрушении Бамиана (Али). В отличие
    от исторической могольской миниатюры здесь разрушается замкнутость листа: художники вводят коллаж, летрасет,
    пустоты, а также переносят логику миниатюры в настенные росписи, текстиль, скульптуру и инсталляцию.
  traits:
    - Ювелирная техника традиционной миниатюры — бумага васли, непрозрачная акварель/гуашь, чайная отмывка и сусальное золото
    - Классические многослойные рамки (поля), орнаментальные решётки и каллиграфия в столкновении с современными образами
    - Ирония, политический и гендерный подтекст — оружие, камуфляж, газетный шрифт, бурка, медиа-сатира
