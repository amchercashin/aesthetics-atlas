  summary: >-
    Трансграничная традиция ручной набойки и многоэтапного резервного крашения хлопка в Синде и Каче:
    геометрические созвездия глубокого индиго, красной марены, чёрного и белого.
  description: >-
    Аджракх — искусство многослойной ручной набойки резными деревянными досками с резервным и протравным
    крашением, сложившееся у ремесленных общин (прежде всего мастеров-кхатри) на засушливом пограничье Синда
    (Пакистан) и Кача в Гуджарате (Индия). Ремесленный центр Khamir в Каче связывает слово одновременно с
    арабским «азрак» («синий», по главному красителю индиго) и местной народной этимологией «оставь на сегодня».
    Настоящий аджракх проходит около шестнадцати (по некоторым схемам — до тридцати) последовательных стадий
    промывки, протравливания миробаланом (харда), набойки глиняно-известкового или воскового резерва и
    многократного крашения в индиго и марене (ализарине), часто с точным совмещением узора на обеих сторонах ткани.


    Среди скотоводческих и земледельческих общин региона (рабари, малдхари, ахиры) и жителей Синда аджракх носят
    как мужские тюрбаны, наплечные шали и лунги, дарят на свадьбы и праздник Ид. Визуально ткань строится как
    строгая архитектурная сетка: сплошное центральное поле из звёзд, розеток, кругов или облачного узора
    (какар), обведённое плоскими полосами бордюра с цветочными медальонами и зубцами, напоминающими решётки
    джали и арки. После землетрясения 2001 года в Каче часть мастеров переехала из Дхамадки в специально
    основанную деревню Аджракхпур; наряду с каноническими шалями новое поколение мастеров-дизайнеров Кхатри
    создаёт авторские полотна, вписывая современные сюжеты в классическую кайму аджракха.
  traits:
    - Строгая палитра четырёх главных цветов — глубокий индиго, тёплая красная марена, чёрный и белый резерв
    - Плотная геометрическая решётка центрального поля из звёзд, кругов, ромбов и облачных мотивов (какар)
    - Чёткая композиционная рамка с широким концевым бордюром из цветочных медальонов и зубцов
    - Матовая зернистая фактура ручного оттиска деревянными штампами с тонким белым контуром резерва
  promptCues:
