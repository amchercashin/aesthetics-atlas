        Смитсоновского фестиваля «Шёлковый путь» 2002 года; четыре украшения (MCC 1005-09) сохранены в архиве
        института.
      source: si-pakistani-truck-ornaments
    - field: description
      claim: >-
        Кузов подчиняется негласной схеме: корона тадж отведена под мечети и святыни, борта — под пейзажи и
        животных, задний борт — под портрет и поэзию на урду; различаются школы Карачи, Пешавара, Равалпинди и Синда.
      source: aramcoworld-trucks-pakistan-2005
    - field: description
      claim: >-
        Звенящие цепи с колокольчиками дали машинам прозвище «jingle trucks»; Дуррия Кази связывает пышный цвет
        и почитание машины с традицией украшения суфийских святынь.
      source: pulitzer-pakistans-truck-art-2013
