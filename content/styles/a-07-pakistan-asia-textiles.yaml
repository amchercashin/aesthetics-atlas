  summary: >-
    Бенгальская женская традиция плоской стёжки и вышивки по нескольким слоям старых хлопковых сари: мелкий
    бегущий стежок создаёт рябь на ткани, а в центре расцветают лотосы, животные и сюжетные сцены.
  description: >-
    Кантха сложилась в исторической Бенгалии (современные Бангладеш и индийский штат Западная Бенгалия) как
    домашнее искусство женщин, превращавших изношенные, мягкие от многократных стирок белые хлопковые сари и
    дхоти в семейные реликвии — покрывала, коврики для сидения (асон), пелёнки и квадратные обёртки (бостани).
    По материалам Музея Виктории и Альберта и Филадельфийского музея искусств, несколько слоёв старой ткани
    сшивали без внутренней ватной прокладки частым бегущим стежком, а цветные нити для узора вытягивали прямо
    из окрашенных кайм тех же сари. Параллельные ряды белых стежков огибали вышитые фигуры («эхо-стёжка»),
    придавая всему полотну мелкую рельефную рябь.


    Богато орнаментированные образцы называют накши-кантха (сохранившиеся музейные образцы в основном относятся
    к 1870–1930-м годам). Их композиция часто строится от центральной розетки лотоса к угловым мотивам ботех
    («огурцам») и многослойным каймам, а между ними располагаются деревья, всадники, птицы, бытовые вещи и
    сцены индуистской и мусульманской культуры — вплоть до божеств в одежде бенгальских горожан. В отличие от
    корейского лоскутного подбора под названием поджаги, кантха соединяет не геометрические лоскуты встык, а
    цельные слои ткани сквозной графической строчкой; с 1920-х годов появились кооперативные артели, а после
    раздела 1947 года в Восточной Бенгалии расцвела геометрическая галича-кантха с вышивкой крестом.
  traits:
    - Плоская стёжка без ватной прокладки из нескольких слоёв мягких старых хлопковых сари
    - Сплошная рябь поверхности от частых рядов бегущего стежка, огибающего контуры мотивов («эхо-стёжка»)
    - Центральный многолепестковый лотос, угловые «огурцы» (ботех) и полосатые каймы по периметру
    - Смешение орнамента с наивно-выразительными фигурами животных, всадников, птиц и бытовых сцен
