  wiki: { en: Shyrdak, ru: Шырдак }
  summary: >-
    Традиционные кыргызские войлочные ковры для утепления и убранства юрты: мозаичный резной шырдак с контрастным
    позитив-негативным узором и мягкий валяный ала-кийиз.
  description: >-
    По реестру ЮНЕСКО (2012) и исследованиям Динары Чочунбаевой и Стефани Банн, кыргызская кочевая традиция
    объединяет две разные техники войлочного ковра, создаваемого женщинами коллективно (обычай взаимопомощи
    ашар) из овечьей шерсти осенней стрижки для утепления юрты и приданого невесты. В технике шырдак два
    контрастно окрашенных пласта войлока складывают вместе, вырезают по одному рисунку и сшивают встык так,
    чтобы вырезанный мотив входил в прорезь другого цвета — без отходов, сразу на два зеркальных по цвету ковра.
    Шов маскируют цветным шнуром, а всю поверхность плотно простёгивают, добиваясь равновесия фона и узора.


    Вторая техника — ала-кийиз («пёстрый войлок»): окрашенные пряди непряденой шерсти выкладывают узором прямо
    на однотонную основу, поливают горячей водой и вваливают в рулоне на тростниковой циновке чий. Если шырдак
    отличается чётким контуром, плотной стёжкой и звенящим цветовым контрастом (красный, зелёный, синий, чёрный,
    белый), то ала-кийиз даёт мягкие, акварельно-расплывчатые очертания. Прямоугольные ковры обычно строятся в
    пропорции 1:2 с широкой каймой и центральным полем ромбов, заполненным роговидными завитками муйуз («рог»),
    сынган муйуз («сломанный рог»), карга тырмак («вороний коготь») и ит куйрук («собачий хвост»).
  traits:
    - Позитив-негативная мозаика шырдака — узор и фон равны по площади и зеркально меняются цветами
    - Контрастный шнур по линии шва и плотная декоративная стёжка по всей толще войлока
    - Крупные завитки рогов (муйуз), ромбы в центре и пилообразная чёрно-белая полоса вдоль каймы
    - В ала-кийизе — ввалянная цветная шерсть с мягким, слегка размытым краем без швов и чёткого контура
