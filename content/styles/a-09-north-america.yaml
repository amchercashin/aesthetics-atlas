  wiki: { en: Norval Morrisseau }
  summary: >-
    Авторская живописная система художника-анишинаабе Норвала Морриссо (1931–2007): мощные чёрные контуры,
    «линии связи», внутреннее «рентгеновское» членение фигур и открытые локальные акриловые цвета.
  description: >-
    По монографии историка искусства Кармен Робертсон «Norval Morrisseau: Life & Work» (Art Canada Institute)
    и материалам коллекции Макмайкла, художник-анишинаабе Норвал Морриссо (1931–2007), подписывавший картины
    слоговым письмом кри духовным именем Мискваабик Анимиики («Медная Громовая птица»), совершил перелом в
    истории канадского искусства XX века. Воспитанный дедом-шаманом традиции Мидевивин на озере Нипигон и
    лишённый академического образования, он перенёс на бумагу и холст визуальные коды наскальных пиктограмм
    Великих озёр (вроде изображения водного духа Мисипишу в Агаве) и священных берёстяных свитков. Его дебютная
    персональная выставка в галерее Джека Поллока в Торонто в 1962 году стала первым показом современного
    художника из числа коренных народов в коммерческой галерее современного искусства Канады; в 1973 году он
    вошёл в объединение Professional Native Indian Artists Inc. («Индейская группа семи»), а в 2006 году стал
    первым коренным художником (не инуитом), удостоенным большой персональной ретроспективы в Национальной
    галерее Канады («Norval Morrisseau — Shaman Artist»).


    В основе его живописной системы лежат три взаимосвязанных формальных приёма. Во-первых, плотный чёрный
    контур, который одновременно очерчивает силуэты людей, зверей и духов и протягивает между ними «линии связи»
    (lines of communication / power lines) — замкнутые контуры взаимозависимости всех существ. Во-вторых,
    внутреннее членение тела («рентгеновский» разрез): внутри контуров показаны сердце, позвоночник, утроба,
    решётчатые мотивы берёстяных свитков и любимый знак художника — «разделённый круг» (от раковины мегис
    общества Мидевивин), символизирующий дуальность мира (добро и зло, день и ночь). В-третьих, цвет: от
    земляной палитры на берёсте и крафт-бумаге 1960-х — начала 1970-х («Дух воды», 1972; «Дар», 1975) он
    перешёл к несмешанному открытому акрилу прямо из тюбика — медному, жёлтому, бирюзовому и пурпурному —
    в монументальных циклах 1977–1994 годов («Человек, превращающийся в Громовую птицу», «Андрогинность»,
    «Наблюдения астрального мира»). Его визуальный словарь породил так называемую «лесную школу» (Woodland School:
    Карл Рэй, Джошим Какегамик, Дафна Оджиг, Блейк Дебассидж). Ввиду широкого распространения поздних
    подделок на рынке (отмеченного Кармен Робертсон) данная карточка опирается строго на музейный корпус.
  traits:
    - Плотные чёрные контуры, скрепляющие фигуры и протягивающие между ними замкнутые «линии связи» (power lines)
    - Внутреннее «рентгеновское» членение фигур людей и животных на цветные отсеки, органы и решётчатые узоры
    - Повторяющийся знак разделённого надвое круга (дуальность) и симметричные пирамидальные композиции
