  scopeNote: >-
    Художественное объединение AfriCOBRA (Чикаго, с 1968 года) в границах программного корпуса пяти основателей
    1969–1971 годов из собрания Бруклинского музея (живопись, шелкография, работа на бумаге и авторский костюм).
    Гарлемский ренессанс 1920-х, всё движение Black Arts в целом и британское движение Black Arts 1980-х в
    карточку не входят.
  evidence:
    - field: dates
      claim: >-
        По словарю Тейт и каталогу Бруклинского музея (2012.80.18), AfriCOBRA основана в Чикаго в 1968 году
        Джеффом Дональдсоном, Барбарой Джонс-Хогу, Уодсвортом Джарреллом, Джей Джаррелл и Джеральдом Уильямсом.
      source: tate-africobra
    - field: description
      claim: >-
        По ресурсу «Oh Freedom!» Смитсоновского музея американского искусства (SAAM), манифест Джеффа Дональдсона
        1970 года сформулировал принципы общественной ответственности, высокоэнергетических цветов, ритма из
        африканского искусства и музыки, африканских символов (анкх, афро) и прямого введения текста в образ.
      source: saam-ohfreedom-bjh
    - field: description
      claim: >-
        Бруклинский музей (записи 2012.80.18, 2012.80.16a-b и 2012.80.26) документирует палитру «Coolade / Cool Ade»,
        связь живописи Уодсворта Джаррелла с костюмами Джей Джаррелл и тиражное распространение плакатов-шелкографий
        по цене около 10 долларов.
      source: bkm-wadsworth-rev-1971
    - field: description
      claim: >-
        В этикетке Бруклинского музея к шелкографии Барбары Джонс-Хогу «Relate to Your Heritage» (2012.80.26)
        прямо отмечено соединение визуального языка психоделических плакатов с образами женской силы и
        афроамериканского самоопределения.
      source: bkm-bjh-heritage-1971
