  scopeNote: >-
    Традиционная художественная система формлайн северных народов северо-западного побережья (хайда, тлинкиты,
    цимшиан) по музейному корпусу резьбы, росписи и ткачества чилкат XIX — начала XX века (MOA UBC, Мет, ROM,
    Кливлендский и Бруклинский музеи). Искусство прибрежных салишей (Coast Salish) и иных коренных народов
    Северной Америки в карточку не включается.
