  dateNote: >-
    1972–1994 — годы пяти музейных картин строго проверенного провенанса (от «Духа воды» 1972 года из
    Канадского музея истории до «Наблюдений астрального мира» ок. 1994 года из Национальной галереи Канады),
    охватывающих переход от земляной палитры на бумаге к монументальным ярко-цветным полотнам. Это не годы
    жизни автора (1931–2007; первая галерейная выставка прошла в Торонто в 1962 году); из-за документированной
    проблемы подделок на коммерческом рынке в корпус включены исключительно работы из публичных музейных
    собраний и монографии Кармен Робертсон (Art Canada Institute).
