  wiki: { en: Formline art }
  summary: >-
    Каноническая система родовых гербов северных народов северо-западного побережья (хайда, тлинкиты, цимшиан):
    непрерывная сужающаяся и расширяющаяся лента формлайн, овойды и U-формы в резьбе по кедру, росписи и ткачестве чилкат.
  description: >-
    По материалам Музея Берка (Университет Вашингтона) и Канадского музея истории, термин «формлайн» (formline)
    ввёл в 1965 году историк искусства и куратор Билл Холм в книге «Northwest Coast Indian Art: An Analysis of Form»,
    изучив сотни исторических сундуков и шкатулок из гнутого кедра. Формлайн — не всеобщий стиль всех коренных
    народов Америки и не единый язык всего побережья (искусство прибрежных салишей опирается на иные принципы),
    а строгая двумерная и рельефная визуальная грамматика северных народов северо-западного побережья — прежде
    всего хайда, тлинкитов и цимшиан (при заметных локальных различиях между школами). В ней изображают
    наследуемые клановые гербы — ворона, орла, медведя, косатку, бобра и духов предков, — удостоверяющие
    статус, происхождение и права владельца на предания и территории.


    Главный строительный элемент системы — непрерывная чёрная первичная лента переменной ширины, которая
    плавно утолщается и сужается, связывая композицию в единый замкнутый каркас. Внутри неё выстраиваются
    канонические модули: мягко скруглённые прямоугольники-овойды (ovoids, образующие глаза, суставы и торсы),
    U-образные и расщеплённые U-формы (перья, плавники, заполнение промежутков) и S-формы; вторичные линии
    обычно выполняют красным пигментом, а редкие акценты и фон — сине-зелёной (бирюзовой) краской или
    инкрустацией перламутром морского ушка. Единая логика переносится на любые носители: на стенки гнутых из
    одной кедровой доски сундуков для ритуальных регалий и рыбьего жира эйлахона (tawt’aGaay у хайда),
    на тканные из шерсти снежной козы и кедрового луба церемониальные плащи чилкат, резные налобники головных
    уборов (как работа, приписываемая мастеру хайда Симеону Стилтде, 1850–1875) и шаманские погремушки-вороны.
    Во второй половине XX и в XXI веке традиция пережила мощный расцвет в работах мастеров хайда и тлинкитов —
    от Билла Рида и Роберта Дэвидсона до нового поколения художников, разрабатывающих терминологию формлайна
    на языке хайда.
  traits:
    - Непрерывная чёрная первичная лента переменной ширины (formline), связывающая всю композицию
    - Модульный словарь скруглённых овойдов, U-форм и расщеплённых U-элементов для глаз, суставов и крыльев
    - Строгий трёхцветный канон — чёрная основа, красные вторичные элементы и бирюзово-зелёные акценты или перламутр
    - Плотная двусторонняя симметрия и развёртка силуэта зверя-герба по всей поверхности сундука, плаща или щитка
