  wiki: { en: AfriCOBRA }
  summary: >-
    Чикагское художественное объединение движения Black Arts (с 1968): «цвета Kool-Aid», ритмический лозунговый
    текст внутри образа, позитивная героическая фигурация, тиражная шелкография и активистский костюм.
  description: >-
    По материалам Тейт, Смитсоновского музея американского искусства (SAAM) и Бруклинского музея, объединение
    AfriCOBRA (African Commune of Bad Relevant Artists; первоначально COBRA — Coalition of Black Revolutionary
    Artists) было основано в 1968 году на Южной стороне Чикаго пятью художниками — Джеффом Дональдсоном,
    Барбарой Джонс-Хогу, Уодсвортом Джарреллом, Джей Джаррелл и Джеральдом Уильямсом (часть из них в 1967 году
    участвовала в создании знаменитого уличного мурала «Wall of Respect»). Позже к коллективу присоединились
    Нельсон Стивенс, Наполеон Джонс-Хендерсон, Кэролин Лоуренс и другие мастера. Отвергая евроцентричный канон
    и элитарность галерейного рынка, группа поставила задачу создать собственный, мгновенно понятный общине
    визуальный язык движения Black Arts и Black Power — искусство достоинства, солидарности и самоопределения
    африканской диаспоры.


    Формальную программу коллектива сформулировал манифест 1970 года Джеффа Дональдсона и коллективные
    обсуждения участников. Она держится на узнаваемых визуальных принципах: сияющие высокоэнергетические
    «цвета Cool-Ade / Kool-Aid» (апельсиновый, лимонно-жёлтый, лаймовый, пурпурный, алый), ритм и повтор
    образов, вдохновлённый африканским искусством и музыкой, блеск поверхности (вплоть до металлических красок,
    как в «Жёнах Шанго» Дональдсона, 1969), фронтальные позитивные образы чернокожих женщин, мужчин и семьи,
    африканские эмблемы (древнеегипетский анкх, пышные причёски афро) и прямое встраивание букв и лозунгов в
    ткань картины и плаката. В «Революционерке (Анджеле Дэвис)» (1971) Уодсворта Джаррелла сама фигура и фон
    собраны из вибрирующих цветных слов её речей («resist», «revolution», «Black is beautiful»), а её жакет
    воспроизводит реальный «Революционный костюм» с патронташем работы Джей Джаррелл (перенесшей эстетику
    коллектива в носимую моду, как и в лоскутном «Костюме городской стены», ок. 1969). Чтобы искусство оставалось
    доступным, Барбара Джонс-Хогу («Объединяйтесь», 1971) и Джеральд Уильямс («Проснись», 1971) выпускали
    недорогие цветные шелкографии-плакаты (продававшиеся на ярмарках и в книжных магазинах примерно за 10 долларов).
    От психоделического плаката 1960-х AfriCOBRA отличается ясной читаемостью политического высказывания и
    дисциплиной общинной программы, а от афрофутуризма — прямой укоренённостью в городской гражданской борьбе
    и уличной культуре Чикаго без научно-фантастической образности.
  traits:
    - Высокоэнергетическая палитра «Cool-Ade / Kool-Aid» — яркий оранжевый, жёлтый, лаймовый, пурпурный и красный
    - Прямое вплетение выразительного ритмического леттеринга и лозунгов прямо в фигуры и фон композиции
    - Позитивная, героическая фигурация и портретность с африканскими и диаспорными эмблемами (анкх, афро, патронташ)
    - Доступная тиражная шелкография-плакат наравне со станковой живописью и носимым текстильным костюмом
