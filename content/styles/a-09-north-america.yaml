  compare:
    - id: psychedelic-art
      note: >-
        Обе плакатные эстетики конца 1960-х используют вибрирующие кислотно-яркие цвета и деформированный
        рукописный леттеринг (что отмечает Бруклинский музей в описании работ Барбары Джонс-Хогу), однако
        психоделический плакат растворяет слово в галлюцинаторном орнаменте, а AfriCOBRA подчиняет цвет и текст
        ясной общественной речи и диаспорной иконографии. Визуальное сравнение, не происхождение.
    - id: afrofuturism
      note: >-
        Две художественные традиции африканской диаспоры второй половины XX века, строящие самостоятельную
        позитивную образность: AfriCOBRA опирается на уличный плакат, героический портрет и политическую графику
        движения Black Arts в Чикаго, а афрофутуризм соединяет африканскую мифологию с научной фантастикой и
        космической эстетикой. Визуальное сравнение, не происхождение.
