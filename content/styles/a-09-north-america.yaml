    упоминается уже с 1650 года, однако сохранившийся музейный корпус начинается в XIX веке. Пять текстильных
    работ корпуса (Музей Бауэрса, Кливлендский музей искусств, Художественный музей Гонолулу и пример школы
    Ту-Грей-Хиллс) намеренно разграничивают два исторических этапа: классические плечевые одеяла XIX века
    (ок. 1850–1880) и поздние региональные ковровые школы рубежа XIX–XX и XX века (Ганадо, Ту-Грей-Хиллс).
    Традиция активно продолжается современными ткачихами и ткачами дине в XXI веке.
