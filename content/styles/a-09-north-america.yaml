  summary: >-
    Шерстяное гобеленовое ткачество народа дине (навахо) на вертикальном стане: от полосатых плечевых
    «вождевых одеял» XIX века к региональным ковровым школам Ганадо и Ту-Грей-Хиллс XX века.
  description: >-
    По материалам Музея Хёрда (Финикс), Денверского художественного музея, Музея искусств Спенсера и
    Кливлендского музея искусств, ткачество народа дине (навахо) на Юго-Западе США — одна из крупнейших
    текстильных систем Северной Америки, связанная в мифологии дине с даром Женщины-Паучихи. Документально
    известное с середины XVII века (ок. 1650), ремесло выполняется без предварительного бумажного шаблона на
    вертикальном двухбрусовом стане из длинноволокнистой овечьей шерсти чурро; благодаря замкнутым кромкам
    (selvages) полотно не имеет бахромы по бокам и отличается исключительной прочностью и плотностью утка.


    Исторически традиция чётко разделяется на два больших пласта. В XIX веке (классический и переходный
    периоды) ткачихи создавали плотные, почти водонепроницаемые носимые плечевые одеяла и серапе для собственного
    употребления и престижного межплеменного обмена. Знаменитые «вождевые одеяла» (Chief’s Blankets) прошли
    последовательную эволюцию: от строгого ритма широких горизонтальных полос натуральной коричневой, кремовой
    и индиговой шерсти (первая фаза, ок. 1850–1860) к введению красных прямоугольных блоков из распущенного
    сукна байеты и фабричной пряжи (вторая фаза), а затем к крупным ступенчатым ромбам и крестам поверх полос
    (третья и четвёртая фазы, ок. 1860–1900). На рубеже XIX–XX веков, после создания сети торговых постов на
    территории резервации, центр тяжести сместился от одеял к напольным и настенным коврам с замкнутой каймой
    и сложились узнаваемые региональные школы: Ганадо (насыщенное красное и серое поле с крестами и ступенчатыми
    ромбами вокруг торгового поста Хаббелла), Ту-Грей-Хиллс в Нью-Мексико (сложнейшая четырёхсторонняя симметрия
    исключительно в неокрашенных натуральных тонах шерсти — от кремового и серого до угольно-чёрного — при
    плотности до 90–120 нитей на дюйм, как у прославленных мастериц Дейзи Тогельчи и Джулии Джамбо), а также
    Тис-Нос-Пос, Кристал и Уайд-Руинс. От узкополосного ткачества кенте асанте ткачество дине отличается
    цельным бесшовным полотном на вертикальном стане и ступенчатой диагональной геометрией гобеленового переплетения.
  traits:
    - Плотная гобеленовая техника на вертикальном стане с замкнутыми кромками и без предварительного эскиза
    - Чёткое историческое различие между открытыми полосатыми плечевыми одеялами XIX века и обрамлёнными коврами XX века
    - Ступенчатая геометрия ромбов, зигзагов, террасных крестов и многоосевой зеркальной симметрии
    - Диапазон палитр от полос индиго и красной байеты до полностью натуральных неокрашенных тонов школы Ту-Грей-Хиллс
