  wiki: { en: Inuit art }
  summary: >-
    Непрерывно действующая с 1959 года печатная школа инуитов в Киннгайте (Нунавут): перенос авторских
    рисунков на рельефный камень, трафарет, офорт и литографию с чётким разделением ролей художника и печатника.
  description: >-
    По материалам Канадского музея истории («Inuit Prints of Cape Dorset»), Dorset Fine Arts и монографии
    куратора Национальной галереи Канады Кристин Лалонд о Питсеолак Ашуне (Art Canada Institute), печатная
    мастерская в арктическом посёлке Киннгайт (ранее Кейп-Дорсет, Нунавут) возникла в конце 1957 года.
    Художник и администратор Джеймс Хьюстон вместе с резчиками Осуитоком Ипили и Канангинаком Путугуком начал
    опыты с печатью по бумаге и ткани, опираясь на многовековую инуитскую традицию гравировки по моржовому
    клыку и аппликации из тюленьей кожи. Зимой 1958–1959 годов Хьюстон изучил ксилографию в Японии у мастера
    сосаку-ханга Унъити Хирацуки и передал приёмы ручной печати инуитским мастерам, которые заменили дерево
    доступным арктическим камнем (мыльным камнем/серпентинитом). В 1959 году учреждённый художниками
    Западно-Баффинов эскимосский кооператив (West Baffin Eskimo Co-operative, сегодня Kinngait Studios) выпустил
    первую официальную коллекцию из 41 листа (показанную в Монреальском музее изящных искусств в феврале 1960 года)
    и с тех пор ежегодно издаёт тиражи по 30–60 и более листов — это старейшая непрерывно работающая печатная
    мастерская Канады.


    Ключевая особенность школы Киннгайта — коллективное разделение труда. Рисовальщики (среди первых мастеров —
    Кеножуак Ашевак, Питсеолак Ашуна, Парр, Пудло Пудлат, Люси Киннуаюак, позднее Шувинай Ашуна и Энни Путугук)
    создавали дома тысячи рисунков графитом, цветными карандашами и фломастерами, а избранные листы переводили
    в эстампы мастера-резчики и печатники кооператива — Осуиток Ипили, Канангинак Путугук, Игивудлук Путугук,
    Ийола Кингватсиак, Лукта Киатсук, Тимоти Отточи, Кабавоак Катсия и их преемники. Над листом обычно стоят
    две подписи и печать кооператива: резчик вырезает на плоском каменном блоке высокий рельеф (stonecut),
    накатывает валик краски и вручную притирает тонкую японскую бумагу; для плавных тональных переходов камень
    часто дополняют трафаретом (сначала из тюленьей шкуры, затем из бумаги). В 1961 году при арт-директоре
    Терри Райане добавились гравюра резцом по меди и офорт (позволившие художнику рисовать прямо на доске),
    а с 1972–1975 годов — многоцветная литография. От ранних лаконичных силуэтов животных и сцен кочевого быта
    («С вороном приходит рыба», 1959; «Строители инукшука», 1968) школа пришла к ироническому соединению
    Арктики и техники у Пудло Пудлата («Самолёт», 1976), документальной точности Канангинака Путугука и
    плотным современным литографиям Шувинай Ашуны («Лоскутное одеяло снов», 2009).
  traits:
    - Выразительные плоские силуэты людей, арктических зверей, духов и лагерного быта на чистом поле тонкой бумаги
    - Разделение авторства рисунка и работы мастера-резчика/печатника с печатью кооператива в нижнем углу листа
    - Сочетание рельефной гравюры на камне (stonecut) с мягкими цветовыми переходами трафарета, офорта и литографии
    - Эволюция сюжетов от памяти о кочевом лагере и мифов к современному быту, авиации и авторскому сюрреализму XXI века
