  summary: >-
    Узнаваемый авторский язык пионера инуитской графики Кеножуак Ашевак: радиально расходящиеся перья-лучи,
    превращение птиц, солнца и духов в живые орнаментальные силуэты при коллективной печати мастерской Киннгайта.
  description: >-
    По каталожным записям Монреальского музея изящных искусств (MMFA), Бруклинского музея, Денверского
    художественного музея, Канадского музея истории и архива коллекции Макмайкла, Кеножуак Ашевак (1927–2013)
    стала одной из первых женщин-художниц кооператива в Кейп-Дорсете (Киннгайте) и создала самые узнаваемые
    образы канадской инуитской графики. До прихода в мастерскую она была опытной швеёй, украшавшей парки и
    сумки аппликациями из кожи: именно мотив её аппликации лёг в основу первого официального оттиска
    «Заяц, поедающий водоросли» (1958–1959, трафарет по тюленьей шкуре, выпуск 1959 года). В архиве рисунков
    Киннгайта на долгосрочном хранении в коллекции Макмайкла насчитывается более двух тысяч её рисунков и
    эстампов, а её первая крупная ретроспектива прошла там в 1986 году (куратор Джин Блоджетт).


    Авторская пластика Кеножуак Ашевак строится на чистом ритме, симметрии и свободном превращении арктической
    природы — прежде всего полярной совы, других птиц и духов — в напряжённое декоративное поле. В «Заколдованной
    сове» (1960; в 1970 году воспроизведённой на почтовой марке Канады) веер удлинённых изогнутых перьев-лучей
    вырывается из центра и заполняет почти весь лист в контрасте охры/оранжевого и глубокого чёрно-синего.
    При этом ключевую роль играет коллективная природа печатного листа Киннгайта: Кеножуак создавала исходный
    рисунок, тогда как резьбу по камню и ручную печать выполняли мастера кооператива — так, над «Заколдованной
    совой» 1960 года вместе с ней работали резчик и печатник Игивудлук Путугук и Ийола Кингватсиак (распределение
    резьбы и печати между ними в каталогах MMFA и CMH приводится в двух вариантах, но оба музея фиксируют этот
    тандем), а в 1990-е годы она работала с Кававау Мануми и Киатсуком Нивиакси. Когда художница сама брала
    резец по меди («Сова и медведи», 1976), появлялась тонкая пунктирная фактура, а в поздних литографиях
    («Чайки и вороны», 2001) её крылатые силуэты превращались в многослойные полупрозрачные потоки цвета.
    От повествовательных бытовых сцен Питсеолак Ашуны её язык отличает отказ от линии горизонта и рассказа ради
    чистого радиального равновесия формы, а от социально-техногенной иронии Пудло Пудлата — сосредоточенность
    на орнаментальной метаморфозе птицы, солнца и зверя.
