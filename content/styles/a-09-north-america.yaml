  compare:
    - id: celtic-art
      note: >-
        Обе системы строят сложный линейный орнамент с плотным равновесием фигуры и фона, но кельтская плетёнка
        вытягивает симметричные ленты-узлы на металле и пергамене, тогда как формлайн собирает тело родового
        зверя из овойдов и U-форм переменной толщины. Визуальное сравнение, не происхождение.
    - id: maori-whakairo
      note: >-
        Две тихоокеанские традиции монументальной резьбы по дереву с родовой геральдикой предков: маорийское
        вакаиро опирается на выпуклые спирали кору и глубокий пластический рельеф, а формлайн северо-западного
        побережья — на плоскую модульную решётку чёрно-красных овойдов и лент. Визуальное сравнение, не происхождение.
