        написанная языком европейского модернизма.
  summary: >-
    Живопись Сингапура и Малайи 1930–1960-х, где мигранты из Китая соединяли китайские и западные приёмы в
    изображении местных людей, пейзажей и быта; «школой» её назвали лишь позднее, и манеры художников очень
    разные.
  description: >-
    По очерку Ео Ман Тхонга, опубликованному Национальной галереей Сингапура, слова «стиль Наньян» и
    «малайский стиль» в 1950-х обозначали искусство, соединявшее восточные и западные приёмы в изображении
    местных пейзажей, людей и культуры. Художники-мигранты вносили «вкус Наньяна» с 1930-х, а Лим Хак Тай
    основал в 1938 году Академию изящных искусств Наньян, чтобы соединить искусство Востока и Запада. В 1951
    году Чэнь Чунжуй, Лю Кан, Чэнь Вэньси и Чонг Су Пиенг показали совместную выставку, а в 1952 году вместе
    поехали на Бали.


    Слова «школа Наньян» появились в прессе лишь в 1985 году, и Ео считает её «фантазией комментаторов»: четыре
    художника писали очень по-разному. Поэтому карточка — путеводитель по кругу, а не описание единого стиля.
    Общее у работ — местный сюжет и соединение традиций: у Чэнь Чунжуя балийские танцовщицы написаны
    акварельно с тонким контуром, у Лю Кана — чистые цветовые поля, близкие к батику, у Чонг Су Пиенга — плоский
    цвет европейского модернизма.
  traits:
    - Местные сюжеты — деревня, рынок, танцовщицы Бали, люди Малайи
    - Соединение китайской кисти и туши с масляной живописью и приёмами западного модернизма
    - Яркий плоский цвет и чёткий контур в масле, тонкая линия и размывка в работах на бумаге
    - Сильные различия авторских манер внутри одного круга
  scopeNote: >-
    Обзор исторического термина «стиль Наньян» по очерку Ео Ман Тхонга и работам Чэнь Чунжуя, Лю Кана и Чонг
    Су Пиенга 1949–1954 годов. Отдельные авторские языки — в карточке Чонг Су Пиенга и будущих карточках других
    художников. В балийской поездке 1952 года источники называют четверых — Чэнь Чунжуя, Лю Кана, Чэнь Вэньси
    и Чонга; Жоржетт Чен среди них нет.
  dateNote: >-
    1938 — основание Академии изящных искусств Наньян; верхняя граница — 1960-е, до которых очерк приводит
    высказывания о «малайском стиле». Термин «школа Наньян» появился в 1985 году и в даты стиля не входит.
