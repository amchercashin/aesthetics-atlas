  summary: >-
    Живопись Чонг Су Пиенга 1949–1978 годов: китайские форматы свитка и тушь соединены с приёмами западного
    модернизма, а фигуры Юго-Восточной Азии становятся всё более вытянутыми и стилизованными.
  description: >-
    Чонг Су Пиенг (1917–1983) приехал в Сингапур в 1946 году и преподавал в Академии изящных искусств Наньян.
    Очерк Ло Сзе Ви на портале Национального совета по наследию разбирает три его женские фигуры, похожие по
    сюжету и совершенно разные по технике. «Лежащая женщина» (1949) написана тушью в длинном формате
    горизонтального свитка, обычно отведённом пейзажу. «Пляж на Бали» (1955) — масло с чертами примитивизма,
    кубизма, фовизма и экспрессионизма. «Девушка с птичьей клеткой» — вертикальный свиток, где шея и руки
    вытянуты, а веки тяжёлые.


    Национальная галерея Сингапура подчёркивает, что Чонг переносил мотивы из техники в технику, а «Сушку
    солёной рыбы» (1978), изображённую на купюре в 50 долларов, написал разными жидкими тушами по шёлку. Общий
    принцип его языка — не один стиль, а соединение китайского формата и кисти с западной модернистской формой.
    Этим он отличается от обзора «стиль Наньян»: по Ео Ман Тхонгу, четыре художника этого круга писали очень
    по-разному.
  traits:
    - Китайские форматы горизонтального и вертикального свитка с западным сюжетом и композицией
    - Плоский цвет и тёмный контур, заимствованные у западного модернизма
    - Вытянутые стилизованные фигуры с тяжёлыми веками
    - Сюжеты Юго-Восточной Азии — Бали, деревня, рынок — в тушью и в масле
