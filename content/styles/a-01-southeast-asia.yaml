  scopeNote: >-
    Буддийские памятники Центральной Явы VIII — начала IX века: Боробудур, Мендут, ансамбль Севу и малая
    металлическая пластика, повторяющая триаду Мендута. Индуистский храм Прамбанан (Лоро Джонгранг),
    храмы Восточной Явы и позднее искусство Индонезии в карточку не входят.
  dateNote: >-
    700 и 900 — границы веков, которыми ЮНЕСКО датирует Боробудур (VIII–IX века) и Севу (VIII век); Met
