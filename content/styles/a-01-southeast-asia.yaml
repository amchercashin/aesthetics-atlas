  wiki: { en: Pua kumbu }
  summary: >-
    Церемониальные ткани ибанов Борнео в технике варпового иката: светлый симметричный узор из растений,
    ромбов и фигур проступает на красно-коричневом поле и заполняет почти всё полотно.
  description: >-
    Пуа кумбу ткут ибанские женщины. Рисунок создают до ткачества: участки нитей основы перевязывают и
    окрашивают, а затем ткут на станке с поясным упором. По описанию Met, красно-коричневый тон даёт
    энгкуду — корни и стебли Morinda citrifolia, а тёмный — местное индиго тарум.


    Узор заполняет почти всё полотно: стилизованные растения, узкие ромбы с каймой и побеги наслаиваются
    друг на друга в строго симметричный повтор, вдоль краёв могут идти полосы с вытянутыми человеческими
    фигурами, а концы ткани часто остаются однотонно красными. В индонезийском батике воск наносят на
    готовую ткань, а здесь узор задан в самих нитях, поэтому рисунок привязан к сетке основы и тянется
    вдоль полотна. Значения отдельных мотивов карточка не раскрывает: публичность их толкований у самих
    ткачих не проверена.
  traits:
    - Рисунок заложен в нитях основы — варповый икат на хлопке
    - Светлый узор на красно-коричневом поле с тёмными акцентами индиго
    - Строгая симметрия и многоярусный повтор из растительных побегов, ромбов и фигур
    - Края и концы полотна оформлены иначе, чем центр — полосы с фигурами, однотонные красные концы
