  summary: >-
    Буддийские памятники Центральной Явы VIII–IX веков: ступенчатая ступа Боробудура с галереями
    повествовательных рельефов и ажурными ступами, храмовые триады и ансамбли со стражами у входа.
  description: >-
    Карточка охватывает буддийскую каменную архитектуру и скульптуру Центральной Явы времени династии
    Шайлендра, а не всё искусство Индонезии и не индуистские храмы того же края. Боробудур построен
    ярусами вокруг холма: пирамидальное основание с пятью квадратными террасами, три круглые платформы и
    большая ступа наверху. Стены и балюстрады галерей покрыты низким рельефом общей площадью около 2500
    м², а на круглых платформах стоят 72 ажурные ступы с фигурами Будды.


    В храме Мендут, стоящем на одной оси с Боробудуром, монолитный Будда сидит между двумя бодхисаттвами.
    Ту же триаду в начале IX века повторили в малом серебре. Ансамбль Севу показывает другой вариант
    языка: главный храм поднимается над малыми святилищами, а вход охраняют парные фигуры стражей. Если
    кхмерский храм-гора строится из башен, галерей и оград, то Боробудур — ступенчатая ступа без башен,
    где путь вверх ведёт мимо непрерывных рельефных лент к открытым круглым платформам.
  traits:
    - Ступенчатый силуэт — квадратные террасы переходят в круглые платформы и центральную ступу
    - Галереи с непрерывными лентами низкого рельефа, где фигуры стоят плотными рядами
    - Ряды колоколообразных ажурных ступ со скрытыми внутри фигурами Будды
    - Фронтальная триада — Будда между двумя бодхисаттвами — как центр святилища
