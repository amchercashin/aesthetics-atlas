  summary: >-
    Резервная роспись горячим воском по хлопку и шёлку: от сдержанных придворных узоров Центральной Явы до
    многоцветных тканей северного побережья, где смешались яванские, европейские и китайские мотивы.
  description: >-
    Мастер наносит на ткань точки и линии горячего воска. Воск не пропускает краситель: ткань окрашивают в
    один цвет, воск снимают кипятком и повторяют работу для каждого следующего цвета. По описанию ЮНЕСКО,
    батик сопровождает жизнь от рождения до похорон, а узоры вобрали мотивы многих культур — от арабской
    каллиграфии и европейских букетов до китайских фениксов.


    Под одним словом живут разные визуальные языки. Батик Центральной Явы, связанный с дворами Джокьякарты
    и Суракарты, отличают упорядоченные композиции и сдержанные цвета; основные типы узоров — растительный
    семен и геометрический чеплок, а в XVIII веке часть узоров разрешалось носить только знати. Центры
    северного побережья, например Пекалонган, с конца XIX века соединяли яванские, европейские и китайские
    мотивы. В годы японской оккупации появился батик хококай, продолживший это смешение, — почти без
    однотонного фона. Обзор помогает найти эти линии; общего набора признаков для всего батика он не утверждает.
  traits:
    - Рисунок воском — точки и линии остаются светлыми контурами на окрашенном поле
    - Многослойная окраска — каждый цвет требует нового погружения и снятия воска
    - Узор покрывает всё полотно — мелким повтором или крупными свободными композициями
    - Поле задаёт форма вещи — длинная набедренная ткань, саронг, плечевой шарф, головной платок
  scopeNote: >-
    Обзор техники и её главных линий: придворный батик Джокьякарты и Суракарты, батик северного побережья
    (Пекалонган) и батик хококай военных лет. Локальные традиции других островов и современный дизайн с
    узорами батика требуют отдельных карточек. Год включения в список ЮНЕСКО (2009) — не начало практики.
  dateNote: >-
    1700 — век, к которому этикетка Met относит запреты на часть узоров при дворах Центральной Явы. Это
    нижняя граница, которую называют источники карточки, а не начало батика: само начало они не датируют.
    Практика живая, поэтому конец не указан.
