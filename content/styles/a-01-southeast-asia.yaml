    note: >-
      13.11.2026: связи — одно сопоставление с кхмерским храмовым искусством, происхождение не
      утверждается. Даты — ЮНЕСКО (Боробудур VIII–IX века, Севу VIII век) и запись Met (Мендут около 800
      года, триада — начало IX века). Описание — 8 утверждений по ЮНЕСКО и Met. Корпус — четыре
      самостоятельные работы. Главная иллюстрация и галерея — сцены и места по страницам файлов Commons,
      датировка по ЮНЕСКО. Открыто: точных лет строительства Боробудура и Севу источники не называют;
      Commons называет центрального Будду Мендута Вайрочаной, ЮНЕСКО и Met — просто Буддой, поэтому имя в
      карточке не указано.
