    - { claim: "Составная поза: лицо, талия и конечности в профиль, глаз и плечи анфас; регистры; иерархия масштаба — цари и боги крупнее знати и намного крупнее простых людей", field: traits, source: smarthistory-ancient-egyptian-art }
