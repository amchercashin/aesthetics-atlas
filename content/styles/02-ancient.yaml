- id: mesopotamian-art
  name: Искусство Месопотамии
  orig: Art of Mesopotamia
  aliases: [шумеры, Вавилон, Ассирия, ворота Иштар, ламассу]
  start: -3500
  end: -539
  dates: ок. 3500 – 539 до н. э.
  era: ancient
  domain: [art, architecture]
  region: Междуречье (Ирак, Сирия)
  tier: 2
  kind: overview
  parents:
    - { id: neolithic-art, type: evolved }
  summary: >
    Зиккураты, крылатые быки-хранители и сияющие синие изразцы Вавилона: искусство первых городов.
  description: |
    Шумеры, аккадцы, ассирийцы и вавилоняне за три тысячи лет создали зиккураты, цилиндрические печати,
    рельефы царских охот и гигантских ламассу у ворот дворцов. Вершина — ворота Иштар Навуходоносора:
    львы, быки и драконы-мушхуш из глазурованного кирпича на ультрамариново-синем фоне.
  traits:
    - Глазурованный кирпич, насыщенный синий фон
    - Шествия животных-символов в профиль
    - Монументальные крылатые хранители
    - Рельефы-летописи царских побед и охот
  names: [Зиккурат в Уре, Штандарт из Ура, ворота Иштар, рельефы Ниневии]
  example:
    file: Berlín, Museo de Pérgamo 05.jpg
    title: Ворота Иштар
    year: ок. 575 до н. э.
    place: Пергамский музей, Берлин
  wiki: { en: Art of Mesopotamia, ru: Древняя Месопотамия }
  links:
    - { title: "Ishtar Gate", url: "https://www.worldhistory.org/Ishtar_Gate/", src: "World History Encyclopedia", lang: en }

- id: ancient-egypt
  name: Древнеегипетское искусство
  orig: Ancient Egyptian art
  aliases: [Древний Египет, египетский канон, фараоны, пирамиды]
  start: -3100
  end: -30
  dates: ок. 3100 – 30 до н. э.
  era: ancient
  domain: [art, architecture]
  region: Египет
  tier: 1
  kind: overview
  parents:
    - { id: neolithic-art, type: evolved }
  summary: >
    Три тысячелетия строгого канона: фигуры в «составной» позе, иерархия размеров, иероглифы
    и пирамиды, рассчитанные на вечность.
  description: |
    Египетское искусство создавалось не для зрителя, а для вечности: изображение должно было
    «работать» в загробном мире. Отсюда канон — голова и ноги в профиль, плечи и глаз анфас,
    фараон крупнее подданных — и удивительная неизменность стиля на протяжении тысячелетий.

    Самый известный сбой случился при Эхнатоне: в амарнский период фигуры стали мягкими
    и почти портретными. Бюст Нефертити из мастерской Тутмоса — самое известное лицо той эпохи.
  traits:
    - Составная поза — профиль и анфас одновременно
    - Иерархия масштаба по статусу
    - Регистры-полосы и иероглифы как часть композиции
    - Плоский локальный цвет без светотени
    - Монументальность и симметрия
  names: [Имхотеп, Тутмос, Нефертити, Тутанхамон]
  example:
    file: Nofretete Neues Museum.jpg
    title: Бюст Нефертити
    author: Мастерская скульптора Тутмоса
    year: ок. 1345 до н. э.
    place: Новый музей, Берлин
  wiki: Art of ancient Egypt
  links:
    - { title: "Ancient Egyptian Art", url: "https://www.worldhistory.org/Egyptian_Art/", src: "World History Encyclopedia", lang: en }

- id: minoan-art
  name: Минойское искусство
  orig: Minoan art
  aliases: [Крит, Кносс, минойская фреска, эгейское искусство]
  start: -2000
  end: -1450
  dates: ок. 2000 – 1450 до н. э.
  era: ancient
  domain: [art]
  region: Крит
  tier: 3
  kind: tradition
  parents:
    - { id: neolithic-art, type: evolved }
    - { id: ancient-egypt, type: influence }
  summary: >
    Жизнерадостные фрески Кносского дворца: дельфины, лилии, акробаты, прыгающие через быков.
  description: |
    Минойцы Крита строили дворцы-лабиринты без крепостных стен и расписывали их по сырой штукатурке.
    В отличие от торжественного Египта, их искусство полно движения: волнистые линии, морские животные,
    гибкие фигуры в прыжке. Позднее эти мотивы унаследовали микенцы, а через них — Греция.
  traits:
    - Динамичные, изогнутые линии
    - Морские мотивы — дельфины, осьминоги, волны
    - Фреска по сырой штукатурке, яркие цвета
    - Природа и ритуальные игры вместо войны
  names: [Кносский дворец, Акротири (Тира), Артур Эванс]
  example:
    file: Knossos bull leaping fresco.jpg
    title: Фреска с прыжком через быка
    year: ок. 1450 до н. э.
    place: Археологический музей Ираклиона
  gallery:
    - { file: "Heraklion — Dolphin fresco.jpg", title: "Фреска с дельфинами, Кносс", year: "ок. 1500 до н. э." }
  wiki: Minoan art
  links:
    - { title: "Minoan Civilization", url: "https://www.worldhistory.org/Minoan_Civilization/", src: "World History Encyclopedia", lang: en }

- id: ancient-chinese-art
  name: Искусство Древнего Китая
  orig: Ancient Chinese art
  aliases: [бронза Шан, Терракотовая армия, Цинь, Хань, нефрит]
  start: -1600
  end: 220
  dates: ок. 1600 до н. э. – 220 н. э.
  era: ancient
  domain: [art]
  region: Китай
  tier: 2
  kind: overview
  parents:
    - { id: neolithic-art, type: evolved }
  summary: >
    Ритуальные бронзовые сосуды с масками тао-те, нефрит и восемь тысяч глиняных воинов первого императора.
  description: |
    При династии Шан мастера отливали сложнейшие бронзовые сосуды для жертвоприношений, покрытые
    маской чудовища тао-те. Цинь Шихуанди в III веке до н. э. окружил свою гробницу армией терракотовых
    воинов в натуральную величину, и у каждого — своё лицо. При Хань формируются каллиграфия,
    шёлковая живопись и каноны, на которых будет стоять всё китайское искусство.
  traits:
    - Ритуальная бронза с маской тао-те
    - Симметричный, плотный орнамент
    - Нефрит как самый ценный материал
    - Серийность при индивидуальных лицах (Терракотовая армия)
  names: [Цинь Шихуанди, бронзы Шан, Мавандуй, нефритовые погребальные костюмы]
  example:
    file: 51714-Terracota-Army.jpg
    title: Терракотовая армия
    year: ок. 210 до н. э.
    place: Сиань, Китай
  wiki: Terracotta Army
  links:
    - { title: "Terracotta Army", url: "https://www.worldhistory.org/Terracotta_Army/", src: "World History Encyclopedia", lang: en }

- id: achaemenid-art
  name: Искусство Ахеменидской Персии
  orig: Achaemenid art
  aliases: [Персеполь, древнеперсидское искусство, Ахемениды]
  start: -550
  end: -330
  dates: 550 – 330 до н. э.
  era: ancient
  domain: [art, architecture]
  region: Иран
  tier: 3
  kind: period
  parents:
    - { id: mesopotamian-art, type: evolved }
    - { id: ancient-egypt, type: influence }
  summary: >
    Имперский стиль Персеполя: залы на сотнях колонн и бесконечные рельефные процессии данников.
  description: |
    Цари Дарий и Ксеркс собрали мастеров со всей огромной империи, и стиль Персеполя впитал месопотамские
    рельефы, египетские колонны и греческую резьбу. Главный образ — бесконечные процессии представителей
    народов, несущих дары, вырезанные с ровным, спокойным ритмом. Это искусство порядка и власти.
  traits:
    - Многоколонные залы — ападаны
    - Ритмичные рельефные процессии
    - Капители с быками и грифонами
    - Сочетание месопотамских, египетских и греческих приёмов
  names: [Дарий I, Ксеркс, Персеполь, Пасаргады]
  example:
