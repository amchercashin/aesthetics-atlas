  summary: >
    От печатей Хараппы до полированных колонн царя Ашоки и ворот ступы в Санчи.
  description: |
    Города долины Инда оставили печати со зверями и знаменитую бронзовую «Танцовщицу». Через две тысячи
    лет царь Ашока поставил по стране колонны с зеркально отполированными львиными капителями — сегодня
    это герб Индии. Резные ворота ступы в Санчи рассказывают буддийские истории и полны жизни:
    слоны, деревья, полубогини-якшини.
  traits:
    - Зеркальная полировка камня (эпоха Маурья)
    - Животные-символы — львы, слоны, быки
    - Плотные повествовательные рельефы
    - Пышные, чувственные фигуры якшини
  names: [Мохенджо-Даро, Ашока, ступа в Санчи, Бхархут]
