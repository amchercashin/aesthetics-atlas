  summary: >
    Зиккураты, крылатые хранители ассирийских дворцов и синий глазурованный кирпич Вавилона: три тысячи лет
    искусства городов Междуречья.
  description: |
    В Уруке около 3200 года до н. э. появляются крупная круглая скульптура и рельеф. Шумеры резали
    цилиндрические печати и возводили зиккураты — ступенчатые башни над храмовыми оградами Ура, Эриду и Урука.
