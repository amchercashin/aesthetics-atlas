      sources: [bm-hunefer-3, smarthistory-ancient-egyptian-art]
  summary: >
    Три тысячелетия канона: фигуры в «составной» позе, иерархия масштаба, регистры с иероглифами и пирамиды Гизы.
  description: |
    Большая часть египетских статуй и рельефов не предназначалась для зрителя: они должны были служить божеству
    или умершему. На плоскости каждая часть фигуры показана с самой узнаваемой стороны: лицо, талия и ноги
    в профиль, плечи и глаз анфас. Сцены идут рядами-регистрами, а размер передаёт значение: царь крупнее знати
    и намного крупнее простых людей. Этот язык сохранялся почти три тысячи лет, хотя сама культура не застыла.

    Резкий перелом — правление Эхнатона около 1350 года до н. э.: вместе с религиозной реформой меняется и
    изображение тела, прямолинейные формы сменяются мягкими и округлыми. Бюст Нефертити найден в мастерской
    скульптора Тутмоса в Амарне.
  traits:
    - Составная поза — профиль и анфас одновременно
    - Иерархия масштаба по статусу
    - Регистры-полосы и иероглифы как часть композиции
    - Плоский локальный цвет без светотени
    - Фронтальность и симметрия статуй
  promptCues:
