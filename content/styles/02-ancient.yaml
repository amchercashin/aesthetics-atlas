    с человеческими головами — стражей от злых сил.

    Навуходоносор II перестроил Вавилон и облицевал глазурованным кирпичом ворота Иштар: на них рядами идут быки
    и драконы, а вдоль стен Дороги процессий шагали львы.
  traits:
    - Глазурованный кирпич на синем фоне (ворота Иштар)
    - Шествия животных-символов в профиль
    - Монументальные крылатые хранители
    - Рельефы царских охот и войн
