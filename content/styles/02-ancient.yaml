- id: minoan-art
  name: Минойское искусство
  orig: Minoan art
  aliases: [искусство минойского Крита]
  searchKeywords: [Крит, Кносс, минойская фреска, эгейское искусство, морской стиль, Акротири]
  start: -1900
  end: -1400
  dates: ок. 1900 – 1400 до н. э.
  dateKind: period
  approx: true
  dateNote: >
    Начало — около 1900 до н. э., когда на Крите появляются дворцы. Конец условен: после разрушений около
    1450 до н. э. усиливается микенское влияние, а самая поздняя датированная работа карточки — фреска с прыжком
    через быка (1450–1400 до н. э.). Минойская культура в целом продолжается до XI века до н. э.
  era: ancient
  domain: [art]
  medium: [painting, ceramics, sculpture]
  subjects: [animals, figure, any]
  region: Крит
  tier: 3
  kind: tradition
  contexts:
    - id: neolithic-art
      type: related-context
      status: verified
      note: >-
        Cameron прослеживает местную критскую техническую предысторию минойской стенописи через штукатурные
        покрытия; сообщение Tomkins документирует более раннюю историю двора Кносса. Это технический и
        пространственный контекст, а не происхождение всей минойской образности от общего неолитического
        искусства. Cameron различает технический материал и позднее декоративное искусство и отмечает пробел в
        находках.
      sources:
        - ra26-d4-cameron-v1
        - ra26-d4-knossos-report
  review:
    status: reviewed
    date: "2026-11-08"
    scope: [relations, dates, text, images, gallery]
    note: >-
      Связи — 16.10.2026, границы у каждой записи; сдвиг дат им не противоречит. 08.11.2026: даты — по очерку
      Метмузея и записи Археологического музея Ираклиона: начало −2000 → −1900, конец −1450 → −1400, потому что
      главная работа датирована музеем 1450–1400 до н. э. Описание — 7 утверждений сверено; снято «по сырой
      штукатурке» (техника не сверялась), «вместо войны», «через них — Греция»; Акротири перенесён в поисковые
      слова. Главная иллюстрация и галерея — 3 изображения, подписи по записям музея Ираклиона, о реставрации
      сказано в примечаниях. Атрибуция «Принца лилий» оспаривается — это указано в подписи.
  parents:
    - id: ancient-egypt
      type: influence
      status: verified
      note: >-
        Египетское влияние документировано на конкретном мотиве: образ Таурт переработан в минойского гения. Не
        распространять этот пример на весь минойский стиль.
      sources:
        - ra26-taweret
  summary: >
    Фрески дворца Кносса — дельфины, лилии, прыжки через быка — и сосуды морского стиля с осьминогами.
  description: |
    Минойцы Крита строили дворцы вокруг мощёного двора и, как правило, без оборонительных стен; стены и полы
    расписывали сценами обрядов и природы. Излюбленный сюжет — прыжки через быка: состязание, ставшее
    изобразительным знаком власти Кносса. На сосудах морского стиля щупальца осьминога обвивают всю поверхность.
    После разрушений около 1450 года до н. э. на Крите усиливается влияние материковых микенцев, и в керамике
    смешиваются минойские и микенские черты.
  traits:
    - Динамичные, изогнутые линии
    - Морские мотивы — дельфины, осьминоги, морское дно
    - Стенная роспись по штукатурке, яркие цвета
    - Обряды, природа и состязания с быками
  names: [Кносский дворец, Палекастро, Артур Эванс]
  evidence:
    - { claim: "Около 1900 до н. э. на Крите появляются дворцы; с 1500 до н. э. растёт микенское влияние, около 1450 до н. э. — широкие разрушения, в керамике смешиваются минойские и микенские черты; к началу XI века до н. э. культура приходит в упадок", field: dates, source: met-minoan-crete }
    - { claim: "Фреска с прыжком через быка — 1450–1400 до н. э.; сюжет — один из самых популярных в росписях Кносса и изобразительный знак власти Кносса", field: dates, source: heraklion-bull-leaping }
    - { claim: "Дворцы устроены вокруг мощёного центрального двора, оборонительных стен, как правило, нет; стены и полы расписывали, фрески изображали обряды и природу", field: description, source: met-minoan-crete }
    - { claim: "Фляга морского стиля из Палекастро: щупальца осьминога покрывают всю поверхность, между ними морское дно", field: traits, source: heraklion-octopus-flask }
