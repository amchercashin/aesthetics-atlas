  domain: [art, architecture]
  medium: [textile, ceramics, metalwork, architecture]
  subjects: [animals, ornament, any]
  region: Перу, Боливия, Чили, северо-запад Аргентины; империя инков — и Эквадор
  tier: 2
  kind: overview
  scopeNote: >
    Обзорная карточка для очень разных культур Анд за две с половиной тысячи лет — от Чавина до инков.
    Более ранние монументальные комплексы (например, культура Котош, 2200–900 до н. э.) сюда не входят.
    До разделения эти традиции были частью общей карточки с Мезоамерикой.
  root: true
  parents: []
  summary: >
    Ткани, керамика, золото и камень цивилизаций Анд — от Чавина до инков.
  description: |
    В первой половине I тыс. до н. э. образы, связанные с храмом Чавин-де-Уантар в горах Перу,
    распространяются по побережью и нагорью — на керамике, тканях, золоте и камне. Историки видят в этом
    первые признаки общей религии у прежде не связанных культур.

    Дальше традиция ветвится. Ткачи Паракаса на южном побережье покрывают большие погребальные мантии
    повторяющимися фигурами существ, а на плато Наска прочерчивают гигантские геоглифы. Мастера мочика на
    северном побережье делают сосуды-головы, которые кажутся портретами настоящих людей. Империя инков вводит
    строгие геометрические ткани: тонкие гобеленовые туники были привилегией знати, и государство раздавало
    их как дар верным союзникам.
  traits:
    - Ткань как знак статуса — гобеленовые туники инков
    - Повторяющийся модуль, у инков — строгая клетка
    - Сосуды-головы с индивидуальными чертами
    - Фантастические существа и животные в орнаменте
