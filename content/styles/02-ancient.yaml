    - { claim: "Керамика мочика — сосуды в форме голов, похожие на портреты реальных людей", field: description, source: walters-moche-vessel }
    - { claim: "Мачу-Пикчу — создание империи инков в её расцвет; стены, террасы и пандусы", field: description, source: unesco-machu-picchu }
  review:
    status: reviewed
    date: "2026-11-08"
    scope: [relations, dates, text, images, gallery]
    note: >-
      Связи — 08.11.2026: родителей нет, root: true оставлен: при сверке источника, документирующего связь с
      другой карточкой атласа, не найдено. Даты — по Метмузею и Британнике (конец — 1532 год вместо безымянных
      1530-х). Описание — 7 утверждений сверено; снята превосходная степень «главное искусство» и «главный
      носитель статуса» (Кливленд подтверждает ткань как знак статуса, но не как главное искусство);
      «лепят портретные сосуды» исправлено (Уолтерс: сосуды-головы, похожие на портреты; лепка не сверена);
      Тиуанаку снято с имён — источника не открыто. Главная иллюстрация — подпись по записи Кливлендского музея
      (перечитана через его API). Галерея — 4 изображения, подписи по записям Уолтерса и Бруклинского музея и ЮНЕСКО;
