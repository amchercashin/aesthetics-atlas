- id: andean-art
  name: Искусство Анд
  orig: Andean art
  aliases: [искусство Анд, андские цивилизации, Andean art]
  searchKeywords: [доколумбово искусство, Чавин, Паракас, Наска, мочика, Тиуанаку, инки, Перу]
  start: -1000
  end: 1532
  dates: ок. 1000 до н. э. – 1530-е
  dateKind: period
  approx: true
  dateNote: >
    Начало — распространение образов, связанных с Чавин-де-Уантаром (по Met — 1000–500 до н. э.);
    монументальные комплексы Анд ещё старше. Конец условен — испанское завоевание империи инков в 1530-х.
  era: ancient
  domain: [art, architecture]
  medium: [textile, ceramics, metalwork, architecture]
  subjects: [animals, ornament, any]
  region: Перу, Боливия, Эквадор, север Чили
  tier: 2
  kind: overview
  scopeNote: >
    Обзорная карточка для очень разных культур Анд за две с половиной тысячи лет — от Чавина до инков.
    Более ранние монументальные комплексы (например, культура Котош, 2200–900 до н. э.) сюда не входят.
    До разделения эти традиции были частью общей карточки с Мезоамерикой.
  root: true
  parents: []
  summary: >
    Ткани, керамика, золото и камень цивилизаций Анд — от Чавина до инков. Главный носитель статуса
    здесь — ткань.
  description: |
    В первой половине I тыс. до н. э. образы, связанные с храмом Чавин-де-Уантар в горах Перу,
    распространяются по побережью и нагорью — на керамике, тканях, золоте и камне. Историки видят в этом
    первые признаки общей религии у прежде не связанных культур.

    Дальше традиция ветвится. Ткачи Паракаса на южном побережье покрывают огромные погребальные мантии
    повторяющимися фигурами птиц и существ. Мастера мочика на северном побережье лепят портретные сосуды
    с узнаваемыми лицами. Империя инков в XV–XVI веках вводит строгие геометрические ткани: тонкие
    гобеленовые туники были привилегией знати, и государство раздавало их как дар верным союзникам.
  traits:
    - Ткань как главное искусство — гобелен, вышивка, перья
    - Повторяющийся модуль, у инков — строгая клетка
    - Портретная и фигурная керамика
    - Фантастические существа и животные в орнаменте
