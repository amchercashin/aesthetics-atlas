    - { claim: "Около 1350 до н. э. Эхнатон меняет религию и стиль: прямолинейные формы сменяются криволинейными, появляется мягкость", field: description, source: smarthistory-amarna-house-altar }
    - { claim: "Бюст Нефертити найден в мастерской скульптора Тутмоса в ходе раскопок Борхардта", field: description, source: smarthistory-nefertiti }
