- id: scythian-animal-style
  name: Скифский звериный стиль
  orig: Scythian animal style
  aliases: [звериный стиль, скифское золото, искусство кочевников, Аржан]
  start: -700
  end: -200
  dates: ок. 700 – 200 до н. э.
  era: ancient
  domain: [art, design]
  region: Евразийская степь — от Дуная до Алтая
  tier: 3
  kind: tradition
  parents:
    - { id: neolithic-art, type: evolved }
    - { id: mesopotamian-art, type: influence }
  summary: >
    Золотые олени, пантеры и грифоны кочевников степи, свёрнутые в кольцо и сплетённые в схватке.
  description: |
    Кочевники Великой степи носили искусство с собой: на поясах, конской сбруе, оружии. Звериный стиль
    превращает оленя, хищника или грифона в упругий знак — тело скручено, ноги поджаты, рога становятся
    орнаментом. Мастера соединяли его с греческой и персидской техникой, а позднее он повлиял на
    германское и средневековое «звериное» искусство.
  traits:
    - Животные в динамичных, скрученных позах
    - Схватки хищников и травоядных
    - Золото и бронза, мелкая пластика
    - Тело зверя превращается в орнамент
  names: [курган Аржан, Куль-Оба, Солоха, Пазырыкские курганы]
  example:
    file: Arzhan deer.jpg
    title: Олень из кургана Аржан
    year: VII век до н. э.
    place: Тува, Россия
  wiki: Animal style
  links:
    - { title: "Scythian Art", url: "https://www.worldhistory.org/Scythian_Art/", src: "World History Encyclopedia", lang: en }

- id: mesoamerican-art
  name: Искусство Мезоамерики
  orig: Mesoamerican art
  aliases: [искусство Мезоамерики, доколумбово искусство Мезоамерики]
  searchKeywords: [доколумбово искусство, ольмеки, майя, ацтеки, Теотиуакан, Камень Солнца]
  start: -1200
  end: 1521
  dates: ок. 1200 до н. э. – 1521 н. э.
  approx: true
  era: ancient
  domain: [art, architecture]
  medium: [sculpture, architecture]
  region: Мексика и Центральная Америка
  tier: 2
  kind: overview
  scopeNote: >
    Обзорная карточка: ольмеки, Теотиуакан, майя и ацтеки — самостоятельные традиции, собранные здесь
    вместе. Раньше карточка объединяла и Анды; теперь искусство Анд — отдельная карточка, а этот адрес
    сохранён за Мезоамерикой.
  root: true
  parents: []
  summary: >
    Независимая от Старого Света традиция: колоссальные головы ольмеков, пирамиды майя
    и Камень Солнца ацтеков.
  description: |
    Почти три тысячи лет цивилизации Мезоамерики развивались без связи с Евразией и пришли к собственным
    формам: ступенчатые пирамиды Теотиуакана и майя, плотные рельефы с глифами, монументальная скульптура.
    Камень Солнца ацтеков соединяет календарь, космологию и скульптуру в один гипнотический круг.
    Позднее эти образы возродят мексиканские муралисты XX века.
  traits:
    - Плотный орнамент, заполняющий всю поверхность
    - Глифы и календарные знаки
    - Ступенчатые пирамиды и храмы на платформах
    - Маски, божества, пернатый змей
  names: [ольмеки, Теотиуакан, майя, ацтеки]
  example:
    file: Monolito de la Piedra del Sol.jpg
    title: Камень Солнца (ацтекский календарь)
    year: ок. 1502–1521
    place: Национальный музей антропологии, Мехико
  wiki: Pre-Columbian art
  links:
    - { title: "Aztec Sun Stone", url: "https://www.worldhistory.org/Aztec_Sun_Stone/", src: "World History Encyclopedia", lang: en }

- id: andean-art
  name: Искусство Анд
  orig: Andean art
  aliases: [искусство Анд, андские цивилизации, Andean art]
  searchKeywords: [доколумбово искусство, Чавин, Паракас, Наска, мочика, Тиуанаку, инки, Перу]
  start: -1000
  end: 1532
  dates: ок. 1000 до н. э. – 1530-е
  dateKind: period
  approx: true
  dateNote: >
    Начало — распространение образов, связанных с Чавин-де-Уантаром (по Met — 1000–500 до н. э.);
    монументальные комплексы Анд ещё старше. Конец условен — испанское завоевание империи инков в 1530-х.
  era: ancient
  domain: [art, architecture]
  medium: [textile, ceramics, metalwork, architecture]
  region: Перу, Боливия, Эквадор, север Чили
  tier: 2
  kind: overview
  scopeNote: >
    Обзорная карточка для очень разных культур Анд за две с половиной тысячи лет — от Чавина до инков.
    Более ранние монументальные комплексы (например, культура Котош, 2200–900 до н. э.) сюда не входят.
    До разделения эти традиции были частью общей карточки с Мезоамерикой.
  root: true
  parents: []
  summary: >
    Ткани, керамика, золото и камень цивилизаций Анд — от Чавина до инков. Главный носитель статуса
    здесь — ткань.
  description: |
    В первой половине I тыс. до н. э. образы, связанные с храмом Чавин-де-Уантар в горах Перу,
    распространяются по побережью и нагорью — на керамике, тканях, золоте и камне. Историки видят в этом
    первые признаки общей религии у прежде не связанных культур.

    Дальше традиция ветвится. Ткачи Паракаса на южном побережье покрывают огромные погребальные мантии
    повторяющимися фигурами птиц и существ. Мастера мочика на северном побережье лепят портретные сосуды
    с узнаваемыми лицами. Империя инков в XV–XVI веках вводит строгие геометрические ткани: тонкие
    гобеленовые туники были привилегией знати, и государство раздавало их как дар верным союзникам.
  traits:
    - Ткань как главное искусство — гобелен, вышивка, перья
    - Повторяющийся модуль, у инков — строгая клетка
    - Портретная и фигурная керамика
    - Фантастические существа и животные в орнаменте
  names: [Чавин-де-Уантар, Паракас, Наска, мочика, Тиуанаку, инки]
  evidence:
    - { claim: "Культуры Чавин — 1000–500 до н. э.; связанные образы распространяются на керамике, тканях, золоте и камне; культура Котош — 2200–900 до н. э.", field: dates, source: met-andes-1000bc }
    - { claim: "Гобеленовые туники — привилегия знати империи инков и государственный дар; узор «инкский ключ», ок. 1400–1540", field: example, source: cleveland-inca-tunic }
  review: { status: partial, date: 2026-10-13, note: "Новая карточка: сверены даты начала, главная работа и подписи галереи по музейным данным. Конец периода и состав культур — по общим сведениям." }
  example:
    file: Peru, Inca, 15th-16th century - Tunic - 1957.136 - Cleveland Museum of Art.tif
    title: Туника с узором «инкский ключ»
    author: ткачи империи инков
    year: ок. 1400–1540
    place: Кливлендский музей искусства
    whyRepresentative: Шахматная сетка одного модуля и цветные полосы — стандартизированный рисунок государственной ткани инков.
  gallery:
    - { file: "Moche - Portrait Vessel - Walters 482827.jpg", title: "Портретный сосуд мочика", year: "50–800 н. э.", whyRepresentative: "Индивидуальные черты лица в керамике северного побережья" }
    - { file: "Paracas mantle, BM.jpg", title: "Погребальная мантия, Паракас — Наска", year: "0–100 н. э." }
  wiki: Andean civilizations
  links:
    - { title: "Central and Southern Andes, 1000 B.C.–1 A.D.", url: "https://www.metmuseum.org/toah/ht/04/sac", src: "The Met, Heilbrunn Timeline", lang: en }
    - { title: "Tunic (1957.136)", url: "https://clevelandart.org/art/1957.136", src: "Cleveland Museum of Art", lang: en }

- id: ancient-indian-art
  name: Искусство Древней Индии
  orig: Ancient Indian art
  aliases: [Хараппа, Маурья, львиная капитель Ашоки, Санчи]
  start: -2600
  end: 320
  dates: ок. 2600 до н. э. – 320 н. э.
  era: ancient
  domain: [art, architecture]
  region: Индия, Пакистан
  tier: 3
  kind: overview
  parents:
    - { id: neolithic-art, type: evolved }
  summary: >
    От печатей Хараппы до полированных колонн царя Ашоки и ворот ступы в Санчи.
  description: |
    Города долины Инда оставили печати со зверями и знаменитую бронзовую «Танцовщицу». Через две тысячи
    лет царь Ашока поставил по стране колонны с зеркально отполированными львиными капителями — сегодня
    это герб Индии. Резные ворота ступы в Санчи рассказывают буддийские истории и полны жизни:
    слоны, деревья, полубогини-якшини.
  traits:
    - Зеркальная полировка камня (эпоха Маурья)
    - Животные-символы — львы, слоны, быки
    - Плотные повествовательные рельефы
    - Пышные, чувственные фигуры якшини
  names: [Мохенджо-Даро, Ашока, ступа в Санчи, Бхархут]
  example:
    file: Sarnath capital.jpg
    title: Львиная капитель Ашоки
    year: ок. 250 до н. э.
    place: Музей Сарнатха, Индия
  wiki: { en: Mauryan art, ru: Искусство Индии }
  links:
    - { title: "Lion Capital of Ashoka", url: "https://www.worldhistory.org/image/14146/lion-capital-of-ashoka/", src: "World History Encyclopedia", lang: en }
