- id: bauhaus
  name: Баухаус
  orig: Bauhaus
  aliases: [Bauhaus, баухауз, школа Баухаус]
  start: 1919
  end: 1933
  dates: 1919 – 1933
  era: avant-garde
  domain: [design, architecture]
  region: Германия
  tier: 1
  kind: school
  parents:
    - { id: arts-and-crafts, type: evolved }
    - { id: de-stijl, type: influence }
    - { id: constructivism, type: influence }
  summary: >
    Школа, которая соединила искусство и промышленность: функция, геометрия, основные цвета
    и шрифт без засечек.
  description: |
    Вальтер Гропиус основал Баухаус в Веймаре, чтобы обучать художников и ремесленников вместе.
    Здесь преподавали Кандинский, Клее, Мохой-Надь; здесь придумали стальной стул, современную
    вёрстку и мебель для массового производства. Нацисты закрыли школу в 1933-м, но эмигрировавшие
    мастера разнесли её идеи по всему миру.
  traits:
    - Форма следует функции
    - Геометрия — круг, квадрат, треугольник
    - Основные цвета плюс чёрный и белый
    - Шрифты без засечек, асимметричная вёрстка
    - Сталь, стекло, промышленные материалы
  names: [Вальтер Гропиус, Людвиг Мис ван дер Роэ, Марсель Брейер, Василий Кандинский, Ласло Мохой-Надь]
