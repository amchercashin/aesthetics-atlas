- id: cubism
  name: Кубизм
  orig: Cubism
  aliases: [кубисты, Пикассо, Брак, аналитический кубизм, синтетический кубизм]
  start: 1907
  end: 1925
  dates: 1907 – 1925
  era: avant-garde
  domain: [art]
  region: Франция
  tier: 1
  kind: movement
  parents:
    - { id: post-impressionism, type: evolved }
  summary: >
    Предмет, разобранный на грани и показанный сразу с нескольких сторон: конец перспективы, придуманной Возрождением.
  description: |
    Вслед за Сезанном и под впечатлением от африканской скульптуры Пикассо пишет «Авиньонских девиц» —
    угловатые фигуры с масками вместо лиц. Вместе с Браком он разбирает гитары, бутылки и портреты на
    кристаллические плоскости, а затем начинает вклеивать в картины газеты и обои — так рождается коллаж.
    Кубизм стал общим языком почти всего авангарда.
  traits:
    - Предмет с нескольких точек зрения одновременно
    - Геометрические грани и плоскости
    - Сдержанная охристо-серая палитра (аналитический период)
    - Коллаж, буквы, газетные вырезки
  names: [Пабло Пикассо, Жорж Брак, Хуан Грис, Фернан Леже]
  example:
    file: "enwiki:Les Demoiselles d'Avignon.jpg"
    title: Авиньонские девицы
    author: Пабло Пикассо
    year: 1907
    place: Музей современного искусства (MoMA), Нью-Йорк
  wiki: Cubism
  links:
    - { title: "Cubism", url: "https://www.theartstory.org/movement/cubism/", src: "The Art Story", lang: en }
    - { title: "Cubism", url: "https://www.guggenheim.org/artwork/movement/cubism", src: "Guggenheim", lang: en }

- id: futurism
  name: Футуризм
  orig: Futurism
  aliases: [итальянский футуризм, Маринетти, Боччони, динамизм]
  start: 1909
  end: 1944
  dates: 1909 – 1944
  era: avant-garde
  domain: [art, design]
  region: Италия, Россия
  tier: 1
  kind: movement
  parents:
    - { id: cubism, type: influence }
    - { id: neo-impressionism, type: influence }
  summary: >
    Скорость, машины и город: «рычащий автомобиль прекраснее Ники Самофракийской».
  description: |
    Поэт Маринетти в 1909 году опубликовал манифест, призывающий сжечь музеи и воспеть скорость, электричество
    и войну. Художники Боччони, Балла и Северини пытались показать движение на холсте: повторяющиеся
    контуры, силовые линии, вихри цвета. В «Городе встаёт» Боччони кони и люди сливаются в стройку будущего.
  traits:
    - Изображение движения и скорости
    - Силовые линии и повторяющиеся контуры
    - Машины, поезда, город, толпа
    - Агрессивные манифесты и типографика
  names: [Филиппо Томмазо Маринетти, Умберто Боччони, Джакомо Балла, Джино Северини]
  example:
    file: The City Rises by Umberto Boccioni 1910.jpg
    title: Город встаёт
    author: Умберто Боччони
    year: 1910
    place: Музей современного искусства (MoMA), Нью-Йорк
  wiki: Futurism
  links:
    - { title: "Futurism", url: "https://www.theartstory.org/movement/futurism/", src: "The Art Story", lang: en }

- id: cubo-futurism
  name: Кубофутуризм
  orig: Cubo-Futurism
  aliases: [русский авангард, будетляне, Малевич, Гончарова]
  start: 1912
  end: 1915
  dates: 1912 – 1915
  era: avant-garde
  domain: [art]
  region: Россия
  tier: 2
  kind: movement
  parents:
    - { id: cubism, type: evolved }
    - { id: futurism, type: evolved }
  summary: >
    Русский сплав кубизма и футуризма: металлические грани, мелькание движения и заумная поэзия будетлян.
  description: |
    Русские художники соединили кубистическое дробление формы с футуристическим движением. «Точильщик»
    Малевича состоит из блестящих металлических граней, повторяющихся, как кадры. Рядом — поэты Хлебников
    и Кручёных с «заумью» и опера «Победа над солнцем», в эскизах декораций к которой, по словам Малевича, появился чёрный квадрат.
  traits:
    - Металлические, цилиндрические формы
    - Мерцание движения, повтор контуров
    - Связь с поэзией, театром и заумью
    - Яркие контрасты и народные мотивы
  names: [Казимир Малевич, Наталья Гончарова, Михаил Ларионов, Любовь Попова, Давид Бурлюк]
  example:
    file: The Knife Grinder Principle of Glittering by Kazimir Malevich.jpeg
    title: Точильщик (принцип мелькания)
    author: Казимир Малевич
    year: 1912–1913
    place: Художественная галерея Йельского университета
  wiki: Cubo-Futurism
  links:
    - { title: "Cubo-Futurism", url: "https://www.theartstory.org/movement/russian-futurism/", src: "The Art Story", lang: en }

- id: orphism
  name: Орфизм
  orig: Orphism
  aliases: [симультанизм, Делоне, орфический кубизм]
  start: 1912
  end: 1914
  dates: 1912 – 1914
  era: avant-garde
  domain: [art]
  region: Франция
  tier: 3
  kind: movement
  parents:
    - { id: cubism, type: evolved }
  summary: >
    Кубизм, наполненный светом и цветом: прозрачные окна, круги-диски и музыка красок.
  description: |
    Поэт Аполлинер назвал так живопись Робера и Сони Делоне, в которой кубистические плоскости стали
    прозрачными и цветными. Серия «Одновременные окна» превращает вид на Париж и Эйфелеву башню в ритм
    цветных призм. Делоне считали, что цвет сам по себе создаёт форму и движение, как звук в музыке.
  traits:
    - Чистые спектральные цвета
    - Прозрачные, перекрывающиеся плоскости
    - Круговые диски и ритмы
    - Путь к абстракции через цвет
  names: [Робер Делоне, Соня Делоне, Франтишек Купка]
  example:
    file: Robert Delaunay, 1912, Les Fenêtres simultanée sur la ville (Simultaneous Windows on the City), 40 x 46 cm, Kunsthalle Hamburg.jpg
    title: Одновременные окна на город
    author: Робер Делоне
    year: 1912
    place: Гамбургский кунстхалле
  wiki: Orphism (art)
  links:
    - { title: "Orphism", url: "https://www.theartstory.org/movement/orphism/", src: "The Art Story", lang: en }

- id: abstract-art
  name: Ранняя абстрактная живопись
  orig: Abstract art
  aliases:
    - ранняя абстрактная живопись
    - ранний абстракционизм
  start: 1910
  end: 1940
  dates: 1910 – 1940
  era: avant-garde
  domain: [art]
  region: Германия, Россия, Франция
  tier: 1
  kind: overview
  kindNote: "Обзор способа изображения, а не одно движение: абстракция возникала у разных групп независимо."
  parents:
    - { id: expressionism, type: evolved }
    - { id: symbolism, type: influence }
  summary: >
    Живопись без предмета: цвет, линия и форма звучат сами по себе, как музыка.
  description: |
    Василий Кандинский пришёл к абстракции через экспрессионизм и музыку: краски для него звучали, а картины
    назывались «Композициями» и «Импровизациями». «Композиция VII» — буря цветовых пятен и линий без единого
    узнаваемого предмета. Одновременно к беспредметности шли Купка, Малевич и Мондриан — каждый своим путём.
  traits:
    - Отказ от изображения предметов
    - Цвет и линия как самостоятельный язык
    - Музыкальные названия — композиции, импровизации
    - Духовное, «внутреннее» содержание
  names: [Василий Кандинский, Франтишек Купка, Хильма аф Клинт, Пауль Клее]
  example:
    file: Composition VII - Wassily Kandinsky, GAC.jpg
    title: Композиция VII
    author: Василий Кандинский
    year: 1913
    place: Государственная Третьяковская галерея, Москва
  wiki: Abstract art
  links:
    - { title: "Abstract Art", url: "https://www.tate.org.uk/art/art-terms/a/abstract-art", src: "Tate", lang: en }
  searchKeywords:
    - Абстракционизм
    - абстракция
    - беспредметное искусство
    - Кандинский
    - лирическая абстракция
  scopeNote: >-
    Обзор ранней абстрактной живописи примерно 1910–1940 годов. Абстракция не заканчивается в 1940 году;
    супрематизм, неопластицизм и послевоенные направления представлены отдельно.
  dateKind: period

- id: suprematism
  name: Супрематизм
  orig: Suprematism
  aliases: [Малевич, Чёрный квадрат, беспредметность, УНОВИС]
  start: 1915
  end: 1935
  dates: 1915 – 1935
  era: avant-garde
  domain: [art, design]
  region: Россия
  tier: 1
  kind: movement
  parents:
    - { id: cubo-futurism, type: evolved }
  summary: >
    «Чёрный квадрат» и парящие в белом пространстве плоскости: точка нуля живописи и начало новой формы.
  description: |
    В 1915 году на выставке «0,10» Малевич повесил «Чёрный квадрат» в красный угол, где в русской избе висят
    иконы. Супрематизм — «превосходство чистого чувства»: геометрические плоскости парят в белой бесконечности.
    Через школу УНОВИС в Витебске идеи Малевича ушли в архитектуру, фарфор, плакат и, позже, в мировой дизайн.
  traits:
    - Простые геометрические формы — квадрат, круг, крест
    - Плоскости, парящие на белом фоне
    - Ограниченная палитра — чёрный, красный, белый
    - Динамика диагоналей без предмета
  names: [Казимир Малевич, Эль Лисицкий, Ольга Розанова, Илья Чашник, Николай Суетин]
  example:
    file: Kazimir Malevich, 1915, Black Suprematic Square, oil on linen canvas, 79.5 x 79.5 cm, Tretyakov Gallery, Moscow.jpg
    title: Чёрный супрематический квадрат
    author: Казимир Малевич
    year: 1915
    place: Государственная Третьяковская галерея, Москва
  wiki: Suprematism
  links:
    - { title: "Suprematism", url: "https://www.theartstory.org/movement/suprematism/", src: "The Art Story", lang: en }
    - { title: "Suprematism", url: "https://www.tate.org.uk/art/art-terms/s/suprematism", src: "Tate", lang: en }

- id: constructivism
  name: Конструктивизм
  orig: Constructivism
  aliases:
    - конструктивизм
    - constructivism
  start: 1915
  end: 1934
  dates: 1915 – 1934
  era: avant-garde
  domain: [design, architecture, art]
  region: СССР
  tier: 1
  kind: movement
  parents:
    - id: suprematism
      type: evolved
      status: unverified
      note: >-
        Открытый вопрос: связь заметна в практике отдельных авторов, прежде всего Лисицкого; тип evolved
        для движения в целом требует отдельного доказательства.
    - id: cubism
      type: influence
  summary: >
    Искусство как инженерия для нового общества: плакаты-клинья, фотомонтаж, рабочие клубы и башня Татлина.
  description: >
    Конструктивизм объединяет разные опыты работы с материалом, пространством и общественной функцией
    искусства. Ранние конструкции Татлина возникли ещё до революции; его знакомство с кубистическими
    опытами Пикассо — один из путей к новому подходу.


    После революции проектирование вещей, зданий и печатной агитации стало важной задачей художников.
    Плакат Лисицкого «Клином красным бей белых» соединяет геометрическую композицию с политическим
    сообщением, но не представляет происхождение всего движения. Родченко работает с фотомонтажом и
    рекламой, архитекторы — с клубами и жильём.
  traits:
    - Геометрия, диагонали, красный и чёрный
    - Фотомонтаж и резкие ракурсы
    - Рубленые шрифты, типографика как образ
    - Функциональная архитектура из простых объёмов
  names: [Эль Лисицкий, Александр Родченко, Владимир Татлин, Варвара Степанова, Константин Мельников]
  example:
    file: Beat the Whites with the Red Wedge.jpg
    title: Клином красным бей белых
    author: Эль Лисицкий
    year: 1919–1920
  wiki: Constructivism (art)
  links:
    - { title: "Constructivism", url: "https://www.theartstory.org/movement/constructivism/", src: "The Art Story", lang: en }
    - { title: "Constructivism", url: "https://www.tate.org.uk/art/art-terms/c/constructivism", src: "Tate", lang: en }
  searchKeywords:
    - конструктивисты
    - Лисицкий
    - Родченко
    - Татлин
    - ВХУТЕМАС
  evidence:
    - claim: История движения включает дореволюционные конструкции Татлина и его обращение к кубизму.
      field: description
      source: ngs-constructivism
  review:
    status: partial
    date: "2026-10-14"
    note: >-
      Текст больше не сводит начало движения к послереволюционной агитации; тип связи с супрематизмом
      оставлен открытым.

- id: dada
  name: Дадаизм
  orig: Dada
  aliases: [дада, dada]
  searchKeywords: [Дюшан, реди-мейд, Кабаре Вольтер, Фонтан, фотомонтаж]
  start: 1916
  end: 1924
  dates: 1916 – 1924
  era: avant-garde
  domain: [art, design]
  region: Цюрих, Берлин, Париж, Нью-Йорк
  tier: 1
  kind: movement
  parents:
    - { id: futurism, type: influence }
    - { id: cubism, type: influence }
  summary: >
    Антиискусство в ответ на бойню Первой мировой: писсуар как скульптура, бессмысленные стихи и коллажи из газет.
  description: |
    В 1916 году в цюрихском «Кабаре Вольтер» эмигранты устроили шоу абсурда: если цивилизация привела
    к войне, её искусство тоже ничего не стоит. Марсель Дюшан ещё в 1913 году в Париже поставил
    велосипедное колесо на табурет, а словом «реди-мейд» стал называть такие вещи двумя годами позже.
    В 1917-м он подал на нью-йоркскую выставку перевёрнутый писсуар под названием «Фонтан» и заострил
    вопрос «что такое искусство?». Берлинские дадаисты сделали фотомонтаж политическим высказыванием.
    На дада потом будут ссылаться сюрреалисты, поп-арт, концептуализм и панк-графика.
  traits:
    - Реди-мейд — готовый предмет как произведение
    - Абсурд, случайность, провокация
    - Коллаж и фотомонтаж
    - Хаотичная типографика
  names: [Марсель Дюшан, Тристан Тцара, Ханна Хёх, Курт Швиттерс, Ман Рэй]
  evidence:
    - { claim: "Оригинал «Велосипедного колеса» — Париж, 1913, за два года до первого употребления Дюшаном слова «readymade»", field: description, source: moma-bicycle-wheel }
  example:
    file: Marcel Duchamp, 1917, Fountain, photograph by Alfred Stieglitz.jpg
    title: Фонтан (фотография Альфреда Стиглица)
    author: Марсель Дюшан
    year: 1917
  wiki: Dada
  links:
    - { title: "Dada", url: "https://www.theartstory.org/movement/dada/", src: "The Art Story", lang: en }
    - { title: "Dada", url: "https://www.tate.org.uk/art/art-terms/d/dada", src: "Tate", lang: en }

- id: metaphysical-painting
  name: Метафизическая живопись
  orig: Metaphysical painting
  aliases: [питтура метафизика, де Кирико, пустые площади]
  start: 1911
  end: 1920
  dates: 1911 – 1920
  era: avant-garde
  domain: [art]
  region: Италия
  tier: 2
  kind: movement
  parents:
    - { id: symbolism, type: evolved }
  summary: >
    Пустые площади, длинные тени, аркады и манекены: тревожная тишина города, где что-то вот-вот случится.
  description: |
    Джорджо де Кирико писал итальянские площади, будто увиденные во сне: резкие тени, безлюдные аркады,
    гипсовые головы, перчатки и поезда на горизонте. Предметы стоят рядом без логики, а пространство
    одновременно знакомо и чуждо. Сюрреалисты считали де Кирико своим предшественником. С его пустыми
    площадями сегодня сопоставляют и интернет-эстетику liminal space — это визуальная аналогия,
    а не доказанная преемственность.
  traits:
    - Безлюдные площади и аркады
    - Длинные косые тени, вечерний свет
    - Манекены, статуи, странные сочетания предметов
    - Неправильная, «сновидческая» перспектива
  names: [Джорджо де Кирико, Карло Карра, Джорджо Моранди]
  example:
    file: "enwiki:De Chirico's Love Song.jpg"
    title: Песнь любви
    author: Джорджо де Кирико
    year: 1914
    place: Музей современного искусства (MoMA), Нью-Йорк
  wiki: Metaphysical painting
  links:
    - { title: "Metaphysical Painting", url: "https://www.theartstory.org/movement/metaphysical-painting/", src: "The Art Story", lang: en }

- id: surrealism
  name: Сюрреализм
  orig: Surrealism
  aliases: [сюрреалисты, Дали, Магритт, сверхреализм]
  start: 1924
  end: 1966
  dates: 1924 – 1966
  era: avant-garde
  domain: [art]
  region: Франция, затем весь мир
  tier: 1
  kind: movement
  parents:
    - { id: dada, type: evolved }
    - { id: metaphysical-painting, type: influence }
  summary: >
    Логика сна: тающие часы, окаменевшие пейзажи и невозможные встречи предметов, выписанные
    с фотографической точностью.
  description: |
    Андре Бретон в «Манифесте сюрреализма» 1924 года предложил освободить творчество от контроля
    разума — через автоматическое письмо, сны и случайность. Одни сюрреалисты писали иллюзорно
    точные сновидения (Дали, Магритт), другие — почти абстрактные «автоматические» картины (Миро).

    Сюрреализм повлиял на кино, моду, рекламу и, в конце концов, на интернет: dreamcore и уирдкор —
    его прямые наследники.
  traits:
    - Сновидческие, иррациональные сюжеты
    - Иллюзорная, «академическая» точность письма
    - Неожиданные сочетания предметов
    - Пустынные бесконечные пейзажи
    - Автоматизм и случайность
  names: [Сальвадор Дали, Рене Магритт, Макс Эрнст, Жоан Миро, Андре Бретон]
  example:
    file: "enwiki:The Persistence of Memory.jpg"
    title: Постоянство памяти
    author: Сальвадор Дали
    year: 1931
    place: Музей современного искусства (MoMA), Нью-Йорк
