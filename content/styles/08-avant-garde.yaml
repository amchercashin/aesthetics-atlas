- id: socialist-realism
  name: Социалистический реализм
  orig: Socialist realism
  aliases: [соцреализм, Мухина, Дейнека, сталинское искусство]
  start: 1932
  end: 1988
  dates: 1932 – 1980-е
  era: avant-garde
  domain: [art]
  region: СССР и соцстраны
  tier: 2
  kind: movement
  kindNote: "Официальный художественный метод, установленный государством, а не добровольное движение."
  parents:
    - { id: peredvizhniki, type: evolved }
    - { id: constructivism, type: reaction }
  summary: >
    Официальный метод советского искусства: героические рабочие, светлое будущее и монументальный оптимизм.
  description: |
    В 1932 году все художественные группировки распустили, а затем объявили единственный метод — изображать
    жизнь «в её революционном развитии». Авангард был объявлен формализмом. Соцреализм дал и пропаганду,
    и сильные вещи: «Рабочий и колхозница» Веры Мухиной, созданная для Всемирной выставки 1937 года в Париже,
    стала символом эпохи.
  traits:
    - Героические, идеализированные фигуры
    - Оптимизм и движение вперёд
    - Реалистичная, понятная форма
    - Монументальность и плакатность
  names: [Вера Мухина, Александр Дейнека, Исаак Бродский, Александр Герасимов]
