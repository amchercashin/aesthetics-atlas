- id: new-objectivity
  name: Новая вещественность
  orig: New Objectivity (Neue Sachlichkeit)
  aliases:
    - Neue Sachlichkeit
    - New Objectivity
    - новая вещественность
  start: 1920
  end: 1933
  dates: 1920 – 1933
  era: avant-garde
  domain: [art]
  region: Германия
  tier: 3
  kind: movement
  parents:
    - { id: expressionism, type: reaction }
    - { id: dada, type: influence }
  summary: >
    Холодный, едкий реализм Веймарской Германии: кабаре, инвалиды войны и портреты с беспощадной точностью.
  description: |
    После экспрессионистского крика художники Веймарской республики вернулись к чёткой форме — но не
    к идеализации. Отто Дикс, Георг Гросс, Кристиан Шад писали общество как вскрытие: спекулянтов,
    проституток, искалеченных солдат. Портрет журналистки Сильвии фон Харден с моноклем — икона эпохи.
  traits:
    - Чёткая, гладкая, почти фотографическая форма
    - Сатира и социальная критика
    - Холодный, «стеклянный» взгляд
    - Город, кабаре, послевоенная травма
  names: [Отто Дикс, Георг Гросс, Кристиан Шад, Макс Бекман]
