- id: international-style
  name: Интернациональный стиль
  orig: International Style
  aliases: [функционализм, модернизм в архитектуре, Мис ван дер Роэ, стекло и сталь]
  start: 1925
  end: 1965
  dates: 1925 – 1965
  era: avant-garde
  domain: [architecture]
  region: Европа, США, весь мир
