    title: Авиньонские девицы
    author: Пабло Пикассо
    year: 1907
    place: Музей современного искусства (MoMA), Нью-Йорк
    whyRepresentative: >-
      Угловатые тела и лица-маски разбивают пространство на острые плоскости.
    sources: [moma-demoiselles]
  evidence:
    - { claim: "Изобретён около 1907–1908 годов Пикассо и Браком; разные виды предмета в одной картине; Сезанн и африканские маски", field: dates, source: tate-cubism }
    - { claim: "Аналитический период 1908–1912, синтетический 1912–1914; вклеенные газеты", field: traits, source: tate-cubism }
