- id: cubism
  name: Кубизм
  orig: Cubism
  aliases: [кубисты, Пикассо, Брак, аналитический кубизм, синтетический кубизм]
  start: 1907
  end: 1925
  dates: 1907 – 1925
  era: avant-garde
