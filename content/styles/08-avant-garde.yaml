    - { claim: "Квадрат впервые появился в занавесе оперы «Победа над солнцем»", field: description, source: tate-five-ways-square }
    - { claim: "Конец 1912 и 1913 годы — опорные работы Малевича и Гончаровой", field: dates, source: commons-knife-grinder }
