      sources:
        - ra26-futurism
    - id: neo-impressionism
      type: influence
      status: verified
      note: >-
        Taylor, Futurism (MoMA, 1961), с.17–22, выводит итальянский дивизионизм из французских
        неоимпрессионистских экспериментов и отдельно сопоставляет мазок Severini с Signac. Это передача техники
        через конкретную итальянскую и парижскую среду, а не тождество итальянского дивизионизма и
        Neo-Impressionism.
      sources:
        - ra26-d2-futurism-moma
        - ra26-d2-severini
  gallery:
    - file: enwiki:Giacomo_Balla,_1912,_Dynamism_of_a_Dog_on_a_Leash,_oil_on_canvas,_89.8_x_109.8_cm,_Albright-Knox_Art_Gallery.jpg
      title: Балла. Динамизм собаки на поводке
      author: Джакомо Балла
      year: 1912
      place: Художественный музей Олбрайт-Нокс, Буффало
      whyRepresentative: >-
        Ноги собаки и поводок размножены в ряд контуров, чтобы показать движение на одном холсте.
    - file: "'Unique_Forms_of_Continuity_in_Space',_1913_bronze_by_Umberto_Boccioni.jpg"
      title: Боччони. Уникальные формы непрерывности в пространстве
      author: Умберто Боччони
      year: 1913
      note: Гипс 1913 года; на снимке бронзовая отливка 1931 или 1934 года.
      whyRepresentative: >-
        Тело вытянуто в струи и лопасти, как будто форму обтекает сама скорость.
  summary: >
    Скорость, машины и город: «гоночный автомобиль прекраснее Ники Самофракийской».
  description: |
    20 февраля 1909 года Маринетти опубликовал в парижской «Фигаро» манифест футуризма: освободить Италию от «бесчисленных
    музеев» и воспеть мир промышленности, техники и скорости. Балла, Боччони и Северини пытались показать движение на холсте
    через повторяющиеся контуры и силовые линии. Боччони перенёс эти принципы и в скульптуру, а его смерть в 1916 году
    фактически завершила движение.
  traits:
    - Изображение движения и скорости
    - Силовые линии и повторяющиеся контуры
    - Город, толпа, стройка
    - Форма, вытянутая потоком
  promptCues:
    - Движение и скорость, повторяющиеся контуры
    - Силовые линии и динамичные диагонали
    - Форма, раздробленная на ритмичные грани
    - Яркие контрастные цвета
  names: [Филиппо Томмазо Маринетти, Умберто Боччони, Джакомо Балла, Джино Северини]
  example:
    file: The City Rises by Umberto Boccioni 1910.jpg
    title: Город встаёт
    author: Умберто Боччони
    year: 1910
    place: Музей современного искусства (MoMA), Нью-Йорк
    whyRepresentative: >-
      Огромный конь и фигуры сливаются в вихрь мазков на фоне строительных лесов.
    sources: [commons-city-rises]
  evidence:
    - { claim: "Манифест 20 февраля 1909 года; смерть Боччони в 1916 году фактически завершила движение", field: dates, source: britannica-futurism }
    - { claim: "Освободить Италию от музеев; красота скорости, гоночный автомобиль и Ника Самофракийская", field: description, source: tate-futurism }
