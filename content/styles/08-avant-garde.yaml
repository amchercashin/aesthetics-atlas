  summary: >
    Огромные фрески на стенах общественных зданий: история Мексики, индейское наследие и революция — для всех.
  description: |
    После революции правительство Мексики заказало художникам росписи общественных зданий, чтобы рассказать
    народу его историю. Диего Ривера, Хосе Клементе Ороско и Давид Альфаро Сикейрос соединили доколумбовые
    мотивы, урок кубизма и левую политику. Фреска Риверы «Человек на перепутье» была уничтожена в
    Рокфеллер-центре из-за портрета Ленина и воссоздана в Мехико.
  traits:
    - Монументальные фрески в общественных зданиях
    - Доколумбовые и народные мотивы
    - Политические и исторические сюжеты
    - Плотные, многофигурные композиции
  names: [Диего Ривера, Хосе Клементе Ороско, Давид Альфаро Сикейрос, Руфино Тамайо]
