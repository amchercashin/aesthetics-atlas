      подтверждения указаны у каждой записи. Даты, описание и изображения карточки полностью не проверялись.
  parents:
    - id: cubism
      type: influence
      status: verified
      note: >-
        После поездки в Париж Попова обратилась к кубизму и затем работала в кубофутуристическом круге.
        Influence документирует её конкретную траекторию, не происхождение всей русской сцены из одной школы.
      sources:
        - ra26-popova
    - id: futurism
      type: influence
      status: verified
      note: >-
        Для Objects from a Dyer’s Shop Поповой (1914) MoMA прямо устанавливает соединение французского кубизма и
        итальянского футуризма; названа посредническая роль Exter. Это влияние: русский кубофутуризм
        синтезировал разные источники и не был филиалом итальянского движения.
      sources:
        - ra26-d2-popova
  gallery:
    - file: Cyclist_(Goncharova,_1913).jpg
      title: Гончарова. Велосипедист
    - file: Woodcutter_by_Kazimir_Malevich.jpg
      title: Малевич. Путешественник
  summary: >
    Русский сплав кубизма и футуризма: металлические грани, мелькание движения и заумная поэзия будетлян.
  description: |
    Русские художники соединили кубистическое дробление формы с футуристическим движением. «Точильщик»
    Малевича состоит из блестящих металлических граней, повторяющихся, как кадры. Рядом — поэты Хлебников
    и Кручёных с «заумью» и опера «Победа над солнцем», в эскизах декораций к которой, по словам Малевича, появился чёрный квадрат.
  traits:
    - Металлические, цилиндрические формы
    - Мерцание движения, повтор контуров
    - Связь с поэзией, театром и заумью
    - Яркие контрасты и народные мотивы
  names: [Казимир Малевич, Наталья Гончарова, Михаил Ларионов, Любовь Попова, Давид Бурлюк]
  example:
    file: The Knife Grinder Principle of Glittering by Kazimir Malevich.jpeg
    title: Точильщик (принцип мелькания)
    author: Казимир Малевич
