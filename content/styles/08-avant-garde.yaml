      role: revival
      note: Поздний авторский вариант, написанный после основных лет метафизической живописи.
      whyRepresentative: >-
        Манекены вместо муз на пустой площади: классический образ становится нелепым и тревожным.
  summary: >
    Пустые площади, длинные тени, аркады и манекены: тревожная тишина города, где что-то вот-вот случится.
  description: |
    Метафизическая живопись расцвела между 1911 и 1920 годами у де Кирико и Карра: узнаваемые, но несочетаемые предметы вызывают
    тревогу. Де Кирико увлекали Ницше и его описания пустых площадей с аркадами. Эта живопись сильно повлияла на сюрреалистов
    1920-х годов. С его пустыми площадями сегодня сопоставляют и интернет-эстетику liminal space — это визуальная аналогия,
