  summary: >
    Аэродинамика как стиль: закруглённые углы, горизонтальные полосы и хромированные поезда, похожие на пули.
  description: |
    В годы Великой депрессии американские дизайнеры Реймонд Лоуи и Норман Бел Геддес сделали обтекаемую
    форму символом прогресса. Обтекаемыми стали не только поезда и самолёты, но и тостеры, радиоприёмники
    и здания с закруглёнными углами и «корабельными» иллюминаторами. Из стримлайна вырастет весь
    послевоенный «атомный» дизайн.
  traits:
    - Каплевидные, обтекаемые формы
    - Закруглённые углы и горизонтальные полосы-«скорости»
    - Хром, алюминий, бакелит
    - Иллюминаторы и корабельные мотивы
  names: [Реймонд Лоуи, Норман Бел Геддес, Генри Дрейфус]
