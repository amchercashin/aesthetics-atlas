      подтверждения указаны у каждой записи. Даты, описание и изображения карточки полностью не проверялись.
  parents:
    - id: post-impressionism
      type: influence
      status: verified
      note: >-
        Сезанн документирован как источник раннего кубизма. Influence с этим уточнением точнее evolved от всей
        категории постимпрессионизма.
      sources:
