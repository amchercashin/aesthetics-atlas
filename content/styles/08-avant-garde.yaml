  kind: overview
  kindNote: "Обзор способа изображения, а не одно движение: абстракция возникала у разных групп независимо."
  contexts:
    - id: expressionism
      type: related-context
      status: verified
      note: >-
        Круг Kandinsky/Blaue Reiter связывает экспрессионистскую среду с одним из путей к ранней абстракции
        1909–1913 годов. Это ограниченный культурный контекст, а не происхождение всей абстракции из
        экспрессионизма.
      sources:
        - ra26-d2-kandinsky-moma
        - ra26-d2-kandinsky-utopia
  review:
    status: partial
    date: "2026-10-16"
    scope: [relations]
    note: >-
      16.10.2026 проверены исторические отношения и связанные с ними контексты и сопоставления; границы
      подтверждения указаны у каждой записи. Даты, описание и изображения карточки полностью не проверялись.
  parents:
    - id: symbolism
      type: influence
      status: verified
      note: >-
        Rose-Carol Washton Long в лекции Guggenheim 1982 года прямо прослеживает синтез символистских идей и
        других источников в On the Spiritual in Art Кандинского. Подтверждение ограничить этим путём к
        абстракции; оно не определяет происхождение всех абстрактных практик.
      sources:
        - ra26-d2-kandinsky-utopia
    - id: cubism
      type: influence
      status: verified
      note: >-
        Кубистические преобразования формы и пространства — документированный источник геометрической ветви
        ранней абстракции. Не объявлять их происхождением всей абстрактной живописи.
      sources:
        - ra26-geometric
  gallery:
    - file: Vassily_Kandinsky,_1923_-_On_White_II.jpg
      title: Кандинский. На белом II
    - file: Vassily_Kandinsky,_1923_-_Composition_8,_huile_sur_toile,_140_cm_x_201_cm,_Musée_Guggenheim,_New_York.jpg
      title: Кандинский. Композиция 8
  summary: >
    Живопись без предмета: цвет, линия и форма звучат сами по себе, как музыка.
  description: |
    Василий Кандинский пришёл к абстракции через экспрессионизм и музыку: краски для него звучали, а картины
    назывались «Композициями» и «Импровизациями». «Композиция VII» — буря цветовых пятен и линий без единого
    узнаваемого предмета. Одновременно к беспредметности шли Купка, Малевич и Мондриан — каждый своим путём.
  traits:
    - Отказ от изображения предметов
    - Цвет и линия как самостоятельный язык
    - Музыкальные названия — композиции, импровизации
    - Духовное, «внутреннее» содержание
  promptCues:
    - Предмет растворён в цветовых пятнах и линиях
    - Цвет и линия как самостоятельный язык
    - Свободные пятна и ритмичные линии, как музыка
    - Без горизонта и перспективы
  names: [Василий Кандинский, Франтишек Купка, Хильма аф Клинт, Пауль Клее]
  example:
    file: Composition VII - Wassily Kandinsky, GAC.jpg
    title: Композиция VII
    author: Василий Кандинский
    year: 1913
    place: Государственная Третьяковская галерея, Москва
  wiki: Abstract art
  links:
