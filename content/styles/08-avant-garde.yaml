  summary: >
    Прямые углы, чёрные линии и три основных цвета: поиск универсальной гармонии у Мондриана и его соратников.
  description: |
    Голландская группа вокруг журнала «Де Стейл» хотела свести искусство к абсолютным элементам: горизонталь,
    вертикаль, красный, синий, жёлтый, чёрный, белый и серый. Мондриан годами уточнял баланс прямоугольников,
    Ритвельд построил по этим принципам красно-синий стул и дом Шрёдер. Язык де Стейл до сих пор узнаётся
    в моде, логотипах и интерфейсах.
  traits:
    - Горизонтали и вертикали (ван Дусбург позже ввёл диагональ)
    - Основные цвета плюс чёрный, белый, серый
    - Асимметричное равновесие прямоугольников
    - Единство живописи, мебели и архитектуры
  names: [Пит Мондриан, Тео ван Дусбург, Геррит Ритвельд, Барт ван дер Лек]
