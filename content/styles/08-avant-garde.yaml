- id: mexican-muralism
  name: Мексиканский мурализм
  orig: Mexican muralism
  aliases: [мурализм, Диего Ривера, Ороско, Сикейрос]
  start: 1920
  end: 1970
  dates: 1920 – 1970
  era: avant-garde
