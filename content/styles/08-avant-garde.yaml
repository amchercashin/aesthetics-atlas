  summary: >
    Стеклянные коробки на тонких опорах: плоские крыши, ленточные окна и «меньше — значит больше».
  description: |
    В 1932 году выставка MoMA дала имя архитектуре Гропиуса, Ле Корбюзье и Миса ван дер Роэ. Принципы
    простые: объём вместо массы, отказ от декора, каркас и свободный план. После войны интернациональный
    стиль стал языком корпораций: Сигрем-билдинг Миса в Нью-Йорке с бронзовыми стойками на фасаде —
    эталон офисного небоскрёба.
  traits:
    - Плоские крыши и гладкие белые или стеклянные стены
    - Ленточные окна, стеклянные навесные фасады
    - Отказ от орнамента — «меньше — значит больше»
    - Каркас и свободная планировка
  names: [Людвиг Мис ван дер Роэ, Ле Корбюзье, Вальтер Гропиус, Филип Джонсон]
