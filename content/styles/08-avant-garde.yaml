- id: organic-architecture
  name: Органическая архитектура
  orig: Organic architecture
  aliases: [Фрэнк Ллойд Райт, Дом над водопадом, стиль прерий]
  start: 1900
  end: 1960
  dates: 1900 – 1960
  era: avant-garde
  domain: [architecture, design]
  region: США, Финляндия
  tier: 3
  kind: movement
  parents:
    - id: chicago-school
      type: evolved
    - id: arts-and-crafts
      type: influence
    - id: wabi-sabi
      type: influence
      status: unverified
      note: >-
        Открытый вопрос. Общий интерес к природным материалам не доказывает влияние ваби-саби на
        органическую архитектуру; нужен авторский или исторический источник.
  summary: >
    Дом, который вырастает из ландшафта: камень, дерево, консоли над водопадом и единство с природой.
  description: |
    Ученик Салливана Фрэнк Ллойд Райт противопоставил европейским белым коробкам архитектуру, сросшуюся
    с местом. Его «дома прерий» стелятся по земле, а «Дом над водопадом» нависает бетонными террасами
    над ручьём. Японская эстетика, природные материалы и открытые пространства — его главные инструменты.
    Близкие идеи развивал Алвар Аалто в Финляндии.
  traits:
    - Единство здания и ландшафта
    - Природные материалы — камень, дерево
    - Горизонтальные консоли и террасы
    - Открытые, перетекающие пространства
  names: [Фрэнк Ллойд Райт, Алвар Аалто, Брюс Гофф]
