  parents:
    - id: cubism
      type: influence
      status: verified
      note: >-
        После поездки в Париж Попова обратилась к кубизму и затем работала в кубофутуристическом круге.
        Influence документирует её конкретную траекторию, не происхождение всей русской сцены из одной школы.
      sources:
        - ra26-popova
    - id: futurism
      type: influence
      status: verified
      note: >-
        Для Objects from a Dyer’s Shop Поповой (1914) MoMA прямо устанавливает соединение французского кубизма и
        итальянского футуризма; названа посредническая роль Exter. Это влияние: русский кубофутуризм
        синтезировал разные источники и не был филиалом итальянского движения.
      sources:
        - ra26-d2-popova
  gallery:
    - file: Cyclist_(Goncharova,_1913).jpg
      title: Гончарова. Велосипедист
      author: Наталья Гончарова
      year: 1913
      place: Государственный Русский музей, Санкт-Петербург
      whyRepresentative: >-
        Колёса и ноги размножены в ряды контуров, а вывески дробятся вокруг фигуры.
    - file: Woodcutter_by_Kazimir_Malevich.jpg
      title: Малевич. Лесоруб
      author: Казимир Малевич
      year: конец 1912
      place: Городской музей, Амстердам
      whyRepresentative: >-
        Крестьянин собран из блестящих цилиндров: деревенский сюжет превращён в машину.
  summary: >
    Русский сплав кубизма и футуризма: металлические грани и мелькание движения.
  description: |
    Русские художники соединяли французский кубизм с итальянским футуризмом; у Поповой MoMA показывает именно такое соединение.
    «Точильщик» Малевича состоит из блестящих металлических граней, повторяющихся, как кадры, а Гончарова дробит
    велосипедиста и городские вывески в ритм движения. Квадрат, с которого начнётся супрематизм, впервые появился
    в занавесе футуристической оперы «Победа над солнцем».
  traits:
    - Металлические, цилиндрические формы
    - Мерцание движения, повтор контуров
    - Дробление формы на грани
    - Яркие контрасты и крестьянские мотивы
  names: [Казимир Малевич, Наталья Гончарова, Михаил Ларионов, Любовь Попова, Давид Бурлюк]
  example:
