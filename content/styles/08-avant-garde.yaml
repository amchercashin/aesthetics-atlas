        Тела, раздробленные на плоскости, и монохромная гамма применяют кубистический язык к военной трагедии.
    - file: enwiki:Pablo_Picasso,_1910,_Girl_with_a_Mandolin_(Fanny_Tellier),_oil_on_canvas,_100.3_x_73.6_cm,_Museum_of_Modern_Art_New_York..jpg
      title: Пикассо. Девушка с мандолиной
      author: Пабло Пикассо
      year: весна 1910
      place: Музей современного искусства (MoMA), Нью-Йорк
      whyRepresentative: >-
        Тело и инструмент разложены на грани приглушённого охристо-серого цвета, как в аналитическом кубизме.
      sources: [moma-girl-mandolin]
  summary: >
    Предмет, разобранный на грани и показанный сразу с нескольких сторон.
  description: |
    Кубизм изобрели около 1907–1908 годов Пикассо и Брак: разные виды предмета собраны в одной картине, отчего она кажется
    раздробленной. Началом считают «Авиньонских девиц» Пикассо; сказались поздний Сезанн и африканские маски. В аналитический
    период (1908–1912) плоскости и линии сплетаются в приглушённых чёрных, серых и охристых тонах. В синтетический (примерно
    1912–1914) формы проще, цвет ярче, а в картину вклеиваются газеты — важнейшая идея искусства XX века.
  traits:
    - Предмет с нескольких точек зрения одновременно
    - Геометрические грани и плоскости
    - Сдержанная охристо-серая палитра (аналитический период)
    - Коллаж, буквы, газетные вырезки
  promptCues:
    - Предмет с нескольких точек зрения одновременно
    - Геометрические грани и плоскости
    - Сдержанная охристо-серая палитра
    - Вставки букв и газетного коллажа
  names: [Пабло Пикассо, Жорж Брак, Хуан Грис, Фернан Леже]
  example:
