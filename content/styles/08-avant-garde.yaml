- id: art-deco
  name: Ар-деко
  orig: Art Deco
  aliases: [арт-деко, стиль 1920-х, джаз-модерн]
  start: 1920
  end: 1940
  dates: 1920 – 1940
  era: avant-garde
  domain: [design, architecture]
  region: Франция, США, весь мир
  tier: 1
  kind: period
  parents:
    - { id: vienna-secession, type: evolved }
    - { id: cubism, type: influence }
    - { id: art-nouveau, type: reaction }
  summary: >
    Роскошь эпохи джаза: зигзаги, солнечные лучи, хром, лак и небоскрёбы со ступенчатыми шпилями.
  description: |
    Название пришло от парижской выставки декоративных искусств 1925 года. Ар-деко взял у модерна любовь
    к декору, но заменил стебли геометрией: ступенчатые формы, веерные лучи, зигзаги и египетские мотивы
    после открытия гробницы Тутанхамона. Он одел всё — от лайнеров и кинотеатров до Крайслер-билдинг.
  traits:
    - Геометрический декор — зигзаги, лучи, ступени
    - Дорогие материалы — хром, лак, слоновая кость
    - Стилизованные фигуры и египетские мотивы
    - Вертикальный ритм небоскрёбов
  names: [Тамара де Лемпицка, Эмиль-Жак Рульман, Кассандр, Уильям ван Ален]
