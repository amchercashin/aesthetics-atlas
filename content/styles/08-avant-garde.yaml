  description: |
    Поэт Маринетти в 1909 году опубликовал манифест, призывающий сжечь музеи и воспеть скорость, электричество
    и войну. Художники Боччони, Балла и Северини пытались показать движение на холсте: повторяющиеся
    контуры, силовые линии, вихри цвета. В «Городе встаёт» Боччони кони и люди сливаются в стройку будущего.
