- id: streamline-moderne
  name: Стримлайн-модерн
  orig: Streamline Moderne
  aliases: [стримлайн, обтекаемый стиль, промышленный дизайн 1930-х]
  start: 1930
  end: 1945
  dates: 1930 – 1945
  era: avant-garde
