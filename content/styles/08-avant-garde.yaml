      Связи — 16.10.2026, границы у записи. 09.11.2026: даты — условные, по опорным работам; описание — 2 утверждения сверено; снято упоминание заумной
      поэзии и признак «связь с поэзией»: на изображениях этого нет. Галерея: заглавие картины Малевича исправлено с «Путешественник» на «Лесоруб».
