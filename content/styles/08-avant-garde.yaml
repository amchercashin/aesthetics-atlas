  description: |
    В 1916 году в цюрихском «Кабаре Вольтер» эмигранты устроили шоу абсурда: если цивилизация привела
    к войне, её искусство тоже ничего не стоит. Марсель Дюшан ещё в 1913 году в Париже поставил
