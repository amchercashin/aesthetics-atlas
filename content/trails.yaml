# Кураторские маршруты («Экскурсии на 5 минут»): 6 тематических прогулок сквозь эпохи и континенты.
- id: blue-and-white
  title: "Синее на белом"
  subtitle: "От египетского фаянса и изникских блюд до гжели, Хокусая и стеклянных интерфейсов"
  minutes: 5
  stops:
    - id: ancient-egypt
      note: "Первая искусственная синяя краска человечества — египетская синь — появляется за тысячи лет до фарфора."
    - id: iznik-ceramics
      note: "В османской Анатолии кобальт, бирюза и чистый белый фон под прозрачной глазурью достигают ювелирной звонкости."
    - id: dutch-golden-age
      note: "Свет из голландского окна, ультрамарин и дельфтский фаянс превращают сине-белую гамму в символ домашнего уюта."
    - id: gzhel-ceramics
      note: "В Подмосковье роспись одним синим кобальтом по белому фаянсу становится самобытным языком живого мазка."
    - id: hokusai-landscape-prints
      note: "Привозная берлинская лазурь переворачивает японскую гравюру: небо и океан получают невиданную глубину."
    - id: frutiger-aero
      note: "В 2000-е синий, белый и прозрачный блеск перебираются с керамики на экраны — как образ чистого цифрового будущего."

- id: power-of-contour
  title: "Сила плоского контура"
  subtitle: "Как ясная линия и локальный цвет раз за разом побеждали объёмную светотень"
  minutes: 5
  stops:
    - id: greek-archaic
      note: "Чёрный силуэт на терракоте и тонкая процарапанная линия доказывают, что для выразительности не нужна тень."
    - id: ukiyo-e
      note: "Резаная деревянная доска Эдо превращает гибкий контур и плоский цвет в универсальную машину образности."
    - id: japonisme
      note: "Японские листы приходят в Париж и учат европейцев смелому кадрированию, высокому горизонту и отказу от иллюзии глубины."
    - id: art-nouveau
      note: "Линия «удара бича» объединяет плакат, витраж, ковку и фасад в непрерывную орнаментальную волну."
    - id: bilibin-illustration
      note: "В русской книжной графике чёрный контур удерживает акварельное поле и связывает сказочный сюжет с орнаментом страницы."
    - id: superflat
      note: "Спустя век Такаси Мураками объявляет «суперплоскость» прямой наследницей японской графической традиции."

- id: geometry-of-order
  title: "Геометрия порядка"
  subtitle: "От исламского орнамента и африканских стен до модернистской сетки и современных экранов"
  minutes: 5
  stops:
    - id: islamic-art
      note: "Бесконечная звёздчатая геометрия строится циркулем и линейкой, превращая стену в математическую музыку."
    - id: de-stijl
      note: "Голландские модернисты сводят мир к вертикали, горизонтали и трём основным цветам — без лишнего жеста."
    - id: bauhaus
      note: "Круг, квадрат и треугольник становятся букварём нового промышленного дизайна и архитектуры."
    - id: swiss-style
      note: "Модульная сетка и шрифт без засечек наводят ясный графический порядок в плакатах, книгах и указателях."
    - id: ndebele-murals
      note: "В Южной Африке строгие ступенчатые геометрические поля и чёрные обводки превращают живые стены в монументальный ритм."
    - id: flat-design
      note: "На экранах смартфонов модульная сетка и плоский цвет снова побеждают декор — уже в масштабе миллиардов устройств."

- id: visions-of-future
  title: "Каким видели будущее"
  subtitle: "Сто лет мечтаний о завтрашнем дне — от аэродинамики и космоса до неона и садов"
  minutes: 5
  stops:
    - id: art-deco
      note: "В 1920-е будущее выглядит как ступенчатые небоскрёбы, хром, геометрия и вера в электричество и скорость."
    - id: streamline-moderne
      note: "Аэродинамическая труба скругляет углы: поезда, тостеры и здания обретают каплевидные полосы скорости."
    - id: googie
      note: "В атомную эру придорожные кафе и вывески взлетают острыми крышами-бумерангами и неоновыми звёздами."
    - id: space-age
      note: "После первых полётов на орбиту литой белый пластик и сферические капсулы обещают жизнь как на космической станции."
    - id: cyberpunk
      note: "К 1980-м оптимизм сменяется дождливой антиутопией: хай-тек корпораций, неон и тесные улицы мегаполиса."
    - id: solarpunk
      note: "В XXI веке маятник качается обратно — будущее снова светлое, с вертикальными садами, витражами и чистой энергией."

- id: living-ornament
  title: "Живой орнамент мира"
  subtitle: "Шесть традиций с разных континентов, где узор рассказывает истории и держит форму вещи"
  minutes: 6
  stops:
    - id: khokhloma
      note: "В нижегородском Заволжье золотистый фон, алые ягоды и гибкий травный узор подчиняют роспись округлой форме дерева."
    - id: mithila-painting
      note: "В индийском Бихаре двойной контур и плотная штриховка не оставляют на бумаге ни одного пустого миллиметра."
    - id: asante-kente
      note: "В Гане сложные геометрические полосы рождаются прямо в переплетении нитей, и каждый узор имеет имя."
    - id: indonesian-batik
      note: "Восковой резерв на Яве позволяет наслаивать индиго и коричневый в тончайшие символические орнаменты."
    - id: samoan-siapo
      note: "В Полинезии кора шелковицы становится холстом для строгой сетки трафаретных и прорисованных знаков."
    - id: prymachenko-imagery
      note: "Фантастические звери, целиком покрытые звёздами и цветами, показывают, как народный орнамент рождает личный космос."

- id: screen-memory
  title: "Память экрана"
  subtitle: "Как цифровые технологии за сорок лет сами стали источником ностальгии, снов и новых стилей"
  minutes: 5
  stops:
    - id: pixel-art
      note: "Жёсткие ограничения первых экранов превращают крупный квадратный пиксель в самостоятельный художественный язык."
    - id: web-1-0
      note: "Домашние страницы 1990-х с пёстрыми фонами и таблицами — стихийный фольклор раннего интернета."
    - id: y2k-aesthetic
      note: "На рубеже тысячелетия глянец, жидкий металл и полупрозрачный цветной пластик празднуют приход нового века."
    - id: vaporwave
      note: "Через десять лет мраморные бюсты, окна старых систем и закатный градиент превращают цифровую рекламу в ироничный сон."
    - id: liminal-space
      note: "Пустые коридоры и залы без людей вызывают странное чувство узнавания — эстетику пограничных пространств."
    - id: ai-aesthetic
      note: "В 2020-е нейросети смешивают весь накопленный визуальный архив человечества в новый, всё ещё формирующийся язык."
